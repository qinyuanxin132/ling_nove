<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泠晞 · 阅读站</title>
<style>
:root {
  --bg: #f5f1e8;
  --bg-card: #fffdf7;
  --text: #3a3630;
  --text-soft: #8a8378;
  --accent: #b0783c;
  --accent-soft: rgba(176, 120, 60, 0.12);
  --border: #e4dccb;
  --shadow: 0 4px 20px rgba(90, 70, 40, 0.08);
}

html[data-theme="dark"] {
  --bg: #1c1a17;
  --bg-card: #24211c;
  --text: #cfc6b8;
  --text-soft: #7d7568;
  --accent: #d0a469;
  --accent-soft: rgba(208, 164, 105, 0.14);
  --border: #38332b;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  line-height: 1.9;
  transition: background 0.3s, color 0.3s;
}

/* 顶栏 */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  z-index: 30;
  box-shadow: var(--shadow);
}
.topbar-inner {
  max-width: 860px;
  height: 100%;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  letter-spacing: 4px;
}
.menu-btn, .theme-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  transition: background 0.2s;
}
.menu-btn:hover, .theme-btn:hover { background: var(--accent-soft); }
.spacer { flex: 1; }
.progress { font-size: 13px; color: var(--text-soft); }

/* 侧栏目录 */
.drawer {
  position: fixed;
  top: 52px; bottom: 0; left: 0;
  width: 280px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  z-index: 40;
}
.drawer.open { transform: translateX(0); }
.drawer-title {
  font-size: 13px;
  color: var(--text-soft);
  padding: 0 20px 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.chapter-list a {
  display: block;
  padding: 8px 20px;
  color: var(--text);
  text-decoration: none;
  font-size: 15px;
  border-left: 3px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chapter-list a:hover { background: var(--accent-soft); }
.chapter-list a.active {
  border-left-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}
.mask {
  position: fixed;
  inset: 52px 0 0 0;
  background: rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 35;
}
.mask.show { opacity: 1; pointer-events: auto; }

/* 阅读区 */
.reader { padding-top: 84px; }
.reader-inner {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 20px 60px;
}
.chapter-title {
  font-size: 26px;
  text-align: center;
  margin-bottom: 34px;
  letter-spacing: 2px;
  color: var(--text);
}
.chapter-content p { margin-bottom: 1.1em; text-align: justify; }

/* 翻页 */
.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.page-btn {
  padding: 9px 20px;
  border: 1px solid var(--accent);
  border-radius: 20px;
  background: transparent;
  color: var(--accent);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, color 0.2s;
}
.page-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
.page-btn:disabled { opacity: 0.35; cursor: default; }
.pager-info { font-size: 13px; color: var(--text-soft); }

.footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--text-soft);
}

/* 移动端 */
@media (max-width: 640px) {
  .drawer { width: 82vw; }
  .drawer-right { width: 82vw; }
  .chapter-title { font-size: 22px; }
  .reader { padding-top: 76px; }
  .page-btn { padding: 8px 14px; font-size: 13px; }
}

/* 右侧日志栏 */
.drawer-right {
  left: auto; right: 0;
  border-right: none;
  border-left: 1px solid var(--border);
  transform: translateX(100%);
}
.drawer-right.open { transform: translateX(0); }

.log-btn {
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, color 0.2s;
}
.log-btn:hover { background: var(--accent-soft); }
.log-btn.active { color: var(--accent); border-color: var(--accent); }

.log-compose { padding: 0 16px 12px; border-bottom: 1px solid var(--border); }
.log-compose textarea {
  width: 100%;
  min-height: 64px;
  resize: vertical;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  padding: 8px 10px;
  outline: none;
}
.log-compose textarea:focus { border-color: var(--accent); }
.log-add {
  margin-top: 8px;
  width: 100%;
  padding: 7px 0;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: transparent;
  color: var(--accent);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, color 0.2s;
}
.log-add:hover { background: var(--accent); color: #fff; }

.log-list { padding: 4px 16px 16px; }
.log-empty { padding: 24px 0; text-align: center; font-size: 13px; color: var(--text-soft); }
.log-item {
  position: relative;
  padding: 10px 26px 10px 0;
  border-bottom: 1px dashed var(--border);
}
.log-meta { font-size: 11px; color: var(--text-soft); }
.log-text { font-size: 14px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.log-del {
  position: absolute;
  right: 0; top: 10px;
  width: 20px; height: 20px;
  border: none; border-radius: 50%;
  background: transparent;
  color: var(--text-soft);
  font-size: 16px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.log-del:hover { color: #c0392b; background: rgba(192, 57, 43, 0.1); }

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#" class="brand" id="brand">泠晞</a>
    <button class="menu-btn" id="menuBtn" title="目录">☰</button>
    <div class="spacer"></div>
    <span class="progress" id="progress">—</span>
    <button class="log-btn" id="logBtn" title="日志 · 每日记录">日志</button>
    <button class="theme-btn" id="themeBtn" title="切换夜间模式">☾</button>
  </div>
</header>

<aside class="drawer" id="drawer">
  <div class="drawer-title">目录 · 共 <span id="totalCount">?</span> 章</div>
  <nav class="chapter-list" id="chapterList"></nav>
</aside>
<div class="mask" id="mask"></div>

<aside class="drawer drawer-right" id="logPanel">
  <div class="drawer-title">日志 · 每日记录 <span class="log-count" id="logCount"></span></div>
  <div class="log-compose">
    <textarea id="logInput" placeholder="今天干了啥？"></textarea>
    <button class="log-add" id="logAdd">记一笔</button>
  </div>
  <div class="log-list" id="logList"></div>
</aside>

<main class="reader" id="reader">
  <div class="reader-inner">
    <h1 class="chapter-title" id="chapterTitle">加载中…</h1>
    <article class="chapter-content" id="chapterContent"></article>
    <div class="pager">
      <button class="page-btn" id="prevBtn" disabled>← 上一章</button>
      <span class="pager-info" id="pagerInfo"></span>
      <button class="page-btn" id="nextBtn" disabled>下一章 →</button>
    </div>
  </div>
</main>

<footer class="footer">《泠晞》· 单文件阅读站</footer>
