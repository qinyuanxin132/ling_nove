\n\"我没有做任何事。我只是让你看见了你不愿看见的东西。\"\n\n纣王没有立刻说话。\n\n他看着她，看了很久。然后他说：\"……朕在神像上，题过一行字。\"\n\n\"嗯。\"泠说，\"我看见了。\"\n\n\"你替它来的？\"纣王问，\"那尊神像？\"\n\n\"那道约。\"泠说，\"总得有人看着。\"\n\n纣王又沉默了很久。\n\n他站起来。他站起来的时候，先整了整王冠——端端正正地戴好，又理了理衣摆。他走到那堆珠玉前，弯腰，把那件珠玉衣穿上，一颗一颗，扣好。他穿好了，回过头，看着泠。\n\n\"朕的天下，\"他说，\"朕自己烧。\"\n\n他走到火盆前，弯腰，把火盆掀翻。油泼出来，火苗蹿起来，沿着台面，烧成一片。他没有退，站在火里——火从他脚下烧起来，他始终站着，衣上的珠玉在火里噼啪地响，像有人在替他敲一件玉器，越敲越急。\n\n泠没有走。\n\n她站在火光前，看着火把那个人吞没。她看着他站着，看着他的王冠歪了，看着他倒下去——她没有动。她看着，像她说过的那样：我种下的东西，我得看着它长完。\n\n火光把鹿台烧红了，把半边天烧红了。\n\n泠站在火光前，抬头，看了看天。天那边，没有别的，只有鹿台的火光映出来的红。\n\n晞在门里，也看着那火光。\n\n\"……她不会谢你。\"晞说。\n\n\"我知道。\"泠说，\"我不是要她谢我。\"\n\n\"……那你图什么？\"\n\n\"我什么都不图。\"泠说，\"她下不了的决心，我替她下了。这就够了。\"\n\n晞没有再说话。\n\n天快亮的时候，泠走下鹿台。\n\n火还在烧，但烧不到别处了——周兵已经把王宫围起来，水桶排成一排，隔开了火。她在晨光里穿过乱了一夜的街道，往女娲宫走。\n\n女娲宫那边，火没有烧到。\n\n庙祝已经开了门，在扫门前的灰——城破了，他的日子照常过。香炉里的白烟，袅袅地升着，升到天上去。一队周兵从宫门前走过，领头的人抬头，看了看那尊神像——看了很久。\n\n然后，他走了。\n\n泠站在宫门外，看着那道白烟，升到天上。她看了很久。\n\n\"……走吧。\"晞说。\n\n\"嗯。\"\n\n她转身，走进城破后的第一个早晨里。身后，那道白烟照常升着，升到天上。\n"}, {"id": 64, "title": "为什么", "content": "# 第64章 为什么\n\n女娲是在第二天傍晚知道商亡的。\n\n她守在云海东段的值房里看边报。边报是巡官送来的——人间的大事，云海各段都要记：哪里的水泛了，哪里的疫起了，哪里改朝换代了。这一日的边报只有一行字，写得很平，像是怕惊着谁：\n\n\"商亡。纣王自焚于鹿台。周军入朝歌。\"\n\n女娲盯着那行字，看了很久。\n\n她想起泠。泠还在朝歌。她说\"从明天起，我住朝歌\"；她说\"她做不到的，我替她做\"。她想起送别那天：泠在云海边站了很久，久到天快黑。\n\n她放下边报，站起来，往人间去了。\n\n她先去了朝歌。\n\n城门口的周军换了一茬，城里的烟已经散了，鹿台那边只剩一片烧过的黑。她去了女娲宫——庙祝照常开门，香火照常烧，白烟照常升到天上去。神像衣摆上那行字，还刷着漆：庙祝又刷过一遍，墨色淡了，字形还认得出来。\n\n她站在自己的神像前，站了一会儿。\n\n然后她循着那道熟悉的气息，出了城，往北走。\n\n泠在官道上走着。\n\n城破后的第三日，她离开朝歌，往北走。她不知道要去哪——她就是走。太阳很好，官道上有逃难的人，也有进城讨生活的人，来来往往，日子在换个过法。\n\n女娲追上她的时候，是黄昏。\n\n泠听见脚步声——不是普通人的脚步，是踩着云风落下来的脚步。她停住，回头。\n\n女娲站在官道上，看着她。她没有穿职司的袍子，头发有些乱，像赶了很久的路。\n\n\"……是你做的。\"女娲说。不是问句。\n\n泠看着她，没有答。\n\n\"商。\"女娲说，\"是你做的。\"\n\n泠沉默了一会儿：\"……是我做的。\"\n\n女娲看着她，看了很久。她的眼睛里有东西在翻涌——气，急，痛，搅在一起。她问：\"为什么？\"\n\n\"因为你下不了决心。\"\n\n\"什么决心？\"\n\n\"那道约。\"泠说，\"他题了字，他忘了约；你说守约的人不挑约值不值——可你挑了，你挑不出来。你下不了决心，我替你下。\"\n\n\"……你就替他烧了整座城？\"女娲的声音高了起来，\"牧野死了多少人，你知道吗？\"\n\n\"我知道。\"泠说，\"我看着的。\"\n\n女娲的呼吸顿住了。\n\n\"我看着的。\"泠又说了一遍，\"从头到尾。我站在土坡上，看着他们打；我站在鹿台上，看着他烧。我一个都没杀——可他杀的人，因我而死。我知道。\"\n\n\"那你还做？！\"女娲喊了出来，\"你告诉我，我会拦你吗？\"\n\n\"……你会拦。\"泠说，\"你会的。\"\n\n\"那你——\"女娲的眼泪掉下来了，\"那你为什么不告诉我？你一个人扛，扛得住吗？！你知不知道你做了什么？你替商翻了个天！长老院的案头、西王母娘娘的案头——他们已经知道了！\"\n\n泠没有说话。\n\n她看着女娲哭，看了很久。然后她说：\"……你别跪。\"\n\n\"什么？\"\n\n\"王母娘娘跟前，你别跪。\"泠说，\"你跪过一回，救了我一回。这回，别跪。跪了也没用——西王母娘娘不是天君，她不看人跪。\"\n\n\"你怎么知道没用！\"女娲说，\"我——\"\n\n\"因为这次，我没有冤枉。\"泠说，\"他们抓我，是抓对了。\"\n\n晞在门里，这时候开口了。\n\n\"……她没杀人。\"晞说，\"她一个都没杀。她只是没拦。\"\n\n女娲顿住，看着泠——不是看泠，是看门里的方向。她知道晞在里面。\n\n\"你听听她说的话！\"女娲对着泠喊，\"'只是没拦'？！那是牧野！几万条命！\"\n\n\"我知道。\"泠说，\"我认。\"\n\n\"你认什么？！\"\n\n\"他杀的，我认。\"泠说，\"那条河，从我放的那句话开始流。他烧鹿台的时候，我站在台子上，看着火把他吞了——我没有拦。他杀的，我认。\"\n\n女娲没有再说话。\n\n她站在黄昏的官道上，看着泠。她看了很久很久，眼泪流了满脸，没有擦。最后她走过去，抬手——不是打她，是抓住她的手腕，攥得很紧：\n\n\"你跟我回天界。\"\n\n\"……\"\n\n\"回去，我找房长老，我找能说话的人。\"女娲说，\"你做的事，你自己认；可天界怎么处置你，我不许它乱来。\"\n\n\"女娲——\"\n\n\"走！\"\n\n泠被她拽得往前踉跄了一步。她看着女娲的背影——这个十九岁的姑娘，头发乱着，眼泪还没干，拽着她，往天上走。\n\n她觉得自己做错了一点什么——但已经走到这里了。\n\n她们走了不到半里路，云风里落下一个声音：\n\n\"女娲长老。王母娘娘有请——\"\n\n一个天将拦在她们面前，行了礼，看了一眼泠：\n\n\"——还有她。两位，都请。\"\n\n女娲握着泠手腕的手，紧了紧。\n\n\"……她是我的人。\"女娲说。\n\n天将没有让开：\"王母娘娘说了，是'请'。女娲长老，娘娘的案头上，边报摆了三日了。\"\n\n黄昏的风吹过官道。泠站在女娲身后，看着那个天将，很平静。\n\n\"走吧。\"泠说，\"别为难他。\"\n"}, {"id": 65, "title": "审问", "content": "# 第65章 审问\n\n王母殿是代天君理政的地方，在九重天的正中。\n\n女娲和泠被带进殿的时候，殿里已经坐满了人。九天长老来了五位，分坐两侧；房长老也在，坐在末席，看见她们进来，眼皮动了一下。上首坐着一个女人——看不出年纪，衣摆压着重重的金纹，端着一盏茶，茶已经凉了。\n\n西王母。\n\n她没有看女娲，先看泠。她看了很久，久到殿里的风都停了。\n\n\"商亡，是你做的？\"她问。\n\n泠站在殿中央，说：\"是我做的。\"\n\n\"怎么做的？\"\n\n\"一句话，一封信，一眼。\"\n\n殿里静了一下。有长老低声咳了一声。西王母没有动，她放下茶盏：\"说清楚。\"\n\n\"一句话，放进茶楼里，它自己会长——长成满城的谣言。\"泠说，\"一封信，夹进太师府待寄的文书里，它自己会走——走到大王的案头上。一眼……\"她停了一下，\"大王田猎回城那天，我看了他一眼。九尾的眼睛，您知道。\"\n\n\"魅惑。\"西王母说。\n\n\"……是。\"\n\n\"你杀了多少人？\"\n\n\"我一个都没有杀。\"\n\n\"你没杀。\"西王母说，\"牧野的血，因你流的。\"\n\n\"……我认。\"\n\n西王母又看了她很久。然后她问：\"为什么？\"\n\n\"因为一道约。\"\n\n\"女娲家与商的旧约。\"西王母说，\"本座知道。\"\n\n泠抬起头：\"她下不了决心。我替她下了。\"\n\n\"她让你这么做了？\"\n\n\"没有。她不知道。\"\n\n殿里又静了一会儿。西王母端详着她，开口说：\"……你身上，有本座看不透的东西。\"\n\n泠的心一下子提起来——门。晞。她的手指蜷了一下。\n\n女娲在旁边，脸色也变了。她攥紧了袖子。\n\n\"不过——\"西王母说，\"本座不问你身上那些事。本座只问人间的事。\"\n\n她收回目光，端起茶，喝了一口凉的：\"人间的事，你认了。那本座判你——静默台，百年。\"\n\n\"百年？\"女娲喊了出来。\n\n她一直忍着没说话，这会儿忍不住了。她往前迈了一步：\"娘娘！她没有杀人！她一个都没杀！她只是——\"\n\n\"她只是替你们家，翻了一个天下。\"西王母说。\n\n女娲噎住了。她站在那里，脸涨得通红，过了好一会儿，才憋出一句：\"……要关她，就把我也一起关了！\"\n\n殿里又静了。\n\n西王母看着她——在职的九天长老，站在殿中央，像个闹脾气的孩子。她看了很久，久到女娲的耳朵都红了。\n\n\"……好。\"西王母说，\"本座成全你。静默台，你也去站站。站到本座叫你回来。\"\n\n\"关就关！\"女娲说。\n\n\"女娲！\"泠低喝了一声，\"你——\"\n\n\"我说了要关一起关！\"女娲回头瞪她，\"你管我！\"\n\n\"押下去。\"西王母说。\n\n两个执天卫从殿外进来，一左一右，站在她们身后。女娲梗着脖子往外走，走到殿门口，又回头喊了一句：\n\n\"关就关！我陪她站！\"\n\n她喊完，被执天卫\"请\"了出去。\n\n出了殿，是云路。\n\n两个执天卫一前一后，押着她们，往天界边缘走。女娲走在前头，泠走在后头，谁也没说话。云路越走越窄，走着走着，路没了——面前是云海断崖。\n\n断崖边，延伸出去一条窄道。\n\n那条道，只容一人侧身而过，没有护栏，两边都是空的——脚下是云海，风从下面灌上来，呜呜地响。押送她们的执天卫在窄道口站住，不走了。\n\n\"二位，请。\"执天卫说，\"走到头，就是静默台。\"\n\n女娲看着那条窄道，咽了口唾沫。她回头看了一眼泠。\n\n\"……我先走。\"她说，\"你跟着我，别看脚下。\"\n\n她踏上窄道。风一下子大起来，吹得她衣摆乱飞。她走出去三步，手有点抖——她没有回头看，一步一步，走得极慢。\n\n泠跟在她身后，也踏上了窄道。\n\n风很大。窄道两边是空的，脚下是云。泠走着，眼睛盯着女娲的鞋跟。她们谁也没有说话——风太大，说话也听不见。\n\n走到一半，女娲停住了。\n\n她站在窄道上，背对着泠，声音被风吹得七零八落：\n\n\"……泠。\"\n\n\"嗯。\"\n\n\"你别怕。\"女娲说，\"百年就百年！我出去，我就去找人！我去找房长老，我去找——\"\n\n\"你别说了。\"泠说，\"看路。\"\n\n\"……哦。\"\n\n她又开始走了。风把她的声音吹散在云海里。\n\n窄道的尽头，是一座石台。\n\n圆形的，约三丈见方，孤零零地悬在云海之上。台面光秃秃的，什么都没有——没有栏，没有顶，只有风。站在台边，脚下是云海；极远处，有一条细细的线——那是人间与魔界的交界线。\n\n女娲先踏上石台。她站在台中央，四周看了一圈，风把她的头发吹得乱糟糟的。\n\n\"……这就是静默台。\"她说，\"也没有那么——\"\n\n她的话没有说完。\n\n阵起的那一刻，她觉得自己像是被什么拢住了——所有的声音，都远了。她自己说的话，落进自己耳朵里，像是隔着水。她回头，看见泠也踏上了台。\n\n两个人，面对面站着。\n\n风从四面灌进来，灌满她们的耳朵。\n\n远处，人间方向的天边，有一道细细的白烟升起来——那是女娲宫的香火，还是哪家的炊烟？她们看得见，够不着。\n\n女娲张了张嘴。她说了什么，泠看见她的口型——\n\n\"你别怕。\"\n\n泠也张了张嘴。风把她的声音吞了。\n\n\"……嗯。我不怕。\"\n"}, {"id": 66, "title": "静默台（上）", "content": "# 第66章 静默台（上）\n\n风是第一个来的。\n\n阵起之后，女娲最先记住的不是台面、不是云，是风。它从四面灌上来，灌进耳朵里，像有人在台底下拧着一只巨大的风箱，一刻不停。她张了张嘴，想说什么，声音落进自己耳朵里，闷闷的，像隔着水。\n\n她回头看泠。泠也看着她。\n\n\"……能听见吗？\"女娲问。\n\n泠点了点头。她的声音也闷闷的：\"能。你说话，我听得到。\"\n\n\"那就好。\"女娲说，\"我还以为……要一个人哑在这儿了。\"\n\n\"外面听不见。\"泠说，\"里面，听得见。\"\n\n女娲在台沿坐了下来。台面是凉的，石头被云海的水汽沁得又冷又滑。她把腿收上来，抱着膝盖，往远处看——人间方向的天边，那条细细的交界线横在那里，像一道永远走不过去的门。\n\n\"……那是什么？\"她问。\n\n\"人间和魔界的交界线。\"泠说。\n\n\"看得见？\"\n\n\"看得见。\"\n\n\"……够不着。\"女娲说。\n\n她说了这一句，就不说话了。风把她的声音吞了——它们落在台上，绕着两个人的脚边转了一圈，散了。\n\n第一天剩下的时间，她们没怎么说话。\n\n女娲的气还没有散。她不是气泠——她是气\"自己最后一个知道\"。她在台上走了两圈，台面三丈见方，走两圈就没了。她停下来，看着泠：\n\n\"你为什么不告诉我？\"\n\n泠坐在她对面，风把她的头发吹得乱糟糟的：\"告诉你，你会拦我。\"\n\n\"我当然会拦你！\"女娲说。\n\n\"嗯。\"\n\n\"你——\"女娲噎住了。她张了张嘴，想说什么，又闭上了。过了好一会儿，她才说：\"……可我至少能拦你。我连拦都没拦上。\"\n\n\"你拦不上的。\"泠说，\"你下不了决心。你连自己都拦不住。\"\n\n\"我——\"女娲想反驳，话到嘴边又咽了回去。她抱着膝盖，声音闷下来：\"……商亡了。你知道吗？边报送来的时候，我坐在值房里，手一直在抖。我想去朝歌，可我——我不知道我去干什么。是拦你？是看你？还是——\"\n\n\"谁也不用救。\"泠说，\"他已经死了。周已经进城了。你在不在，都一样。\"\n\n\"不一样。\"女娲说，\"……我想陪着你。你不知道吗？\"\n\n风灌进来。泠没有接话。\n\n\"我想陪着你。\"女娲又说了一遍，\"你做什么，我陪着你做。你闯了祸，我陪着你闯。你下决心，我帮你下——可你连帮的机会都没给我。你把我一个人留在云海东段，等边报落下来，砸在我头上。\"\n\n\"……嗯。\"\n\n\"你只会嗯！\"女娲说。\n\n泠没有回嘴。她坐了一会儿，说：\"我错了。\"\n\n女娲抬起头：\"你错哪儿了？\"\n\n\"我该告诉你。\"泠说，\"我该跟你说一声，再去做。\"\n\n\"……然后呢？\"\n\n\"然后你拦我。\"泠说，\"你拦我，我就——\"\n\n\"你就什么？\"\n\n\"我就不知道了。\"泠说，\"我没想那么远。\"\n\n女娲看了她很久。风把她眼睛吹得发红——不知道是风，还是别的。她挪了挪，挨着泠坐下来，肩膀靠着她的肩膀：\n\n\"……你下次，跟我说一声。行不行？\"\n\n\"嗯。\"\n\n\"别'嗯'！\"\n\n\"……行。\"泠说。\n\n她们在台上坐了很久，看着云从面前飘过去。静默阵封住的不只是灵力——它把时间也磨慢了。没有书，没有活儿，没有人找你。只剩下风，和彼此。\n\n光暗下来的时候，风更冷了。风从云海底下翻上来，带着水汽，往骨缝里钻。女娲缩在台中央，抱着自己，牙齿有点打颤。\n\n\"……你不冷吗？\"她问泠。\n\n\"不冷。\"泠说。她缩着，声音比白天低。\n\n女娲扭头看她。天暗下来，泠的轮廓在风里——她发现哪里不对。\n\n\"泠。\"她说，\"你的……你的耳朵。\"\n\n泠僵了一下。她抬手去摸——头顶上，两只白绒绒的狐狸耳朵，在风里抖着。\n\n\"灵力封了。\"她说，\"压不住。\"\n\n她说着，想把它压回去，压了半天，没压动。两只耳朵在她手底下抖，毛被风吹得东倒西歪。女娲看着她，笑了。\n\n\"……你也有今天。\"她说着，伸手把泠护着耳朵的手拿开，\"别捂了，越捂越冷。我看看。\"\n\n她凑过去，端详着那对耳朵。天暗下来，看不真切，她伸手碰了碰——耳尖是凉的，毛又细又软，像绒。那对耳朵在她指尖下抖了一下，往旁边躲了躲。\n\n\"别动。\"女娲说。\n\n\"……你别碰尖。\"泠说，\"尖上凉。\"\n\n\"那我碰哪儿？\"\n\n\"……根。\"泠说，\"根上暖和。\"\n\n女娲把手挪到耳根。那里果然暖些，毛更密，贴着皮肉，能感觉到极轻的血脉跳动。她用手掌拢住，揉了揉——泠的耳朵在她掌心里动了动，像两只不听话的小兽，一会儿想躲，一会儿又自己转回来。\n\n\"……别揉那么快。\"泠说，\"痒。\"\n\n\"我偏要。\"女娲说。\n\n她嘴上说着，手上反倒细了。她用手指一寸一寸地揉，从耳根揉到耳尖，把被风吹乱的毛顺回去。风又把毛吹乱，她再顺。两只耳朵在她手里不抖了，耷拉下来，服帖地靠在她掌心里。\n\n\"……暖了。\"泠说。\n\n\"嗯。\"\n\n女娲想起来：\"你小时候，耳朵也这样漏出来过？\"\n\n\"我小时候，青丘的雪天，耳朵冻得直抖。\"泠说，\"我娘就坐在门口，把我耳朵捂在手里，捂一整个下午。\"\n\n\"……那你娘手一定很暖。\"\n\n\"她手粗。\"泠说，\"指节上有茧。但是暖。\"\n\n女娲没有再说话。她把手拢在泠的耳朵上，像替谁补了一个下午的暖。\n\n门里的暗红色，安静地亮着。晞看着台上，一句话也没有说。\n\n入夜之后，风更大了。女娲缩成一团，还是冷。\n\n\"……你说你不冷？\"她问泠。\n\n\"白狐一脉，雪里滚大的。\"泠说，\"青丘的冬天比这冷多了。\"\n\n\"你们青丘的冬天……\"\n\n\"雪能没过膝盖。\"泠说，\"我小时候在雪地里睡过觉。\"\n\n女娲瞪着她：\"雪地里？\"\n\n\"狐皮厚。\"泠说，\"不怕。\"\n\n女娲又缩了缩。她抱着膝盖，声音闷闷的：\"我冷。\"\n\n泠看了她一会儿。然后她动了——她坐到女娲身边，把她往自己这边拢了拢，然后，一条毛茸茸的尾巴伸了过来，盖在她腿上，又搭上她的肩膀，把她半个人裹住了。\n\n女娲僵住了。\n\n尾巴很暖。白狐的尾巴，又厚又软，带着活物的暖，像一条会呼吸的被子，从她肩头搭到脚踝，把她裹得严严实实。风还从四面灌着，但灌进来的风，先被一层毛挡了。\n\n\"……你干什么。\"女娲说。她的声音被毛挡着，闷闷的。\n\n\"给你取暖。\"泠说，\"你不是冷吗。\"\n\n\"……我没让你用尾巴裹我！\"\n\n\"那你别裹。\"泠作势要把尾巴收回去。女娲赶紧按住尾巴：\"别收！\"\n\n\"……哦。\"泠说。\n\n女娲抱着那截尾巴，把脸埋进去，蹭了蹭。白狐的毛又软又暖，蹭起来沙沙响。她蹭了一会儿，声音从毛里传出来，闷闷的：\n\n\"……你尾巴真大。\"\n\n\"嗯。\"\n\n\"你怎么不早拿出来？\"\n\n\"你也没说要啊。\"\n\n\"……我以为你冷得说不出话了呢！\"\n\n\"我冷什么。\"泠说，\"我说了，青丘的冬天比这冷。\"\n\n\"那你也该想着我冷！\"\n\n\"嗯。\"\n\n\"你别光嗯！\"\n\n\"……行。我想着你冷。\"\n\n\"……就一条？\"女娲问，\"你不是九条吗？\"\n\n\"收着呢。\"泠说，\"九条都放出来，能把你埋了。\"\n\n\"那你放！\"女娲说，\"埋了我也行！\"\n\n泠看着她，没动。\n\n\"放嘛！\"女娲抱着那条尾巴晃了晃，\"你刚才还说想——\"\n\n\"……行。\"泠说。\n\n她松了松劲。女娲眼睁睁看着，第二条、第三条——九条银白色的尾巴一条接一条放出来，毛茸茸的，把她从头顶到脚踝，严严实实埋住了。风还在灌，但风先撞上一层又一层毛，传到她这儿，只剩一点凉意。\n\n女娲在毛堆里只剩下半张脸。她动了动，声音闷闷的：\n\n\"……暖。\"\n\n\"嗯。\"\n\n\"九条都给我了？\"\n\n\"……嗯。都给你。\"\n\n\"那你自己冷不冷？\"\n\n\"不冷。\"泠说，\"我说了，狐皮厚。\"\n\n女娲没话说了。她把自己往毛里又埋了埋。风从四面灌着，台上两个人挨在一起——一只白狐，和她九条尾巴里裹着的一个神。\n\n后半夜，风小了些。女娲靠在泠的肩膀上，头发又被吹乱了——她窝在尾巴里，自己伸手理了理，越理越乱，气鼓鼓地把手一放：\n\n\"……你给我梳。\"\n\n\"我拿什么梳？\"泠说，\"这里连根簪子都没有。\"\n\n\"用手！\"女娲说，\"你手不是手吗！\"\n\n泠看了她一眼，没说什么。她挨过去，把女娲的头发拢到手里。发尾被风吹得打结，缠成一团，她没硬扯，先用手指把最外面那层乱发分开，一缕一缕，从打结的地方一点一点拆。\n\n女娲坐在她前面，一动不动，只有耳朵尖着，听她动作。\n\n\"……你手好稳。\"女娲说。\n\n\"嗯。\"\n\n\"你以前给谁梳过？\"\n\n\"我娘。\"泠说，\"在青丘的时候，她坐在门口，我给她梳。梳完她给我梳。\"\n\n\"……我也想让我娘给我梳。\"女娲说，\"我娘走得早。我都不记得她梳头发是什么样了。\"\n\n泠的手停了一下。她没有接话，继续拆。拆开的地方，她用指腹把头发捋直，再梳下去。女娲的头发长，黑，像缎子，从她指间滑下去，滑到一半，又被风吹起来。\n\n\"别动。\"泠说。\n\n\"我没动！\"\n\n\"你头发在动。\"\n\n\"那是风！\"\n\n\"……风动你就别动。\"\n\n\"你讲不讲理！\"\n\n\"我讲。\"泠说，\"梳头发的时候，谁动谁理亏。\"\n\n女娲不说话了。她赌气不动，头发安安静静地待在泠手里，被她一缕一缕梳顺。\n\n过了一会儿，女娲又说：\"……不过没事。我爹给我梳过。他手粗，扯得我头皮疼。\"\n\n\"……那你还让我梳。\"\n\n\"你手稳啊。\"\n\n\"嗯。\"\n\n\"你又不说话！\"\n\n\"我在梳。\"\n\n\"……哦。\"\n\n风在四面灌着。台上没有别的声响——只有风，和手指穿进头发里的细碎声音。女娲坐着坐着，困了。她的头一点一点，最后靠在了泠的肩膀上。\n\n泠没有动。她保持那个姿势，把最后一缕头发梳顺，然后把手放下来，没敢动。\n\n\"……泠。\"\n\n\"嗯。\"\n\n\"商亡了，你难过吗？\"\n\n泠想了一会儿：\"我见过他写那道约。他题字那天，我真以为，商能活很久。\"\n\n\"我也以为。\"女娲说，\"我娘给我讲那道约的时候，我还小。她说，这是我们家和人间，最要紧的一个约定。\"\n\n\"……现在没了。\"\n\n\"你难过吗？\"泠问。\n\n女娲没有立刻回答。她靠在泠的肩膀上，看着远处人间方向——天黑着，看不见交界线，但女娲宫的方向，她知道，还有香火在烧。\n\n\"我不知道。\"她说，\"……我娘说，守约的人，不挑约值不值。可我从来没想过，约会有没的那天。\"\n\n\"我替你把约收完了。\"泠说，\"你什么都不用管了。\"\n\n\"……谁要你管了！\"女娲说。她的声音闷闷的，\"你管那么宽！你连我的决心都替我下了！\"\n\n\"我错了。\"泠说。\n\n\"你错哪儿了？\"\n\n\"我该跟你说一声。\"\n\n\"……然后呢？\"\n\n\"然后你拦我。你拦我，我就——\"\n\n\"你就不知道了。\"女娲接上她的话，\"你说了两遍了。\"\n\n\"嗯。\"\n\n\"不许'嗯'！\"\n\n\"……行。\"\n\n她们一起笑了一下。笑声落在台面上，被风吞了。但吞之前，两个人都听见了。\n\n女娲在泠的肩膀上睡过去的时候，天边已经泛白了。\n\n泠没睡。她坐着，让女娲靠着，看着远处——人间与魔界的交界线在晨光里现出来，细细的，像一道疤。\n\n她翻了人间的那道河，已经有人在新岸上过日子了。\n\n她看得见。她够不着。\n\n这也好。她本来也没想够着。"}, {"id": 67, "title": "静默台（下）", "content": "# 第67章 静默台（下）\n\n第二天，风小了点——也不小，是她们习惯了。女娲窝在尾巴里，睡了个囫囵觉。醒来的时候，泠还坐着，尾巴还搭在她身上。\n\n\"你一夜没睡？\"女娲问。\n\n\"睡了。\"泠说，\"醒得比你早。\"\n\n\"骗人。\"\n\n\"真的。狐皮厚，眯一会儿就行。\"\n\n女娲爬起来——尾巴滑下去，她赶紧接住，又塞回自己腿下垫着：\"……这尾巴借我坐坐。\"\n\n\"坐吧。\"\n\n她们坐在台中央，对着云海，没事做。没事做，就开始找事做。\n\n\"我们数云。\"女娲说，\"谁数得对，谁赢。\"\n\n\"赢什么？\"\n\n\"赢——\"女娲想了想，\"赢一次梳头发！输的人给赢的人梳头发！\"\n\n\"……你就是想让我给你梳头发。\"\n\n\"你管我！\"\n\n她们数了一上午的云。云太多了，数不清，女娲输了三回，泠输了四回——两个人都说自己赢了，谁也不服谁。最后女娲恼了：\"不算！云是活的，它们自己会跑！\"\n\n\"你赖皮。\"\n\n\"我没赖！是云赖！\"\n\n下午，女娲发现泠的尾巴毛被风吹得乱糟糟的——白毛打了卷，沾着云海的露水。她蹲下来，伸手给泠顺尾巴毛。\n\n\"你干嘛？\"泠问。\n\n\"给你理毛。\"女娲说，\"你们狐狸不是爱理毛吗。\"\n\n\"……那是我自己理。\"\n\n\"我帮你理！\"\n\n她把尾巴抱到膝上，从根到梢，一缕一缕顺。白毛又软又长，顺完的地方蓬蓬的，翘着。她顺着顺着，在尾巴梢上发现一小撮被露水沾湿打结的毛，就凑过去，用手指一点一点拆开，拆完还不放心，凑上去吹了吹。\n\n\"……你尾巴毛真多。\"女娲说。\n\n\"白狐嘛。\"\n\n\"你九条都放出来了，一个人打理得过来吗？\"\n\n\"一条一条理，轮着来。\"\n\n\"那我帮你理！\"女娲说，\"昨天你拿九条尾巴埋我，今天我包两条！\"\n\n\"……那就两条。\"泠说，\"第三条开始，我自己来。\"\n\n\"嗯。谢了。\"\n\n\"客气什么！\"\n\n理完毛，她们又靠着坐。风把云推过来，又推过去。女娲说：\"……等出去了，我带你去人间，看周朝的新年。听说他们换了个历法，比商的清楚。\"\n\n泠没有接话。\n\n女娲也没有再问。她知道自己说的是句空话——她知道静默台是百年，她自己也说不清\"出去\"是哪天。但她说了，泠听着，风吞了，也算说过了。\n\n第三天，或者第四天，她们数不清了——风停了一瞬。\n\n那是不寻常的：静默台的风从来不停。可那天，风停了下来。\n\n女娲先抬起头。她看见云海里，有一条路——很窄的一条光路，从云海深处铺过来，直通台沿。光路的尽头，站着一个人。\n\n穿着执天卫的白袍。他站在光路上，风不动他的衣摆，像一幅画。\n\n\"女娲长老。\"他开口，\"王母娘娘有请。请随我回去。\"\n\n女娲顿了一下。她回头看泠——泠坐在台上，看着她。\n\n\"……为什么是我？\"女娲说。\n\n\"娘娘说，您站够了。\"执天卫说。\n\n\"我没站够！\"女娲说，\"我——\"\n\n\"娘娘还说，\"执天卫说，\"您再站下去，云海东段的边报，就没人收了。\"\n\n女娲噎住了。她张了张嘴，想说什么——她知道这是借口，王母娘娘想放她，什么借口找不出来。可她站起来了。\n\n她站起来，又蹲下去，看着泠：\n\n\"……你等我。\"\n\n\"嗯。\"\n\n\"我出去，我找房长老，我找长老院，我——\"\n\n\"嗯。\"\n\n\"你别光嗯！\"\n\n\"……行。\"泠说，\"我等你。\"\n\n女娲看着她，眼眶有点红——风大，还是风大。她吸了吸鼻子，站起来，走上那条光路。走了两步，又回头：\n\n\"泠！\"\n\n\"嗯。\"\n\n\"……你别怕。\"\n\n\"我不怕。\"泠说。\n\n女娲走了。\n\n光路在她身后收起来，像一幅画轴被卷走。风又灌回来了——台上，只剩下泠一个人。\n\n她坐在台中央，看着光路消失的地方，很久。\n\n\"……她回来吗？\"她问。\n\n门里，晞的声音闷闷的：\"……会回来的。\"\n\n泠听着。\n\n\"她救不了你的。\"晞说，\"百年呢。她救不了你的。\"\n\n\"……我知道。\"\n\n\"那你还让她走？\"\n\n\"她得回去。\"泠说，\"她还有职司。她不能跟我一起烂在台上。\"\n\n\"……她回去，天界就看不见你了。\"晞说，\"静默台，谁也看不见。百年。谁也看不见你。包括她。\"\n\n泠没有接话。风从四面灌进来，灌满她的耳朵。远处，人间方向的天边，有一道细细的白烟升起来——女娲宫的香火，还在烧。\n\n她看得见。她够不着。\n\n但她知道，有个人会回来。说\"你别怕\"的人，一定会回来。\n"}]};

  $("menuBtn").addEventListener("click", openDrawer);
  mask.addEventListener("click", closeAllPanels);
  brand.addEventListener("click", function (e) { e.preventDefault(); loadChapter(1); });

  /* ---------- 右侧日志栏 ---------- */
  var LOG_KEY = "lingxi_logs";
  var logPanel = $("logPanel");
  var logList = $("logList");
  var logInput = $("logInput");
  var logCount = $("logCount");

  function closeAllPanels() {
    closeDrawer();
    logPanel.classList.remove("open");
    $("logBtn").classList.remove("active");
    mask.classList.remove("show");
  }

  function getLogs() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveLogs(logs) { localStorage.setItem(LOG_KEY, JSON.stringify(logs)); }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function fmtTime(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
           " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function renderLogs() {
    var logs = getLogs();
    logCount.textContent = logs.length ? "(" + logs.length + ")" : "";
    logList.innerHTML = "";
    if (!logs.length) {
      logList.innerHTML = '<div class="log-empty">还没有记录，写一笔今天的吧</div>';
      return;
    }
    logs.forEach(function (item, i) {
      var div = document.createElement("div");
      div.className = "log-item";
      var meta = document.createElement("div");
      meta.className = "log-meta";
      meta.textContent = item.time;
      var text = document.createElement("div");
      text.className = "log-text";
      text.textContent = item.text;
      var del = document.createElement("button");
      del.className = "log-del";
      del.textContent = "×";
      del.title = "删除";
      del.addEventListener("click", function () {
        var logs2 = getLogs();
        logs2.splice(i, 1);
        saveLogs(logs2);
        renderLogs();
      });
      div.appendChild(meta);
      div.appendChild(text);
      div.appendChild(del);
      logList.appendChild(div);
    });
  }

  $("logAdd").addEventListener("click", function () {
    var text = logInput.value.trim();
    if (!text) return;
    var logs = getLogs();
    logs.unshift({ time: fmtTime(new Date()), text: text });
    saveLogs(logs);
    logInput.value = "";
    renderLogs();
  });
  logInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("logAdd").click(); }
  });
  $("logBtn").addEventListener("click", function () {
    var open = logPanel.classList.contains("open");
    if (open) { closeAllPanels(); }
    else {
      drawer.classList.remove("open");
      logPanel.classList.add("open");
      mask.classList.add("show");
      this.classList.add("active");
      renderLogs();
      logInput.focus();
    }
  });
  renderLogs();

  function buildList() {
    totalCount.textContent = chapters.length;
    list.innerHTML = "";
    chapters.forEach(function (c) {
      var a = document.createElement("a");
      a.textContent = "第" + c.id + "章 " + c.title;
      a.dataset.id = c.id;
      a.addEventListener("click", function () {
        loadChapter(c.id);
        closeDrawer();
      });
      list.appendChild(a);
    });
  }

  function renderListActive() {
    Array.prototype.forEach.call(list.querySelectorAll("a"), function (a) {
      a.classList.toggle("active", Number(a.dataset.id) === state.current);
    });
  }

  /* ---------- 封面 ---------- */
  var cover = $("cover"), coverStart = $("coverStart");
  coverStart.addEventListener("click", function () {
    cover.classList.add("hidden");
    loadChapter(parseInt(localStorage.getItem("lingxi_last"), 10) || 1);
  });

  /* ---------- 正文渲染 ---------- */
  function renderText(text) {
    var html = "";
    text.split(/\n+/).forEach(function (p) {
      p = p.trim();
      if (!p) return;
      html += "<p>" + p.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</p>";
    });
    content.innerHTML = html;
  }

  function loadChapter(id) {
    state.current = id;
    var idx = chapters.findIndex(function (c) { return c.id === id; });
    if (idx < 0) { title.textContent = "章节不存在"; return; }
    var c = chapters[idx];
    title.textContent = "第" + c.id + "章 " + c.title;
    renderText(c.content);
    document.title = "第" + c.id + "章 " + c.title + " · 泠晞";
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= chapters.length - 1;
    pagerInfo.textContent = "第 " + (idx + 1) + " / " + chapters.length + " 章";
    progress.textContent = Math.round(((idx + 1) / chapters.length) * 100) + "%";
    renderListActive();
    window.scrollTo({ top: 0 });
    localStorage.setItem("lingxi_last", String(id));
  }

  prevBtn.addEventListener("click", function () {
    var idx = chapters.findIndex(function (c) { return c.id === state.current; });
    if (idx > 0) loadChapter(chapters[idx - 1].id);
  });
  nextBtn.addEventListener("click", function () {
    var idx = chapters.findIndex(function (c) { return c.id === state.current; });
    if (idx >= 0 && idx < chapters.length - 1) loadChapter(chapters[idx + 1].id);
  });

  /* ---------- 键盘翻页 ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { prevBtn.click(); }
    else if (e.key === "ArrowRight") { nextBtn.click(); }
    else if (e.key === "Escape") { closeAllPanels(); }
  });

  /* ---------- 初始化 ---------- */
  buildList();
  var last = parseInt(localStorage.getItem("lingxi_last"), 10);
  var target = chapters.some(function (c) { return c.id === last; }) ? last : 1;
  loadChapter(target);
})();
</script>
</body>
</html>
