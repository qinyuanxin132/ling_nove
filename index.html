  $("menuBtn").addEventListener("click", openDrawer);
  mask.addEventListener("click", closeAllPanels);
  brand.addEventListener("click", function (e) { e.preventDefault(); loadChapter(1); });

  /* ---------- 右侧日志栏 ---------- */
  var LOG_KEY = "lingxi_logs";
  var logPanel = $("logPanel");
  var logList = $("logList");
  var logInput = $("logInput");
  var logCount = $("logCount");

  function closeAllPanels() {
    closeDrawer();
    logPanel.classList.remove("open");
    $("logBtn").classList.remove("active");
    mask.classList.remove("show");
  }

  function getLogs() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveLogs(logs) { localStorage.setItem(LOG_KEY, JSON.stringify(logs)); }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function fmtTime(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
           " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function renderLogs() {
    var logs = getLogs();
    logCount.textContent = logs.length ? "(" + logs.length + ")" : "";
    logList.innerHTML = "";
    if (!logs.length) {
      logList.innerHTML = '<div class="log-empty">还没有记录，写一笔今天的吧</div>';
      return;
    }
    logs.forEach(function (item, i) {
      var div = document.createElement("div");
      div.className = "log-item";
      var meta = document.createElement("div");
      meta.className = "log-meta";
      meta.textContent = item.time;
      var text = document.createElement("div");
      text.className = "log-text";
      text.textContent = item.text;
      var del = document.createElement("button");
      del.className = "log-del";
      del.textContent = "×";
      del.title = "删除";
      del.addEventListener("click", function () {
        var logs2 = getLogs();
        logs2.splice(i, 1);
        saveLogs(logs2);
        renderLogs();
      });
      div.appendChild(meta);
      div.appendChild(text);
      div.appendChild(del);
      logList.appendChild(div);
    });
  }

  $("logAdd").addEventListener("click", function () {
    var text = logInput.value.trim();
    if (!text) return;
    var logs = getLogs();
    logs.unshift({ time: fmtTime(new Date()), text: text });
    saveLogs(logs);
    logInput.value = "";
    renderLogs();
  });
  logInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("logAdd").click(); }
  });
  $("logBtn").addEventListener("click", function () {
    var open = logPanel.classList.contains("open");
    if (open) { closeAllPanels(); }
    else {
      drawer.classList.remove("open");
      logPanel.classList.add("open");
      mask.classList.add("show");
      this.classList.add("active");
      renderLogs();
      logInput.focus();
    }
  });
  renderLogs();

  function buildList() {
    totalCount.textContent = chapters.length;
    list.innerHTML = "";
    chapters.forEach(function (c) {
      var a = document.createElement("a");
      a.textContent = "第" + c.id + "章 " + c.title;
      a.dataset.id = c.id;
      a.addEventListener("click", function () {
        loadChapter(c.id);
        closeDrawer();
      });
      list.appendChild(a);
    });
  }

  function renderListActive() {
    Array.prototype.forEach.call(list.querySelectorAll("a"), function (a) {
      a.classList.toggle("active", Number(a.dataset.id) === state.current);
    });
  }

  /* ---------- 正文渲染 ---------- */
  function renderText(text) {
    var html = "";
    text.split(/\n+/).forEach(function (p) {
      p = p.trim();
      if (!p) return;
      html += "<p>" + p.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</p>";
    });
    content.innerHTML = html;
  }

  function loadChapter(id) {
    state.current = id;
    var idx = chapters.findIndex(function (c) { return c.id === id; });
    if (idx < 0) { title.textContent = "章节不存在"; return; }
    var c = chapters[idx];
    title.textContent = "第" + c.id + "章 " + c.title;
    renderText(c.content);
    document.title = "第" + c.id + "章 " + c.title + " · 泠晞";
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= chapters.length - 1;
    pagerInfo.textContent = "第 " + (idx + 1) + " / " + chapters.length + " 章";
    progress.textContent = Math.round(((idx + 1) / chapters.length) * 100) + "%";
    renderListActive();
    window.scrollTo({ top: 0 });
    localStorage.setItem("lingxi_last", String(id));
  }

  prevBtn.addEventListener("click", function () {
    var idx = chapters.findIndex(function (c) { return c.id === state.current; });
    if (idx > 0) loadChapter(chapters[idx - 1].id);
  });
  nextBtn.addEventListener("click", function () {
    var idx = chapters.findIndex(function (c) { return c.id === state.current; });
    if (idx >= 0 && idx < chapters.length - 1) loadChapter(chapters[idx + 1].id);
  });

  /* ---------- 键盘翻页 ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { prevBtn.click(); }
    else if (e.key === "ArrowRight") { nextBtn.click(); }
    else if (e.key === "Escape") { closeAllPanels(); }
  });

  /* ---------- 初始化 ---------- */
  buildList();
  var last = parseInt(localStorage.getItem("lingxi_last"), 10);
  var target = chapters.some(function (c) { return c.id === last; }) ? last : 1;
  loadChapter(target);
})();
</script>
</body>
</html>
