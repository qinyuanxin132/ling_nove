n\n泠想了想：\"那你现在要去寻他吗？\"\n\n\"不。\"江岫说，\"说好的，等你的门好了，我再去。\"\n\n\"……要是门一直不好呢？\"\n\n江岫看了她一眼，嘴角动了一下，不知道算不算笑：\"门在长。我看见了。它会长好的。\"\n\n后台传来晞的声音：\"……嗯。快了。\"\n\n泠摸了摸左肩胛。那片很慢的水声还在，但她觉得，好像比昨天浅了一点。\n\n半夜，泠醒了。江岫还坐在门口，背对着她。月光把他膝上两只木鸟的影子投在地上——一只鸟嘴活了，一只只有身子，像一句话，说了半句，另一半还含在嘴里。\n\n泠看了一会儿，没叫他，闭上眼又睡了。\n\n第二天清晨，线从石屋后坡上山。泠走在前面，江岫跟在后面，怀里揣着两只木鸟。\n\n山很安静。鸟都不叫。"}, {"id": 30, "title": "旧门", "content": "山里的路不好走，走了一整天。线贴着石壁，贴着树根，一直往上，走到山腰——停下了。\n\n线头停在一道门洞前。\n\n不是人家那种门。是石头的，门框半埋在土里，门扇不知去哪了，只剩一个黑黝黝的门洞。藤蔓从门框上垂下来，像两道干涸的帘子。\n\n路难走，但路上有东西看。每隔一段，石壁上就有一行刻字，有的深有的浅——风化了的是老辈的，棱角新的是近年的。每行刻字旁边，都刻着三个字：守微人。\n\n\"他们来过这儿？\"泠问。\n\n\"来过。\"江岫说，\"守微人走线，走到要紧的地方，都要留个名。一是给后来人看——这路有人走过，走得通。二是给自己看——走过的路，都是真的。\"\n\n\"那你师父，也会在这山里留名吗？\"\n\n江岫没答。他走快了两步，往山腰去了。\n\n守微录在江岫怀里轻轻震了一下。泠知道，是那一页——墨色的山，山腰一道门。一模一样。\n\n\"书指的，就是这里。\"江岫说。\n\n泠蹲在门洞边，往里看。里面是黑的，看不见底，也看不见墙。风从门洞里往外走，带着一股很旧的味道，像石头晒了一百年。\n\n\"这扇门，通向哪？\"\n\n江岫没答。他伸手摸了摸门框，石头是凉的。\n\n后台安静了一整夜。第二天清晨，晞才说话。\n\n\"……我到过这里。\"\n\n泠愣住了：\"晞姐？\"\n\n\"我越界那天，走的，就是这扇门。\"晞的声音很轻，像怕惊动什么，\"魔界和人间，有条旧路。我以为它早被堵死了。原来它还开着。\"\n\n\"那你那天，就是从这门走出去的？\"\n\n\"嗯。走出去，是天族的边界。我走了太远，没有回头。\"\n\n泠没问\"然后呢\"。她知道然后——晞说过，她坠落的时候，浑身是血。\n\n泠过了一会儿，又问：\"晞姐，那天……疼吗？\"\n\n\"不疼。\"晞说，\"就是没站稳。\"\n\n\"骗人。\"\n\n\"……有一点点。\"晞的声音闷闷的，\"主要是累。走得太远，又挨了一下，脚底发虚，就没站稳。\"\n\n\"那下回，别走那么远。\"\n\n\"下回有你看着，走不远。\"\n\n江岫在门边坐下：\"那你现在，还想不想回去？\"\n\n后台沉默了很久。\n\n\"……不想。\"晞说，\"那头没有等我的人。这头有。\"\n\n泠蹲在门洞边，笑了：\"那你站远一点。你站这门边，我怕门把你吸回去。\"\n\n\"吸不回去。\"晞说，\"门认路的。走过的路，它记得。\"\n\n\"晞姐，\"泠问，\"这门，跟你的门，是一样东西吗？\"\n\n后台沉默了一会儿。\n\n\"不一样。\"晞说，\"你的门，是活的。这道门，是死的——它年轻的时候活着，后来没人走了，它就老了，死了。\"\n\n\"那它死了，为什么还开着？\"\n\n\"门这东西，开了就是开了。\"晞说，\"就像人走过的路，走过了，路还在。\"\n\n\"那你走的时候，它是活着的？\"\n\n\"嗯。\"晞说，\"它活着，送了我一程。\"\n\n夜里，三人在门洞前生了一堆火。火光照亮了半圈石头，照不进门洞——门洞是黑的，黑得像一口井，火光到了门口，就怯怯地停住了，不肯往里走。\n\n\"火进不去。\"泠说。\n\n\"嗯。\"晞在后台说，\"旧通道不吃光。它只吃风。\"\n\n\"那它吃什么长大？\"\n\n\"不知道。\"晞说，\"它比我老。我过门的时候，它就这么老。\"\n\n夜里，泠照例给门\"听线\"。这次她没有贴地——线在山腰拐了个弯，贴着门框走，像水流绕过大石头，发出很轻的、沙沙的声音。\n\n她觉着左肩胛暖了一下。就一下，像有人隔着衣裳，轻轻按了按她的后背。\n\n\"晞姐？\"\n\n\"……我在。\"晞的声音闷闷的，\"泠，你听。\"\n\n泠把耳朵贴近门框。沙沙声还在，像很远的地方有水流过河滩。\n\n\"这是你的线。\"晞说，\"它走到这里，拐了个弯。\"\n\n\"拐弯去哪儿？\"\n\n晞没有立刻答。风从门洞里过，把她的声音吹得很远。\n\n\"……回来。\"\n\n后半夜起了风。泠迷迷糊糊听见晞说了一句话，像说给自己听：\n\n\"这条缝，原来这么宽。\"\n\n泠没睁眼，嘟囔了一句：\"晞姐，你说什么？\"\n\n\"没什么。\"晞说，\"睡吧。明天路还长。\""}, {"id": 31, "title": "风", "content": "泠是醒在一阵风里的。\n\n山腰的风从门洞里过，吹在她脸上。她睁开眼，天刚亮，石头门框被晨光照成淡金色。\n\n她记得昨夜睡前，还趴在地上听过一次——水声还在，细细的，像一条还没干透的河。她当时想，照这个长法，少说还要走十天半个月。\n\n她没想过，路会在她睡着的时候，自己走完。\n\n她照例伸手去摸左肩胛——摸门的习惯，像人摸伤口，摸了十七天。\n\n不凉了。\n\n她愣了一下，又摸了一遍。那片\"很慢的水声\"，没了。后背平平的，什么也没有——就像那里从来没有什么门，什么裂缝。\n\n\"晞姐？\"她喊。\n\n没有应。\n\n\"晞姐！\"她有点慌了，声音大起来。\n\n过了很久，后台传来很轻的一声：\n\n\"……泠。我好像，能摸到外面的风了。\"\n\n泠的手停在后背上。她不敢动了，像怕惊着什么。\n\n\"你出来。\"她说，\"你出来试试。\"\n\n\"门才刚长好。\"晞说，\"我……不一定会。\"\n\n\"试试嘛。\"\n\n江岫不知什么时候醒了，靠着门框站着，没说话，看着。\n\n泠的右手背上，那道暗红色的剑形印记亮了起来——平时只有晞接管身体时才亮。\n\n然后，从印记里，暗红色的光一点点浮出来，在泠面前慢慢凝成一个人形。\n\n不抢身体的——是另一个。她站在泠面前，像是从泠影子里长出来的。\n\n凝得很慢。先是轮廓，再是衣角，再是脸。\n\n她凝出来的时候，自己也不知道自己会长成什么样——她只是照着看过十七年的那张脸，一点一点，把轮廓描了出来：银白的发，垂到腰间；白色的衣，和她一模一样。\n\n只有眼睛不一样。暗红的，像凝固的晚霞，又像两道极细的门缝。\n\n脸很白，白得比泠更淡一些，眉眼安安静静的，像她每次在后台说\"……对不起\"时那样。\n\n她低头，看着自己的手，看了很久。\n\n\"……原来我长这样。\"她说。\n\n泠蹲在她面前，仰着头看她。姐姐的脸，她第一次看见——和她自己像了九成，只有那双眼睛，是陌生的。\n\n\"晞姐。\"泠喊她。\n\n晞抬起头，看着她，眼里的暗红像水一样动了动。她张了张嘴，想说什么，没说出来。\n\n风从门洞里过，吹起她银白的头发。\n\n\"……云，是这么慢的。\"她说。\n\n泠不知道她为什么说这个。很久很久以前，她一岁那年说过\"云很慢\"，晞没有纠正——这句话，晞记了十七年。\n\n泠围着她转了一圈。\n\n\"你跟我，长得一模一样。\"泠蹲下来，凑近了看她的眼睛，\"就是眼睛不一样。\"\n\n\"嗯。\"晞说，\"别的，我照着你的样子长的。\"\n\n\"那你为什么不照一个自己的？\"\n\n\"我不知道自己长什么样。\"晞说，\"我看了十七年的，只有你的脸。\"\n\n\"那现在你知道了。\"泠说，\"你长这样——银白的头发，白的衣裳，还有一双红的眼睛。好看。\"\n\n晞低下头，看着她：\"……你刚才说，红的眼睛，像什么？\"\n\n\"像我娘给我缝的那个香囊，里子是红的。\"\n\n晞想了想：\"……你娘，手很巧。\"\n\n\"嗯。针脚可密了。\"泠说，\"等回家，我让她也给你缝一个。\"\n\n晞试着走了一步。一步，两步——第三步歪了，往边上倒。\n\n泠一把接住她。\n\n\"你慢点！\"泠说，\"你走都不会走了？\"\n\n晞被她扶着，站直，耳根有点红：\"……十七年，没走过路。\"\n\n\"那你多走几遍嘛。\"泠说着，松开手，退开两步，\"来，到我这儿来。\"\n\n晞站了一会儿，像下决心似的，抬起脚，一步一步，朝泠走过去。走得很慢，像小狐狸第一次学走路——其实是泠一岁那年学走路的样子，晞在后台看了十七年。\n\n泠接住她，两个人一起倒在地上。泠笑得直打滚。\n\n\"晞姐你走路像鸭子！\"\n\n晞躺在地上，看着天，嘴角弯了一下——一个很浅的、几乎看不见的笑。\n\n\"……下次走给你看。\"\n\n晞低头看了看自己的手，又看了看地上的影子——影子跟着她动，和泠的一样，是寻常的影子。\n\n\"泠。\"她问，\"我这样……像不像人？\"\n\n\"你就是人。\"泠说。\n\n\"我是魔。\"\n\n\"魔也是人变的。\"泠理直气壮，\"你站在这儿，会走路，会说话，还会脸红——你不是人是什么？\"\n\n晞被她堵住了，半天才说：\"……我没有脸红。\"\n\n\"你刚才耳朵都红了。\"\n\n江岫在门边看着，没说话，转过身去，把行囊收好了。\n\n泠坐在地上问：\"晞姐，你的门，到底是什么时候好的？\"\n\n晞想了想：\"不知道。\"\n\n\"你现在能感觉出来吗？\"\n\n\"能。它好了。\"晞说，\"走着走着，就好了。\"\n\n泠摸了摸自己的后背——平平的，什么都没有。\n\n\"那我以后，还给你听线吗？\"\n\n\"不用了。\"晞说，\"它自己会长。就像路，自己会走。\"\n\n\"那……你以后，可以一直在外面了吗？\"\n\n晞低头看了看自己的手，又看了看她：\"……撑得久一点。你灵力不够了，我就回去。\"\n\n\"那你要是不回去呢？\"\n\n\"不回去，你撑不住。\"晞说，\"你灵力一空，我就得回门里去。躲不开的。\"\n\n泠抱住她，像抱一只大狐狸：\"那你别硬撑。灵力不够了，就回去——我睡一觉就补回来了，你明天再出来。\"\n\n晞任她抱着，没说话。过了一会儿，她抬起手，轻轻放在泠的后背上——放的位置，正好是门长好的地方。\n\n\"……嗯。\""}, {"id": 32, "title": "还书", "content": "守微录摊在石屋的桌上，翻到最后一页。\n\n那页是空的。墨色的山、关着的门，都褪了——像画完的画，收了笔。\n\n江岫把书合上，拿布包好。\n\n\"书看完了。\"他说，\"它该回家了。\"\n\n\"你把它带回去？\"泠问。\n\n\"嗯。院子还锁着，钥匙挂在钉子上。\"他顿了顿，\"书认路。我带它回家。\"\n\n\"那……我们呢？\"\n\n江岫看着她，又看了看她身后——晞站在门洞边，被晨光照着，影子投在地上，长而薄。\n\n\"你们有你们的路。\"他说。\n\n江岫把行囊背上，怀里揣着两只木鸟——旧货摊那只，石屋这半只。\n\n\"对了。\"他说，\"院子里窗台上，还有一只木猫，跟你怀里那只是一对。\"\n\n\"我知道。\"泠说，\"我走的时候，把它留下了。\"\n\n\"它等着你回去看它。\"江岫说，\"等找到了师父，我路过青丘，给你们捎个话。\"\n\n\"捎什么话？\"\n\n\"就说，猫养得好，院子也干净，让她们放心。\"\n\n\"我先回院子，把书放回去。\"他说，\"然后，我往山里走。师父的木鸟在镇上出现，他的字在山脚——他走的方向，是山里。\"\n\n\"那你要找多久？\"\n\n\"不知道。找东西这种事，说快也快，说慢也慢。\"他笑了一下，\"找得到最好。找不到，就当把这条路走一遍。\"\n\n泠看着他：\"那你找到了，还回来吗？\"\n\n这话她问过。那时江岫说，回来。\n\n江岫顿了顿，还是那两个字：\"回来。\"\n\n晞一直站在门边没说话。江岫走过她身边时，她开口了：\n\n\"江岫。\"\n\n江岫停住。\n\n\"……谢谢。\"晞说，\"书，你好好守着。\"\n\n江岫点了点头，没回头，摆了摆手，往山下走了。\n\n走了几步，他停下来，没回头，声音从风里传过来：\n\n\"门好了，就好好过。\"\n\n泠站在山坡上，看着他越走越远，变成一个黑点，拐过山脚，不见了。\n\n山里安静下来了。鸟叫了——之前一路，鸟都被惊得不敢叫。现在一只麻雀落在门框上，歪着头看她们。\n\n晞蹲下来，看着那只麻雀，看得入神。她伸手，麻雀没跑。\n\n\"它不怕你。\"泠说。\n\n\"嗯。它没见过我。\"晞说，\"它不知道魔是什么。\"\n\n泠在她旁边蹲下：\"那你要不要让麻雀知道你是什么？\"\n\n晞想了想：\"……不用了。它怕我，我就没朋友了。\"\n\n泠笑了，搂住她肩膀：\"你还有我呢。\"\n\n过了一会儿，晞问：\"泠，我在人间走，会不会吓到人？\"\n\n\"不会。\"泠说，\"你话少，走路还像鸭子。江岫那样的人都没人怕，怕你做什么。\"\n\n\"……我走路不像鸭子。\"\n\n\"像。\"\n\n晚上，两人躺在石屋里，看着屋顶漏下来的月光。\n\n\"晞姐，门好了。江岫也走了。\"泠说，\"我们接下来，干什么？\"\n\n晞沉默了很久。\n\n\"……我想去边界看看。\"\n\n\"边界？\"\n\n\"魔界和天界中间，有一条线。\"晞说，\"我以前，总站在那儿吹风。风很好。\"\n\n\"那我也去。\"泠说，\"我也吹吹。\"\n\n\"你吹不了。\"晞说，\"那边的风，往地底下吹。你会冷。\"\n\n\"那你就站我前面，替我挡着。\"\n\n晞想了想：\"……嗯。\"\n\n半夜，泠被一阵动静弄醒——不是声音，是线在动。\n\n她起身，摸到屋外。山下的黑里，有一点极淡的青光，一闪，灭了。\n\n\"晞姐，你看。\"\n\n晞站在她旁边，看着那个方向，看了很久。\n\n\"……是魔的气息。\"她说，\"不是那只老的。是新的。它往东去了。\"\n\n\"往东？东边是江岫走的方向。\"\n\n晞没有接话。风从山下吹上来，带着一点说不清的味道。\n\n\"东边，过了那座山，就是江岫回院子的路。\"晞说，\"魔界的东西，轻易不进山。它进山，就是有事。\"\n\n\"它会不会去找江岫？\"泠问。\n\n\"……不知道。\"晞说，\"但我知道一件事。\"\n\n\"什么？\"\n\n\"废村那只老魔，看见过你。\"晞说，\"它会把话传出去的。'这边有个活人，身体里藏着东西。'——上面迟早会知道。\"\n\n泠握紧了腰间的刀。\n\n\"那我们走快点。\"她说，\"离魔界越近，越能听见风声。\"\n\n晞看了她一眼：\"……好。\""}, {"id": 33, "title": "边界", "content": "往西北走了三天，风开始变硬。\n\n这天傍晚，两人在一条干涸的河床边歇脚。晞捡了一根树枝，在地上画——就是那天泠学的那几个魔界字。\n\n\"晞姐，\"泠想起一件事，\"我以前问过你——你以前那个妹妹，她爱吃什么？\"\n\n晞的手停住了。\n\n那是很久以前的事了，泠还是小雪的时候问的。当时晞没有回答。\n\n晞看着地上的字，看了很久。\n\n\"……她爱吃糖。\"晞说，\"魔界有种果子，叫甜梨。熟了是红的，一颗一颗，像小灯笼。她每年秋天，都摘很多，揣在怀里，走到哪儿吃到哪儿。\"\n\n\"那你呢？\"\n\n\"我不爱吃。\"晞说，\"她总说，姐姐，你不吃，我就替你吃了。然后她真的全吃了，一颗也不剩。\"\n\n泠安静地听着：\"她一定很想你。\"\n\n晞没接话。过了一会儿，她说：\"她死的时候，跟我说，别替我报仇。你不适合杀人。\"\n\n\"你听她的了？\"\n\n\"……嗯。\"晞把树枝放下，\"她说的对。我不适合。\"\n\n风从河床里过，吹起她银白的头发。\n\n\"那我们就去摘甜梨。\"泠说，\"等我们找到魔界的口子，我给你摘一捧，你放在她坟前。\"\n\n晞看了她很久，眼眶有点红，没说话，只是轻轻\"嗯\"了一声。\n\n路过一个小镇，泠拉着晞去糖人摊前，买了一只糖狐狸，塞进晞手里。\n\n\"吃。\"\n\n晞拿着糖人，看了半天：\"……原来糖人长这样。\"\n\n\"你以前只能尝到我嘴里的。现在你自己吃。\"\n\n晞咬了一小口，眼睛弯了一下：\"……很甜。\"\n\n老翁看着她们：\"姐妹俩？\"\n\n\"嗯。\"泠说，\"我姐。\"\n\n\"哟，一个模子刻出来的。\"老翁笑呵呵的，\"也就眼睛不一样——一个蓝的，一个红的。\"\n\n\"随了不同的长辈。\"泠面不改色，\"我随我娘，我姐随我爹。\"\n\n三天下来，晞的分身稳了很多。能走一整天，能帮泠背水，能替她挡风。\n\n傍晚起风，晞自然而然地站到上风口，把风挡住。\n\n\"你别把我当小孩。\"泠说。\n\n\"你不是小孩。\"晞说，\"你是妹妹。\"\n\n泠一时不知道说什么，只好说：\"……你也是妹妹。你在我这儿，想当妹妹也行。\"\n\n这句话，是很多年前泠说过的。晞记着呢。她嘴角弯了一下：\"……我当姐姐。\"\n\n第四天，她们到了。\n\n那条线，不是画在地上的。是风——从一片很平的旷野上横着刮过，一边的风是暖的，一边的风是凉的。界线清清楚楚，像一堵看不见的墙。\n\n晞站在暖风那侧，伸出手，指尖探进凉风里。\n\n\"就是这里。\"她说，\"我小时候，总站在这儿。\"\n\n\"站这儿干什么？\"\n\n\"吹风。\"晞说，\"天族管不了这儿，魔族也管不了这儿。站在这儿，谁都不是。\"\n\n泠学她，把手指探进凉风里，打了个哆嗦：\"真冷。\"\n\n晞伸手，把她的手包住，从凉风里拉回来：\"说了你吹不了。\"\n\n\"那你替我吹。\"\n\n晞站在线上，风吹起她的头发。她站在那儿，像一尊安静的石像——像很多很多年前，那个站在边界线上想事情的魔族公主。\n\n泠在她旁边站了一会儿：\"晞姐，你站这儿的样子，像在等什么人。\"\n\n晞没有回头：\"……没有。我没在等谁。\"\n\n\"那你为什么总站这儿？\"\n\n\"不知道。\"晞说，\"站得久了，就习惯了。\"\n\n\"晞姐。\"泠说，\"你以前站这儿，有没有人陪你？\"\n\n\"没有。\"\n\n\"那以后我陪你。\"泠说，\"你站多久，我站多久。反正我腿脚好。\"\n\n晞看了她一会儿，没说话。风把她的头发吹到脸上，她抬手，把那缕头发别到耳后——动作很轻，像怕碰坏了什么。\n\n\"……嗯。\"\n\n日头偏西，风变了向。\n\n晞的脸色变了。她一把拉住泠，往后退了三步，退回暖风里。\n\n\"怎么了？\"\n\n\"别说话。\"晞压低声音，\"看那边。\"\n\n远处的天边，一个白点浮在空中，朝这边移过来。不是鸟。是人。穿着一身白，身后拖着长长的袍角——巡天卫。\n\n天族的巡天卫，巡到了人间边界。\n\n晞的手指冰凉的，死死攥着泠的手腕：\"他知道我吗？\"\n\n\"……不知道。\"泠说，\"但你别动。我们走。\"\n\n两人弯着腰，沿着一道土坎，慢慢地往人间那边退。\n\n白点在天上悬了一会儿，转了个圈，往另一个方向去了——没往这边来。\n\n晞一直退到一座土丘后面，才松开手。她靠着土丘，喘着气，脸上一点血色都没有。\n\n\"你怕他。\"泠说。\n\n\"我怕他看见你。\"晞说，\"他看见你，就会看见我。看见我——天族就知道我活着。\"\n\n\"那下次，我们不站那么近。\"\n\n晞摇了摇头：\"边界线，不是每次都能避开的。\"\n\n太阳落下去了。凉风那侧的天，被染成一条暗红的线，像一道伤口，又像一道门。\n\n晞站在人间这侧，回头看了一眼那条线。\n\n\"……下次再来。\"她说。\n\n泠站在她旁边：\"嗯。下次。\"\n\n两人转身，往人间走了。晚风从她们身后吹过来，把晞银白的头发吹得飘起来。\n\n很远的地方，那个白点彻底消失在天边。\n\n夜来了。"}, {"id": 34, "title": "风声", "content": "从边界线往人间走，是下坡。风从背后追上来，推着她们走，又像在留她们。\n\n晞走得很稳了。一步，一步，不歪，不急。她低着头，看着自己的脚，看了很久。\n\n\"……路，是往下走的。\"她说。\n\n\"嗯？\"泠问。\n\n\"我以为路都是平的。\"晞说，\"我在门里看了十七年，从没看过坡。\"\n\n\"那是你没出来走过。\"泠说，\"人间的路一会儿上，一会儿下，走多了就惯了。\"\n\n晞没接话。\n\n回到第一个镇子的时候，日头偏西。镇口卖炊饼的刚出笼，热气腾起来，白花花一片。晞在摊子前站住了，看了很久。\n\n泠掏钱买了两个。一个塞给她，一个自己咬了一口。\n\n\"烫。\"晞拿着炊饼，没动。\n\n\"吹一吹。\"\n\n晞吹了一下。热气歪了歪，又直起来。她咬了一口，嚼了很久，咽下去。\n\n\"……是热的。\"她说。\n\n\"炊饼当然是热的。\"\n\n\"我是说，\"晞说，\"我以前吃的东西，都是冷的。甜的也尝不出味道。你在外面吃糖人的时候，我只能看着。\"\n\n泠把炊饼塞进嘴里，腮帮子鼓着，含含糊糊地问：\"那现在呢？\"\n\n\"现在。\"晞又咬了一口，认真嚼了嚼，\"甜的。\"\n\n\"那以后好吃的，都给你留一份。\"泠说。\n\n\"嗯。\"\n\n找了间客栈住下。天黑下来，晞坐在窗边，看着镇子里的灯一盏一盏亮起来。泠趴在床上，问她：\"晞姐，你明天还出来吗？\"\n\n\"出来。\"\n\n\"那我要是灵力不够呢？\"\n\n晞回过头：\"怎么想起来问这个。\"\n\n\"我今天走路的时候，觉得背有点空。\"泠说，\"像有什么东西在抽。是不是你在外面待久了，用得凶？\"\n\n晞想了想：\"……是用的。你睡一觉，就补回来了。\"\n\n\"那你累不累？\"\n\n\"我不累。\"晞说，\"我是魂。累的是你。\"\n\n泠顿住了：\"那你怎么不早说？\"\n\n\"你也没问。\"晞说，\"以前你在外面，是我替你看着路。现在换我看着你——你累不累，我比你先知道。\"\n\n泠把脸埋进枕头里，闷闷地说：\"那你灵力不够了，要告诉我。\"\n\n\"嗯。\"晞说，\"你跟不上的时候，我就回去。我进去了，你就轻了。\"\n\n\"那你明天还出来吗？\"\n\n\"出来。\"\n\n泠没说话。过了一会儿，她翻过身来，看着窗边那个银白的影子：\"晞姐，你能出来，真好。\"\n\n晞没有接话。夜风从窗缝里挤进来，她不动了——屏住呼吸，听了很久。\n\n风里有别的东西。\n\n不是人间的声音。是从很远的地方，顺着风向带过来的——魔界的方向。她在那条线上站了那么多年，那种声音，她认得。\n\n像有人在水底敲什么东西。一下，一下，很沉，很有规律。\n\n\"……上面，在动了。\"她低声说。\n\n泠坐起来：\"什么？\"\n\n\"魔界。\"晞说，\"有动静。以前不是这样的——以前是乱的，敲哪儿的都有。现在敲得很齐，一下是一下。\"\n\n\"那是什么意思？\"\n\n\"有人，在整兵。\"晞说，停了一下，\"或者是——在找人。\"\n\n泠想到了废村那个老魔，想到了它说的\"上面迟早会知道\"。她的背有点凉：\"找谁？\"\n\n晞看着窗外，很久，才说：\"不知道。也说不定，不是找我们。\"\n\n\"那往东的那道气呢？\"泠问，\"江岫走的方向。\"\n\n晞沉默了一会儿：\"那道气还在。跟在后面，不远不近。\"\n\n\"他不会有事吧？\"\n\n\"他是守微人。\"晞说，\"书在他身上。\"\n\n泠想说\"可书又不是刀\"，话到嘴边，又咽了回去。她想起江岫按着剑的样子——她没见过他拔剑，可守微录认他。\n\n\"睡吧。\"晞说，\"明早，我们往旧门走。\"\n\n\"旧门？\"\n\n\"摘甜梨。\"晞说，\"门那头，是东境边上。\"\n\n\"东境？\"\n\n\"我爹守的地方。\"晞说，声音很平，\"十七年，没回去过了。\"\n\n泠躺回去，盯着房梁看了一会儿：\"那我们这回，算是去你爹的地盘了。\"\n\n\"……只是路过。\"\n\n\"路过也要路过得体面。\"泠说，\"你是公主，我是九尾。排场够了。\"\n\n晞没理她。\n\n第二天清早，两人退了房。镇上的人刚起，炊烟还没升起来。晞站在街口，回头看了一眼来路——来路的尽头，是边界线的方向。\n\n她看了很久，才转过来。\n\n\"走吧。\"她说。\n\n风从东边来，吹起她银白的头发。两人沿着旧路往山里走。旧门在半山腰，门板早没了，只剩一道石门框，藤蔓垂下来，像一道没人走的门槛。\n\n晞在门前站住了。\n\n\"……上次走这扇门，是十七年前。\"她说，\"我走了太远，没有回头。\"\n\n\"这次呢？\"\n\n\"这次，我带你过。\"\n\n她伸手，推了一下空门框。风从门洞里穿过来，是暖的——魔界那边的风，是暖的。\n\n\"走吧。\"泠说，\"摘甜梨去。\"\n\n晞看了她一眼，点头，迈过了门槛。\n\n门洞很深。走进去三步，光就没了。脚下的地由硬变软，像踩进一片晒了很久的沙。身后人间的风追着她们跑进来，追到第四步，就追不动了。\n\n前面有风。暖的，带着一种很旧的味道——像什么东西，晒了一百年。\n\n\"到了。\"晞说。\n\n她站住，没有急着走。泠跟上来，站在她身边，看见了暗红色的天。\n\n魔界的天，是暗红色的，像血稀释过，又像黄昏永远停在同一个时辰。山不长草，长黑色的矮灌木，夜里会发出呼吸一样的声音——现在是白天，它们只是安静地立着。\n\n\"……回来了。\"晞说。\n\n风从暗红色的天上下来，吹过她的头发。她站了一会儿，没有回头。\n\n\"走吧。\"她说，\"甜梨，在河那边。\""}, {"id": 35, "title": "甜梨", "content": "魔界的夜比人间短。天还暗着，就亮了——不是亮，是红，像有人把一整坛血倒进了天里，又用清水冲淡，于是那个红，就一直挂在那儿，下不来。\n\n泠醒得早，坐在旧门外的山坳里看天，看得脖子都酸了。贴着她左肩胛骨的地方，响起晞的声音，像从很深的水底浮上来的气泡：\n\n\"没有太阳。只有天亮。\"\n\n\"天亮是红的？\"\n\n\"嗯。\"晞说，\"小时候觉得丑。后来看惯了，也就不觉得了。\"她停了一下，\"你盯着看久了，会以为全天下都是这个颜色。\"\n\n\"那你想不想出来看看？\"\n\n门里静了一下。\"……出来要花你的灵力。\"晞说，\"你昨晚没睡好。我先看着。\"\n\n\"看什么？\"\n\n\"看你。\"晞说，\"看你的眼睛，看这天的红。够了。\"\n\n泠没有再劝。她站起来，拍了拍身上的土：\"走吧。河在那边。\"\n\n路是土路，踩上去，一踩一个印子，印子半天不散。路两边的灌木是黑的，叶子也是黑的，长得不高，一丛一丛，像烧过没烧透的柴。泠伸手碰了一下，缩回来，指尖扎了个小口子。\n\n\"黑棘。\"晞说，\"扎人。小时候我妹妹摘过一枝，扎得满手都是刺，哭着回家。\"\n\n\"后来呢？\"\n\n\"后来我替她把刺一根一根挑干净了。\"晞说，\"她说，姐姐，明天我再摘一枝给你。\"\n\n\"那她摘了吗？\"\n\n\"摘了。\"晞说，\"第二天，挑了一枝刺最少的，举着跑回家，献宝一样给我看。结果路上又摔了一跤，还是扎了手。\"\n\n泠听着，没忍住笑了一声。笑声落在红的天底下，散进风里。她想起来，这是进魔界以来，第一次笑。\n\n风贴着地皮走，钻进土缝里，听久了，像有人在地下喘气。\n\n\"晞姐，这里的风，怎么往地上钻？\"\n\n\"魔界的风，是往地底下吹的。\"晞说，\"你听。\"\n\n泠站住，竖起耳朵。风从她脚边过，绕着她的鞋尖打转，像在认路。\n\n\"以前你教我的那个字——\"泠说，\"风。\"\n\n\"嗯。\"晞说，\"魔界的风，就是这么写的。\"\n\n她教得认真，泠也学得认真。在人间，这个字是画在灯下的；在这里，风把字写满了一整片天。\n\n河到了。河水是浑的，泛着暗红的光，映着天上的红。河那边，滩地上立着一棵树。\n\n不是黑棘。是绿的。\n\n泠站住了。那棵树叶子是绿的，枝头挂着一串一串红的果子，一颗一颗，圆圆的，像小灯笼。\n\n\"晞姐——\"她话没说完，手背上的剑形印记先亮了一下。\n\n晞从印记里浮出来，在她身边站定。白色的常服，银白的头发，瞳色是暗红的。她看着那棵树，看了很久，久到泠以为她不打算说话了。\n\n\"甜梨。\"晞说，\"就是它。\"\n\n她弯腰，把裤腿卷了两卷，趟水过去。河水没过她的小腿，她走得不快，一步一步，像是怕惊动什么。走到树下，她仰头看了一会儿，伸手够下一枝。果子在她手里，红得发亮。\n\n她摘了满满一兜，又趟水回来，蹲在泠面前，把兜口解开，推过去。\n\n\"尝尝。\"\n\n泠拿起一颗，咬了一口。甜的，带一点酸，汁水顺着指缝往下淌。\n\n\"好吃吗？\"晞问。\n\n\"好吃。\"泠说，\"你也吃。\"\n\n晞也拿了一颗，咬了一口，没说话。过了一会儿，她才说：\"我妹妹说，姐姐，你不吃，我就替你吃了。\"\n\n\"那她吃了你那份？\"\n\n\"没有。\"晞说，\"她每次都这么说。每次摘回来，都先给我。\"\n\n泠把手里的吃完，又拿起一颗，没急着咬，先举到晞面前：\"晞姐，这颗你替我尝。\"\n\n晞接过去，咬了一口：\"甜的。\"\n\n\"那我信你。\"泠说，\"你说甜，就是甜的。\"\n\n晞看了她一眼，低头把兜口重新扎好，声音低下去：\"这几颗，是带给她的。\"\n\n远处传来动静。\n\n不是风。是脚步。很齐，很多，像很远的地方，有一群人踩着同一个点往前走，一下，一下，敲在土路上。\n\n晞的动作停住了。她直起身，朝声音来的方向看了一眼，然后一把把兜塞进泠怀里，拉着她退到黑棘丛后面，蹲下来。\n\n泠趴在黑棘后面，透过叶子往外看。河对岸的土路上，一队魔正走过去。黑甲的，排成两列，走得整整齐齐，从东往西。走在最后的一个，走到河湾那儿，回头看了一眼——没有看这边，只是回头。然后队伍转过山脚，没了。\n\n\"他们在干什么？\"泠小声问。\n\n晞没答。她听了很久，久到那队魔的脚步声完全听不见了，才说：\"在找什么。或者是，在等什么。\"\n\n\"找什么？\"\n\n\"不知道。\"晞说，\"我离开十七年了。\"\n\n她说着，把头低下去，把脸藏进黑棘的阴影里。在人间的时候，她总抬头看天；回了魔界，她反倒低着头，像怕被天看见。\n\n\"晞姐。\"泠喊了她一声。\n\n\"……我先进去了。\"晞说，\"路还长。\"\n\n\"那你晚上出来吗？\"\n\n\"你睡一觉。\"晞说，\"明天灵力足了，我再出来。\"\n\n她说着，人从衣角开始淡下去，一点一点，融回泠手背的印记里。声音留在原地，贴着左肩胛骨：\n\n\"往东。顺路。\"\n\n泠抱着那兜甜梨，站起来，往东走。走了几步，她回过头，看见那棵甜梨树还站在河边——红的果子，绿的叶子，在暗红色的天底下，像一盏没人点的灯。\n\n她回过头，又问：\"晞姐，你妹妹，喜欢甜梨，还是喜欢甜的？\"\n\n\"她喜欢甜的。\"晞的声音从门里传来。\n\n\"那你记得挺清楚。\"\n\n\"嗯。\"晞说，\"十七年，就剩这一样，是我记得最牢的。\""}, {"id": 36, "title": "东境", "content": "往东走了两天，天还是那个红法。\n\n魔界的路不认生人。土路窄，走着走着就没了，变成一溜乱石，乱石也走完了，就剩荒坡。泠跟在一条看不见的路后面，靠着晞的指点，往东、往东，过了一道梁，又过了一道梁。\n\n\"快了。\"晞在门里说，\"再往前，就是我爹守的地方。\"\n\n\"你家院子呢？\"\n\n\"过了这道梁就是。\"晞说，\"十七年没人住了。\"\n\n泠爬上一道梁，往下看。坡下有一片院子的遗迹——土墙塌了半边，门板躺在地上，草从墙缝里长出来，长得比墙还高。院子后面有条河，河还是那条河，只是河这边的树，全是黑棘。\n\n\"那就是你家？\"\n\n\"嗯。\"晞说，\"小时候的院子，没这么大。\"她停了一下，\"别下去了。草深，蛇多。\"\n\n\"你小时候怕蛇吗？\"\n\n\"不怕。\"晞说，\"我妹妹怕。\"\n\n泠没有再问。她绕过院子，继续往东。走了几步，她听见晞在门里说：\"你回头看一眼。\"\n\n泠回过头。塌了半边的院墙，在暗红色的天底下立着，草在风里摇。\n\n\"看见了。\"泠说。\n\n\"……走吧。\"晞说。\n\n午前，她们到了东境驻地外围。\n\n营地扎在两道梁之间的平地上，黑帐一顶连一顶，围成几圈，中间立着一面大旗，旗面是暗红的，被风扯得直响。营地里有人进出，都是黑甲的兵，走得很快，没有人说话。\n\n泠趴在梁后的石头后面，看得心惊：\"这么多兵。\"\n\n\"东境是防着天族的那道门。\"晞说，\"兵一直多。\"\n\n\"那我们来干什么？\"\n\n\"路过。\"晞说，\"只是路过。\"\n\n\"那我们绕过去？\"\n\n\"绕不过去。\"晞说，\"营地横着这道梁，往两边都是断崖。要过去，只能贴着营地走。\"\n\n\"那就贴着走呗。\"泠说，\"他们又不知道我们是谁。\"\n\n晞没答话。\n\n泠又趴回去看。营地中间那面大旗下面，站了一个人，隔着这么远，看不清脸，只看得见是个高的，披着一件比兵甲长的东西，站在旗杆下，一动不动，像站了很久了。\n\n\"晞姐。\"泠小声说，\"旗杆下站了个人，你看见了吗？\"\n\n门里静了一会儿。\n\n\"……看见了。\"晞说，\"你走你的，别看那边。\"\n\n\"为什么？\"\n\n\"怕你多看两眼，人家就过来了。\"晞说，\"走吧。\"\n\n她说着，声音里带了点催促。泠没有多问，从石头后面溜出来，贴着营地的边沿，低着头往东走。营地里有人出来搬东西，看了她一眼，又回去了。泠低着头，走得比刚才快，怀里那兜甜梨硌得她手臂发酸，她也不敢停。\n\n贴着营地走了半个时辰，才绕到梁的另一头。回头再看，营地已经缩成一片黑，只有那面大旗还立着，暗红的，在风里一扯一扯。\n\n\"晞姐，\"泠说，\"那是你爹守的地方，你不想去看一眼吗？\"\n\n门里很久没有声音。久到泠以为她不会答了，晞才说：\n\n\"……他以为我死了。\"\n\n\"你不是——\"\n\n\"死了的人，别回去吓人。\"晞说，\"这样挺好。他守他的东境，我走我的路。两不相欠。\"\n\n泠张了张嘴，什么也没说出来。\n\n傍晚，她们到了另一道梁下。\n\n这里离营地已经远了，离天族的边界线却近了——风变得一边暖一边凉，从梁上灌下来，像两股水在打架。\n\n\"晞姐，你带我来这儿干什么？\"\n\n\"我妹妹，埋在这儿。\"晞说，\"东边，靠边界线那道梁下，有个小土包。她死的那年，我还没出去过，后来就再没回来过。\"\n\n泠站住了：\"你妹妹……埋在这儿？\"\n\n\"嗯。\"晞说，\"离她死的地方近。\"\n\n\"你不早说！\"泠说，\"那我们——\"\n\n\"明天去。\"晞说，\"天快黑了，路不好走。\"\n\n\"那我们快去快回——\"\n\n\"明天。\"晞又说了一遍，声音低下去，\"……明天，我就不出去了。你去。\"\n\n\"我去？\"\n\n\"嗯。\"晞说，\"你替我把甜梨放上。跟她说，姐姐摘的。\"\n\n\"那你呢？\"\n\n门里静了一下。\"她认生。\"晞说，\"……她小时候就认生。隔着门，她认得我的声音就行。\"\n\n风从边界线那边灌过来，凉的半边贴上泠的后背，暖的半边贴上她的脸。她抱紧那兜甜梨，在梁下找了个背风的地方坐下。\n\n夜里，红的天暗下去，变成了暗红。泠躺在地上，望着天，说：\"晞姐。\"\n\n\"嗯。\"\n\n\"你爹，长什么样？\"\n\n\"……黑甲。比我高很多。\"晞说，\"小时候，他把我举到肩上，看东境的兵操练。我说，爹，我以后也去守东境。他说，好，那你得先长过这张桌子。\"\n\n泠听着，没说话。\n\n\"后来，我妹妹说，她要替我守。\"晞说，\"她没能守成。\"\n\n风把那句话卷走了。泠等着她往下说，晞却没有再说。\n\n风从边界线那边过来，吹得黑棘沙沙地响。泠把甜梨往怀里拢了拢，没再说话。她数着风声，数着数着，就分不清哪边是暖，哪边是凉了。\n\n红的天，一直亮着，像有一盏灯，挂在谁的手也够不到的地方。\n\n她不知道的是，她们身后那道梁上，营地的方向，有一个人影，在暗红色的天底下站了很久，很久。\n\n那个人影没有回营地，也没有往前走。\n\n他只是站着，像在等什么。"}, {"id": 37, "title": "坟前", "content": "天亮的时候，泠一个人上了梁。\n\n甜梨兜在怀里，用衣摆裹着，护了一夜，果子还是凉的。梁上风大，一半暖，一半凉，吹得她的头发往后飘。她走得不快，一步一步，像怕吵醒什么。\n\n土包在梁背面的缓坡上，不高，堆了十七年，土已经和周围的山长在一起，远远看去，几乎看不出是坟。坟前没有碑，只有一块半埋进土里的石头，石头底下压着一截枯枝——不知道是谁放的，也不知道放了多久。\n\n泠在坟前蹲下来，把甜梨从衣摆里一颗一颗拿出来，码在石头前面。码完，她退后半步，说：\n\n\"妹妹，我是泠。你姐姐现在住我这儿。\"\n\n风把她的话吹散。她顿了顿，又说：\n\n\"她好着呢。她……能出来了。门好了，她能出来走走了。你姐姐走路的姿势特别奇怪，像鸭子，我教了她好几天，还是像。她说下次走给你看。\"\n\n说完她自己笑了一下，又觉得不该笑，收了声。\n\n\"甜梨是她摘的。河边那棵，绿的叶，红的果。她说你喜欢甜的，我就多摘了几颗。\"泠说，\"她还说，姐姐，你不吃，我就替你吃了——这句话，是你说的吧？\"\n\n坟没有回答。风从边界线那边过来，绕着土包转了一圈，又走了。\n\n贴着她左肩胛骨的地方，晞的声音响起来，比平时轻，像怕惊着谁：\n\n\"……妹妹。\"\n\n泠让到一旁。\n\n晞隔着门，说了很久。说的都是很小的事：黑棘扎手那回、她替她挑刺、\"明天我再摘一枝给你\"、还有那棵甜梨树——\"树还在。结的果子，和你小时候吃的，一个样。\"\n\n\"十七年了。\"晞说，\"姐姐才来看你。你别怪姐姐。\"\n\n\"你寄生的那株草，我看见了。\"她又说，\"还活着。好。\"\n\n泠站在风里，听她一句一句地说。有些话她听不懂——那株草，那些只有她们姐妹俩才知道的事——她没有问。\n\n说完了，晞沉默了很久。\n\n\"走吧。\"她说，\"看过了。\"\n\n\"不再待会儿？\"\n\n\"……待过了。\"晞说，\"她记性好，来一次，够她记十七年。\"\n\n泠把剩下的甜梨又往石头前拢了拢，站起来，拍了拍膝盖上的土。\n\n\"妹妹，\"她说，\"我下回再来看你。\"\n\n离开坟，她们绕到梁的另一头。\n\n这里离天族的地界更近了，风墙立在两道山脊之间，像一堵透明的墙，一边的云是白的，一边的天是红的。白色的那边，云走得快；红的这边，云走不动。\n\n\"这里。\"晞说，\"我小时候，总站这儿。\"\n\n\"站这儿看什么？\"\n\n\"看那边。\"晞说，\"看白的那边。那时候觉得，白的，真稀罕。\"\n\n泠站到她身边——站到她声音旁边，一起看那道风墙。红的这一侧，风贴着地走；白的那一侧，风吹得云跑。\n\n\"晞姐。\"泠说，\"你妹妹，也是死在这边的吧？\"\n\n晞没答。过了一会儿，她说：\n\n\"她替我死的。\"\n\n泠没敢接话。\n\n\"我小时候爱往这边跑。她总跟着我。\"晞说，\"那天也一样。我过了线，她也过了线。天族动手的时候，她挡在我前面。\"\n\n\"……\"\n\n\"她说，姐姐，你走。\"晞的声音低下去，\"我就走了。我再没回来过。\"\n\n风从风墙那边灌过来，凉的那半边，贴上泠的后背。她站了很久，不知道该说什么。最后她说：\n\n\"那棵草，是谁种的？\"\n\n\"我种的。\"晞说，\"种在坟边。走了十七年，没想到它还活着。\"\n\n回程比来时快。\n\n她们贴着梁走，绕过驻地的方向，往旧门走。路上又遇见一队魔——这一次没有躲。那队魔看见泠，远远地站住了，领头的一个盯着她看了很久，然后按着胸口，弯下腰去。\n\n\"他干什么？\"泠小声问。\n\n\"敬礼。\"晞说，\"他认得你背上的印。\"\n\n\"什么印？\"\n\n\"王族的印。\"晞说，\"我爹守东境十七年，东境的人都认得这个印。你背着我的门，他们敬的是我。\"\n\n\"那他们为什么不说话？\"\n\n\"王族的路，轮不到他们搭话。\"晞说，\"他们只知道敬。敬完了，就要传话。\"\n\n泠的心一紧：\"传话？\"\n\n\"嗯。\"晞说，\"上面在找王族的血，找了好久了。这队魔见了你，回去就会报上去——王族的血，在东境出现过。\"\n\n\"那你——\"\n\n\"所以我走。\"晞说，\"找到我，敬的是我。你跟我在一起，麻烦的是你。我不走，这队魔明天就会一路跟到旧门口。\"\n\n泠抱着空了的兜，回头看那队魔。他们还站在原地，弯着腰，没有跟上来。\n\n\"他们敬你。\"泠说。\n\n\"敬的是死人。\"晞说，\"我早就是死人了。死人被敬着，没什么意思。\"\n\n旧门在望。门洞那头，人间的风漏过来，吹得门洞边的草往这边倒。\n\n泠把空了的兜折好，塞进怀里。\n\n\"走了。\"泠说。\n\n\"嗯。\"晞说，\"走了。\"\n\n泠迈过门洞。身后，暗红色的天还挂着，像一盏没灭的灯。她听见晞在门里，声音很轻：\n\n\"甜梨，你送到了。妹妹，你也见了。\"\n\n\"嗯。\"\n\n\"……谢谢你，妹妹。\"晞说，\"谢谢你带姐姐回家。\"\n\n风从门洞那头吹过来，人间的风，带着草和土的味道，把魔界的风挤了出去。泠没有回头，往前走着，走进人间的天亮里。"}, {"id": 38, "title": "人间", "content": "回到人间，泠才发现自己变了。\n\n魔界的天是红的，人间的是蓝的。她站在旧门外，看了半天天，觉得蓝得陌生。山还是那些山，草还是那些草，可它们都不再认识她了——她刚从那边回来，身上带着那边的风。\n\n\"别站在门洞口。\"晞提醒她，\"站久了，人家以为你是什么山精水怪。\"\n\n\"我本来就是山精水怪。\"\n\n\"山精水怪不会站人家门口。\"晞说，\"走。\"\n\n泠笑了笑，往山下走。人间的路好走，有石板，有台阶，走着走着就有了人家。她路过一个卖炊饼的摊子，停下来，掏了掏兜——没有钱。她愣在原地，站了一会儿，才想起钱在江岫那儿。\n\n\"晞姐，\"她说，\"我有点想江岫了。\"\n\n\"想他就去找他。\"晞说，\"他往山里去了，找他的师父。\"\n\n\"他现在到哪儿了？\"\n\n\"不知道。\"晞说，\"他带着书，书会告诉他路。\"\n\n泠又走了一段路。太阳晒着，她走得有些发昏——魔界的路走惯了，人间的路反倒不会走了。她边走边想：晞的爹、妹妹的坟、那队敬礼的魔、王族的印。她低头看着自己的影子，影子在她脚下，一截长，一截短。\n\n她没注意自己的耳朵。\n\n从前她也会漏耳朵。那时候有江岫在边上，耳朵一冒出来，他就替她按住，再问她一句\"饿不饿\"。这一次，她身边没有人。\n\n等她回过神的时候，一对毛茸茸的狐耳已经竖在头顶上，九条尾巴在身后晃着，像九把撑开的扇子。她低头看了看自己的手——十根手指，指腹上长出了细白的绒毛。\n\n\"完了。\"她说。\n\n\"回去！\"晞的声音一下子紧了，\"藏起来！\"\n\n\"我知道我知道——\"泠手忙脚乱地想把耳朵按回去。灵力在魔界耗得太多，回来还没缓过来，耳朵不听使唤。她一边按，一边往路边的树丛里躲。\n\n没躲成。\n\n树丛后面走出来一个老道。花白的头发束得一丝不苟，灰白的道袍洗得发白，腰上挂着一柄乌鞘长剑，背着个布包，脚步沉稳，像走过很多路。他看见泠，脚步停了一下，然后手按上了剑柄。\n\n\"妖。\"\n\n\"我不是——\"\n\n\"九尾狐。\"老道说，\"大白天的，在官道上现形。你好大的胆子。\"\n\n他拔了剑。剑是青色的，出鞘的时候，泠觉得周围的空气都凉了一层——那是浸过太多妖血的剑，隔着三步，就能闻到上面的寒意。\n\n\"晞姐！\"泠喊。\n\n\"别出声！\"晞的声音压得极低，像怕被谁听见，\"他是老道，手上沾过不少妖。你灵力没回来，硬拼不过——能跑就跑！\"\n\n\"我往哪跑——\"\n\n老道已经欺上来。剑尖直取她咽喉——人间道士斩妖，从不废话。泠侧身躲过，右手一翻，水漠握在掌心。刀一出手，暗红的水光一闪，老道的眉头皱起来：\n\n\"妖气里还掺着魔气——这东西，老夫三十年没见过了。你到底是个什么东西？\"\n\n\"你管我是什么东西！\"\n\n泠举刀格挡。她灵力不足，刀势发虚，一剑就被震得虎口发麻。老道的剑又到，她滚地躲开，沾了一身的土。这时候，路那头又传来脚步声——一个年轻道士，背着同样的布包，从树丛后面转出来。\n\n\"师父，这是什么？\"\n\n\"妖。\"老道说，\"妖气里还有魔气。拿下她，带回去审。\"\n\n\"审什么！\"泠爬起来，\"我又没害人！\"\n\n\"妖气掺魔气，还大摇大摆走官道。\"老道说，\"你身上这桩事，审完了才知道轻重。束手就擒，少吃些苦头。\"\n\n两个道士一左一右，把泠围在中间。水漠在手里发沉——这把刀认她，可她的灵力喂不饱它，刀光暗一阵、亮一阵，像一盏快灭的灯。她想起在魔界的时候，晞说灵力是她给的命。她命都不够了，哪还顾得上刀。\n\n\"动手。\"老道说。\n\n弟子先上。剑势快而直，泠用水漠挡开，手腕发麻。老道在后，一剑一剑，不急不躁，专挑她刀势最虚的地方落——像磨刀。泠退到一棵树前，背靠着树干，被磨得只剩下招架的力气。她的耳朵还竖着，尾巴收不回去，灵力在经脉里像干涸的河床，一滴也挤不出来。\n\n\"别露门。\"晞的声音从门里传出来，轻得像怕惊动什么，\"千万别露门。\"\n\n\"我知道。\"\n\n\"……我在。\"晞说，\"我在门里看着你。\"\n\n老道的剑又到。这一剑，剑脊横拍，打在泠肩上，把她拍得跪倒在地。她挣扎着站起来，又挨了一下——这一下打在背上，她听见自己嘴里涌上血腥气。\n\n\"妖，束手就擒。\"\n\n泠咬着牙，撑在地上，没有吭声。她抬头，看见老道的剑尖举起来，对着她的后颈——她闭上眼睛。\n\n剑没有落下来。\n\n风先到的。干净的风，从天上落下来，像有人把一整片云抖开了。然后是一个声音，不高，很稳：\n\n\"住手。\"\n\n两个道士的剑，齐齐停住。他们抬头，脸色变了。\n\n泠也抬起头。路的尽头，站着一个人——白袍，银发束得整整齐齐，袍角绣着云纹，站在那里，像一棵不该长在人间的树。\n\n\"九天长老巡人间。\"那人说，\"此妖体内有魔气，涉及魔界，归天界管。你们，退。\"\n\n道士们互相看了一眼。没有人敢说话。他们收了剑，退到路边，看着白袍人走到泠面前，蹲下来。\n\n\"九尾。\"他说，\"涉魔之妖，按天律当诛。你运气不好，撞在我手里。\"\n\n泠看着他，眼前一阵一阵地发黑。她想说话，一张嘴，血先涌了出来。\n\n\"撑着别死。\"白袍人站起来，目光落在她脸上，没什么波澜，\"死了，魔气的来处就没处问了。走——能走，就跟上。走不动，我提着你回去。横竖都是回天界，过完堂，再论生死。\"\n\n泠用手背抹了一把嘴角的血，撑着地，摇摇晃晃地站起来。她没有问要去哪。她知道了——这个人截下她，不是为了救她。\n\n他是来杀她的。\n\n\"……走吧。\"白袍人已经转身，袍角的云纹在风里翻了一下，\"趁我还没改主意，在路上就处置了你。\"\n\n泠跟在后面，一步，一步。血从她嘴角淌下来，滴在石板路上，又被风吹干了。她走得不快，也没有回头。人间在她身后，一点点远了。\n\n倒下之前，她听见晞在门里，用气声说：\n\n\"……别怕。我一直在。\""}, {"id": 39, "title": "天界", "content": "泠醒过来的时候，先感觉到的是疼。左肩的伤口像被人重新撕开又合上，钝钝地跳着。她缓了一会儿，才睁开眼睛。\n\n白色的云从窗棂外面流进来，流过房梁。她盯着那些云看了很久，才想起自己在哪——天界。长老府。她在人间被那个白袍人截住的时候，他说：涉魔之妖，按天律当诛。\n\n她撑着想起来，一动，手腕被拽住了。\n\n一条银链，扣在床头的铜环上。不长，刚好够她伸手碰到床沿。她扯了一下，纹丝不动，冰冰凉，贴在皮肤上，像一条蛇。\n\n\"晞姐。\"她压着嗓子，\"晞姐。\"\n\n门里没有声音。\n\n\"晞姐！\"\n\n\"……在。\"过了很久，晞的声音才响起来，轻得像怕被谁听见，\"别喊。\"\n\n\"这链子——\"\n\n\"封灵锁。\"晞说，\"锁妖的。你身上的灵力被它压着，动不了。\"\n\n\"那怎么办？\"\n\n\"别动它。\"晞说，\"命要紧。\"\n\n泠沉默了一会儿：\"晞姐，他说……要杀我？\"\n\n\"嗯。\"晞说，\"你昏着的三天，他来过两次。有一回我听见他站在床边说——问清了魔气的来处，就处决。\"\n\n泠的手凉了。她攥了攥被角，又松开：\"那他给我治伤——\"\n\n\"死囚也要过堂。\"晞说，\"留着你的命，是要问话。……你别怕。有我。\"\n\n\"你别出来！\"泠急了，\"这是天界！你那个眼睛——\"\n\n\"我知道。\"晞说，\"先活过眼前。他问什么你答什么，别提我。\"\n\n门帘掀开。白袍人走进来，银发束得整整齐齐，袍角的云纹在光底下发亮。他端着一碗药，放在床头的小几上，居高临下地看着她。\n\n\"醒了。\"\n\n\"……谢长老。\"泠撑着身子。\n\n\"我不救你的命。\"白袍人打断她，\"治伤，是怕你死在过堂之前。你身上有魔气。从哪来的？\"\n\n\"我不知道。\"\n\n\"不知道。\"白袍人重复了一遍，\"你那条银项链，我让人查过——银的，压着你的妖气。谁给你的？\"\n\n泠的手在被角上收紧。项链……她醒来就没摸着。\n\n\"它在我这儿。\"白袍人说，\"过完堂，看你的话，再还你。\"\n\n\"……我的。\"\n\n\"我娘给的。\"——这五个字在她舌尖转了一圈，又咽了回去。不能说。说什么都像在替那道魔气找来处。\n\n\"魔气的来处，说了，给你个痛快。\"白袍人说，\"不说，天牢里有的是办法问。你十七岁，妖生还长。\"\n\n泠低下头：\"我生下来，就有。\"\n\n白袍人看了她很久：\"你倒硬气。\"\n\n门外传来一串脚步声。门帘被掀开，探进来一个脑袋——十四五岁，白裙子，眼睛亮得像浸过水的葡萄。她没看她爹，先走到床边，蹲下来，凑近了看泠。泠往后缩了一下，锁链哗啦一响。\n\n\"你别怕。\"姑娘说，又扭头看她爹，\"爹，你给她上锁了？\"\n\n\"她涉魔。\"白袍人说，\"娲儿，出去。\"\n\n\"她涉魔，你锁她，她就要死？\"姑娘没出去，在床边蹲稳了，\"爹，她才多大？狐狸有什么罪？\"\n\n\"她体内的魔气有罪。天律如此。\"\n\n\"那你抓回来的妖，哪个不是处决？\"姑娘说，\"怎么偏偏把她锁在家里——爹，你是不是也没想好？\"\n\n白袍人没接话。\n\n\"没想好就先别杀。\"姑娘说，\"我在家就剩我和那只破鸟，娘也不在。让她陪我两天嘛——等我玩腻了，你再杀，行不行？\"\n\n\"……你当她要犯是玩物？\"\n\n\"我没当。\"姑娘抱着膝盖，\"我就是觉得，她像只被捡回来的小兽。你捡回来又要杀，图什么呀？\"\n\n泠躺在床上，看着这个白裙子姑娘。她替她说话，一句接一句——可泠越听越怕。她不知道我是谁。她知道我背上有个姐姐，她还会这样说话吗？\n\n白袍人沉默了很久。\n\n\"……她留下来，做什么？\"他说。\n\n\"做我的玩伴！\"姑娘的眼睛亮起来，\"我养她，我看着她。锁别解，链子留着，她跑不了。\"\n\n\"留着可以。\"白袍人说，\"但话我说在前头——留不留她，你我说了都不算。长老院迟早要过问，天律当诛。到那天，求天君也没用。\"\n\n\"那我就去求天君！\"\n\n白袍人没接话，看了看她，又看了看泠：\"你倒是随你娘。\"\n\n\"随我娘怎么了！我娘要是在，早就把人留下了！\"姑娘转过来，眼睛亮晶晶的，\"姐姐，你愿意留下吗？你跟我住，我把我的青鸟给你看——它老啄我，我让它啄你试试！\"\n\n泠看着她，没有立刻答。\n\n她想活。可是——她帮我，是因为不知道我是谁。知道了呢？\n\n门里，晞的声音极轻地响了一下：\"……答应。\"\n\n\"嗯。\"泠说，\"我愿意留下。\"\n\n\"听见没有！\"姑娘得意地回头看她爹。\n\n\"她愿意，不算数。\"白袍人说，\"她的去处，是长老院说了算。\"他顿了顿，\"你先养伤。养好了，跟着娲儿，哪儿也不许去。天界人多眼杂，若让人知道家里养着一条魔气缠身的妖，我这长老，也兜不住。\"\n\n\"我知道。\"\n\n\"你知道什么。\"白袍人转身往外走，\"娲儿，让她歇着。你那只青鸟，别拿进来啄她。\"\n\n\"我不啄她！\"姑娘跟在后面喊，\"我啄你！\"\n\n夜里，泠躺在床上，透过窗棂看外面的云。天界的夜也是亮的——云里透出淡淡的银光。手腕上的链子冰冰凉，她一动，就响一声。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"她爹说，求天君也没用。\"\n\n\"……\"\n\n\"天君是谁？\"\n\n门里安静了很久。\n\n\"不认识。\"晞说，\"听说过。\"\n\n\"那她要是求不动呢？\"\n\n\"……\"晞又安静了一会儿，\"她求不动，还有我。\"\n\n\"你别乱来！\"\n\n\"我不乱来。\"晞说，\"你睡吧。\"\n\n窗外，云从窗前流过。泠闭上眼睛，手心里空空的——银项链被收走了。她攥了攥拳，又松开。链子响了一声。\n\n\"……嗯。\"她说，\"我们住下了。\"\n\n晞没再说话。"}, {"id": 40, "title": "青鸟", "content": "链子换长了。\n\n女娲说这是她磨了三天换来的——\"我跟爹说，你锁在床上，连倒水都够不着！\"泠更正是她自己提的桶。总之，银链的另一头从床头的铜环挪到了廊下的铜环，链长够她在院子里走一个来回，再多，就绷住了。\n\n\"就这么多。\"女娲叉着腰，很得意，\"我爹说，再长，就锁回屋里。\"\n\n\"……谢了。\"泠说。\n\n\"不谢！\"女娲拉着她就走，\"我带你看我的鸟！\"\n\n长老家的院子很大。云铺的路，银叶树一棵一棵排到墙边，叶子是银白的，风一过，整棵树都在发光。天界的风没有味道，吹在身上，凉丝丝的，像在过一道洗不净的溪水。\n\n女娲的青鸟拴在廊下。翠色的羽毛，豆大的眼睛。看见女娲，它先叫了一声，扑腾着翅膀来啄她的手背。\n\n\"你看！\"女娲把手缩回来，手背上一个红印，\"它天天啄我！\"\n\n\"你喂它没有？\"\n\n\"喂了！\"女娲说，\"我喂它三年了！\"\n\n泠看着那只鸟。鸟也看着她——歪着头，豆大的眼睛转了两转，飞起来，绕着她转了一圈，落在她肩上。\n\n女娲瞪圆了眼睛：\"它不啄你？\"\n\n\"它凭什么啄我。\"\n\n\"它啄我！\"\n\n\"你喂它三年，它还啄你。\"泠说，\"要不你换一只养。\"\n\n\"我不换！\"女娲扑过来，想起她肩上有伤，改抱住她的袖子，\"它是我娘给我养的！我娘说，鸟认人。它啄我，是跟我亲。\"\n\n\"它啄你，是跟你亲。\"\n\n\"对！\"女娲说，\"它不啄你，是把你当外人！\"\n\n\"……行吧。\"泠说，\"那我当外人。\"\n\n青鸟在她肩上跳了一下，歪过头，蹭了蹭她的耳朵。女娲的嘴瘪下去。\n\n院子里那棵最大的银叶树底下，放着女娲的竹垫子。她拽着泠坐下来，把鸟食洒了一地，青鸟跳下去啄。\n\n\"你在人间，天天干什么？\"女娲问。\n\n\"赶路。\"\n\n\"赶路干什么？\"\n\n\"找人。\"\n\n\"找谁？\"\n\n\"一个朋友。\"泠说，\"走散了。\"\n\n\"找着了吗？\"\n\n\"还没。\"\n\n\"那你跟我住这儿，怎么找？\"女娲问完了，自己先噎住。她低下头，拿指头戳鸟食，\"……我不是赶你走。我爹说，长老院迟早要过问。过堂的日子定了，你就得……\"\n\n\"我知道。\"泠说。\n\n\"我不让。\"女娲抬起头，\"我去求天君。\"\n\n\"你爹说，求天君也没用。\"\n\n\"那是他怕！\"女娲说，\"我娘要是还在，她肯定有办法。我娘最厉害了。\"\n\n\"你娘呢？\"\n\n女娲不说话了。她戳鸟食，戳了半晌：\"……我娘走了。我不知道她去了哪。我爹不说，我也没敢问。\"她又戳一下，\"我爹说，娘会回来的。我等了好久了。\"\n\n泠没有接话。她伸手摸了摸青鸟的背，鸟眯起眼睛，很舒服的样子。\n\n\"……它啄我，是真跟我亲。\"女娲闷闷地说，\"我娘说的。\"\n\n\"嗯。\"泠说，\"它跟你亲。\"\n\n青鸟吃饱了，跳到女娲膝盖上蹭了蹭。女娲的嘴角翘起来，又赶紧抿下去，装作不稀罕的样子。\n\n\"人间有糖人。\"泠说，\"甜的，画成小动物，舔一口，能从嘴里甜到耳朵根。\"\n\n女娲的眼睛一下子亮了：\"真的？！\"\n\n\"真的。\"泠说，\"还有糖葫芦，一串五个山楂，裹着糖壳，咬一口嘎嘣脆。\"\n\n\"我要吃！\"女娲叫起来，\"你带我去！\"\n\n\"我出不去。\"\n\n\"……\"女娲噎住了，小声说，\"那我求我爹放你出去。爹不放，我去求天君。天君不放，我就……我就跟你一起锁着！\"\n\n\"你锁着干什么？\"\n\n\"陪你啊！\"女娲说，\"你一个人锁着多没意思。我跟你一起，我爹总不能把我也过堂了吧？\"\n\n泠看着她，想笑，又有点笑不出来：\"……你爹不会让你锁的。\"\n\n\"那我就天天来。\"女娲说，\"天天来，缠着你，烦死你。\"\n\n晞的声音从门里漏出来，极轻，只有泠听得到：\n\n\"……银叶树。\"\n\n泠的手停了。\n\n\"晞姐？\"\n\n\"……没什么。\"晞说，\"你玩你的。\"\n\n可泠听得出来——她的声音顿了一下，像被什么绊住了。银叶树。天界。她想问，女娲在旁边，她张了张嘴，又咽了回去。\n\n傍晚，父亲回来了。他在廊下站了一会儿，看了泠一眼，又看了看那条绷得笔直的银链，没说什么。女娲从屋里跑出来，他拍了拍她的头：\n\n\"长老院递了话。明日有人来府上查验文书。\"\n\n女娲的脸垮下来：\"查验什么文书？\"\n\n\"……公务。\"父亲说，\"你回屋去，把你的鸟收好。\"\n\n他走了两步，又停住，头也不回：\n\n\"这几日，老实待着。\"\n\n泠坐在竹垫子上，看着他的背影。查验文书。这四个字她听懂了——是来验她的。过堂的日子，近了。\n\n夜里，云光把整座院子照得白亮亮的。女娲被父亲叫回了屋，泠一个人坐在廊下，银链在脚边绷出一个月牙。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"银叶树怎么了？\"\n\n门里安静了很久。\n\n\"……小时候，有人教过我认这树的果子。\"晞说，\"甜的，吃完舌头会变蓝。\"\n\n\"谁教的？\"\n\n\"忘了。\"\n\n泠知道她没忘。她靠着廊柱，看那棵银叶树在云光里晃：\"那你记性真差。\"\n\n\"嗯。我记性差。\"晞说，\"你睡吧。\"\n\n\"……晞姐，你以前来过天界？\"\n\n\"……\"晞沉默了很久，\"来过。\"\n\n\"干什么来的？\"\n\n\"玩。\"晞说，\"就玩。玩完了，就回家了。\"\n\n泠没有再问。她躺下来，把脸贴在廊柱上，木头凉凉的。链子在她脚边，响了一声。\n\n\"那棵树真好看。\"她说，\"明天我也摘个果子尝尝，看舌头变不变蓝。\"\n\n门里没有声音。过了很久，晞说：\n\n\"……别摘。那不是给你的果子。\""}, {"id": 41, "title": "查验", "content": "天还没亮透，长老府就来人了。\n\n泠被女娲从廊下拽回屋里的时候，院子里已经站了三个人。走在最前头的是一位老者，白袍比女娲父亲的更深，袖口压着金线，脸上的褶子像刀刻的。他身后跟着一个抱卷宗的年轻人，再后面，是两个背着手的执事。\n\n女娲的父亲站在门口，行了礼：\"房长老。\"\n\n\"不用客套。\"老者说，\"那妖呢？\"\n\n泠站在廊下，手腕上的链子绷直了，够到她站的位置，再多一步也不行。老者走近，上下打量她。他看人的眼神和女娲父亲不一样——像在看一件器物，在估它的价。\n\n\"灵镜。\"\n\n年轻人上前，从袖中取出一面灰白的镜子，对着泠照了照。镜面先是亮的，然后暗下去，一缕暗色从镜心漫开，像墨落在水里，又像血。\n\n老者皱眉：\"魔气。\"\n\n\"是。\"女娲的父亲说，\"妖气掺着魔气。\"\n\n\"卷宗怎么写的？\"\n\n年轻人翻开卷宗，念：\"九尾白狐，青丘籍，妖气掺魔气，涉魔之罪。按天律，当诛。\"\n\n院子里安静下来。女娲从屋里跑出来，她站在泠前面，仰头看那老者：\"房爷爷，你们要干什么？\"\n\n\"查验。\"老者说，\"女娲，你让开。\"\n\n\"我不让！\"女娲张开胳膊，\"她是我家的！\"\n\n\"她是妖。\"老者说，\"妖不配做你家的什么。\"\n\n\"她配！\"女娲喊，\"她教我认人间的东西！她给我讲糖人！她比你们——\"\n\n\"娲儿。\"女娲的父亲开口了，声音不高，却把她的喊声压了下去，\"进屋去。\"\n\n\"爹！\"\n\n\"进屋。\"\n\n女娲没动。她站在那里，两只手攥着，眼睛红了，可是没哭。泠看着她，看着她挡在自己前面那个小小的背影，想起江岫挡在她前面的时候——也是这样，明明不宽，却把天都遮住。\n\n\"……没事。\"泠说，\"女娲，你先进去。我跟他们说话。\"\n\n\"你跟他们说什么！\"女娲回头瞪她，\"他们要杀你！你怎么不跑！\"\n\n\"跑？\"泠说，\"我跑了，你爹怎么办。\"\n\n\"我爹是长老！\"\n\n\"正因为他是长老。\"泠说，\"他收留我，是把你当女儿；他要是放跑了我，就是执法者失职。你爹这辈子，最怕的就是这个。\"\n\n女娲僵住了。她看看泠，又看看她爹，嘴唇动了动，到底没说出话来。\n\n老者看了一眼泠，眼里那点估价的冷意收了些：\"你倒是懂事。\"\n\n\"我十七了。\"泠说，\"该懂的都懂了。\"\n\n\"那就更该知道，天律不是儿戏。\"老者说，\"你涉魔，按律当诛。三日后辰时，长老院过堂。过堂之前——\"他看了看那条银链，\"锁，不许解。\"\n\n\"房长老。\"女娲的父亲开口了，声音很稳，\"她伤还没好透。过堂之前，容她在府上养着，我看着她。\"\n\n老者看了他很久：\"……你是怕她死在过堂之前，白费了这道流程。\"\n\n\"是。\"女娲的父亲说，\"天律也没说，不能让伤好的人去过堂。\"\n\n老者没再说什么。他转身走了两步，又停住，没有回头：\n\n\"三日后，辰时。过堂之前，锁不许解。这话，我记在卷宗上了。\"\n\n脚步声远了。院子里又安静下来，只剩下青鸟在廊下叫了一声。\n\n女娲的父亲站在门口，看了泠一眼。那一眼里有什么东西，泠看不太懂——像是叹气，又像是别的什么。他什么也没说，进了屋。\n\n女娲还站在她前面。她转过身，看着泠，眼泪这时候才掉下来：\n\n\"……三天。他们就给三天。\"\n\n\"三天够我养伤了。\"泠说，\"你哭什么。\"\n\n\"他们要杀你！\"\n\n\"还没杀。\"泠说，\"过堂是问话，问了才知道死不死。万一问完没事呢？\"\n\n\"万一有事呢！\"\n\n泠没接话。她伸出手，链子哗啦一响，够不到女娲，就停在半空。女娲自己上前一步，把脸贴在她掌心里，像那只青鸟一样，蹭了蹭。\n\n\"……我去求天君。\"女娲闷闷地说，\"明天就去。\"\n\n\"你爹说，求天君也没用。\"\n\n\"那是他没求过！\"女娲说，\"天君是天界最大的。长老院判的，天君能改。我明天一早去天君殿，跪在门口，天君不见我，我就一直跪着！\"\n\n\"你见过天君？\"\n\n\"没有。\"\n\n\"那你跪什么。\"\n\n\"跪他愿意见我。\"女娲说，\"我娘说，想求人，心要诚。我娘没骗过我。\"\n\n泠看着她。十四岁的姑娘，眼睛还红着，说出的话却像立了誓。泠没有再劝——她想起自己七岁那年，揣着一块糖人就要去找江岫的样子。也是这么傻，这么当真。\n\n\"……去吧。\"泠说，\"跪累了就回来。\"\n\n\"我不回来！\"女娲说，\"我求到了才回来！\"\n\n她说完，转身跑回屋里去了。门摔得响。\n\n夜里，云光还是白亮的。泠坐在廊下，银链在脚边绷着。她攥着左手——白天灵镜照出魔气的时候，手背上的印记烫了一下，像有人要冲出来，被她按住了。\n\n\"晞姐。\"\n\n\"……在。\"\n\n\"灵镜照你，照得到吗？\"\n\n\"照不到。\"晞说，\"门把我都盖住了。他看见的，只有你身上的魔气。\"\n\n\"那就好。\"泠说，\"过堂那天，你也别出来。听见没有？\"\n\n门里没有声音。\n\n\"晞姐！\"\n\n\"……听见了。\"晞说，\"我不出来。\"\n\n\"你保证。\"\n\n\"我保证。\"晞说，\"……你怕吗？\"\n\n泠想了想：\"怕。三日后过堂，天律当诛，卷宗上朱笔都写好了。说不怕，是骗你。\"\n\n\"……那你为什么还劝她别哭？\"\n\n\"哭不出来的时候，总得有一个人不哭。\"泠说，\"我要是也哭，女娲就真没主意了。\"\n\n晞沉默了很久。\n\n\"……你不会有事的。\"她说。\n\n\"你怎么知道？\"\n\n\"……\"晞又沉默了很久，\"天界的天，不是长老院撑起来的。\"\n\n\"那是谁撑的？\"\n\n\"天君。\"晞说，\"长老院判得了妖。可天君想保的人，长老院判不了。\"\n\n泠的心跳了一下：\"你不是说不认识天君吗？\"\n\n\"我不认识。\"晞说，\"可这规矩，我小时候就听人说过。\"\n\n\"听谁说的？\"\n\n\"……忘了。\"\n\n泠没有追问。她靠在廊柱上，看那棵银叶树在云光里晃。天君。天界最大的那个人。女娲明天要去跪他，晞说她\"小时候就听人说过\"他的规矩——两个人，都在往同一个人面前跑。\n\n\"晞姐。\"她说，\"天君要是真像你说的，能保人——他为什么要保我？\"\n\n\"……不知道。\"晞说，\"睡吧。明天还有一天。\"\n\n\"嗯。\"\n\n泠闭上眼睛。云光透过眼皮，亮堂堂的。她听见链子又响了一声，然后晞说：\n\n\"……我在。你睡。\"\n\n她睡着了。"}, {"id": 42, "title": "喊门", "content": "天君殿在九重天的最高处，云海托着，一重一重的殿门望不到头。\n\n女娲是天没亮就出门的。她没跟父亲说——说了，他一定拦。她穿过长老府的回廊，跳过两截矮墙，把青鸟的叫声甩在身后，一直跑到云海边上，才停下来喘气。\n\n天君殿的守卫拦住了她。\n\n\"我是九天长老的女儿！\"女娲仰着头，\"我要见天君！\"\n\n守卫看了她一眼：\"天君不见客。\"\n\n\"我不是客！\"女娲说，\"我是来求他的！\"\n\n\"求也不见。\"守卫说，\"姑娘，回去吧。\"\n\n女娲没回去。她在殿门外那块最大的石阶上，跪下了。\n\n云光从白走到淡金，又走回来。天界没有日头，光就是云自己发出来的——女娲跪在石阶上，膝盖先是疼，后来麻了，后来没有感觉了。她把腰挺得直直的，像一棵种在石阶上的小树。\n\n守卫换了两班。第三班的时候，一个穿灰袍的内侍从殿里出来，站到她面前：\n\n\"天君说了，不见。\"\n\n\"我听见了！\"女娲说，\"我明天还来！\"\n\n\"天君还说——\"内侍顿了一下，\"让你别跪了。跪坏了，九天长老要心疼。\"\n\n\"我爹不心疼！\"女娲喊，\"我爹他——\"她喊到一半，声音卡住了。她想起父亲把她挡在身后、替泠求\"伤好再过堂\"的样子。她吸了吸鼻子，\"……我爹疼我。可他拿天律没办法。天君有办法！\"\n\n内侍没再说话，转身回去了。\n\n女娲跪到守卫换第四班，不想干等着了。她先喊\"我要见天君！\"，喊了十几遍，殿门一动不动。后来她改了主意——不喊求见了，喊泠的事：\n\n\"天君！你听我说！我家里养了一只狐狸！她叫泠！她不是坏妖！她是青丘来的白狐狸，她十七岁！\"\n\n没人应她。她接着喊：\n\n\"她给我讲人间的糖人！讲糖葫芦！她说那东西甜，从嘴里甜到耳朵根！她教我认鸟——她跟我的青鸟特别好！我的鸟啄我，不啄她！\"\n\n云海上的风起来了，把她的声音吹散一半。她追着风喊：\n\n\"她说她最怕的不是死！她怕连累我爹！她说——她说她要是跑了，我爹就是执法者失职！天君，你见过这样的妖吗！\"\n\n殿门关着，里面安静得能听见云流过屋檐的声音。\n\n\"我娘说，想求人，心要诚！\"女娲的嗓子哑了，喊一句，咳一声，\"我娘没骗过我！天君，我不求别的——你见她一面！你见她一面，你就知道了！\"\n\n她的声音在云海里滚了几滚，散成碎片，被风带走。\n\n天君殿里没有点灯——天界的光不用点。一个白袍的年轻人坐在案后，手里捏着一支笔，笔尖悬在半空，很久没有落下。案上摊着的折子他看了三遍，写的是：九尾白狐，青丘籍，妖气掺魔气，涉魔之罪，按天律当诛。\n\n殿外的声音断断续续飘进来，隔着九重殿门，听不真切，只有那个小姑娘的嗓子，又哑又亮，像一把豁了口的刀，一刀一刀刮在风里。\n\n\"……十七岁。\"年轻人放下笔，\"十七年了。\"\n\n他站起来，走到殿门口，站了一会儿。殿外，石阶上那个小小的影子还跪着，被云光拉得很长。\n\n\"传话。\"他说，\"让她回去。\"\n\n\"天君，她明日还会来——\"\n\n\"我知道。\"年轻人说，\"告诉她——我听见了。\"\n\n傍晚，女娲的父亲找到天君殿来。他站在云海边上，看着自己女儿跪在石阶上的背影，站了很久，才开口：\n\n\"娲儿。\"\n\n\"爹！\"女娲的嗓子哑得不成样子，她回头看他，\"爹，你帮我求求天君！\"\n\n\"天君说了不见。\"\n\n\"他没见！他说不定明天就见！\"\n\n\"……娲儿。\"父亲走过去，把她从石阶上拉起来。女娲的膝盖早站不住了，一拉就软，他干脆把她抱起来，\"回去吧。他要是肯见你，一早见了。\"\n\n\"那是因为我没跪够！\"\n\n\"你跪够了。\"父亲说，\"他也不会见你。天君不见人，是规矩。你今天跪在这，明天跪在这，后天还跪在这——他不会为你破例。\"\n\n\"万一呢！\"\n\n父亲没接话。他抱着女儿往回走，走到云路尽头，女娲伏在他肩上，忽然哭起来：\n\n\"爹，那泠姐姐怎么办……她三日后要过堂……她说她不怕死，可我怕……\"\n\n\"……爹有爹的办法。\"父亲说，\"过堂那天，爹替她说话。爹是长老，说话有人听。\"\n\n\"你说话有人听，天君的话谁听？\"\n\n\"娲儿，别说了。\"\n\n\"爹，天君为什么不听我说话？\"女娲哭着问，\"是不是因为我小？\"\n\n父亲没有回答。他抱着她，走了一路，也没想出一句能答她的话。\n\n长老府里，泠还坐在廊下。银链在她脚边绷着，云光转暗，她看见女娲被父亲抱回来——女娲一落地，就扑过来抱住她，把脸埋进她怀里，哭得上气不接下气。\n\n\"泠姐姐……天君不见我……\"\n\n\"……没事。\"泠说，\"不见就不见。\"\n\n\"他不见我，你三日后就要过堂了！\"\n\n\"过堂是问话。\"泠说，\"问了才知道。你别哭了，你嗓子都哑了。\"\n\n女娲伏在她怀里，哭一会儿，抽一会儿，后来睡着了。泠把她扶到屋里躺下，又坐回廊下。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"她跪了一天。\"泠说，\"天君也没见她。\"\n\n\"……\"\n\n\"你说，天君会见她吗？\"\n\n门里安静了很久。久到泠以为她不会回答了，晞的声音才响起来，轻得像一片云落地：\n\n\"……他会来的。\"\n\n\"谁？\"泠问，\"天君？你怎么知道？\"\n\n晞没有回答。\n\n夜里，九重天上起了风。长老府门外的云路上，来了一个白袍的年轻人。他没有带仪仗，没有随从，一个人，像散步一样走到府门前，停住，抬头看了一会儿。\n\n院子里那棵银叶树在云光里晃，银白的叶子一片一片往下落。\n\n年轻人看了那棵树很久。\n\n\"……甜的。\"他说，\"这树的果子，是甜的。\"\n\n没有人回答他。他站了一会儿，抬脚，走进了长老府的门。"}, {"id": 43, "title": "赦免", "content": "夜里，长老府的门响了一声。\n\n女娲的父亲还没睡。女儿哭累了，伏在他膝上睡过去，他把她抱回屋里，出来的时候，廊下站着一个人。白袍，年轻，没有带随从，站在云光里，像一道不该惊动的影子。\n\n父亲看清他，整个人顿住了。他快步走过去，刚要行礼，年轻人抬了抬手：\n\n\"不必。\"\n\n\"天君——\"父亲压低声音，\"您怎么——\"\n\n\"我来看看那个丫头。\"天君说，\"折子我看过了。你女儿跪了一天，嗓子都哑了。\"\n\n\"……是。\"父亲说，\"她不懂事。\"\n\n\"她懂。\"天君说，\"她比我见过的大多数人都懂。\"他看向廊下那根绷直的银链，\"锁着的那位，倒是沉得住气。\"\n\n\"她一直很安静。\"\n\n\"嗯。\"天君说，\"明日，把房长老请来。\"\n\n\"……是。\"\n\n天君没有再说话。他站在院子里，看了那棵银叶树很久，才转身离开。父亲站在原处，看着他的背影消失在云路尽头，心口说不清是紧还是松。\n\n天光转白的时候，泠醒了。\n\n她睡在廊下——链子够不着屋里的床，女娲就把竹垫子铺在廊上，垫了三层，说\"地上凉\"。泠睁眼，看见一个白袍的年轻人站在她面前，负着手，正低头看她。\n\n\"……你是谁？\"泠问。\n\n\"过路的。\"年轻人说，\"听说这里锁着一只狐狸，来看看。\"\n\n\"看完了？\"\n\n\"看完了。\"年轻人说，\"你背上那道门，养得挺好。\"\n\n泠的手一下子攥紧了。门。他知道门。她盯着他，喉咙发紧：\"……我不知道你在说什么。\"\n\n\"你知道。\"年轻人说，\"门里那位，不出来吗？\"\n\n\"没有门。\"泠说，\"也没有谁。\"\n\n年轻人看了她一会儿。他的目光很平静，没有敌意，也没有打量——像在看一样他认得的东西。\n\n\"……不出来也好。\"他说，\"外面风大。\"\n\n他转身要走。泠叫住他：\"你到底是谁？\"\n\n\"明日你就知道了。\"年轻人说。\n\n房长老是天亮后到的。他进了府，一眼看见院子里站着的白袍年轻人，先是皱眉——等他认出那是谁，脸上的褶子都僵了：\n\n\"天、天君？！\"\n\n\"房长老。\"天君说，\"今日劳你来，是为那桩卷宗。\"\n\n\"是。\"房长老定了定神，\"三日后过堂——\"\n\n\"不必了。\"天君说，\"卷宗，销了。\"\n\n房长老怔住：\"销了？\"\n\n\"销了。\"天君说，\"这丫头，我赦了。\"\n\n\"天君！\"房长老上前一步，\"她涉魔！天律——\"\n\n\"天律是我立的。\"天君说，\"我说她无罪，她今日起，就无罪。\"\n\n院子里安静下来。房长老看看天君，又看看廊下锁着的泠，嘴唇动了几动，到底没说出第二句。他躬身：\n\n\"……是。卷宗，今日就销。\"\n\n\"今日的事，出了这道门，不必再提。\"天君说，\"长老院那头，我自会去说。\"\n\n\"是。\"\n\n女娲是被吵醒的。她揉着眼睛跑出来，看见院子里站着一个白袍的年轻人，父亲和房爷爷都站着，像在听训。她一头雾水，跑到泠身边蹲下：\"泠姐姐，他们说什么呢？\"\n\n\"……有人赦了我。\"泠说。\n\n\"啊？\"女娲眨眨眼，\"谁？\"\n\n\"天君。\"\n\n女娲\"啊\"了一声，没反应过来。她看看父亲，又看看房爷爷，最后看着那个白袍的年轻人：\"你——你是天君？\"\n\n\"是。\"\n\n\"天君！\"女娲一下子跳起来，\"你听见我喊了？！\"\n\n\"……听见了。\"\n\n\"那你——你真的赦了泠姐姐？！\"\n\n\"真的。\"\n\n女娲站在那里，张着嘴，半天没动。然后她的眼泪掉下来了，一边哭一边笑，扑过去抱住泠：\"我娘说的对！心诚则灵！我娘没骗我！\"\n\n泠被她撞得往后仰，链子哗啦一响。\n\n\"……松开。\"泠说，\"我透不过气了。\"\n\n\"我不松！\"女娲抱着她哭，\"我求到了！我求到了！\"\n\n天君站在旁边，看着这两个抱成一团的姑娘，脸上没什么表情。父亲走过去，轻声说：\"娲儿，松手。天君在。\"\n\n\"天君在天君在！\"女娲哭着说，\"他赦了我泠姐姐，他是好人！\"\n\n天君没忍住，嘴角动了一下，又压下去：\n\n\"……锁，解了吧。\"\n\n父亲上前，解下床头的铜环——链子从泠手腕上滑落，哗啦一声，落在地上，堆成一圈。泠活动了一下手腕，那圈勒出来的红印，很深。\n\n\"往后，她留在府上。\"天君说，\"怎么安置，你们定。\"\n\n女娲擦了一把眼泪：\"做我的侍卫！贴身的那种！走到哪儿跟到哪儿！\"\n\n天君看了她一眼：\"……随你。\"\n\n\"谢天君！\"女娲拉着泠就要行礼，泠没让她拉下去。她自己跪下，头低着：\n\n\"……谢天君。\"\n\n天君看着她跪下去的样子，没有说话。他站了一会儿，转身往外走。走到银叶树底下，他停住，没有回头，声音不高，像自言自语：\n\n\"……果子，还是甜的。\"\n\n女娲没听懂。父亲和房长老也没听懂。泠跪在地上，却觉得手背上的印记，烫了一下——像有人攥紧了拳，又松开。\n\n天君走远了。\n\n女娲父亲把人送走，回来站在泠面前，看了她很久：\"……往后，好好过。别辜负她跪的那一天。\"\n\n\"我知道。\"泠说。\n\n房长老也走到她面前。他看了她一会儿，什么都没说，只摇了摇头，走了。走到门口，又停住：\"……倒是条好命。\"\n\n院子里安静下来。青鸟在廊下叫了一声。女娲跑去给泠倒水，泠一个人坐在竹垫子上，看着那圈解下来的银链，看了很久。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"刚才那个人……你听见他说了吗？说果子还是甜的。\"\n\n门里没有声音。\n\n\"晞姐？\"\n\n\"……听见了。\"晞说。\n\n\"你认得他？\"\n\n门里沉默了很久。久到泠以为她不会回答了，晞才开口，声音很轻，像怕惊动什么：\n\n\"……认得。\"\n\n\"他是谁？\"\n\n\"……\"晞又沉默了一会儿，\"摘果子的那个人。\"\n\n泠想起那晚她说的话——\"小时候，有人教过我认这树的果子。甜的，吃完舌头会变蓝。\"她问\"谁教的？\"晞说\"忘了\"。原来没有忘。\n\n\"他摘给你过？\"\n\n\"……嗯。\"晞说，\"他把果子摘下来，递给我的时候，说——甜的都给你。\"\n\n泠没说话。她靠在廊柱上，看那棵银叶树在云光里晃。十七年了。摘果子的人成了天君，收果子的人困在一道门里，隔着十七年，一个在门外说\"果子还是甜的\"，一个在门里，应都不敢应。\n\n\"晞姐。\"她说，\"你不想他吗？\"\n\n门里没有声音。过了很久，晞说：\n\n\"……不想了。想不动了。\"\n\n泠没有戳穿她。她闭上眼睛，听着银叶树叶子落下来的声音，一下，一下，像有人在很远的地方，数着什么。"}, {"id": 44, "title": "侍卫", "content": "女娲给泠准备了一身行头。\n\n她不知道从哪儿翻出一条银色的发带，非要给泠系在头发上：\"侍卫要有侍卫的样子！\"又跑到廊下去摘青鸟的尾羽。青鸟扑腾着躲，被她按住，拔了一根最亮的，疼得直叫。\n\n\"你轻点。\"泠说。\n\n\"我轻了！\"女娲把羽毛编成一个小环，挂到泠脖子上，\"这是我的标记！我娘说，我家的东西都要有标记，走丢了，认得回来。\"\n\n\"你娘说的还挺多。\"\n\n\"我娘什么都知道！\"女娲说，\"泠姐姐，你往后跟着我，走到哪儿跟到哪儿——不能丢。\"\n\n\"……好。\"泠说，\"不丢。\"\n\n天界很大，比长老府大得多。女娲拉着泠，从云路上走出去，一路走一路给她指：\"那是药长老家的院子，那是司律司，那是——哎，你别看那边！那边是雷池，进去要挨劈的！\"\n\n泠跟着她，走过一重一重云路。天族的人来来往往，有人的目光落在她身上——九尾白狐，耳尖上还带着一点银白的毛，走在天族的云路上，像一滴墨落在雪里。有人认出了她：\n\n\"那就是九天长老府养的那只妖？\"\n\n\"嘘——是天君赦的。\"\n\n\"赦了也是妖。涉魔的妖——\"\n\n\"关你们什么事！\"女娲的声音响起来，脆生生的，把那些话都拦在半路，\"她是我的人！我爹请来的！天君点头的！你们谁有意见，去找天君说！\"\n\n没人敢去找天君说。议论声歇下去，云路上的人各走各的。女娲回头，得意地朝泠扬了扬下巴：\"走，带你看好玩的！\"\n\n\"你刚才那样。\"泠说，\"像只护食的小鸡。\"\n\n\"小鸡怎么了！小鸡护食，天经地义！\"\n\n晞在门里，极轻地笑了一下。只有泠听见。\n\n女娲说的\"好玩的\"，是云海边上的一口池子。池水是云做的，白茫茫一片，里头养着云鲤——银白的鱼，尾巴一摆，就搅起一小片雾。女娲趴在池边，手伸进去搅：\"你看你看！它亲我手！\"\n\n\"它那是想咬你。\"泠说。\n\n\"它喜欢我！\"女娲说，\"我天天来喂它们！\"\n\n池边聚了几个天族的孩子，看见女娲，围过来：\"女娲，你养妖啦？\"\"听说你爹抓了只狐狸回来？\"\n\n\"什么抓！\"女娲把泠拉到身边，\"是我爹请回来的！她是我的人！\"\n\n孩子们打量泠，目光在她耳朵上打转：\"她耳朵尖上有毛！\"\n\n\"狐妖不都这样？\"泠说，\"你没见过狐狸？\"\n\n\"我、我见过画里的！\"\n\n\"画里的狐狸会说话吗？\"\n\n孩子们你看看我，我看看你，有人憋不住笑出来。女娲趁机把泠拉走，走了老远才回头，看见那群孩子还在池边，叽叽喳喳的，有一个蹲下来学了声狐狸叫。\n\n\"……他们其实不坏。\"女娲说，\"就是没见过。天界规矩多，小孩儿没见过的东西也多。\"\n\n\"我知道。\"泠说。\n\n\"你不生气？\"\n\n\"生什么气。\"泠说，\"我七岁那年，青丘的小孩儿拿石头扔我，说我是怪物。比起石头，学狐狸叫算是夸我了。\"\n\n女娲瞪着她，半天没说话。她把泠的袖子攥紧了一点，小声说：\n\n\"泠姐姐，以后谁拿石头扔你，你告诉我。我替你扔回去。\"\n\n\"……好。\"泠说，\"你扔，我看着。\"\n\n傍晚，女娲的父亲从人间巡查回来。他在门口抖了抖袍子上的尘，进了院子，从袖里摸出一个小纸包，递给扑上来的女娲：\n\n\"人间买的。\"\n\n\"什么什么！\"女娲拆开纸包——三个糖人。一个狐狸，一个圆圆的鸟，还有一个扎小辫的姑娘。\n\n\"糖人！\"女娲叫起来，\"泠姐姐你快看！糖人！是你说那个——从嘴里甜到耳朵根的！\"\n\n泠走过去，看着那只狐狸糖人。糖皮亮晶晶的，狐狸翘着尾巴，嘴角还画着一道笑。\n\n\"……谢长老。\"她说。\n\n\"不谢。\"父亲说，\"人间多的是。下回巡，再带。\"他顿了顿，\"娲儿，分你泠姐姐一个。别都自己吃了，牙疼。\"\n\n\"我分我分！\"女娲把狐狸糖人塞到泠手里，\"这个像你！你吃这个！\"\n\n泠捏着那根竹签，糖人举到眼前，看了很久。\n\n\"晞姐。\"她低声说，\"甜的。\"\n\n门里安静了一会儿。\n\n\"……我吃过甜的。\"晞说，\"很久以前。\"\n\n\"谁给你的？\"\n\n\"忘了。\"\n\n泠没有追问。她把狐狸糖人举到左肩旁边，让门里的她\"看\"了一会儿，才放进嘴里。糖壳在牙齿间碎开，甜味从舌尖漫到耳朵根——她没说谎，真是甜的。\n\n女娲在旁边啃她的鸟糖人，啃得满嘴都是糖浆：\"泠姐姐，你刚才跟谁说话？\"\n\n\"……念经。\"泠说。\n\n\"你还会念经！\"\n\n\"嗯。驱邪的。\"\n\n\"驱什么邪？\"\n\n\"贪吃的小鸡。\"\n\n女娲啃糖人的动作顿了一下，随即扑过来：\"你才小鸡！你全家——\"她喊到一半，想起来泠没有家，改口，\"你、你是狐狸！狐狸！\"\n\n\"狐狸。\"泠说，\"狐狸吃糖，也甜。\"\n\n夜里，女娲被父亲叫去洗漱。泠一个人坐在廊下——链子已经解了，她想坐哪儿坐哪儿，手腕上那圈红印还没褪干净，她总忍不住去摸。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"你以前在天界，也逛过云路吗？\"\n\n\"……逛过。\"\n\n\"好玩吗？\"\n\n门里沉默了一会儿。\n\n\"好玩。\"晞说，\"那时候小，觉得什么都是新鲜的。云是软的，树是亮的，果子是甜的。\"\n\n\"后来呢？\"\n\n\"后来就不好玩了。\"晞说，\"后来我明白了——那些东西再好，不是我的。\"\n\n泠没说话。她看着院子里那棵银叶树，叶子在云光里一片一片地亮。\n\n\"现在呢？\"她问，\"现在这棵树，是你的邻居了。算不算你的？\"\n\n\"……\"晞沉默了一会儿，\"算半个。\"\n\n泠笑了：\"那我再去跟它商量商量，让它整个儿归你。\"\n\n\"你少跟树说话。\"晞说，\"叫人看见，当你是傻狐狸。\"\n\n\"傻狐狸也是狐狸。\"泠把青鸟的羽毛环从衣领里拽出来，捏了捏，\"我家的标记。走丢了，认得回来。\"\n\n门里没有声音。过了很久，晞说：\n\n\"……丢不了。我看着你呢。\""}, {"id": 45, "title": "云市", "content": "九重天的云市，七天开一回。\n\n摊子摆在云上，东一个西一个，卖什么的都有——天界的果子、绣云纹的料子、会飞的木鸟，还有人间的东西。天族的人来来往往，有摊主扯着嗓子吆喝，云被踩得一晃一晃，像踩在一层厚雪上。\n\n女娲拉着泠，从市口挤进去，一路走一路看：\"泠姐姐你看这个！这个会自己飞！\"\"泠姐姐你看那个！那个是雷池边上的石头，摸一下手会麻！\"\n\n泠被她拽着，脚不沾地地穿过大半个云市，最后在一排木刻摊子前停下来。\n\n摊子上摆着木刻的小玩意儿：木马、木鱼、木鸟，还有一个木狐狸。翘着尾巴，耳朵立着，嘴边画着一道笑——和昨天的糖人狐狸一个样。\n\n\"这个像你！\"女娲拿起来，翻来覆去地看，\"老板，这个多少钱？\"\n\n\"三颗云珠。\"摊主说，\"姑娘好眼光，这是人间的手艺。\"\n\n女娲从腰间的袋子里摸出三颗亮晶晶的珠子，搁在摊上：\"买了！\"她把木狐狸塞到泠手里，\"送你的！你的侍卫牌挂脖子上了，这个挂——挂腰上！\"\n\n泠捏着那只木狐狸，指腹摩过翘起来的尾巴。木头的纹路，一刀一刀，刻得很细。她想起江岫家窗台上那只离群一格的小木狐狸，想起江岫削东西的样子——削完了，还会拿指腹把毛边磨平，磨得光光的。\n\n摊主是个老头，看了她一会儿：\"姑娘，你盯着这狐狸看半天了。是想起谁了吧？\"\n\n\"……想起一个人。\"泠说，\"他也削狐狸。\"\n\n\"哦？\"摊主来了兴致，\"也是人间的手艺？\"\n\n\"是。\"泠说，\"他削得比你好。\"\n\n\"嘿！\"摊主吹胡子，\"你这是夸他，还是踩我？\"\n\n\"夸他。\"泠说，\"也踩你。\"\n\n女娲在旁边笑得直不起腰。摊主瞪了泠两眼，倒也没恼，从摊子底下又摸出一个木鸟，扔给她：\n\n\"拿着。看你会说话，多送你一个。这鸟会看家，带回去，别让它飞丢了。\"\n\n\"谢老板。\"泠说。\n\n\"不谢。\"摊主说，\"人间手艺，给看得懂的人。\"\n\n女娲拉着泠往前走，走出去老远，还回头喊：\"老板！他削得真的比你好！\"\n\n\"你这丫头闭嘴！\"\n\n云市深处，有一家卖果子的。摊上摆着一篮银叶果——银白的皮，咬开，果肉是淡金色的。女娲凑过去看了一眼，叫起来：\"老板！这是不是我们府上那棵银叶树结的？\"摊主点头：\"姑娘好眼力，正是房府那棵老树，年年匀些下来换云珠。\"女娲掏云珠：\"买了！\"她把一小篮果子塞给泠：\"这是银叶树的果子！我们府上那棵树结的！你天天看那棵树，还没吃过吧？\"\n\n泠捏起一颗，看了看。银叶果，甜的，吃完舌头会变蓝——晞说过的。\n\n她咬了一口。汁水在嘴里炸开，甜的，带着一点凉。她把舌头伸出来给女娲看：\"蓝了吗？\"\n\n\"蓝了蓝了！\"女娲凑过来看，\"真的变蓝了！\"\n\n泠含着那颗果子，心想，晞姐当年，也是这样吃过的吧。\n\n\"晞姐。\"她含糊地说，\"真的变蓝了。\"\n\n门里静了一会儿，晞的声音响起来，轻得只有她听得见：\n\n\"……我记得。\"\n\n回去的路上，女娲还在兴奋：\"下回开市，我们还来！我攒云珠！\"她说着想起什么，回头看了一眼天君殿的方向，\"泠姐姐，天君赦了你，我还没谢过他呢。他喜欢什么呀？\"\n\n泠想了想：\"……甜的。\"\n\n\"甜的？\"女娲眨眨眼，\"那我下回开市，买一篮银叶果给他送去！\"\n\n\"……他大概会收。\"\n\n\"他收不收，我都送！\"女娲说，\"我娘说，得了人的好，要记着还。我娘没骗过我。\"\n\n泠看着她，没说话。银叶果。天君说\"果子还是甜的\"——十七年了，他还记得那个味道。女娲要是真送去一篮，他大概会停一会儿吧。\n\n\"……送吧。\"她说，\"记得挑大的。\"\n\n夜里，云市散了。女娲趴在窗台上数云珠，数着数着睡着了，手里还攥着那颗没数完的。\n\n泠把她抱到床上，替她掖好被角。青鸟在架子上打了个盹，翎毛蓬着。她摸了摸脖子上的羽毛环，又摸了摸枕边的木狐狸。\n\n这姑娘在天君殿前跪了一天，嗓子都跪哑了，才把她从天律底下捞出来。她救了她——那她往后，就得好好当这个侍卫。\n\n\"别辜负她跪的那一天。\"父亲的话，泠记在心里。\n\n她在窗边坐下来，守着。银叶树的叶子在云光里一片一片地亮，落下来的那一片，躺在窗台上没动。\n\n\"晞姐。\"\n\n\"……在。\"\n\n\"你说得对，日子还长。\"泠说，\"长到我报答完她为止。\"\n\n门里没有回答。过了一会儿，晞说：\n\n\"……她是个好姑娘。\"\n\n\"我知道。\""}, {"id": 46, "title": "送果", "content": "第二天一早，女娲就爬上了银叶树。\n\n泠站在树下，仰着头看她：\"你下来。\"\n\n\"我摘果子！\"女娲骑在枝桠上，够着那几颗熟透的银叶果，\"开市要等七天！我等不了！这树是我们家的，我摘了送去！\"\n\n\"你昨天不是说开市再买？\"\n\n\"那不一样！\"女娲摘下一颗，往袖子里揣，\"买的是买的，自己家树上摘的，才叫心意！我娘说——\"\n\n\"得了人的好，要记着还。\"泠接她的话，\"你娘还说什么？\"\n\n\"还说你话多。\"女娲理直气壮，\"快接住！\"\n\n她从树上丢下来，泠一抬手接住，一颗一颗，稳稳的，全落在她手心里。青鸟在旁边叫，女娲瞪它：\"不许告状！\"\n\n\"你爹知道了咋办？\"\n\n\"我爹知道了就说是我给泠姐姐摘的！\"女娲滑下树，拍拍裙子，\"走！送果去！\"\n\n\"我不去。\"泠说。\n\n\"为什么？\"\n\n\"……天君殿。\"泠说，\"我去那儿，不合适。\"\n\n女娲看了她一会儿，像是懂了什么，点了点头：\"那你在殿门外等我！你不进去，就在台阶底下等我！\"\n\n泠没再说话。她接过女娲的果篮，替她理了理被树枝挂乱的头发，把那根银发带重新系好：\"去吧。我等你。\"\n\n天君殿外，内侍拦住了女娲：\"天君不见客。\"\n\n\"我不是客！\"女娲挺着胸脯，\"我是九天长老的女儿！我来给天君送果子的！\"\n\n\"天君从不收礼。\"内侍说，\"姑娘，回去吧。\"\n\n\"这也不是礼！这是果子！我们府上银叶树结的！\"女娲把篮子往他面前一举，\"你闻闻！甜的！天君他喜欢甜的！\"\n\n内侍张了张嘴，正要再说什么，殿里传出一个声音：\n\n\"让她进来。\"\n\n内侍吓了一跳。殿门开了，女娲提着篮子走进去，看见天君坐在案后，手里还捏着一支笔，案上摊着半卷文书。\n\n\"你就是九天长老家的女儿？\"\n\n\"是！我叫女娲！\"女娲把篮子放到案上，摘了一颗大的递过去，\"你尝尝！泠姐姐说你喜欢甜的，我们府上的树结的，比云市上卖的还甜！\"\n\n天君接过那颗银叶果，看了很久。\n\n\"……泠姐姐。\"他说，\"她让你送来的？\"\n\n\"不是！我自己要送的！\"女娲说，\"你赦了她！她是我的人，你赦了她，就是救了我——我娘说，得了人的好，要记着还！\"\n\n天君没说话。他把那颗果子放在手心，转了两圈，银白的皮在殿光里亮着。过了好一会儿，他问：\n\n\"她……在你们府上，住得好吗？\"\n\n\"好呀！\"女娲眼睛一亮，\"她吃得好睡得好！昨儿夜里我睡着了，她还给我掖被角呢！我爹说，她是个好姑娘！\"\n\n\"……好姑娘。\"天君重复了一遍，\"那就好。\"\n\n女娲看着他，凑近了一点：\"天君，你是不是笑了？\"\n\n\"没有。\"\n\n\"你笑了！嘴角动了！\"女娲得意，\"我就知道你是好人！你赦了我泠姐姐，你还会笑！\"\n\n\"……\"天君把果子放回篮子里，又看了它一眼，\"果子，我收下了。你回去吧。\"\n\n\"那我走了！\"女娲转身跑了两步，又回过头，\"天君，你记得吃呀！吃了舌头会变蓝的！可好玩了！\"\n\n殿门合上。天君坐在案后，看着那篮银叶果，看了很久。他拿起刚才那颗，剥开，咬了一口。\n\n甜的。汁水在嘴里炸开，带着一点凉。\n\n他走到铜镜前，看了一眼——舌头，真的变蓝了。\n\n\"……还是这个味。\"他说。声音很轻，殿里没有人听见。\n\n女娲跑出殿门，一路蹦下台阶，扑到泠面前：\"他收了！他收了！他说'让她进来'！他自己说的！\"\n\n\"……嗯。\"泠说，\"走，回去。\"\n\n\"你不问问他还说了什么？\"女娲跟在她身边，小跑着，\"他还问我，你在府上住得好不好！我说好！我说你吃得好睡得好！我说你给我掖被角！他听完就笑了！真的笑了！嘴角动了！\"\n\n泠的步子慢下来。\n\n\"……他问了？\"\n\n\"问了！\"女娲说，\"泠姐姐，天君是不是认识你呀？他像是很关心你！\"\n\n\"……不认识。\"泠说，\"天君关心谁，都是天君的事。走吧，回去了。\"\n\n她走得很快。快得像是要把什么甩在身后。\n\n回到府里，门边的侍从早已禀过：小姐提着果子去了天君殿。女娲的父亲正在院子里，手里拿着一卷文书，抬头看了女儿一眼：\"果，送去了？\"\n\n\"送去了！\"女娲扑过去，\"他收了！他还笑了！我亲眼看见的！\"\n\n\"……笑了。\"父亲说。\n\n\"嗯！\"女娲点头，\"爹，你说天君是不是认识泠姐姐？他问我在府上住得好不好呢！\"\n\n父亲没答。他想起那天夜里，天君站在廊下，看着泠说的那句话——\"她懂。她比我见过的大多数人都懂。\"\n\n一篮银叶果，值当什么。天君什么样的东西没见过，却为一个不认识的丫头破例开了殿门。\n\n\"……去洗手。\"父亲说，\"午饭凉了。\"\n\n\"哦。\"女娲应着跑开了。父亲站在原地，卷文书捏在手里，没有展开。\n\n门里，晞一直没说话。直到长老府的大门在身后合上，泠才听见她开口，声音很轻，轻得像那一片落下来的银叶：\n\n\"……他还是喜欢吃甜的。\""}, {"id": 47, "title": "门里的姐姐", "content": "那天夜里，女娲睡不着，抱着枕头溜进了泠的屋子。\n\n\"泠姐姐。\"她爬上床沿，\"你跟我爹说话，跟我说话，都好好的。可你一个人的时候，总往左肩头说话。你是在跟谁说话？\"\n\n泠把枕头让给她一半：\"……念经。\"\n\n\"骗人！\"女娲说，\"念经不是那个声儿！你念经念得可好听了，跟人说话的时候，声儿都不一样！\"\n\n泠沉默了一会儿。\n\n\"你想知道？\"\n\n\"想！\"\n\n\"……那你躺好。\"泠说，\"这事，说来话长。\"\n\n女娲立刻躺平，眼睛亮晶晶的。\n\n泠看着窗外那棵银叶树，想了一会儿，从哪儿说起。\n\n\"我背上，有一道门。\"她说，\"从我记事起就在。门里住着一个姐姐，她叫晞。\"\n\n\"门里的姐姐？！\"女娲一下子坐起来，\"什么门？在哪儿？我看看！\"\n\n\"你看不见。\"泠说，\"那道门长在我背上。门修好的时候，谁也看不见。\"\n\n\"那她怎么进去的？\"\n\n\"十七年前，她被人追杀，从天上掉下来，正落在我身上。\"泠说，\"她受了重伤，进不了轮回，就躲进我的身体里。门关上了，她在里面活了下来。\"\n\n女娲张了张嘴，半天没出声。她问：\"她、她是坏人吗？\"\n\n\"她不是坏人。\"泠说，\"她是魔族。\"\n\n\"魔族——！\"女娲压低声音，\"魔族不是要吃小孩吗？！\"\n\n\"她不吃小孩。\"泠说，\"她连我小时候哭都不舍得凶。她听了我十七年的话——我走路、我挨骂、我笑，她都听着。她是我姐姐。\"\n\n女娲不说话了。她抱着枕头，把脸埋进去一半，过了一小会儿，闷闷地问：\n\n\"……她凶吗？\"\n\n\"凶。\"泠说，\"我睡懒觉的时候最凶。\"\n\n\"她吓唬你吗？\"\n\n\"不吓唬。\"泠说，\"她只是不说话。我不听话的时候，她就不说话。比凶还吓人。\"\n\n女娲想了想，又想了想，最后小声说：\"……那我能不能跟她说句话？\"\n\n\"能。\"泠说，\"她听得见你。你喊她，她应你。\"\n\n\"真的？！\"\n\n\"真的。\"\n\n女娲爬起来，跪坐在床上，对着泠的左肩，认认真真地，喊了一声：\n\n\"晞姐姐！我是女娲！我爹是九天长老！我养青鸟！我今年十四了！你听见了没！\"\n\n屋子里安静了一会儿。泠说：\n\n\"她说，听见了。\"\n\n\"她说啥了？！\"\n\n\"她说——你好吵。\"\n\n\"哈哈哈——\"女娲笑得滚进被子里，\"她说我吵！她听见我了！\"\n\n她笑完了，又趴过来，眼睛亮晶晶的：\"泠姐姐，晞姐姐长什么样？\"\n\n\"银白头发。\"泠说，\"和我一样高，照我描的。瞳色是暗红的——天界通缉令上，就画着那个颜色。所以她不能出来。一步都不能。\"\n\n\"……\"女娲的声音小下去，\"那我是不是也不能跟别人说？\"\n\n\"谁都不能说。\"泠说，\"包括你爹。\"\n\n\"我爹也不说？\"\n\n\"你爹是长老。\"泠说，\"他知道该秉公办事的时候，他会秉公办事。\"\n\n女娲沉默了很久，然后重重地点了点头：\n\n\"那我不说！谁都不说！\"她伸出手，\"拉钩！\"\n\n泠跟她拉了钩。\n\n\"拉钩上吊——\"女娲说，\"一百年不许变！\"\n\n从那以后，日子就快了起来。\n\n第一年，云市开市，她们又去。木刻摊主老远就喊：\"哟，小狐狸又来了！这回给你留了个好东西！\"他从摊子底下摸出一颗木刻的银叶果，银白的皮上刻着几道叶脉，递过来：\"新刻的，还没人买过。送你，摆着好看。\"\n\n女娲替泠收着，木鸟和木刻的银叶果，并排放在窗台上。\n\n青鸟还是不让女娲摸，啄了她第三年。女娲气得跺脚，泠走过去，青鸟就跳到她肩上，蹭她的耳朵。女娲控诉：\"它肯定是母的！\"\n\n\"它比你小。\"泠说，\"你让着它。\"\n\n第二年开春，泠在院子里练拳。她离开人间久了，灵力养回来了——九尾的灵力，夜里练的时候，影子会多出几条。女娲看呆了：\"你还会这个？！教我！\"\n\n\"教你翻跟头。\"\n\n\"那也行！\"\n\n教了两年，女娲学会了在云上翻跟头，泠学会了接住她。每次女娲从云上栽下来，都是泠一伸手，稳稳接住。\n\n夜里没人的时候，泠就坐在窗边，跟着晞认字。\n\n\"这是什么字？\"泠问。\n\n\"风。\"晞说，\"魔界的风，往地底下吹。\"\n\n\"这个呢？\"\n\n\"门。\"\n\n\"……门。\"泠写了一遍，\"这个字我认得。\"\n\n\"不。\"晞说，\"魔界的门，和人间的门，不是一个写法。记好——将来用得着。\"\n\n泠没问她\"将来\"是什么时候。她嗯了一声，把那个字又写了一遍。\n\n父亲每年巡人间，都会带糖人回来。第一年三个，第二年还是三个——狐狸、鸟、扎小辫的姑娘。女娲每次都把狐狸那个塞给泠。\n\n女娲十五岁生日那天，她站在院子里，对着月亮许愿。泠问许的什么，她说：\"不能说！说了就不灵了！\"——夜里泠听见她小声念叨：\"娘，你什么时候回来呀。\"\n\n她娘还是没有回来。父亲说，会回来的。\n\n日子就这么过着，一晃，两年。\n\n两年后的那个春天，父亲从人间巡查回来，脸色和往常不一样。他在院子里站了一会儿，才说：\n\n\"东境那边，不太平了。\"\n\n\"怎么了？\"女娲问。\n\n\"魔气。\"父亲说，\"这半年，边界的魔气一直在涨。村子的井水发苦，夜里地底下有响动。我回来的时候，东边起了营帐。\"\n\n\"魔界要打仗了？\"女娲问。\n\n父亲没有答。他看了她一会儿，抬手摸了摸她的头：\"……先去睡吧。\"\n\n女娲应了一声，乖乖回屋。泠站在廊下，没有动。\n\n门里，晞也没有说话。\n\n过了很久，泠才听见她开口，声音很轻：\n\n\"……要打仗了。\"\n\n\"你听见什么了？\"泠问。\n\n\"风声。\"晞说，\"魔界的风往人间吹的时候，都带着铁器味儿。我小时候，闻过一回。\"\n\n泠望着院外的云海，没有再问。那天夜里她没有睡，银叶树的亮光映在窗上，窗外的风，一夜比一夜凉。"}, {"id": 48, "title": "兵临", "content": "父亲带回消息的第三天夜里，战鼓响了。\n\n泠是被鼓声震醒的。她坐起来，听见风里夹着铁器碰撞的细响，还有远处有人在喊。她没有问，她在等晞先开口。\n\n\"……不是我。\"晞说。\n\n泠顿了一下：\"我还没问。\"\n\n\"你第一反应是这个。\"晞说，\"你不是去听鼓的。你是来找我的。\"\n\n泠没有否认。她望着窗外，银叶树还亮着：\"那他们打上来干什么？\"\n\n\"打仗。\"\n\n泠侧耳听——脚步声是四面八方散开的，有人在叫，在撞门，在问\"怎么回事\"。不是追着谁来的，是整座九重天都被惊动了。\n\n\"是冲九重天来的。\"晞说，\"不是冲我来的。\"\n\n泠站起来，还没迈步，女娲的房门开了。\n\n女娲赤着脚站在门口，一只手攥着被角：\"泠姐姐，外面怎么了？\"\n\n泠还没来得及开口，廊下已经传来脚步声。\n\n父亲从廊下快步走过来，手里握着剑，另一只手提着女娲的鞋。他蹲下，把鞋套在女儿脚上，动作很快，不温柔但很稳。\n\n\"娲儿。魔军打上来了。\"\n\n女娲还没完全清醒：\"……什么？\"\n\n\"打上来了。现在就走。\"父亲站起来，没有看泠，看的是女娲，\"走，跟着她。她认得路。\"\n\n女娲终于醒了。她一把攥住父亲的袖子：\"爹一起走！\"\n\n\"爹不走。\"\n\n\"那我也不走！\"女娲攥得更紧了，\"爹不走，我哪也不去！\"\n\n\"娲儿。\"父亲说。\n\n\"我不听！我不走！爹不走就是不走！\"\n\n父亲低头看着她，没有吼她。他只是把手从她手里抽出来，动作不快，像在做一件他早就知道要做的事。然后他转向泠，声音不高，但很清楚：\n\n\"泠。带她走。\"\n\n泠没有说\"好\"，没有说\"快\"。她上前一步，把女娲从父亲身边拉开。女娲挣扎了一下，泠没有松手。女娲回过头，看见父亲已经转过身，把剑完全拔了出来，银白的刃光映着烧起来的银叶树。\n\n\"爹——！\"\n\n\"走。\"父亲没有回头，\"别回头。\"\n\n泠拉着女娲跑过火，跑过云路断裂的边缘。路上撞见一队黑甲，泠把女娲往身后一藏，九尾的灵力在火光里炸开，影子一分为七。她没有恋战，一掌推倒挡路的黑甲，拉起女娲就跑，跑出去很远，才听见身后那队魔军没有追上来。\n\n\"晞姐。\"她喘着气，\"云海下面，是人间吗？\"\n\n\"是。\"晞说，\"抱紧她。\"\n\n她们跑到云海边上。泠握住女娲的手，往前迈了一步，落了下去。暗红的光从她左肩涌出来，托住她们，坠势缓了一瞬。\n\n\"别怕。\"晞说，\"落下去，是人间。\"\n\n她们落在青丘的地界上。青草没过膝盖，天上没有云路，只有月亮。泠背着女娲走了一夜，走到村口那扇门，敲了敲。娘开门的时候，看见泠，看见她背上的天族姑娘，青鸟落在她肩上——那些事就不必问了。\n\n\"进来。屋里睡。\"\n\n那一夜，娘给女娲铺了床，又端了一碗热水放在床头。女娲蜷在被子里，把脸埋进枕头，肩膀一直在抖，但始终没有哭出声。青鸟守在枕边，一声不吭。\n\n泠坐在门槛上，把那只木鸟从怀里摸出来——云市那只，木刻摊主说会看家的——放在膝盖上，没有动。她攥着青鸟尾羽的环，攥了很久。\n\n\"……到家了。\"晞说。\n\n\"……三年了。\"泠说。\n\n\"你爹娘，没问你为什么回来。\"\n\n\"……他们没问。\"\n\n\"……会打多久？\"泠问。\n\n\"不知道。\"晞说，\"打仗这种事，没有人知道会打多久。\"\n\n\"那她爹——\"\n\n\"九天长老。\"晞说，\"挡得住最好。挡不住——\"她停了一下，\"她迟早会知道的。\"\n\n天快亮的时候，女娲从屋里走出来，站在泠身边。晨光从青丘的山尖漫过来，照在她的肩膀上。她的眼睛肿着，但没哭，也没有问\"我爹怎么样了\"。\n\n她问：\"泠姐姐，青鸟的尾巴，烧焦了。\"\n\n泠伸手，碰了碰那截焦边：\"它跟着你跑了一路。\"\n\n\"它还会长好的吗？\"\n\n\"会的。\"泠说，\"鸟的羽毛，会重新长。\"\n\n女娲蹲下来，摸了摸青鸟的尾羽，没有再说别的。晨光把她的影子投在泠的背上，长长的，像一个人站在她身后，看着她们。\n\n泠没有回头。她把那只木鸟收进怀里，拍了拍衣摆上的草屑，站起来。\n\n\"晞姐。\"\n\n\"……在。\"\n\n\"我们就在这儿住下了。\"\n\n\"……住下吧。\"晞说，\"日子还长。\"\n\n天亮透的时候，青鸟飞走了。它没有叫，也没有回头，朝着北边，飞过青丘的山尖，很快不见了。女娲站在门口，看着它走，始终没有喊它。她脚边落着一根青色尾羽，细细的——风往北边吹，把那根羽毛吹得竖起来，像一根牵出去的线。"}, {"id": 49, "title": "青鸟的信", "content": "到青丘的第十四天，泠把能想到的办法都用完了。\n\n翻跟头。女娲翻了半个，歪在地上，不起来，也不笑。学狐狸叫，九条尾巴在身后摇成一片雪白——女娲看了，嘴角动了动，没笑出来。糖饼，她做了三回，女娲吃，认认真真地吃，吃完把手指头舔干净，然后坐着，看溪水。\n\n泠又带她去溪边看鱼。鱼在浅水里摆尾巴，白花花的一片。女娲看了一会儿，问：\"泠姐姐，仗打完了吗？\"\n\n泠答不上来。她摸出怀里那只木鸟，又放回去。\n\n\"晞姐。\"夜里，泠躺在草席上，\"我该拿她怎么办。\"\n\n\"等。\"晞说。\n\n\"等到什么时候？\"\n\n\"等到有消息的那天。\"晞说，\"她不是不想笑。是她爹还没消息，她不敢笑。\"\n\n女娲整日坐在门口，手里攥着那根青色细羽，一遍一遍地摸。娘给她盛饭，她吃；娘问她冷不冷，她说\"不冷\"；其余的时候，她坐着，看村口的云。\n\n第十六天黄昏，青鸟回来了。\n\n一声鸟叫，青色影子穿过晚霞，落在院墙上。女娲猛地站起来，凳子带翻了，她没管。她看见青鸟脚上绑着一截细竹管——她认得，那是房叔的竹管。以前在长老府，房叔给父亲送信，用的就是这种竹管。\n\n青鸟跳下墙头，落在她肩上，蹭了蹭她的脸，像是说：我回来啦。\n\n女娲没动。泠上前，取下竹管，拧开。里面一卷纸，纸很薄，字很小，一笔一画，写得很稳——房叔的字。\n\n泠把纸卷放进女娲手里。\n\n女娲低头，指尖压着纸角。\"娲儿见字。青鸟回来了。你平安，我就放心了。\"\n\n她的手抖了一下。她往下看，看得很慢。\n\n仗打了十一天。魔军攻上九重天，烧了半条云路。天君调兵，把他们打回了云海那边。退了。九重天还在，长老府还在，银叶树烧了半边，根还活着。\n\n\"你爹，守的是云海边上那段。魔军退了，他没有退。他最后一步，踏在云海边上。碑立在云海边上，朝着人间——朝着他最后看的方向。他想看的，是人间。是你。\"\n\n女娲没有哭。她读第二遍。\n\n\"你爹随身那根银链子，我收在府里了，等你回来拿。天界稳了。你要是想回来，就回来。府里，我给你收拾好了。\"\n\n\"你娘那边……还没有消息。我再打听。别急。\"\n\n女娲读第三遍。读到\"你娘那边\"的时候，她停住了。她把纸贴在胸口，弯下腰，哭了出来。\n\n不是这十几天那种闷在胸口里的抖。是哭出声，一声一声，像要把攒着的东西全倒出来。她喊：\"爹——！\"喊到嗓子哑了，还在喊。\n\n泠蹲下来，抱住她。女娲揪着她的衣襟，哭了很久很久。青鸟站在她肩上，一动不动。娘站在屋门口，没进来，站了一会儿，转身进了灶房。\n\n天擦黑的时候，女娲不哭了。她把信叠好，叠得方方正正，收进怀里，贴着心口。\n\n\"泠姐姐。\"她的声音还是哑的，\"我要回去。\"\n\n泠看着她。\n\n\"我爹的碑，朝着人间。\"女娲说，\"我要站在碑前，告诉他，我回来了。房叔说天界稳了——我回去看看我爹，看看房叔，看看那棵还活着的银叶树。\"\n\n\"我跟你回去。\"泠说。\n\n女娲看着她，看了很久。她知道泠背上有一道门，门里住着谁。天界对她姐姐来说是什么地方，她们都知道。\n\n\"可是晞姐姐——\"女娲说。\n\n门里安静了很久。久到女娲以为她不会答了，才听见晞的声音，很轻：\n\n\"……你爹的事，要紧。天界的事，到了再说。\"\n\n女娲低下头，攥着那根细羽，攥得很紧。青鸟从她肩上跳下来，在她脚边走来走去——尾巴上那截焦边旁边，长出了几根新的小羽，嫩嫩的青色。\n\n女娲蹲下来，摸了摸：\"你也回来了。\"\n\n\"飞走的鸟，\"泠站在她身后，看着那一人一鸟，\"还会认得你。\"\n\n女娲蹲在那儿，跟青鸟说话。说房叔，说碑，说回去以后要做的事，说银叶树的新芽。她说了很久，说着说着，声音就亮了。\n\n泠站在门口，看着她的影子在灯下晃。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"她回来了。\"\n\n\"……回来了。\"晞说。"}, {"id": 50, "title": "归途", "content": "出发那天，娘往泠的口袋里装吃的，装了很多。\n\n糖饼是昨夜里烙的，果子是后院树上摘的，烤鱼干是溪里捞的，还有一包炒米。娘往里塞的时候一句话不说——塞了那么多，口袋也不见鼓。\n\n\"这口袋装不满的。\"泠说。\n\n\"知道。\"娘说，\"九尾的衣袋，装不满。\"她又塞了一把，在泠肩上拍了一下。\n\n\"路上吃。\"娘说，\"不够，捎个信回来。\"\n\n女娲站在院门口，信贴着心口放着，青鸟落在她肩上。她朝娘弯了弯腰：\"婶婶，我们走了。\"\n\n娘看着她，张了张嘴，最后只说：\"路上小心。\"\n\n两人往北走。青丘的云很慢，慢得像是特意送她们一程。\n\n走出青丘的第二天，她们看见了第一片废墟。\n\n那是云路断裂的残迹——半条烧焦的云路从天上垂下来，拖进一个村子。村子塌了半边，房梁横在路中间，灰里埋着半只碗，灶还立着，锅没了。风一吹，灰就起来，落人满身。\n\n女娲站住了，看了很久。\n\n\"这村子，以前有人住。\"她说。\n\n\"现在也有人。\"泠说，\"在往外走。\"\n\n路上确实有人在走。三三两两，从云海那边下来，衣衫破烂，脚步拖着。有老人，有孩子，有抱着包袱的女人。他们看见泠和女娲，远远站着，不过来，也不走。\n\n一个孩子蹲在路边，盯着泠的口袋，眼睛都不眨。\n\n女娲蹲下来，从泠的口袋里摸出一个果子，递过去。孩子不敢接，看了她半天。女娲把果子塞进他手里：\"吃。\"\n\n孩子咬了一口，眼泪就下来了。\n\n\"饿着的时候，吃的东西最金贵。\"女娲说，\"我爹以前巡人间，也带吃的。\"\n\n她说着，从泠的口袋里把饼一个一个掏出来，分出去。老人接了，抱着包袱的女人接了，一个缺了条胳膊的汉子犹豫了一下，也接了。他们没说话，只说\"谢谢姑娘\"。\n\n泠站在旁边，看着女娲。她看着看着，觉得那个蹲在地上分饼的姑娘，跟三天前哭着喊\"爹——！\"的是一个人，又不像同一个人。\n\n\"晞姐。\"她轻声说。\n\n\"嗯。\"晞说。\n\n\"你看她。\"\n\n\"看见了。\"晞说，停了一下，\"她爹教她的，她记住了。\"\n\n泠没再说话。\n\n分到最后，娘装的那些，一样不剩。女娲拍拍手上的碎渣，站起来：\"走。\"\n\n\"够吗？\"泠问，\"你自己还没吃。\"\n\n\"我吃过了。\"女娲说，\"早上婶婶塞给我的饼，我吃了一块。剩下的——\"\n\n她顿了顿，摸了摸心口。信还贴着那儿放着。\n\n\"剩下的，比吃的金贵。\"\n\n走出村子的时候，一个老妇人追上来，把一小把晒干的野花塞进女娲手里：\"姑娘，你爹教得好。你爹在天上，看得见。\"\n\n女娲攥着那把野花，没说话。她走回泠身边，把那把野花小心地别在泠的衣带上，像别着一枚记号。\n\n她们继续往北走。走了很远，泠回头看，那个村子还立在那儿，灰还在飘。路边的孩子举着手里的果核，朝她们挥了挥。\n\n天边，云海垂着，像一道灰白的门。\n\n女娲走在前面，青鸟跟着她，一路往北。泠摸了摸怀里——那只木鸟还在。口袋里的东西，都分完了。\n\n\"晞姐。\"\n\n\"……在。\"\n\n\"回了天界，你怎么办？\"\n\n门里安静了很久。\n\n\"……到了再说。\"晞说，\"先把她的碑看了，把链子拿了。我的事，不着急。\"\n\n泠没再问。她摸了摸左肩，那里有一道门，门里住着她姐姐。姐姐肯回去，是为了女娲；她自己的事，她向来不多说。天君赦过了，天界伤不了她们。可泠知道，姐姐的顾忌，从来不是怕。\n\n女娲走远了，回头喊：\"泠姐姐——！\"\n\n\"来了！\"泠应道，追了上去。\n\n青鸟在前头，翅膀带起风。三个人，往北走。云海越来越近，像一道垂在天边的门，等着她们推开。"}, {"id": 51, "title": "葬礼", "content": "她们过云海那天，天界的钟在响。\n\n一声，接一声，从九重天上落下来，压得云都低了。青鸟先落了地，回头叫。女娲站在云海边，看着长老院的方向——白幡挂满殿檐，风托着幡布，一片一片浮着，像天上多长了一层云。\n\n\"那是……\"女娲的声音很轻。\n\n\"你爹的葬礼。\"房长老站在她们身后，\"第七天了。我们以为你们赶不上。\"\n\n女娲的嘴唇动了动，没出声。\n\n灵堂设在长老院正殿。九天长老的灵柩停在正中，棺木银白，覆着淡金云纹幡。灵前摆着供案——一盘银果，一盘云糕，三炷香细细地烧着，香灰落下来，落在案上，谁也没扫。灵前点着一盏魂灯，火苗不大，很稳，怎么也不晃。房长老说，魂灯由亲人守着，灯不灭，魂不走。\n\n\"出殡前，亲属可以见最后一面。\"他说。\n\n女娲站在灵柩前，站了很久。她没有哭。她抬手，摸了摸棺木上的云纹，像怕碰坏。\n\n\"爹。\"她说，\"我回来了。\"\n\n泠站在殿门口，没有进去。\n\n她听见女娲说：\"你说的碑，立在云海边上，朝着人间。我看见了。回来的路上，我看见云路断了好多地方，村子的房梁烧断了，一个小孩饿得蹲在路边，眼睛都不眨。我把他喂饱了。爹，你教我的，我记住了。\"\n\n殿里安静了一会儿。然后女娲哭了。\n\n她没有憋，也没有躲，趴在棺木上哭出了声，一声比一声大，最后哭得蹲下去。泠走进殿里，蹲在她旁边，把她抱住。女娲把脸埋进她肩上，整个人都在抖。\n\n\"泠姐姐，\"她哭着说，\"我爹……我爹他……\"\n\n\"我知道。\"泠说，\"我知道。\"\n\n\"他说走，别回头。\"女娲说，\"我没回头。可我走再远，都走不到他那儿了……\"\n\n泠没说话。她抱着她，一只手拍她的背，一下，一下。\n\n殿门外，有长老经过，步子慢下来，目光落在她们身上。\n\n\"那白发的……是妖族？\"\n\n\"九尾。听说天君赦过。\"\n\n\"这种场合，怎么来了一只狐狸。\"\n\n\"女娲那丫头……跟她抱在一起。\"\n\n声音不大，但灵堂太静，泠听得清清楚楚。她没有抬头，也没有松手，只是把女娲抱得更紧了些。\n\n门里，晞没有出声。但泠知道她在。那扇门里有一道很静的气息，压在她背上，像一只手按着，不让她的腰弯下去。\n\n当晚，房长老在府上给她们收拾了一个小院子，被褥是新换的：\"烧了头七的纸，再走也不迟。\"女娲应了。\n\n夜里，女娲没有睡。她又回到灵堂，跪在灵前守魂灯。泠陪在旁边，跪着。青鸟蹲在灯边，羽毛被火光镀成暖色。\n\n灯油浅下去的时候，女娲把油壶拎过来，给灯添油。她添得很慢，一滴一滴，怕添急了，火苗会跳。添完了，又用指头肚把灯芯挑了挑，让火苗亮一点。\n\n\"灯不灭，魂不走。\"她小声念，\"爹，我不困，我守着。\"\n\n她守了一会儿，又从灵前拿起一叠纸钱，一张一张，放进火盆里。纸灰打着旋往上飘，飘到灵柩上方，散开。泠没见过天界的纸钱——白纸剪成一串串小花瓣，烧起来没有烟，只发光。光落在女娲脸上，忽明忽暗。\n\n\"泠姐姐，\"女娲说，\"我娘没来。\"\n\n泠不知道该说什么。\n\n\"她是不是不知道？\"女娲说，\"还是她不想来？\"\n\n门里，晞也没有说话。魂灯的火苗晃了一下，又立住了。\n\n后半夜，女娲没有睡，也没有走。她跪在灵前，膝盖跪麻了，就换一条腿。她望着魂灯，小声说：\"爹，我还有话，没跟你说。\"说了一遍，又说一遍。\n\n泠心里那根弦动了一下。她听见自己问门里：\"晞姐。\"\n\n\"……你疯了。\"晞说。\n\n\"就几分钟。\"\n\n\"灵力耗空，你会——\"\n\n\"我知道。\"泠说，\"可她没来得及道别。\"\n\n门里静了一会儿。晞没有再说话。\n\n泠走到灵前，跪下去，把双手拢住魂灯。她的灵力从四肢百骸往指尖涌——九尾的灵力，白得发亮，灯影里，她身后的影子铺开，一条、两条，像有什么东西在影子里舒展。她把那些灵力，一滴不剩，渡进魂灯。\n\n魂灯的火苗涨起来。火里浮出一个人的影子——白袍，银发束得整整齐齐，站在火里，像刚从很远的地方走回来，低头看见跪在地上的女儿。\n\n\"……娲儿。\"\n\n女娲整个人都在抖。\"爹！\"\n\n\"你怎么……\"父亲的声音像隔着很远的水，\"你瘦了。\"\n\n\"我没瘦！\"女娲哭着笑，\"爹你看，我长高了！\"\n\n父亲看着她，看了好一会儿，点了点头：\"……长高了。\"他顿了顿，\"碑立在云海边上，朝人间。爹站得高，看得见你回家的路。\"\n\n\"爹，\"女娲说，\"我明天送你。我不哭。\"\n\n\"哭也不丢人。\"父亲说，\"……娲儿，云市那个糖人摊，爹还欠他一个铜板。你哪天下人间，替爹还了。\"\n\n\"好！我记着！\"\n\n父亲的影子淡下去。他最后看了女娲一眼，又看了泠一眼——泠跪在地上，脸色白得像纸。他没有说破，只说：\n\n\"……多谢。\"\n\n话音落，身影散进火里。灯焰落回原来的大小，稳稳的。\n\n泠收回手的时候，眼前一黑。她听见女娲喊\"泠姐姐\"，听见自己倒下去的声音。她没有摔在地上——女娲接住了她，抱得稳稳的，像她接住从云上栽下来的女娲那样。\n\n\"泠姐姐！泠姐姐！\"\n\n门里，晞没有出声。可泠在半昏半醒里，听见门里那口气，长长地，叹了出来。\n\n女娲把泠抱回屋里，放到床上，掖好被角。泠昏昏沉沉睡着——出殡那天，是女娲一个人送的。\n\n第八天出殡。\n\n天还没亮透。女娲跪在灵前，最后拜了三拜。她从供案上取过一盏小灯，就着魂灯的火引亮了，捧在手里——这是要带到碑前的长明灯。房长老说，头七之前，碑前的灯不能灭。\n\n启灵的时候，八名天族力士齐声喝了一礼，把灵柩抬上肩。女娲把棺前那条白幡解下来，系在自己腕上，捧着魂灯走在最前面，青鸟落在她肩上。长老们跟在后面，钟一声接一声地敲。\n\n云路很长。力士们走得很稳，一步一步，踏得云路发颤。女娲走在最前头，不时从怀里掏出一把白纸剪成的花瓣，往路两边撒——天界的引路纸。风托着它们，一朵一朵，顺着云路的方向飘，往云海那边飘。\n\n走了很久，走到云海边上——那里已经立着一座碑，朝着人间。\n\n灵柩入土的时候，女娲没有哭。她蹲下来，从怀里掏出那把晒干的野花——老妇人塞给她的那把——放在碑前，放得端端正正。又从力士手里接过一捧云土，撒进墓坑里，撒了三把。然后她跪下来，把引了火的小灯放在碑前，火苗立住了，稳稳的。\n\n\"爹，\"她说，\"有人认得你。她跟我说，你爹教得好，你爹在天上，看得见。\"\n\n风从人间那边吹上来，拂过碑，拂过野花，又往上走。女娲抬起头，看着天，很久很久。\n\n出殡那天夜里，女娲坐在泠床边，没有点灯。泠醒过来的时候，屋里很暗，只有窗外的天光。\n\n她动了一下。女娲猛地抬头：\"泠姐姐！\"\n\n\"……醒了。\"泠说，嗓子哑。\n\n女娲没说话，扑过来把脸埋进泠的被子里，肩膀一抽一抽，哭得说不出话。\n\n泠抬手，摸了摸她的头发：\"……哭什么。我还没死。\"\n\n\"你吓死我了！\"女娲抬起头，脸上全是泪，\"你为了我，把自己弄成这样——\"她吸了吸鼻子，\"我爹……我爹跟我说了话。我本来以为，这辈子再也听不到他说话了。\"\n\n\"……听见了就好。\"泠说。\n\n\"我爹最后说，多谢。\"女娲说，\"我也要谢你。谢谢你，泠姐姐。\"\n\n泠被她看得不自在，别开脸：\"……举手之劳。九尾的灵力，睡两天就回来了。\"\n\n\"骗人！\"女娲哭着说，\"你睡的时候，我摸你手，都是凉的！\"她说着又哭起来，\"你对我这么好，我、我以后天天给你买糖人！\"\n\n泠没忍住，笑了一下：\"……那你爹欠糖人摊的那个铜板，记着还。\"\n\n\"记着呢！我记一辈子！\"\n\n女娲哭累了，趴在泠床边睡着了。睡到半夜，梦里喊了一声\"爹\"。\n\n门里，晞一直没有出声。可泠知道，那扇门里的气息，是软的。\n\n起初那两天，泠没出过屋门。灵力空得像被掏过的口袋，她走两步就腿软，只能躺着，或是坐在窗边。女娲白天去碑前烧纸，天黑了回来，进院门先往泠屋里看一眼——泠坐在窗边，看着女娲从院门口走进来，进了屋，灯亮起来，才收回目光。\n\n泠坐在窗边，看着外面的天界。星子很亮，比人间的亮。她听见门里一声：\"……她娘，没来。\"——晞说的。\n\n\"嗯。\"泠说，\"你也觉得奇怪？\"\n\n\"不奇怪。\"晞说，\"来了才奇怪。\"她停了一下，\"……睡吧。明天还有纸要烧。\""}, {"id": 52, "title": "鱼", "content": "泠醒来的第三天夜里，灵力总算养回来一些，人也没那么倦了。她正要吹灯，女娲才刚合眼不久。院子里落下一道影子。\n\n她没动。影子在外面站了一会儿，没有叩门，往门缝里塞进一张纸条。\n\n泠捡起来，就着灯看。纸上只有三个字：跟我走。\n\n她看了一眼床上的女娲——睡得浅，眉还皱着，像随时要醒。泠替她掖了掖被角，出门。\n\n引路的内侍站在院墙外，走得很轻，像怕踩响云。泠一路没问。到了天君殿前，内侍停住，抬手：\"姑娘请。天君在里头。\"\n\n殿门开着。灯亮着。天君站在灯下，背对着门，听见脚步声，转过身来。\n\n\"你来了。\"他说。\n\n\"她不肯来。\"泠说。\n\n\"我知道。\"天君说，\"我请的是你。烦你替我问她一句——这些年，她过得好不好。\"\n\n泠站了一会儿，像是在听什么。半晌，她开口：\"她说，不见。\"\n\n\"那劳你再问一句——\"天君说，\"银叶树结果了。她还记得那个味道吗。\"\n\n泠又等了一会儿：\"她说，不记得。\"\n\n天君没再说话。他看着泠，看了很久，开口说：\"你饿不饿？\"\n\n泠眨了一下眼。\n\n\"云鲤。\"天君说，\"厨房清蒸的。\"他朝殿后抬了抬下巴。内侍会意，端出一只银盘——两条鱼，白生生的，卧在清亮亮的汤里，热气淡淡地往上走。\n\n泠看着那两条鱼。\n\n门里，晞说：\"……别吃。\"\n\n泠坐下来，拿起筷子。\n\n她夹起一块鱼肉，在嘴边停了停，又放回盘子里。\n\n再夹，再停，再放下。\n\n门里没有催她，也没有说话。\n\n第三次，她才把鱼肉送进嘴里——很嫩，入口即化。她想起女娲在路上那句话——\"剩下的，比吃的金贵\"。那姑娘把饼都分了出去，自己饿着。她吃了几口，就放下了筷子。\n\n\"我吃饱了。\"她说。\n\n\"她说了什么？\"天君问。\n\n泠擦擦手：\"她说了，不见。不记得。就这两句。\"\n\n\"那你替我告诉她，\"天君说，\"鱼是给她吃的。你吃了她的鱼，她欠我一个人情。\"\n\n泠看着那盘只动了几口的鱼，想了想，说：\"她不出来。你跟我说再多，也没用。\"\n\n\"你肯让，她就出得来。\"天君说。\n\n泠没答。她坐回椅子里，垂着眼，过了一会儿，闭上眼睛，往后靠了靠——在心里说：晞姐，去吧。鱼都吃了，你就听听他说什么。\n\n门里静了一息。\n\n再睁开眼的时候，她脸色更白了。她坐得很直，瞳色是暗红的。\n\n\"……几条鱼，就把你卖了。\"天君说。\n\n晞扫了一眼桌上的鱼骨头，没看他：\"是她卖的。\"\n\n天君没有笑。他看了晞好一会儿，才开口，声音比刚才低：\n\n\"她倒是跟你亲。\"\n\n晞没有动。殿里静了一会儿。天君走到窗边，看着外面的云，开口了。\n\n\"我第一次见你，你在边界线上站着。我以为你是来踩线的魔兵，走近了才发现，是个比我还矮的小丫头。\"他说，\"你问我那边是什么。我说，是天界。你说，知道，天界的风和你那边不一样——你说你常来听风。\"\n\n晞没有动。\n\n\"后来我带你爬云。你胆子大，爬到最高那朵上坐着，说星星近得能摘。\"他说，\"我就去摘。摘下来给你，你说，甜的都给你。你记得吗。\"\n\n\"……不记得了。\"晞说。\n\n\"你记得。\"天君说，\"你记得，所以你十七年没来过天界，宁可在云海下面听钟。\"\n\n晞不答。\n\n\"长老发现那天，我跪在长老院门口。\"天君说，\"我求他们——我说她只是来玩的，她不知道规矩。我哭了。我那时候才多大，当着那么多长老的面哭，把袖子都哭湿了。后来我再没哭过。\"\n\n他说完这句话，殿里静了很久。\n\n\"你坠下去那晚，\"他说，\"我以为是天族动的手。我查了十七年。查到最后，没人动手，是你自己走的。\"他转过身，看着晞，\"我有时候想，你要是肯来问我一句——哪怕问一句——\"\n\n\"问什么。\"晞说。\n\n\"问我，\"他说，\"还认不认得你。\"\n\n晞看着他，看了很久。她的眼睛是暗红色的，在灯下像两粒凝住的火。\n\n\"……认得。\"她说。\n\n天君没有再说话。他站在那里，像是十七年都白站了，就等这一句。\n\n过了一会儿，晞说：\"她还在后院睡着。我该回去了。\"\n\n\"明天还来吗。\"天君问。\n\n\"不来。\"晞说。她走到殿门口，停了一下，\"鱼，是给她吃的。人情，算我的。\"\n\n第二天早上，泠在自己床上醒过来，脖子酸。她坐起来，想了想昨晚的事——那鱼是清蒸的，挺嫩。然后她想起来，自己把人卖了。\n\n\"晞姐。\"她喊。\n\n\"……在。\"\n\n\"她跟你说什么了？\"\n\n门里安静了一会儿。\n\n\"说了些旧事。\"晞说。\n\n\"什么旧事？\"\n\n\"不告诉你。\"\n\n泠望着窗外。天界的天很亮，银叶树在风里沙沙地响。她摸了摸左肩——门里很静。晞没有说话，可那份静里，有什么东西缓了下来，像攥了很久的，松开了。"}, {"id": 53, "title": "年长", "content": "头七那夜，纸烧到后半夜。\n\n火盆里最后一张纸蜷起来，亮了一下，塌成一片灰。女娲蹲在盆边，等火彻底灭了，把灰拢进布袋，扎紧口，放在朝南的窗台上。房叔说，头七的纸灰要收好，亲人夜里会回来看看。\n\n\"爹。\"她对着窗台说，\"我收好了。\"\n\n泠站在门边，没有进去。\n\n第二天一早，房叔把一个木匣子放到她面前。匣子旧了，角上磨得发白。打开，里面躺着一根银链子——链身细，坠子是一颗银色的珠子，珠子里封着一点淡金的光。\n\n\"你爹随身的。\"房叔说，\"他说过，这链子给你留着——等你长大，自己来拿。\"\n\n女娲拿起链子，绕了两圈，戴在左手腕上。坠子垂下来，贴着手背。\n\n\"大了。\"她说，\"我来拿！\"\n\n日子就这么过下去。女娲在长老府住下了，跟着房叔学看文书，学着管云海的边报。泠研墨，她写字。\n\n她十六岁那年，比泠矮半头。走路总是跑着追，追上了，仰着头跟泠说话，说急了还蹦一下。\n\n\"泠姐姐，你看这个！\"她举着边报蹦起来，\"云路又修好一段！\"\n\n泠接过去看，看完了说：\"嗯。写得好。\"\n\n十七岁那年开春，房叔给她量衣裳，量完说了一句：\"娲儿长个了。\"女娲没当回事。直到有天她站在泠身边照铜镜，才发现——她们一样高了。\n\n\"泠姐姐！\"她拉着泠比，\"一样高了！我长到你了！\"\n\n泠看了看镜子里那两个影子：\"……嗯。\"\n\n\"你说句话呀！\"女娲急了，\"我是不是长高了好些！\"\n\n\"长高了。\"泠说，\"再长三年，就比我高了。\"\n\n\"骗人！我现在就比你高！\"女娲踮起脚，\"看！\"\n\n泠没理她，伸手把她翻卷的衣领按平，又把她翘起来的头发丝压下去：\"长个了，站相也要学。\"\n\n十八岁那年，女娲真的比泠高了。不是踮脚那种高，是实实在在的，高出小半个头。她站在泠身边，肩线错开，低头，能看见泠的发顶。\n\n\"泠姐姐，你看！\"她低头看着泠，美滋滋的，\"我给你挡着太阳！\"\n\n\"云上哪来的太阳。\"泠说。\n\n\"那你就是承认我高了！\"\n\n\"……没承认。\"\n\n\"没承认我也高了！\"女娲在她头顶比划，\"这儿！我比这儿还高一点！\"\n\n泠抬手，按住她的头顶，往下一压。女娲被压得矮下去，又挣起来：\"你耍赖！\"\n\n泠收回手：\"长多高，都是你耍赖。\"\n\n女娲笑倒在云上。\n\n十九岁那年，她高出泠一个头还多。天族的姑娘长起个来，挡都挡不住——房叔给她做的新衣袍，第二年春天就短了一截，袖子短了，衣摆短了，她站在泠身边，像一棵小银树挨着一株白草。泠跟她说话，得仰起头；她听泠说话，得低下头。从前她仰着头追着泠跑，如今轮到泠仰着头看她了。\n\n\"别弯着腰跟我说话。\"泠说，\"你弯腰，我更矮。\"\n\n\"那你站高点！\"\n\n\"我站多高，都没有你高。\"\n\n\"哈哈哈哈——\"女娲笑完，蹲下来，蹲到和泠一样高，认真地说：\"那我蹲着跟你说话，公平了吧？\"\n\n泠看了她一眼，没忍住，笑了一下。她抬手，摸了摸女娲的头顶——她蹲着，正好够得着：\"……行了。站起来吧。云路都被你挡了。\"\n\n那天夜里，女娲把短了一截的新衣袍脱下来，搭在椅背上，睡下了。第二天一早，她拎起衣袍一看——衣摆被人接长了一截，针脚细细的，接得端端正正，看不出缝过的样子。\n\n\"泠姐姐，你缝的？！\"\n\n\"嗯。\"泠说，\"短了不体面。\"\n\n\"你还会缝衣裳？\"\n\n\"会。\"泠说，\"以前在人间，给家里人缝过。\"\n\n女娲抱着衣袍，看了又看，忽然说：\"泠姐姐，往后你穿我的旧衣裳，都归你改。\"\n\n\"……我不穿你的旧衣裳。\"\n\n\"改好了给我穿！\"女娲说，\"我长太快，一年一件，房叔都嫌我费布了！\"\n\n那三年，女娲学文书学得很快。房叔说，她写的字比长老院的老吏还齐整。云海的边报，哪段云路修了，哪片云塌了，哪家商船过了界，她一条一条记，记完自己再看一遍。\n\n头一回进长老院，是跟着房叔去送文书。九重天的长老院，比她爹的灵堂还安静。她站在廊下等，有长老路过，看了她一眼，又看了一眼：\"九天长老家的丫头？\"\n\n\"是我。\"女娲说，\"我爹叫九天长老，我叫女娲。\"\n\n\"知道。\"长老说，\"你爹的位置，还空着。\"\n\n\"嗯。\"女娲说，\"等我接。\"\n\n长老看了她一眼，没再说话。她爹的碑立在云海边上，她隔些日子就去一趟，放一捧野花，说几句话。有时候说：\"爹，今天云海有风。\"有时候说：\"爹，糖人摊那个铜板，我记着呢。等我哪天下人间，去还。\"\n\n银叶树烧了半边，靠南的枝又发了新芽，一年一年，长回了原来的样子。她娘种的树，还在等她娘回来。她娘还没回来。\n\n青鸟还是停在女娲肩上——以前她矮，青鸟要低头够她；现在她高了，青鸟落在她肩上，像落在一截小枝上，挺自在。\n\n她翻跟头。十六岁那年她翻，泠在旁边接着，接了一回又一回；十八岁那年她翻，稳稳落地，拍着手喊\"不用接了！\"——有一回没站稳，栽下去，泠还是伸手，接住了她。女娲躺在她臂弯里，笑得直不起腰：\"你说了不接的！\"\n\n\"我没说。\"泠说，\"你自己说的。\"\n\n十九岁那年她翻，翻完站着，气都不喘，回头看泠——泠坐在云边，看着她，像看着一件长成了的东西。\n\n\"泠姐姐，\"女娲走过去，蹲到她面前，\"我长大了。\"\n\n\"嗯。\"泠说，\"长大了。\"\n\n\"那我爹的位置——\"女娲说，\"我能接了吗？\"\n\n泠没有答。她看着蹲在面前的女娲——十九岁的女娲，比她高一个头的女娲，蹲下来的时候，又像回到了十四岁，趴在床边问她\"晞姐姐长什么样\"的那个小姑娘。\n\n\"问你爹。\"泠说，\"你爹会答你。\"\n\n门里，晞的声音响起来，很轻：\"……她像她爹。\"\n\n女娲没听见。她站起来，拍拍衣摆：\"那我去问房叔！\"\n\n那年秋天，长老院的文书下来了：云海东段那位长老的位置，由他的女儿接任。九天长老，九个座位，她坐进了她爹那一把。\n\n交接那天，房叔把一卷文书放到她面前：\"你爹走的时候，守的是云海边上那段。如今，归你了。\"\n\n女娲把文书抱在怀里，抱得很紧。腕上那根银链子，坠子磕在封皮上，响了一下。\n\n\"爹，\"她说，\"你守过的，我接着守。\"\n\n她站起来。十九岁的女娲站在长老院的廊下，比泠高出一个头还多，银白的头发在风里扬着，像她爹年轻的时候。泠站在她身后，看着她，没有说话。\n\n\"泠姐姐，\"女娲回过头，笑了，\"走，去云海边看看。\"\n\n泠跟上去，走在她后头。她看着那道比她高的背影——长得比银叶树还快。十四岁那年，是女娲追在她后头跑，仰着头喊\"泠姐姐，等等我\"；如今，轮到她在后头，看前面那个人走。门里，晞说：\n\n\"……她像她爹。\"\n\n泠嗯了一声，快走两步，跟上了她。"}, {"id": 54, "title": "补天", "content": "女娲接任九天长老的第二年开春，天界的钟忽然敲了起来——不是报丧那种慢钟，是急的，一声接一声，压得云都低了。\n\n女娲从边报里抬起头。窗外的云海在抖，一层一层，像有什么东西在底下翻。\n\n\"房叔？\"她问。\n\n房长老站在廊下，看着天边：\"娲儿，你看。\"\n\n天边烧起来了。\n\n不是云烧，是天烧。半边天是水，半边天是火——水柱卷着云往上冲，火柱跟着烧过来，两股颜色在天上撞，撞得九重天的云路都在颤。火里有人形，水里也有人形，两个上古的神，从云海那边一路打过来，谁劝也不听。\n\n\"共工。\"房叔说，\"祝融。水神和火神，积了万年的仇。\"\n\n长老院的折子递进天君殿，天君只回了一句：随他们。\n\n\"随他们？\"女娲站在廊下，看着天边那一片火和水，\"他们打完了，云路就断了！\"\n\n\"云路断了，还能修。\"房叔说，\"上古的神打架，不是我们能劝的。娲儿，你拦不住的。\"\n\n女娲没说话。她看着那场架打了三天三夜——从云海打到九重天，从九重天打到极北。第四天，火胜了。祝融的火烧断了共工的水族，共工败走，一路退，退到不周山下。\n\n不周山是天地的柱子，自开天就立在那儿，撑着天穹，比九重天还高。天界的老人说，那山碰不得——谁碰，天就塌。\n\n共工不知道。也许他知道。他就是要撞。\n\n那一夜，九重天的人都听见一声响——从极北传来的，闷的，沉的，像整个天穹被什么撞了一下。然后，山折了。\n\n女娲正在灯下看边报，手边的茶盏先跳了一下，然后整张案桌在晃，整座长老院在晃，整个天界在晃。她站起来，奔到廊下——\n\n天塌了。\n\n天，从西北角裂开一道口子，云路断成几截，天河从裂口倾泻下来，像一条倒悬的河，直直落向人间。人间洪水滔天，冀州先淹了。地也在沉，东南的方向，能看见云海在退——地陷东南，海水倒灌。长老院里乱成一团，有人喊\"天塌了\"，有人往天君殿跑，有人瘫在廊下哭。\n\n女娲站在廊下，仰着头，看着那道裂口。天河的水还在往人间灌。\n\n\"娲儿。\"房叔走到她身边，\"这不是我们拦得住的。这是天的事。\"\n\n女娲看了那道裂口很久。\n\n\"那就补上。\"她说。\n\n她走遍了天地五方。东边采青石，南边采赤石，西边采白石，北边采黑石，中原采黄石——五色石，一色一筐，背回九重天。她站在裂口底下，掌心里拢起天火，把五色石一块一块炼化，炼成滚烫的石液，再一捧一捧，糊上那道裂缝。\n\n天火燎着她的指尖，指尖烧出血泡，血泡破了，又燎出新的。她没停。\n\n泠站在她身后，给她递石头，一块，一块。石液太烫，泠用袖子垫着接；女娲接过去，糊上去，指尖冒烟，她也不吭声。\n\n\"……歇一会儿。\"泠说。\n\n\"不能歇。\"女娲说，\"天河每灌一刻，人间就多淹一处。冀州已经没了，我不能让第二个冀州也没了。\"\n\n天君殿的钟，敲了七天七夜。九重天的人都听见了——那钟声不是报丧，是告诉他们：有人在天上补天，天会合拢的，别怕。\n\n第七天夜里，女娲把最后一块石液糊上去。裂缝合拢的那一刻，整道裂口亮了一下，像天眨了一下眼——然后合上了。\n\n天补好了。\n\n只是天从此向西北倾斜，地从此向东南陷落。太阳、月亮、星星，都往西北那边走；江河的水，都往东南那边流。世界成了如今的模样。\n\n女娲的双手全是烫伤，燎泡连成一片。泠把她的手握过来，用干净布一层一层包好。包完了，泠说：\"……手，还能用吗？\"\n\n\"能。\"女娲说，\"就是写字要慢两天。\"\n\n\"那两天，\"泠说，\"我替你写。\"\n\n女娲笑了一下。她看着自己包成粽子的手，忽然说：\"泠姐姐，冀州，淹了。\"\n\n\"我知道。\"\n\n\"大水退下去，黑龙就来了。\"女娲说，\"一条在水里翻腾的黑龙，掀船，吞人，把冀州当成了自己的水府。我补天那几天，它已经吃了三个村子。\"\n\n\"长老院派过人，\"房叔在旁边说，\"过不去那片水。那水是黑的，船下去就翻。\"\n\n女娲看着泠，看了很久：\"泠姐姐，你去...杀了那条龙。\"\n\n泠看着她。二十岁的女娲，九天长老，坐在她爹坐过的位子上，腕上那根银链子坠着淡金的珠子——她说话的样子，和她爹当年说\"带她走\"的时候，一模一样。\n\n\"……好。\"泠说。\n\n夜里，泠收拾东西。水漠、白狐玉佩、银狐狸项链。她摸了摸左肩：\"晞姐。\"\n\n\"……嗯。\"\n\n\"我去杀龙。\"\n\n\"嗯。\"晞说，\"我听见了。\"她停了一会儿，\"那条龙盘着的水，底下有东西。你到了，先听水，再下河。\"\n\n\"你听过冀州的水？\"\n\n\"没去过。\"晞说，\"魔界的水，和它一个味儿。\"\n\n泠的手顿了一下，没再问。\n\n云海边，女娲来送她。风把她的银发吹起来，她站在她爹的碑旁边，像她爹站了半辈子那样站着。\n\n\"杀完就回来。\"女娲说。\n\n\"嗯。\"泠说，\"杀完就回来。\"\n\n她走下云路，往人间冀州去。身后，女娲站在云海边，看着她走远，腕上银链子的坠子磕着链身，一下，一下。"}, {"id": 55, "title": "杀龙", "content": "冀州的水，是黑水。\n\n泠下了云路，落在一片泥地上。大水退过，地还是湿的，一脚踩下去，半尺的泥。远处有残破的屋顶，有倒下的树，有没来得及收的尸——洪水过后，冀州就成了这个样子。再远处，一条大河横着，水是黑的，一动不动，像一条死蛇盘在平原上。\n\n岸边蹲着几个逃难的人，看见她，先是一惊，看清是个年轻姑娘，又松了口气。一个老船夫问她：\"姑娘，你要过河？\"\n\n\"过。\"\n\n\"过不得。\"老船夫指着黑水，\"水里有东西。上月一支船队，十艘，下去就没了。船是翻的，人是被拖下去的——水底有东西拽。\"\n\n泠站在岸边，看着那片黑水。水很静，静得不对——大水退后，河应该还在流。这条河不流。它像一口憋着气的井，表面是黑的，底下有东西在喘。\n\n\"先听水，再下河。\"晞在门里说。\n\n泠蹲下来，把耳朵贴到水边——她不是用耳朵听的。她贴水听线：线流是乱的，水底有一大团东西盘着，呼吸，一呼一吸，隔得很久。它盘在最深处，像一只睡着的兽，但它的呼吸是醒的——那团线流里，带着一缕一缕的黑气，往上游。\n\n\"晞姐。\"泠说，\"这水，跟你说的一个味儿。\"\n\n门里静了一会儿。\"……嗯。魔界的味儿。\"\n\n泠站起来，没急着下河。她沿着河走，走了半日，把黑水从头看到尾——它从冀州南边来，尽头是一道裂开的地缝，水从那缝里涌上来，黑的就是那一段。她想起来了：天塌那天，地也裂过。天补上了，地缝没有。\n\n\"它从缝里来的。\"泠说。\n\n\"嗯。\"\n\n\"吃过人了。\"\n\n\"嗯。\"\n\n泠在缝边站了一会儿，忽然开口：\"晞姐。\"\n\n\"嗯。\"\n\n\"我想跟你一起打它。\"\n\n门里没有立刻回答。泠又说：\"不是打不过它。是我……想跟你一起。\"\n\n\"……知道。\"晞说，\"那你去叫它出来。\"\n\n泠拔出水漠，反握，贴着水面掠出去。刀锋点水，水面上点开一圈一圈的纹。她到河心，站定，把刀往水里一送——\n\n水开了。\n\n先是河心鼓起一个山丘，黑水从丘顶裂开，水柱冲天而起，像把整条河竖了起来。龙从那水柱里出来——黑鳞，一片一片，大如席，每一片都往下滴水；龙头先出，须是黑的，眼是混浊的金，眼缝里一条竖着的瞳，扫过岸边，逃难的人连滚带爬地往后跑，喊都喊不出来。\n\n龙对着泠，张开嘴。喉咙里是黑的，像一口井。黑水从它喉咙里喷出来，浇向河岸——水落在地上，草立刻焦了。\n\n泠往左一闪，残影还留在原地，黑水把残影冲散了。她贴着水面再掠，刀反握，一刀，从龙头侧面切过去——刀刃划过黑鳞，擦出一溜火星。鳞太厚，刀切不进，只是留了一道白印。龙低吼，龙尾横扫，水柱跟着卷来，泠翻身避开，落回岸边。\n\n\"鳞硬。\"她说。\n\n\"鳞软的地方在颈下。\"晞说，\"喉下三片鳞，是白的。\"\n\n\"你听出来的？\"\n\n\"猜的。\"晞说，\"它从缝里来，往缝里长，喉下护不了那么全。\"\n\n泠看着那条龙。它盘回河心，黑水拢上来，又成了那条死蛇。它不怕她——它吃过人，见过血，一个拿刀的姑娘，它没放在眼里。\n\n\"晞姐。\"泠说。\n\n\"嗯。\"\n\n\"来。\"\n\n右手手背的印记亮了，一道暗红的细纹，从指尖一路亮到手腕。晞从那里出来，站在泠身边——一样的银白发，一样的白衣服，只有瞳色不同：暗红，暗到发黑的红。\n\n黑水动了。\n\n那条盘着的龙，龙头忽然压低了，黑水像见了火，从晞脚边往两边退，露出河底的黑泥。龙盯着晞，混浊的金瞳里，竖瞳缩成一条线——它不吼了。\n\n\"它认得你。\"泠说。\n\n\"它认得这个颜色。\"晞说。\n\n她往前走，一步步，踩在黑泥上。黑水不敢近她。她抬手，暗红的灵力从她掌心漫出去，像潮，贴着河面铺开，从四面八方拢向河心——龙想退，暗红的潮已经锁住它的颈，一根一根，嵌进鳞缝里，锁链勒紧，龙颈被按下去，按进黑水里。\n\n龙挣，整条河在抖；挣不动。暗红的锁链嵌进鳞里，鳞片崩开，露出底下的白肉。\n\n\"去吧。\"晞说。\n\n雨开始落了。\n\n冀州的水汽，全站在泠这边——雨点砸在黑水上，砸起一层白雾。泠的九条尾巴全开，银白的，在雨里张开，像一把撑开的白伞。她的刀上凝着水，反握，贴着雨幕掠出去——白影过处，水漠的刃口亮了一下，从龙颈下那三片白鳞切进去，一刀到底，剖开半个龙腹，然后她不停，不回头，掠出十丈，站定。\n\n龙没有立刻倒。\n\n它抬起头，金色的眼望着天，望着雨，望了很久——然后它往下沉，沉进黑水里。黑水翻了一会儿，平了。\n\n水清了。\n\n黑水退下去，露出河底的泥。那道地缝还在，水还在往上涌，但涌上来的水，是清的。逃难的人从泥地里爬起来，看着河，看着水里，有人跪下去，有人哭，有人喊\"水清了！水清了！\"——没有人看见泠和晞。\n\n泠站在缝边。晞蹲下去，看着那道缝——丈宽的裂口，黑在底下，像一口没有底的井。井底有声音，极轻的，像风，又像呼吸。\n\n\"天塌那天，这儿也裂了。\"晞说，\"天补上了，这口子没人补。\"\n\n她把手伸进缝里，暗红的灵力沉下去，一层一层，把黑压下去，结了一层膜，盖在缝口上——膜是暗红的，像一道疤。\n\n\"封不死。\"她说，\"撑几年。\"\n\n\"几年后呢？\"\n\n\"水还会黑。\"\n\n\"那我再来。\"泠说，\"杀到它不敢黑。\"\n\n晞站起来，看着她，看了很久。\"……嗯。\"\n\n雨停了。冀州的天空还是阴的，但水是清的。\n\n泠摸了一下左肩：\"晞姐，你回去歇着吧。分身费我的灵力，今晚我得多吃一碗饭。\"\n\n\"……嗯。\"\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"刚才那刀，帅吗？\"\n\n\"……帅。\"\n\n\"你锁住它的时候，也帅。\"\n\n\"……嗯。\"\n\n晞回了门里。泠站在河岸边，听着水——水声是清的，好听的，像什么都没发生过。但缝底那层暗红的膜底下，隔很久，传来一声极轻的响，像什么东西在深处翻了个身。\n\n她没告诉晞她听见了。\n\n她蹲下来，把耳朵贴在清水的边上，听了一会儿。然后她说：\"晞姐。\"\n\n\"……嗯。\"\n\n\"水底下，还有东西。\"\n\n门里很久没有声音。然后晞说：\"……别听。\"\n\n\"嗯。\"泠说，\"我不听了。\"\n\n她站起来，把水漠收好，往冀州城里走去。身后，那条河安安静静地流着，水是清的；只有河底那道缝，隔很久，无声地动一下，像一只闭着的眼。"}, {"id": 56, "title": "重逢", "content": "# 第56章 重逢\n\n冀州的水，清了。\n\n黑水退去之后，河底露出来，泥是黑的，晒了几日，长出第一茬青草。泠在冀州城住了半个月，帮人修了两间屋，挖了一条渠，又看着逃难回来的人，在原先的田埂上重新种下庄稼。没有人认得她。龙死那天，水清那天，没人看见她——她站在人群之外，看他们跪下来，喊水清了。\n\n\"该回去了。\"晞在门里说。\n\n泠没有立刻答。她看了一会儿那些跪在河边的人，才说：\"……嗯。女娲该等急了。\"\n\n她走的那天，冀州的渠水已经能喝。她把最后一筐土倒进渠里，拍了拍手，往北走。云路在天上，她走了一段路，找一处没人的地方，腾身而起。\n\n过云海的时候，风是湿的。天界的天，蓝得干净——不像魔界，也不像人间。她落在云海边上。\n\n女娲在那儿。\n\n她站在她爹的碑旁边，比泠高出一个头还多，银白的长发在风里扬着。远远看见泠，脚步顿了一下，然后跑过来。跑了两步又停住，站定了，说：\n\n\"杀完就回来。\"\n\n\"回来了。\"泠说。\n\n女娲绷了一会儿，绷不住，笑出来：\"你身上有泥！\"\n\n\"挖渠挖的。\"泠说，\"冀州的水，清了。\"\n\n\"龙呢？\"\n\n\"杀了。\"\n\n\"谁杀的？\"\n\n泠想了想：\"晞姐锁的，我剖的。\"\n\n女娲朝她的左肩挥了挥手：\"晞姐姐好！\"\n\n门里静了一下：\"……嗯。\"\n\n女娲哈哈笑起来。笑完了，又低头看她：\"你瘦了。\"\n\n\"没瘦。\"泠说，\"你长高了。\"\n\n\"早长高了！\"女娲蹲下来，凑到她跟前，\"你走的时候，我就比你高了——你不在的这半个月，我又长了一点。你看！\"\n\n泠伸手按了一下她的发顶，她蹲着，正好够得着。\"长了。\"\n\n\"别按！\"女娲站起来，\"走，回府。房叔今天蒸了云糕，说是给你接风的——他早早就算着你今天回来。\"\n\n她们走过云路，走过长老院的长廊。一路上，泠讲了冀州的事：黑水、地缝、那条龙。女娲听了，眼睛亮亮的，又软下来：\"你手疼不疼？\"\n\n\"不疼。\"\n\n\"晞姐姐呢？\"\n\n\"她封了缝。\"泠说，\"封不死，撑几年。\"\n\n\"几年后呢？\"\n\n\"水还会黑。\"\n\n\"那怎么办？\"\n\n\"再去。\"泠说，\"杀到它不敢黑。\"\n\n女娲点了点头，没再问。她走在前头，步子大，银发在风里一下一下地扬。泠看着她的背影——三年前，她还是那个追着泠跑、仰头说话的小丫头。如今她走在前面，像她爹年轻的时候。\n\n夜里，泠坐在廊下。女娲给她端来一盘云糕，自己也端一盘，坐她旁边。\n\n\"泠姐姐，我跟你说个事。\"\n\n\"嗯。\"\n\n\"人间的消息传上长老院了——他们给我立了宫。\"\n\n\"知道。\"泠说，\"来的路上，看见好几座。\"\n\n\"好几座？\"女娲瞪大了眼，\"我就知道一座！他们给我立了几座？\"\n\n\"一路走一路有。补天娘娘。\"\n\n\"补天娘娘……\"女娲念了一遍，自己先乐了，\"我爹的碑朝着人间——他要是看得见，得笑半天。他闺女，成娘娘了。\"\n\n泠没说话。她想起补天那七天七夜，天君殿的钟敲了七天七夜。人间记住了钟声，记住了补天的人。\n\n\"我想去看看。\"女娲说。\n\n\"看什么？\"\n\n\"看看我的宫啊！\"女娲盘腿坐直，\"我补天的时候，走遍五方，看见的都是灾后的地——水、泥、塌了的山。我还没见过好好的地呢。人间的热闹，我也只听过，没看过。\"\n\n\"你爹给你带的糖人，不就是人间的？\"\n\n\"那是人间的味儿，不是人间的热闹！\"女娲说，\"我要看他们赶集、看他们唱戏、看他们排队买糖人——泠姐姐，你带我去！\"\n\n泠想了想：\"长老院的职司呢？\"\n\n\"我告了假！\"女娲拍了拍胸口，\"房叔说，云海东段风平浪静，准我歇半月。天塌过一回，天界也该歇歇了。\"\n\n\"……那行。\"泠说，\"明早走。\"\n\n第二天一早，她们下了云海。\n\n人间正是春天。麦子绿着，桃花开着，路上的人，赶车的、挑担的、赶集的，从四面八方往镇里涌。女娲走在人群里，比谁都新鲜——她看什么都新奇：面摊的炊饼在铁板上滋滋响，货郎的拨浪鼓转得叮当，卖花的姑娘把一篮杏花举到她们跟前：\"姑娘，买枝花吧！\"\n\n女娲买了一枝，别在泠的衣带上，又给自己买了一枝，别在耳边。她凑近闻了闻：\"香！\"\n\n\"香。\"泠说。\n\n她们在一个糖人摊前停住。老翁捏糖，手指翻飞，捏出一只狐狸，捏出一只鸟，又捏出个扎小辫的姑娘。女娲蹲在摊前，看了半晌，说：\"老爷爷，我要那个扎小辫的。\"\n\n\"好嘞！\"老翁把糖人递给她。\n\n女娲举着糖人，没舍得吃，先看了半天：\"泠姐姐，你看，像我！我小时候，我爹给我带的糖人，也有一个扎小辫的——狐狸的、鸟的、扎小辫的，一年三只，年年不重样。\"\n\n泠看着她。\"你爹说，云市那个糖人摊，他还欠人家一个铜板。\"\n\n\"嗯。\"女娲把糖人小心地转了转，\"爹说，哪天下人间，替他还。我今儿到了人间——等我回了天界，先去云市，把钱还了。\"\n\n她说完，咬了一口糖人，眼睛弯起来：\"甜的。\"\n\n\"甜的。\"门里，晞的声音很轻，\"……这个味儿，我记得。\"\n\n泠没有接话。她记得——很久以前，晞说过，她吃过甜的。谁给的，她不说。\n\n她们从南往北走，走了许多天。走过一座城，又一座城。每到一座城，都能看见女娲宫——香火有盛有淡，神像有旧有新。女娲头一回看见自己的神像，站在神像前，仰着头看了很久，说：\n\n\"不像。\"\n\n\"怎么不像？\"泠问。\n\n\"我哪有这么板着脸。\"女娲说，\"他们把我画得可严肃了。\"\n\n\"补天娘娘嘛，端着些。\"\n\n\"补天娘娘也要笑！\"女娲对着神像做了个鬼脸，又叹了口气，\"……我补天的时候，其实是怕的。手烫得疼，石液糊到天上，我怕糊歪了，怕天还裂着。他们说我是娘娘，可我那天，只想把天补上，让冀州的孩子，不用再往外跑。\"\n\n泠没有说话。她想起补天那几天，女娲的手上血泡破了又起，她递石头，用袖子垫着接，烫得呲牙——女娲也没停。\n\n\"泠姐姐。\"女娲说，\"我以后，还要好好守着云海东段。我爹守过的地方，我要守得像他一样好。\"\n\n\"你会的。\"\n\n\"你会陪我吗？\"\n\n\"陪你。\"泠说。\n\n晞在门里，什么也没说。但那份静，是软的。\n\n过了黄河，往北，路越来越宽，车马越来越多。人间的消息在路边茶棚里飘着：西边周国又收了哪路诸侯啦，朝歌的纣王又修了什么台啦，太师闻仲又带兵去了哪儿啦——女娲听不太懂，问泠，泠就说：\"人间的事，听着就是了。\"\n\n第五天黄昏，她们望见一座大城。\n\n城墙高，城门阔，车马在门口排成长队；城里有酒旗，有戏台，有烟——香火的白烟，一道一道，从城中最高的那座殿宇顶上，直直地升上天去。那殿宇的飞檐翘着，在黄昏里镀了一层金。\n\n女娲站在城门外的坡上，看了很久。\n\n\"泠姐姐。\"她说，\"这是哪儿？\"\n\n\"朝歌。\"泠说，\"商都。人间最热闹的城。\"\n\n\"……它可真热闹。\"\n\n\"嗯。\"泠说，\"进城吧。\"\n\n她们下了坡，走进人流里。灯火一盏一盏地亮起来，像一条条游动的河，把整座城都点亮了。\n\n\"补天娘娘的宫，也在里面。\"泠说。\n\n女娲站在人流里，望着那道升上去的白烟，没有接话。\n\n朝歌的夜，比白天还亮。\n"}, {"id": 57, "title": "神像", "content": "# 第57章 神像\n\n朝歌的早晨，是从市集开始的。\n\n天没亮透，卖菜的已经占好了位子，炙肉的摊子支起来，铁架上的肉滋滋冒油，香气顺着风，一条街一条街地钻。女娲昨夜里睡得晚，今早却起得早——她站在客栈门口，看着满街的人，看了好一会儿，说：\"泠姐姐，人间怎么这么吵？\"\n\n\"吵吗？\"\n\n\"吵。\"女娲说，\"吵得人想出来逛逛。\"\n\n她们顺着人流走。女娲见什么都要停：蜜饯摊的梅子，她尝了一颗，酸得眯起眼睛；布庄的绸子，她摸了半天，说没有云缎软；卖炙肉的老汉给她切了一块，她咬一口，油顺着嘴角流下来，她拿袖子一擦，说：\"好吃！比云糕香！\"\n\n\"那当然。\"泠说，\"人间的东西，就是这口油水。\"\n\n街那头有个戏台，围着里三层外三层的人。锣鼓一响，台上开唱。女娲踮起脚，看不见，急得直蹦——泠伸手把她往前推了推：\"你高，看得见。\"\n\n台上唱的是补天。扮补天娘娘的旦角，披着霞帔，戴着一头的珠翠，唱：\"五色石，补天漏，救下万民不回头——\"唱到天塌那一段，鼓点急起来，台下的人攥着拳头跟着攥。\n\n女娲站在人群里，看完了整出戏。\n\n\"他们把我唱高了。\"她小声说。\n\n\"不高。\"泠说，\"你就是那么做的。\"\n\n\"我那天，可没这么好看。\"女娲说，\"手上全是泡，头发也乱了——他们把我画得，跟真神仙似的。\"\n\n\"你本来就是神仙。\"\n\n\"……也是。\"女娲笑了一下，\"走，去看我的宫。\"\n\n女娲宫在城中心，是朝歌最高的一座殿宇。石阶宽，宫门高，进香的队伍从殿里排到街上。泠和女娲顺着人流往里走，过了香炉，过了功德碑——碑上刻着商朝历年进献的香资，最上头一行，是\"商立国之初，首献\"。\n\n女娲在碑前站住，看了很久。\n\n\"泠姐姐。\"她说，\"你知道这碑上写的什么吗？\"\n\n\"写的什么？\"\n\n\"写的是一个约。\"女娲说，\"商朝立国的时候，有人求到我们家里来。说商要立国，请我们庇护。我们家应了。后来的几百年，一代一代传下来，传到我这辈——我们家许诺过的事，从不收回。\"\n\n泠看着她。\"你们家庇护了商多少年？\"\n\n\"数不清了。\"女娲说，\"我们家看着他长大，看着他爹，他爷爷，一茬一茬换人。他们年年进香，我们年年应着——也不应，就守着。守了这么多年，都守成习惯了。\"\n\n她说完，拍了拍石阶，站起来：\"进去吧。看看他们把我画成什么样了。\"\n\n殿里光线暗，香火重。神像端坐在供台后面，金身，宝冠，垂着眼，手里托着一块五色石。香客们跪在蒲团上，念念有词。一个庙祝迎上来，笑呵呵的：\"两位姑娘，上香？补天娘娘灵验得很，求什么的都有。\"\n\n\"我不上香。\"女娲说，\"我看看她。\"\n\n她站在神像前，仰着头，看了很久。庙祝在旁边念叨：\"娘娘是商朝的庇护神，商朝立国那天就供着，几百年了，香火没断过——\"\n\n\"嗯。\"女娲应了一声，目光从金身往下移。\n\n她停住了。\n\n神像的衣摆上，题着一行字。\n\n那行字题在衣摆最显眼的地方，笔画张狂，像是喝醉了写的，词句腌臜，不堪入目。香客们走到那儿，都低着头，绕着走。漆刷过两回——底下一层旧漆，上一层新漆，都盖不住那行字的轮廓，笔画从漆底下透出来，黑黑的，像一道没结痂的疤。\n\n女娲站在那儿，看着那行字。\n\n泠的血一下子涌上来。她护短——女娲是她的家人，她看不得有人往她家人脸上抹灰。她的手按上刀柄，喉咙里一个字一个字蹦出来：\"谁题的？\"\n\n庙祝吓了一跳，压低声音：\"姑娘，莫问……上月就有了。刷过两回漆，又题上了。\"\n\n\"我问你，谁题的。\"\n\n庙祝不敢看她，往殿外努了努嘴：\"……上头的人。这话，不好说。\"\n\n泠的刀柄在手心里转了一圈。她正要迈步，女娲开口了：\n\n\"……走吧。\"\n\n只有两个字。很平。\n\n泠的脚步顿住了。她回过头——女娲已经转身往殿外走。她没看那行字第二眼，也没看泠，步子不快不慢，像什么都没发生过。\n\n泠跟上去，压着火：\"女娲，那行字——\"\n\n\"我知道。\"\n\n\"你知道是谁？\"\n\n\"我知道是谁题的。\"女娲说。\n\n\"那你不——\"\n\n\"不怎么样？\"女娲停下来，回过头看她。她的眼睛很平静，平静得不像她——女娲向来话多，眼里藏不住事。此刻她的眼睛像一潭水，深得看不见底，\"砸了宫？撕了那行字？还是找他去，问一句'你为什么要亵渎我'？\"\n\n泠被她问住了。\n\n\"问出来，又怎么样呢？\"女娲说，\"他答了，然后呢？\"\n\n她没有等泠回答，转身走了。\n\n出宫的时候，太阳已经偏西。香客散了大半，庙祝在殿门口扫地，看见她们，躬了躬身。女娲在宫门口站住，回头看了一眼那道白烟。\n\n\"走吧。\"她说。\n\n她们顺着宫墙往南走。朝歌的黄昏，街上的人少了，酒肆里开始上灯。走到宫墙转角，泠听见身后的殿里传出一声脆响——像是什么东西摔了。接着是几声含糊的醉话，隔着两道墙，听不真切，只辨得出是个男人的嗓门，又大又横。\n\n\"上头的人。\"泠停住脚步，\"庙祝不敢说的那个，就在里面？\"\n\n女娲没有答。她站在墙根下，听着。过了一会儿，她转身往回走。\n\n\"你别去。\"泠说。\n\n女娲没有停。她走得快，又走得轻——她到底是神，脚步落在石板上，一点声音也没有。泠只好跟上去，绕到宫墙侧门。\n\n侧门虚掩着，门缝里透出火光。女娲在门缝边站住，往里看。\n\n泠从她肩头看进去。\n\n殿里点着火把。神像前站着几个人——一个穿王袍的男人，身形高大，歪歪斜斜的，像是喝多了，扶着供台才站得住；他身后两个侍从，弓着腰要去扶他，被他一把推开：\"滚开！朕没醉！\"\n\n朕。泠的呼吸停了一下。\n\n那男人摇摇晃晃地走到神像前，仰头看着金身，看了好一会儿，笑了一声：\"补天娘娘……好大的架子。朕来看你，你不下来迎接？\"\n\n他说着，伸手去够神像垂下的衣摆，一把扯住，用力一拽——只拽下一角璎珞，他自己也趔趄了一下。他握着那截璎珞，凑到鼻子底下闻了闻，嫌弃地扔了。\n\n\"高居九重，不管人间的事。\"他站直了，声音大起来，\"你们拜她，她理过你们吗？朕偏不拜！\"\n\n他回头，看见供台上的砚台和笔——那是庙祝留着写功德簿的。他抓起笔，蘸了墨，摇摇晃晃地走到神像前，在衣摆上画了起来。笔尖划过金漆，划出一道一道的黑痕，字不成字，笔画张狂。他画得兴起，嘴里念念有词。\n\n\"大王！\"一个侍从扑上来，\"大王，使不得——这是补天娘娘——\"\n\n\"补天娘娘？\"纣王把笔往地上一摔，墨点子溅了一地，\"她要是真有灵，就叫她下来，问问朕，朕写得好不好！\"\n\n他大笑着，摇摇晃晃地往外走，侍从们赶紧跟上。笑声在殿里撞来撞去，好一会儿才散。\n\n殿里空了。火把还在烧。\n\n女娲从门缝边退开一步。\n\n泠看着她。火光隔着门缝，照在她的脸上，明一阵暗一阵——那张脸上没有愤怒，没有难过。她只是站着，像在等什么。等笑声散尽，她推开门，走了进去。\n\n泠跟着她走进殿里。\n\n神像还端坐着。衣摆上新添了一行黑痕，比旧的那行更乱，笔画还是湿的，墨顺着金漆往下淌，淌到一半，凝住了。供台上被撞歪的香炉，还冒着烟。\n\n女娲站在神像前，看了很久。\n\n\"你守了这么多年的，就是——\"泠说。\n\n\"嗯。\"女娲打断她，\"就是他。\"\n\n泠的火往上顶：\"那你——\"\n\n\"我怎么？\"女娲问。她没回头，还是看着那行新字，\"砸了他的宫？抓了他的手？让他跪在这儿，对着我的像磕头？\"\n\n\"他亵渎的是你！\"\n\n\"他没亵渎我。\"女娲说。她终于回过头来，看着泠，眼睛很平静，平静得让泠心里发沉，\"他亵渎的是他祖宗供了几百年的神。我算什么？我不过是一个应过约的人——他连约都忘了。\"\n\n\"那你还要守吗？\"\n\n女娲没有回答。她转身往外走。路过那截被扯下来的璎珞时，她停了一下，弯腰捡起来，掸了掸上面的灰，放回供台上。\n\n走出宫门的时候，天已经黑了。朝歌的灯火亮起来，女娲宫的白烟还在升——香客早散尽了，烟也淡了，只剩一缕，晃晃悠悠的。\n\n泠跟在女娲后面，一句话也说不出来。她看着她走在前面的背影——她的背挺得很直，步子也是稳的。可泠总觉得，她脚下那条路，比白天的时候，宽了一些。像是她家走了几百年的那条路，她头一回，想回头看一看。\n\n回到客栈，女娲的房门关上。过了一会儿，灯亮了。\n\n她在灯底下坐着，没有睡。\n\n泠在廊下站了很久。她的火没熄，只是没有地方烧。她想起女娲在石阶上说的话：\"我们家许诺过的事，从不收回。\"\n\n可那道约，是约的另一端，自己砍断的。\n\n\"晞姐。\"她开口，\"你也看见了吧。\"\n\n门里没有立刻回答。过了一瞬，晞的声音很轻：\"……看见了。\"\n\n\"你说她——\"\n\n\"她站那儿看了很久。\"晞说，\"我看见她看的。\"\n\n泠沉默了。\n\n\"她会自己走过去的。\"晞又说。\n\n\"走不过去呢？\"\n\n晞很久没有说话。廊下的灯被风吹得晃了一下，又立住。\n\n\"……那就陪她站着。\"她说。\n"}, {"id": 58, "title": "沉默", "content": "# 第58章 沉默\n\n第二天早晨，女娲没有下楼。\n\n泠端着一碗粥，在二楼廊道里站了一会儿，敲门。门里没有声音。她又敲了一下，过了一会儿，女娲的声音才响起来，隔着门板，闷闷的：\"……进来吧。\"\n\n门开了。女娲坐在窗边，窗开着，她看着窗外——窗外是朝歌的街，早上刚热闹起来，叫卖声一声一声往上传。她看得很认真，像在数什么，又像什么都没看。\n\n\"粥。\"泠说。\n\n\"嗯。\"\n\n她接过去，捧在手里，没喝。粥的热气袅袅地往上升，扑在她脸上，她也不躲。\n\n泠在床边坐下来。等了一会儿，说：\"今天想去哪儿？\"\n\n\"……都行。\"\n\n\"女娲。\"\n\n\"嗯？\"\n\n\"你看着我说。\"\n\n女娲转过头来。她的眼睛还是那潭水，深得看不见底。她看了泠一眼，又转回去，看窗外：\"我看着你呢。\"\n\n\"你没看我。\"泠说，\"你看的是那根烟。\"\n\n窗外，女娲宫的白烟，一道，淡淡的，升在半空。朝歌的天空很蓝，那道烟显得很细，像是随时会散。\n\n女娲没有反驳。她捧着粥，又看了很久，才说：\"……喝粥吧。粥要凉了。\"\n\n她们还是出了门。\n\n泠带她走热闹的地方——市集、酒肆、说书摊。女娲走在她身边，步子也稳，话也答，只是那话答得都不对：人家问\"姑娘吃点什么\"，她说\"都行\"；卖花姑娘往她手里塞了一枝花，她拿着，走了一条街，也没想起来别在头上。\n\n泠的心里，火苗一蹿一蹿的，压着。\n\n走过渡口的时候，一个妇人抱着孩子，直直地看着女娲，看了一会儿，叫起来：\"姑娘！你、你长得好像补天娘娘！\"\n\n女娲停了一下。那妇人又看，又摇头：\"不对，不对，娘娘没那么年轻——姑娘你真是好相貌。\"\n\n女娲笑了一下。那个笑很浅，像在水面上画了一道，很快就没有了：\"……是么。\"\n\n她拉着泠走远了。走出那条街，她松开手，声音很轻：\"我小的时候，我爹说，人间的香火，是给神的信。神在天上，闻得见。\"\n\n泠没有接话。\n\n\"我头一回，不知道该不该应。\"女娲说，\"以前，人间的祷告，一句一句的，我都应着——也不应，就听着。今天，他们还在说，可我不知道，该怎么应了。泠姐姐，你说，我这是怎么了？\"\n\n\"……你在想事。\"泠说。\n\n\"想什么事？\"\n\n\"想那道约，值不值。\"\n\n女娲没有答。她还在往前走，背影还是直的，可泠觉得，她像是走在另一条路上。\n\n回到客栈，天已经擦黑。\n\n女娲在廊下坐下来，看着天边的最后一点亮。泠在她旁边坐下来。\n\n\"女娲。\"她说。\n\n\"嗯。\"\n\n\"这就是你庇护的商。\"\n\n女娲没有回答。天边的亮又暗下去一截，暗得那么快，像有人伸手把天布收了起来。\n\n\"我们一家，守了它几百年。\"女娲说，\"守到我这儿，守出一个在神像前题字的王。我要是早知道——\"\n\n她停住了。过了一会儿，说：\"我也不知道我早知道，会怎样。\"\n\n\"我去查。\"泠说，\"查出来是谁，让他跪着，把你的像擦干净。\"\n\n\"擦干净了，然后呢？\"\n\n\"然后他就知道——\"\n\n\"他就知道什么呢？\"女娲转过头来，看着她。她的眼睛在暗下来的天光里，亮得过分，又空得过分，\"他跪着擦干净了，那道约，就回来了吗？\"\n\n泠被问住了。\n\n\"我不知道。\"女娲说。她说了这一句，声音轻下来，\"我爹把这道约传给我的时候说，守约的人，不挑约值不值。我一直记着。可今天，我头一回，想挑一挑。\"\n\n\"女娲——\"\n\n\"我没事。\"女娲说，\"就是……有点乱。我没打算不守。我就是，想停一停。像是脚底下那块地，我们家走了几百年，走得我忘了，它也会裂。\"\n\n夜里。\n\n女娲房间的灯亮着。她没睡——她坐在窗边，对着那道白烟的方向。烟在夜里看不见了，她对着黑漆漆的夜空坐着。\n\n泠在廊下坐着。她的刀放在手边，她没碰。\n\n\"晞姐。\"她开口，\"你看见了。\"\n\n\"……看见了。\"晞说。\n\n\"她什么时候能好？\"\n\n\"不知道。\"\n\n\"晞姐，你见过这种——\"\n\n\"见过。\"晞说，\"我妹妹死的那天，我也是这样。站在那儿，什么都做不了。\"她停了一下，\"走不动的不是脚，是心。你推她，她反而会更站不稳。别催她。\"\n\n\"……我没催她。\"泠说。\n\n\"你满脑子都是催她。\"晞说。\n\n泠不说话了。\n\n过了一会儿，她说：\"晞姐，他们家守了几百年。\"\n\n\"嗯。\"\n\n\"我守过的东西，最多守了几年。\"泠说，\"她比我难。\"\n\n\"她不比你难。\"晞说，\"她是补过天的人。天塌下来她都撑得住——这么一点乱，乱不住她。她想清楚了，自己会动。\"\n\n\"……真的？\"\n\n\"真的。\"晞说，\"你要做的，就是别走。她站不住的时候，你在旁边，她就还能站。\"\n\n\"好。\"泠说，\"我不走。\"\n\n廊下的灯，被风吹得晃了一下，又立住。\n\n女娲房间的灯，还亮着。\n"}, {"id": 59, "title": "回天", "content": "# 第59章 回天\n\n又过了几日。\n\n女娲试着照常过日子。她吃饭，上街，跟泠说话，也会笑——只是那笑总慢半拍，像是先想了一遍\"该笑了\"，才笑出来。泠看在眼里，没有说。\n\n第五天早晨，女娲坐在窗边，把那枝蔫了的花从窗台上拿起来，看了半天，说：\"泠姐姐，我告的假，该到日子了。我想回去了。\"\n\n\"回天界？\"\n\n\"嗯。云海东段的边报，堆得老高了。\"她顿了顿，\"房叔一个人，看不过来。\"\n\n泠没有点破。她说：\"……好。我送你。\"\n\n她们收拾了行装——其实没什么可收的。女娲只把几件换洗衣裳打了个小包袱，又把那枝蔫花，夹进包袱里。\n\n\"花都蔫了，还带？\"泠问。\n\n\"嗯。\"女娲说，\"它陪了我几天。\"\n\n她们出城，往北走。云海在天上，要走到城外的坡上，才能起云路。一路上，女娲没说女娲宫，泠也没提。两个人就这么走着，像她们刚下人间那天一样——只是那天女娲话多，今天她话少。\n\n快到坡下的时候，女娲停住了。\n\n\"泠姐姐。\"她说，\"那庙祝……你要是再见到他，替我带句话。\"\n\n\"什么话？\"\n\n\"告诉他，香火照常烧。\"\n\n泠看着她。\n\n\"约还守着。\"女娲说，\"我就是……走一段，歇一歇。歇够了，就回来守。\"\n\n\"……好。\"泠说，\"话我带到。\"\n\n女娲笑了一下。那笑还是慢半拍，但比前几日，真了一些。\n\n她们上了坡。云路在坡顶等着，白茫茫的一条，通向天界。女娲站在云路边，回头看了人间一眼——朝歌的方向，那道白烟，细细的，还升着。\n\n\"泠姐姐。\"她说，\"我走了。\"\n\n\"嗯。\"\n\n\"你要是在人间待够了——\"\n\n\"我就去天界找你。\"泠说，\"你说过了。\"\n\n\"……嗯。\"女娲又笑了一下，\"那我走了。你——回去，好好歇着。\"\n\n\"好。你也好好歇着。\"\n\n女娲转身，踏上云路。她走了几步，又回头，张了张嘴，想说什么，终究没说。她挥了挥手，走进云里。云把她吞没了，很快，连影子也不见了。\n\n泠在坡上站了很久。\n\n风从云海那边吹过来，湿湿的。她站到天快黑，才转身往回走。\n\n\"她走了。\"她说。\n\n\"嗯。\"晞应。\n\n回到朝歌，天已经全黑了。城里的灯亮着，市声还在，女娲宫的白烟在夜色里看不见，只有那一片殿宇的轮廓，黑沉沉地立着。\n\n泠在客栈门口站了一会儿。她没有上楼，在台阶上坐下来。\n\n\"晞姐。\"她说，\"她下不了决心。\"\n\n\"……嗯。\"\n\n\"她下不了决心，那行字就在那儿一天。香客绕着走一天，庙祝刷着漆一天。\"泠说，\"我看见了。我睡不着。\"\n\n晞没有接话。她等她说完。\n\n\"她做不到的，我替她做。\"泠说，\"她下不了的决心，我替她下。\"\n\n晞沉默了一会儿。\"你想做什么？\"\n\n\"不做什么。\"泠说，\"我只是……让该看见的人，看见。\"\n\n\"……不杀人？\"\n\n\"不杀人。\"泠说，\"杀了人，就不一样了。我要的，是它自己倒。\"\n\n晞很久没有说话。\n\n\"……行。\"她说。\n\n泠抬头，看了看天上的星星。朝歌的夜，灯火太亮，星星都显得淡。她看了很久，说：\"从明天起，我住朝歌。\"\n\n\"嗯。\"\n\n\"……让该看见的人，看见。\"泠又说了一遍，像是在念给自己听。\n\n晞没有再答。但她也没有拦——泠知道，这就是她的回答了。\n\n泠伸手摸了摸胸口——水漠还别在胸带外侧，刀柄贴着心跳，凉凉的。她没有把它取下来，只按了按，像是在跟它说话。\n\n朝歌的夜风从街上吹过来，把她的头发吹起来，又放下。\n\n明天，她要进城了。\n"}, {"id": 60, "title": "谣言", "content": "# 第60章 谣言\n\n泠在朝歌住了下来。\n\n客栈的掌柜给她留了一间朝东的屋子，房租按旬付。掌柜娘子看她一个姑娘家独自住店，多问了一句\"家里人呢\"，她答：\"家里人，在别处。过些日子就来。\"掌柜娘子信了，从此每日早饭，多给她塞一个煮鸡蛋。\n\n她白天混在城里。赶集的日子，她跟人流挤一条街，听布庄老板娘说东边又打了仗；闲的日子，她在茶楼角落坐一下午，听人说书，说三国旧事，说西伯侯被囚，说太师闻仲又带兵去了哪儿。夜里，她走街串巷，听墙根——谁家婆娘骂人，哪个衙役喝多了说漏了嘴，宫里的消息，是怎么从人嘴里一层一层漏出来的。\n\n她听了几天。晞在门里，也听了几天。\n\n\"……你在学话怎么走路。\"晞说。\n\n\"嗯。\"泠说，\"话会走路。从一张嘴，走到另一张嘴，越走越歪，越歪越真。\"\n\n\"你学这个做什么？\"\n\n\"让该看见的人，看见。\"\n\n晞没再问。\n\n那天下午，茶楼里人坐得满。说书先生刚说完一段，端着茶去歇了，堂上的人接着闲谈，说起西边的事：周国的西伯侯被囚了，周国的人却没乱，反倒又收了两路诸侯。有人叹气：\"闻仲太师要是在朝中，哪轮得到西边张狂。\"\n\n泠坐在角落里，面前的茶已经凉了。她听了一会儿，声音不高不低，像是自言自语，又像是说给邻桌听：\"听说太师在外头，跟西边也有书信往来。\"\n\n邻桌那人回过头：\"不能吧？太师是忠臣！\"\n\n\"那谁知道呢。\"泠说，\"我也是听人说的。城里传得可多了，谁知道哪句真哪句假。\"\n\n她放下茶钱，起身走了。走出茶楼的时候，她听见那人还在跟同桌说：\"……跟西边有书信往来？这话是从哪儿传出来的？\"\n\n\"谁知道，许是有人看见过信差。\"\n\n泠没有回头。那句话已经落下去了。话会自己找嘴。\n\n过了几天，她再去那间茶楼。隔着一条街，就听见有人压着嗓子说话，一个说\"闻仲太师，跟周国书信往来\"，一个说\"嘘——这话可不敢乱说\"，又一个说\"什么乱说，信都落到大王案头上了！\"\n\n泠在老位子上坐下，要了一壶茶。她听了一下午，没插一句嘴。那句话从她嘴里出去的时候，只有一句话；现在它已经自己长出了手脚，会跑了。满堂的人，都在替她说。\n\n夜里，泠在灯下写信。\n\n她的案头摊着一叠旧纸——收旧纸的摊子上淘来的。她挑的时候，翻了半个时辰：太师府流出来的旧行文，纸是官造的，厚实，落笔有筋；字迹端方，一笔一划都有规矩。她挑了三封，压在案头，天天看，临了三个晚上——先描轮廓，再学起笔落笔，最后学笔锋的轻重。到第三个晚上，她落笔，笔尖在纸上走，跟那旧行文一模一样。\n\n信是写给西伯侯姬昌的。\n\n信上说，商朝气数尽了，纣王荒淫失道，太师在外征战，心系天下，愿与周国修好，共图大事。写到\"太师\"两个字的时候，她的笔停了一下——闻仲这个人，她没见过，也不恨他。她只是需要一封信。\n\n末了，落款处盖着一方印。那方印，她照旧文书上的印模，描了三个晚上——先拿笔描，描到像，再拿刀刻，刻坏了三块木头，第四块才成了。她蘸了朱砂，印在纸上，拿起来对着灯看了半天，又跟旧文书上那方印比了比，印泥的浓淡都一样。\n\n她写完，把信看了一遍，吹干墨，折好，收进怀里。\n\n\"……你什么时候学的这个？\"晞问。\n\n\"九尾的巧劲。\"泠说，\"学字，学得像。\"\n\n\"学得真像。\"晞说，\"像到我认不出是假的。\"\n\n泠没有说话。她摸了摸胸口的刀柄——水漠凉凉的，贴着她的心跳。\n\n又过了几日，纣王出城田猎回城。\n\n百姓一大早就被赶到了街边，跪成两排。泠混在人群里，跟着跪下去。远远的，一队人马过来，旗幡猎猎，先头是执戟的卫士，后头是仪仗，再后头，那个王骑在马上——他比传说里更高大，肩上搭着猎获的皮毛，皮毛上的血还没干透，脸上带着志得意满的笑。百姓低着头，他看也不看，马蹄踏着石板路，得得地过去了。\n\n泠跪在人群里，隔着那么远，看着他。她想起女娲宫那一夜：火光里，他扯下神像的璎珞，往地上摔；他蘸了墨，在神像衣摆上写字，写完，还回头看了看，像看一件得意的事。\n\n泠看着他，看了很久。\n\n她的眼睛是九尾的眼睛。她只用了那么一下——很轻，轻得像风吹过水面：把他心里那点疑心，拨大了一点。对截教的疑心。对\"身边到底谁可靠\"的疑心。\n\n用完，她低下头，跟着人群退开。她往回走，走得很快，一直走到客栈，把门关上，才停下来。\n\n晞在门里，很久没有说话。\n\n\"……你不想用这个。\"晞说。\n\n\"嗯。\"\n\n\"那你为什么用？\"\n\n\"因为他题了字。\"泠说，\"因为他扯了我家人像上的璎珞。\"\n\n晞沉默了一会儿：\"……用完了，心里难受吗？\"\n\n泠没有答。过了很久，她才说：\"……我小时候，被人用这种眼睛看过。我知道那是什么滋味。\"\n\n\"那你还——\"\n\n\"用得轻。\"泠说，\"就这一下。下不为例。\"\n\n夜里，她照旧去女娲宫附近走一圈。\n\n庙祝已经睡了，宫门关着。她绕着宫墙走，走得很慢，走到正殿的方向，站住——那道白烟，白天还升着，夜里看不见了。可她总觉得，那烟还在，只是换了个人看不见的样子。\n\n她站了一会儿，往回走。走到宫墙拐角，听见墙那边有脚步声——一队巡夜的侍卫。她脚步一收，贴着墙根站住。打头的侍卫停了下来：\"那边什么动静？\"\n\n\"白影！\"一个侍卫说，\"像是——狐狸？\"\n\n\"胡说，城里哪来的狐狸。\"\n\n他们举着火把照了照，墙根下空空荡荡，什么也没有。\n\n泠贴着墙根，等脚步声远了，才翻过墙。她没有急着走，绕了两条街，确认没人跟上来，才回客栈，把门关上。\n\n\"……有人看见你了。\"晞说。\n\n\"嗯。看见就看见。\"泠说，\"城里闹白狐，不算大事。\"\n\n\"他们会上报。\"\n\n\"上报就上报。\"泠说，\"话传出去，也是话。话多了，真真假假，没人分得清。\"\n\n这夜三更，泠去了太师府。\n\n府里静悄悄的。太师不在朝中，府里只留了几个老仆，前院的灯早灭了，只有门房还亮着一盏。她翻过院墙，落在后院，脚步落得像一片叶子。她顺着回廊摸到前院，贴着门房的窗往里看——门房的案上，摞着一叠文书，是府里各处要寄的信，明早差役要送出城去。\n\n门房里的老仆趴在案上打盹，鼾声一起一伏。\n\n泠推门进去，脚步放得极轻。她走到案前，把那封信，夹进最中间那摞文书里——不靠上，不靠下，夹在正中间，像它本来就在那儿。夹完，她退出来，顺手把灯芯拨暗了一些，掩上门，像从来没有人来过。\n\n她翻出墙，走了。从头到尾，那老仆的鼾声，没断过一下。\n\n第二天一早，太师府的差役把信袋送出城，照例走东门。\n\n城门那里，守军拦下了信袋——西伯侯被囚之后，朝歌戒严，凡与西边往来的书信，一律过检。守军把信袋解开，一封一封翻：家书、报平安的、催账的。翻到最中间，抽出一封——信皮上没有落款人，只写着\"姬昌足下\"。\n\n守军翻来覆去看了三遍，脸色变了。\n\n那天下午，那封信被送进了宫，放到\"该看见的人\"的案头上。\n\n泠站在城门口，隔着一条街，看着那袋信被抬进城，抬进宫。她看了一会儿，转身走了。走到茶楼那条街，满街的议论声正热：\"……听说了吗？闻仲太师，真的通周了——\"\n\n她走进茶楼，在老位子上坐下，要了一壶茶。满堂的人都在说那封信——没人见过那封信，可人人都说得像自己亲眼看过。\n\n晞在门里，听了一会儿，说：\"……成了。\"\n\n\"嗯。\"泠说，\"成了。话自己会长。\"\n\n她喝了一口茶。朝歌的午后，太阳很好，茶楼里人声鼎沸。\n\n她什么都没做——只是让该看见的人，看见。\n"}, {"id": 61, "title": "猜忌", "content": "# 第61章 猜忌\n\n风声是从宫里漏出来的。\n\n先是城门口的守卫换了一拨人，进出都要搜身；再是太师府门口，多了几个生面孔，蹲在对面茶棚里，一蹲一整天。市井里的话，一天一个样：先是\"大王案头上多了一封信\"，再是\"信是从太师府流出去的\"，再是\"太师府跟西边通信，坐实了\"——没人见过那封信，可人人都说得像自己亲眼看过。\n\n泠在茶楼角落听了一下午。\n\n满堂的人，一半说闻仲冤枉：\"太师在外头打仗，哪顾得上通周。\"另一半说知人知面不知心：\"他手里握着兵，跟西边眉来眼去，大王能不防？\"说来说去，谁也没个准话。这时候，从东门进来一个行商打扮的人，挤到人堆里，压着嗓子说了一句，满堂安静下来：\n\n\"周国的兵马，往东边压过来了。已经过了孟津，往朝歌来了。\"\n\n有人急了：\"那还不赶紧调闻仲太师回师？\"\n\n\"调他？\"行商的人哼了一声，\"大王案头上那封信，写的就是他。这时候调他回来，是让他来护驾，还是让他来开城门？\"\n\n满堂又吵起来。泠坐在角落里，把茶喝完了。\n\n她放下茶杯的时候，手很稳。那封信是她写的。她知道它会走，可它会走到哪一步，她管不住——话自己会长，信自己会走。她只是让它出发的人。\n\n夜里，太师府被查了。\n\n泠没进去。她站在两条街外的暗处，看见一队兵举着火把涌进太师府大门，半个时辰后，押出一个人来——年轻，道士打扮，是闻仲留在朝中看护军务文书的弟子。他被五花大绑，嘴里塞着布，一路挣扎，被拖走了。\n\n泠看着那队兵远去，火把在夜里一晃一晃，把那个年轻人的影子拖得很长。\n\n她认得他吗？不认得。她翻太师府那夜，门房里打盹的是老仆，这个弟子，她没见过。可他管的那摞文书里，有一摞，是她夹过信的。\n\n第二天，消息传遍朝歌：太师府私通西边，搜出了书信往来——闻仲的弟子，被下了大狱。\n\n第三天，弟子被押到宫门外斩首。\n\n泠去了刑场。她挤在人群里，跟满城的百姓一起看。那个年轻人被押上刑台的时候，已经脱了形——三天大狱，他瘦了一圈，衣裳上都是鞭痕。他跪在刑台上，抬起头，向着人群喊了一句：\n\n\"太师是忠的！那信是假的！是有人害太师——\"\n\n刀落下去，话断了。\n\n人群轰的一声，散了大半。有人摇头走开，有人啐了一口，有人低声说死到临头还嘴硬。泠站在原地，没有走。她看着刑台上的血，流成一道，顺着砖缝，流到人群脚下。她一直看到刽子手把尸首收走，才转身离开。\n\n回到客栈，她把门关上，在床边坐了很久。\n\n晞在门里，很久没有说话。\n\n\"……他动手了。\"晞说。\n\n\"嗯。\"\n\n\"你没动手。\"\n\n\"我没动手。\"\n\n\"可你让他动的手。\"\n\n泠没有答。她坐了很久，才说：\"……我知道。\"\n\n\"那年轻人，管文书的。\"\n\n\"嗯。\"\n\n\"他替闻仲死的。\"泠说，\"闻仲还不知道。他在外头打仗，等他知道，他的弟子已经死了。\"\n\n\"……你早知道会这样？\"\n\n\"我知道会有人倒霉。\"泠说，\"我不知道会是他。\"\n\n晞沉默了一会儿：\"……你要做到底吗？\"\n\n\"嗯。\"泠说，\"做到底。他倒了，我就停。\"\n\n\"他倒的时候，会压死很多人。\"\n\n\"……我知道。\"泠说。她站起来，走到窗前，看着外面的夜色，\"我知道。可那道题了字的约，总得有人替她看着。\"\n\n后来几天，朝歌的方士，一个接一个地走了。\n\n市井里的人说，大王疑心重，看谁像通周的——朝里的方士，一夜走了好几个；太师府里，除了几个老仆，再没旁人进出。截教的修士们不再进宫，不再炼丹，不再替朝廷问卜——他们缩在自己的道观里，关起门来，谁也不见。\n\n周军集结的消息，却一天紧过一天。有人说已经过了孟津，有人说还在黄河边上扎营。朝堂上吵成一团：有人要调闻仲回师，有人说闻仲通周调不得，有人说先诛了太师府满门以儆效尤——吵了三天，什么也没定下来。兵没人调，城没人守，满朝的大臣，都在互相看着眼色。\n\n泠在人群里看着这一切。她做了很多，又像什么都没做——她只写了一封信，放了一句话，然后坐在茶楼里，喝了一下午的茶。\n\n可朝歌，正在她面前裂开。\n\n黄昏，她路过女娲宫。\n\n庙祝在扫地，香客进进出出，白烟照常升着。神像衣摆上那行字，庙祝又刷了一遍漆——盖住了，也盖不住。泠站在宫门外，看了一会儿。\n\n晞在门里，也看了一会儿。\n\n\"……你让她看见了，不愿看见的。\"晞说。\n\n泠没有答。她看着那道白烟，看着它升到天上，散进云里。\n\n\"她迟早会看见的。\"泠说，\"她在天上，她听得见人间。\"\n\n\"……她知道是你做的吗？\"\n\n\"不用知道。\"泠说，\"她只要看见，就够了。\"\n\n她转身，走进人流里。黄昏的朝歌，炊烟升起来，混着白烟，混着刑场上还没散尽的血腥气——这座城还在过它的日子，可裂缝，已经裂到脚底了。\n"}, {"id": 62, "title": "兵临", "content": "# 第62章 兵临\n\n周军兵临城下的时候，朝歌的城门，关了整整三天。\n\n城外，旌旗遮了半边天。周国的旗，还有诸侯的旗——庸、蜀、羌、髳、微、卢、彭、濮——一面一面，扎在朝歌南郊的旷野上，夜里能看见连天的营火。城里的消息乱成一团：有人说周军十万，有人说二十万；有人说闻仲太师正星夜回师，有人说大王根本不敢调他回来。\n\n商王没有调闻仲。\n\n他在宫里待了三天，第四天，下令：征发城中奴隶、战俘、民夫，凑出一支大军，出城迎战。\n\n\"方士呢？\"有人问，\"护国的方士呢？\"\n\n没人答话。\n\n截教的修士，走了大半。剩下的几个，缩在道观里，谁也叫不动。大王疑过他们，关过他们的人，杀过他们的同门——如今要打仗了，才想起他们来，哪里还叫得动。\n\n出战那日，天色昏黄。\n\n商王披甲出宫，骑在马上，身后是他的旗。百姓被赶到街边，看着这支大军开出去——前排是抓来的奴隶，衣衫褴褛，手里攥着长矛，眼里没有光；后排是东拼西凑的兵；再往后，是王旗。大军出南门，往牧野开去。\n\n泠站在城外一处土坡上，看着这一切。\n\n她站的位置，能看见牧野全貌。两军隔着旷野列阵：周军那边，旗帜严整，甲光在黄昏里一片一片地亮；商军这边，阵脚虚浮，风一吹，旗都摆不齐。她看着两军中间那片空地——空空的，什么也没有。\n\n本该有的东西，没有来。\n\n商军阵前，本该有方士压阵。护国的方士一系，替商立过多少阵，守过多少回城——可今天，一个也没来。阵是空的。\n\n战鼓响了。\n\n周军先动。前排执盾，后排执戈，一步一步，踏着鼓点压过来。商军这边，鼓也响了，可敲得急，乱，像有人在抖。两军越来越近，近了，接触了。\n\n然后，商军的前阵，裂了。\n\n那支由奴隶和战俘组成的前阵，没有接战。周军冲过来的那一刻，他们丢下长矛，转身，朝自己的阵里冲——倒戈。前阵一倒，后阵跟着乱，人挤人，旗倒旗，整个阵，像一面墙，从根上塌下去。\n\n溃败。\n\n泠站在土坡上，看着旷野上的人潮反过来涌。喊杀声变成了哭声，尘土扬起来，遮了半边天。商王的旗，在人潮里倒了，又被人扶起来，又倒了——那面旗，最后往朝歌城的方向，拖了回去。\n\n追杀声一直响到城门口。\n\n泠没有动。她看着溃败的军队涌进城，看着周军追到城下，看着城门在黄昏里被撞开——朝歌城，破了。\n\n她没有出手。\n\n从头到尾，她站在这处土坡上，看着这场仗打完。她没有拦——她拦不住，几万人；她也没有帮——帮谁呢？她只是，没有阻止。\n\n入夜，周军入城。\n\n城里的火，烧起来了。不是周军放的——是乱兵，是溃败的散兵趁乱抢掠，是有人浑水摸鱼。百姓关紧门窗，躲在屋里，听着街上乱了一整夜。\n\n泠绕过乱兵，走回城。\n\n她路过女娲宫。庙祝没跑，还守在殿里，香炉里的白烟，袅袅地升着——城破了，庙还在，香火还烧着。神像衣摆上那行字，还刷着漆。\n\n她站了一会儿，走了。\n\n她走到一条巷子的尽头，往王宫的方向看。王宫那边，灯火乱成一片——有人在跑，有人在喊，有人在收拾金银细软。那个人，那个在神像前题过字的王，听说退了进去——退上了鹿台。\n\n泠看了很久。\n\n晞在门里，也看了很久。\n\n\"……成了。\"晞说。\n\n\"嗯。\"泠说，\"它倒了。它自己倒的。\"\n\n\"……你本可以不来看的。\"\n\n\"嗯。\"泠说，\"可我想看着。我种下的东西，我得看着它长完。\"\n\n晞沉默了一会儿：\"……那现在呢？\"\n\n\"现在？\"泠看着王宫的方向，\"该去见他了。\"\n\n\"你见他做什么？\"\n\n\"让他知道——\"泠说，\"他在神像前题的那行字，有人看着。\"\n"}, {"id": 63, "title": "鹿台", "content": "# 第63章 鹿台\n\n纣王退上鹿台的时候，身边已经没什么人了。\n\n宫人跑了大半，侍卫散了，只有火盆还亮着。他坐在台上，把王冠摘下来，擦干净，又戴回去。他身后是堆起来的珠玉——他叫人搬来的，搬完了，人也就都跑了。\n\n鹿台很高。朝歌城里的乱，在台下，像隔了一层水。\n\n泠走上鹿台的时候，没有遇到一个人拦她。台阶很长，一路散着没来得及带走的东西：丢下的鞋，打翻的灯，一卷没卷完的帛书。风从台下吹上来，把她衣摆吹起来。她走得很慢，一步一步，走到台上。\n\n那个王坐在火光里。他听见脚步声，回过头，看着她。\n\n他看了她很久。\n\n\"……朕的鹿台，什么时候轮到野狐狸上来了？\"\n\n泠站在台阶口：\"我是自己走上来的。\"\n\n\"朕的侍卫呢？\"\n\n\"没有侍卫了。\"泠说，\"都跑了。\"\n\n纣王沉默了一会儿，笑了一下：\"……跑了好。省得朕一个个杀。\"\n\n他说完，又看着她：\"朕见过你。\"\n\n泠没有答。\n\n\"女娲宫。\"纣王说，\"朕的侍卫报过——女娲宫那边，闹过一只白狐。是你。\"\n\n\"……是我。\"\n\n纣王看着她，眼睛里的火盆光一跳一跳。他问：\"是你做的？\"\n\n\"我做的？\"\n\n\"朕的朝。朕的城。朕的天下。\"纣王一字一字地说，\"是你做的？\"\n\n泠站在火光里，说：\n
