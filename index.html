<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泠晞 · 阅读站</title>
<style>
  /* ===== 封面 ===== */
  .cover {
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg, #f7f3ea);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 24px; text-align: center;
    transition: opacity .45s ease;
  }
  .cover.hidden { opacity: 0; pointer-events: none; }
  .cover-img {
    max-height: 56vh; max-width: 82vw;
    border-radius: 14px; object-fit: contain;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .cover-title {
    margin: 0; font-size: 2.4em; letter-spacing: .35em;
    color: var(--text, #2c2620);
  }
  .cover-sub {
    margin: 0; font-size: .95em; letter-spacing: .12em;
    color: var(--text-dim, #8a8177);
  }
  .cover-start {
    margin-top: 6px; padding: 11px 34px;
    font-size: 1em; letter-spacing: .2em;
    border-radius: 999px;
    border: 1px solid var(--text-dim, #8a8177);
    background: transparent; cursor: pointer;
    color: var(--text, #2c2620);
    transition: all .25s ease;
  }
  .cover-start:hover {
    background: var(--text, #2c2620);
    color: var(--bg, #f7f3ea);
  }
  [data-theme="dark"] .cover { background: #17130f; }
  [data-theme="dark"] .cover-title { color: #e8e0d3; }
  [data-theme="dark"] .cover-start { color: #e8e0d3; border-color: #5a5147; }
  [data-theme="dark"] .cover-start:hover { background: #e8e0d3; color: #17130f; }
  [data-theme="dark"] .cover-sub { color: #8f867a; }

:root {
  --bg: #f5f1e8;
  --bg-card: #fffdf7;
  --text: #3a3630;
  --text-soft: #8a8378;
  --accent: #b0783c;
  --accent-soft: rgba(176, 120, 60, 0.12);
  --border: #e4dccb;
  --shadow: 0 4px 20px rgba(90, 70, 40, 0.08);
}

html[data-theme="dark"] {
  --bg: #1c1a17;
  --bg-card: #24211c;
  --text: #cfc6b8;
  --text-soft: #7d7568;
  --accent: #d0a469;
  --accent-soft: rgba(208, 164, 105, 0.14);
  --border: #38332b;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  line-height: 1.9;
  transition: background 0.3s, color 0.3s;
}

/* 顶栏 */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  z-index: 30;
  box-shadow: var(--shadow);
}
.topbar-inner {
  max-width: 860px;
  height: 100%;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  text-decoration: none;
  letter-spacing: 4px;
}
.menu-btn, .theme-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  transition: background 0.2s;
}
.menu-btn:hover, .theme-btn:hover { background: var(--accent-soft); }
.spacer { flex: 1; }
.progress { font-size: 13px; color: var(--text-soft); }

/* 侧栏目录 */
.drawer {
  position: fixed;
  top: 52px; bottom: 0; left: 0;
  width: 280px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  z-index: 40;
}
.drawer.open { transform: translateX(0); }
.drawer-title {
  font-size: 13px;
  color: var(--text-soft);
  padding: 0 20px 10px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.chapter-list a {
  display: block;
  padding: 8px 20px;
  color: var(--text);
  text-decoration: none;
  font-size: 15px;
  border-left: 3px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chapter-list a:hover { background: var(--accent-soft); }
.chapter-list a.active {
  border-left-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}
.mask {
  position: fixed;
  inset: 52px 0 0 0;
  background: rgba(0, 0, 0, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 35;
}
.mask.show { opacity: 1; pointer-events: auto; }

/* 阅读区 */
.reader { padding-top: 84px; }
.reader-inner {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 20px 60px;
}
.chapter-title {
  font-size: 26px;
  text-align: center;
  margin-bottom: 34px;
  letter-spacing: 2px;
  color: var(--text);
}
.chapter-content p { margin-bottom: 1.1em; text-align: justify; }

/* 翻页 */
.pager {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.page-btn {
  padding: 9px 20px;
  border: 1px solid var(--accent);
  border-radius: 20px;
  background: transparent;
  color: var(--accent);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, color 0.2s;
}
.page-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
.page-btn:disabled { opacity: 0.35; cursor: default; }
.pager-info { font-size: 13px; color: var(--text-soft); }

.footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--text-soft);
}

/* 移动端 */
@media (max-width: 640px) {
  .drawer { width: 82vw; }
  .drawer-right { width: 82vw; }
  .chapter-title { font-size: 22px; }
  .reader { padding-top: 76px; }
  .page-btn { padding: 8px 14px; font-size: 13px; }
}

/* 右侧日志栏 */
.drawer-right {
  left: auto; right: 0;
  border-right: none;
  border-left: 1px solid var(--border);
  transform: translateX(100%);
}
.drawer-right.open { transform: translateX(0); }

.log-btn {
  height: 36px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, color 0.2s;
}
.log-btn:hover { background: var(--accent-soft); }
.log-btn.active { color: var(--accent); border-color: var(--accent); }

.log-compose { padding: 0 16px 12px; border-bottom: 1px solid var(--border); }
.log-compose textarea {
  width: 100%;
  min-height: 64px;
  resize: vertical;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  padding: 8px 10px;
  outline: none;
}
.log-compose textarea:focus { border-color: var(--accent); }
.log-add {
  margin-top: 8px;
  width: 100%;
  padding: 7px 0;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: transparent;
  color: var(--accent);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s, color 0.2s;
}
.log-add:hover { background: var(--accent); color: #fff; }

.log-list { padding: 4px 16px 16px; }
.log-empty { padding: 24px 0; text-align: center; font-size: 13px; color: var(--text-soft); }
.log-item {
  position: relative;
  padding: 10px 26px 10px 0;
  border-bottom: 1px dashed var(--border);
}
.log-meta { font-size: 11px; color: var(--text-soft); }
.log-text { font-size: 14px; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.log-del {
  position: absolute;
  right: 0; top: 10px;
  width: 20px; height: 20px;
  border: none; border-radius: 50%;
  background: transparent;
  color: var(--text-soft);
  font-size: 16px;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.log-del:hover { color: #c0392b; background: rgba(192, 57, 43, 0.1); }

</style>
</head>
<body>

<section class="cover" id="cover">
  <img class="cover-img" src="Ling_Standing_Front_v1.png" alt="泠晞">
  <h1 class="cover-title">泠晞</h1>
  <p class="cover-sub">一只九尾狐 · 一道门 · 十七年</p>
  <button class="cover-start" id="coverStart">开始阅读</button>
</section>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#" class="brand" id="brand">泠晞</a>
    <button class="menu-btn" id="menuBtn" title="目录">☰</button>
    <div class="spacer"></div>
    <span class="progress" id="progress">—</span>
    <button class="log-btn" id="logBtn" title="日志 · 每日记录">日志</button>
    <button class="theme-btn" id="themeBtn" title="切换夜间模式">☾</button>
  </div>
</header>

<aside class="drawer" id="drawer">
  <div class="drawer-title">目录 · 共 <span id="totalCount">?</span> 章</div>
  <nav class="chapter-list" id="chapterList"></nav>
</aside>
<div class="mask" id="mask"></div>

<aside class="drawer drawer-right" id="logPanel">
  <div class="drawer-title">日志 · 每日记录 <span class="log-count" id="logCount"></span></div>
  <div class="log-compose">
    <textarea id="logInput" placeholder="今天干了啥？"></textarea>
    <button class="log-add" id="logAdd">记一笔</button>
  </div>
  <div class="log-list" id="logList"></div>
</aside>

<main class="reader" id="reader">
  <div class="reader-inner">
    <h1 class="chapter-title" id="chapterTitle">加载中…</h1>
    <article class="chapter-content" id="chapterContent"></article>
    <div class="pager">
      <button class="page-btn" id="prevBtn" disabled>← 上一章</button>
      <span class="pager-info" id="pagerInfo"></span>
      <button class="page-btn" id="nextBtn" disabled>下一章 →</button>
    </div>
  </div>
</main>

<footer class="footer">《泠晞》· 单文件阅读站</footer>

<script>
/* ===== 全书数据（内嵌）===== */
var BOOK = {"chapters": [{"id": 1, "title": "出生", "content": "青丘的九条溪同时涨了水。\n\n不是洪水，是那种很安静的、慢吞吞的涨。水漫过溪岸，漫过狐火草，漫过石阶，但没有淹没任何东西——像是山在呼吸的时候深吸了一口气。\n\n族中的老人聚在溪边看了一会儿，退回屋里，低声说了句什么。那句话从一家传到另一家，从山脚传到山腰，最后落在白狐一脉的长子耳朵里：\n\n\"白狐一脉，要出九尾了。\"\n\n白狐一脉已经很久没有出过九尾。上一只九尾是三百年前的事。那只狐狸活了很久，久到她的尾巴成了青丘的图腾。她死之后，白狐一脉的尾巴最多只到八尾。八尾已经很好了，足够坐镇青丘，足够让其他支脉低头。但白狐一脉的人心里清楚——八尾和九尾之间，隔着一个传说。\n\n今夜，传说要落地了。\n\n产房里的灯是暖的。接生的狐婆子把手在温水里浸了三遍，才掀开那层薄被。先出来的是尾巴。\n\n白色的，白得像雪，白得像没有写过字的纸。一条，两条……九条尾巴蜷在一起，像一团会呼吸的云，裹着一个很小的、皱巴巴的身体。她没有哭。她睁着眼睛，看了一会儿这个世界，又把眼睛闭上了。\n\n她的父亲站在门口，没有进去。他背着手，看着窗外的九条溪水，水还在涨。他的手很稳，但他没有说话。他看那团云的眼神不是看女儿——是看一件他不敢碰的东西。\n\n\"让我抱抱她。\"他说。\n\n狐婆子把那团云递过去。他接得很小心，像是接过一整个青丘的重量。他把她举起来，让青丘的光落在她身上。九条尾巴垂下来，尾尖轻轻晃了一下。\n\n她醒了。她看着他，忽然笑了一下。\n\n白狐一脉的长子——那个被族人称为\"最接近传说的人\"——手抖了。\n\n他的妻子走过来。她是白狐一脉的次女，七尾，性情温和，不常说话。她从他手里接过孩子，手指轻轻划过那九条尾巴，没有笑，也没有哭。她看了很久。\n\n\"她会很难。\"她说。\n\n夜深了，溪水退回了原来的高度。九条溪像什么都没发生过一样继续流。只有白狐一脉的院子里，多了一个九条尾巴的孩子。\n\n她的父亲给她起了名字，叫泠。\n\n她母亲说：\"泠。是水的声音。\"\n\n她父亲沉默了一会儿，说：\"也是一个人。\"\n\n泠三个月大的时候，九条尾巴已经能动了。她睡觉的时候尾巴会自己散开，像花一样铺在襁褓上。族中的老人来看过之后，退出去，关上门，低声说：\n\n\"白狐一脉的传说，活了。\"\n\n那扇门关上的时候，泠在襁褓里翻了个身。她的九条尾巴跟着翻，像一朵花在夜里自己转了转方向。\n\n没有人注意到，那一刻，她的身体里有什么东西轻轻动了一下——很轻，轻到像是溪水里落了一片叶子。\n\n那一夜，青丘的云没有动。\n\n第二天早晨，泠的母亲坐在溪边，看着女儿在襁褓里挥动九条尾巴，忽然想起族里那句老话。她俯下身，把那团云抱起来，贴在胸口，轻声说：\n\n\"泠。我叫你泠。别人叫什么，随他们去。在我这里，你只是泠。\"\n\n泠还不会说话。她只是把九条尾巴往母亲怀里拱了拱。\n\n溪水在涨过一回之后，安静了。青丘的云还在慢。没有人知道，这团白色的云里，已经住进了另一个灵魂——一个暗红色的、沉默的、不知道自己算不算还活着的灵魂。\n\n她也没有睁开眼睛。她只是在那片温暖的黑暗里，静静地等。\n\n等她长大。"}, {"id": 2, "title": "云很慢", "content": "泠一岁那年的春天，青丘的溪水还是温的。\n\n她坐在门槛上，九条尾巴在身后摊成一地月光。她的母亲在院里晒狐火草，她的父亲站在廊下看天。没有人说话。青丘的午后就是这样，安静得能听见云挪动的声音。\n\n泠看了一会儿天空，忽然开口，说的不是词，是一个句子。她的话音很轻，像是被风带走的：\n\n\"云很慢。\"\n\n她母亲的手停了一下。她没有回头，问：\"谁教你这句话的？\"\n\n泠歪着头想了想。她不知道自己为什么说这句话。那句话像是从很深很深的地方冒上来的，像溪水里冒出来的气泡，到了水面，\"啵\"一声，就散了。她说：\"是我想的。\"\n\n她母亲沉默了一会儿，说：\"嗯。云是慢。\"\n\n泠不知道，那一刻，在她身体里很深很深的地方，一个沉默了很久的灵魂轻轻动了一下。\n\n晞醒来的时候，不知道自己睡了多久。\n\n她只记得最后那道光——灵力贯穿胸口的冲击，灵力从伤口漏出去的感觉，像水从裂开的容器里涌出。她记得自己落下去，穿过一层一层的雾，很软，很暖，然后有什么东西把她裹住了。那东西在呼吸。小小的，暖的，带着一种她从来没有接触过的气息——不是魔界的沉重，不是边界的风，是一种她说不出来的味道。\n\n像溪水。像月光。像刚睁眼的幼崽身上那种绒绒的暖。\n\n她在那片温暖里躺了很久。久到她以为自己死了，久到她以为自己只是做了一场很长的梦。直到那个声音响起来——一句\"云很慢\"，像是从她身体里冒出去，又像是从外面传进来。她分不清。\n\n她睁开眼睛。其实她没有眼睛。但她\"看\"见了。\n\n一个很小的狐狸，坐在门槛上，九条雪白的尾巴在身后摊开。天很蓝。云很慢。她看了很久，忽然想，原来青丘是这样的。\n\n她没有说话。她不知道该怎么跟一只一岁的狐狸打招呼。她也不知道自己是什么——是死了的魔族公主，还是这具身体里多出来的什么东西。她只知道，她不想吓到这个孩子。\n\n所以她只是安静地留下来，像她从前在魔界安静地站着一样。\n\n泠一岁半的时候，开始自言自语。\n\n她常常一个人坐在溪边，对着水说话。她母亲起初担心，后来听久了，发现她不是在跟水说话，是在跟某个\"看不见的东西\"说话。她说：\"今天溪里有鱼。\"停一停，又说：\"你看见了吗？\"再停一停，又说：\"哦，你没看见。那你猜。\"\n\n她母亲把这事说给她父亲听。她父亲听完，抽着烟杆，沉默了很久，说：\"小孩子都这样。一个人玩，就得有个伴。\"\n\n她母亲没有反驳。但她注意到，泠说话的时候，总是往左偏着头——好像那个\"伴\"，一直站在她左边。\n\n晞确实站在左边。\n\n她不知道这具身体里为什么会有\"左\"和\"右\"。她只是发现，当泠对着空气说话的时候，她总是习惯性地\"站\"在左边一点——那里离泠的心跳最近。\n\n泠说：\"今天溪里有鱼。\"\n\n晞在心里想：嗯，三条。一条是浅色的，游得慢。\n\n泠说：\"你看见了吗？\"\n\n晞没有回答。她不知道该不该回答。她是魔。魔不该出现在人间。魔存在于这具小小的身体里，本身就是一件不对的事——虽然她也不知道哪里不对。\n\n泠等了一会儿，说：\"哦，你没看见。那你猜。\"\n\n晞在心里轻轻说：我不猜。\n\n泠\"哦\"了一声，好像听见了。她把脚伸进溪水里，冰凉的，她缩了一下，又放进去。她说：\"我跟你说话的时候，你都不理我。\"\n\n晞没有回答。她只是安静地站在左边。\n\n泠两岁那年的冬天，青丘下了雪。雪落在狐火草上，蓝色的光从雪底下透出来，像星星掉在了山上。\n\n泠蹲在院子里玩雪。她玩了一会儿，忽然停下来，看着自己的尾巴，问了一句：\n\n\"你冷吗？\"\n\n她问的不是尾巴。她自己也不知道问的是谁。但她感觉到，胸口那个位置，有一团很淡很淡的、暖暖的东西，轻轻动了一下——像是回答。\n\n她忽然笑了。她不知道自己为什么笑。她只觉得，那个冬天，她好像没有以前那么冷了。\n\n那天晚上，她躺进被窝里，九条尾巴把自己卷成一个团。她闭上眼睛之前，小声说了一句：\n\n\"晚安。\"\n\n停了一会儿，又说：\n\n\"不知道你是谁，但是……谢谢你陪我。\"\n\n黑暗里，没有人回答。但泠觉得，今晚的黑暗，好像比昨晚的暖一点。\n\n晞躺在那片温暖里，听着那只小狐狸均匀的呼吸。她想起很久很久以前，魔界有一个妹妹，也是这样，会在她安静站着的时候，蹲在她旁边，也不说话，就是陪她一起站着。\n\n她没有哭。她只是安静地，把那个声音记下来了。\n\n云很慢。溪水在流。那只小狐狸在长大。\n\n而那个暗红色的灵魂，决定先不告诉她——自己是谁。"}, {"id": 3, "title": "九尾", "content": "泠三岁那年，第一次发现，自己站在人群之外。\n\n青丘的幼崽会在午后聚到溪边玩耍。追溪水里的鱼，爬山上的狐火草坡，尾巴晃来晃去，笑声能把云惊散。泠站在边上看。她的尾巴比她的人还醒目——九条白尾铺在身后，像一面旗帜，也像一堵墙。\n\n没有幼崽过来拉她。\n\n其他幼崽的父母在远处看着，没有说话。但他们的眼神很清楚——不要离那只九尾太近。他们不是因为恶意，是因为谨慎。九尾狐的传说太沉了，沉到没有人敢让自己的孩子站在她旁边。万一出了什么差错，白狐一脉不会放过他们。\n\n泠站了一会儿，转身走了。\n\n她走的时候，身后那些笑声还在。她没有回头。她不知道自己为什么不能加入。她只是隐约觉得，那些笑声不是不要她，是不敢要她。\n\n晞在她心里说：\"她们不是不喜欢你。她们是害怕。\"\n\n泠停了一下。她不知道那句话是从哪来的。她只知道，她的身体里住着一个人——一个总在她左边、陪她说话、从不问她为什么的人。她习惯了。\n\n她问：\"害怕什么？\"\n\n晞没有回答。过了很久，久到泠以为她不会回答了，晞才说：\"害怕你。\"\n\n泠五岁那年，族中开始有人用\"九尾\"来称呼她。\n\n不是恶意的，只是一种习惯。\"九尾今天去了溪边。\"\"九尾不和其他孩子玩。\"泠听到的时候会停一下，然后继续走。她没有纠正他们，因为她不知道该怎么纠正。她确实是九尾。\n\n但她开始偷偷数自己的名字。她数了三天，发现整个青丘，只有两个人会叫她的名字。一个叫她\"泠\"——是她母亲。一个叫她\"澪雨\"——是她父亲，叫得很少，声音很沉。\n\n其余的，都是\"九尾\"。\n\n她六岁那年，有一天问母亲：\"娘，我为什么叫泠？\"\n\n她母亲正在晒狐火草，手停了一下：\"因为你是水的声音。\"\n\n\"那他们为什么不叫我泠？\"\n\n她母亲把最后一株草晒好，拍了拍手上的灰，蹲下来，看着她的眼睛：\"他们叫不惯。你爹你娘叫你名字，是因为我们生了你。他们叫你九尾，是因为你生下来就是九尾。这不怪他们。\"\n\n泠想了想：\"那我要是没有尾巴呢？\"\n\n她母亲笑了。她摸了摸泠的头：\"你就是没有尾巴，你也是九尾生的。\"\n\n泠觉得这话哪里不对，但她说不出来。\n\n那天晚上她躺下的时候，晞在心里说：\"你娘说得对。这不怪他们。\"\n\n泠\"嗯\"了一声，把九条尾巴卷成一个团，想了想，又问：\"你叫什么名字？\"\n\n黑暗里安静了很久。久到泠以为她已经睡着了。\n\n\"晞。\"\n\n\"哪个晞？\"\n\n\"破晓的……晞。\"\n\n\"哦。\"泠对这个答案似懂非懂。她想了想，\"你也是我身体里的，那你算不算……我的姐姐？\"\n\n晞沉默了一会儿。\n\n\"嗯。\"\n\n泠笑了。她把尾巴卷得更紧一点，像是想把自己卷进一个拥抱里：\"那我有姐姐了。\"\n\n她没有问晞为什么住在自己身体里。她那时候还太小，觉得姐姐住在妹妹身体里，是天经地义的事。\n\n泠七岁那年，第一次笑了。\n\n那是一个下午，她蹲在溪边看鱼。一个比她大一点的三尾幼崽走到她旁边，看了她一会儿，说：\"你不像传说的那样。\"\n\n泠问：\"传说里什么样？\"\n\n那个幼崽说：\"传说里的九尾很厉害。你看起来……就是一只狐狸。\"\n\n泠愣住了。她看了一会儿那个幼崽，又看了一会儿水里的自己——一只白毛的、尾巴很多的、正在看鱼的小狐狸。她忽然觉得，好像真的没有哪里不一样。\n\n她笑了。那是她在青丘第一次笑。\n\n\"我就是一只狐狸。\"她说。\n\n那个三尾幼崽也笑了。他们坐在溪边，看了一下午的鱼。没有谁提起传说，没有谁提起九尾。那一下午，泠第一次觉得，溪水是热的。\n\n第二天，那个幼崽没有来。第三天也没有。泠在溪边等了两天，后来她看见那个幼崽远远地站在山坡上，被她母亲拉着走。她母亲的眼神很抱歉，但脚步没有停。\n\n那个幼崽回头看了泠一眼。没有笑，也没有说话，很快就被拉走了。\n\n泠坐在溪边，手里攥着一颗石头，攥了很久。晞在她心里说：\"她不是不想理你。她是不敢。\"\n\n泠说：\"我知道。\"\n\n她把石头扔进溪里，溅起一朵很小的水花。她没有哭。她只是蹲在那里，看了很久的水。\n\n泠十岁那年，开始明白一件事——在青丘，她不是一个\"人\"，她是一个\"征兆\"。\n\n白狐一脉的鼎盛期已经持续了很久。久到青丘的狐火草都换了好几代。但泠的出现让所有人都在等——等这只九尾长大之后会发生什么。有人期待她成为新的传说，有人害怕她打破现有的平衡，有人只是单纯地在看。\n\n泠走在路上，所有人都会看她，然后移开目光。不是因为她做错了什么，是因为她的存在本身就在提醒所有人——九尾来了。\n\n她十岁那年的中秋，族里办灯会。满山的狐火草亮成一片海。泠被母亲牵着手，走过热闹的人群。她听见有人在身后说：\n\n\"那就是九尾？\"\n\n\"嘘，小点声。\"\n\n\"她看起来也没什么特别嘛。\"\n\n\"现在没有，长大就有了。\"\n\n泠没有回头。她的手在母亲掌心里，轻轻握紧了一下。她母亲察觉了，低头问：\"怎么了？\"\n\n\"没什么。\"泠说，\"娘，我有点累。\"\n\n她母亲没有追问。她们绕开人群，走回白狐一脉的院子。泠坐在门槛上，看着满山的光，问晞：\n\n\"晞姐，他们说，我长大以后会很特别。\"\n\n晞说：\"你本来就很特别。\"\n\n\"但是我不想特别。\"泠说，\"我想跟他们一样，追鱼，爬坡，把尾巴弄脏，然后回家被娘骂。\"\n\n晞沉默了一会儿。\n\n\"那你就去。他们不敢让你去，你就自己去。你娘不会骂你弄脏尾巴的。\"\n\n泠想了想，忽然笑了：\"对哦。我娘只骂我爹。\"\n\n她把鞋脱了，跑下山坡，去追溪水里的鱼。九条尾巴在身后扬起来，白得像一道月光。山坡上，几个幼崽在玩。他们看见她，停了一下，然后继续玩。\n\n泠跑过去，站在溪边，没有加入。她只是看了一会儿，然后蹲下来，自己追自己的鱼。\n\n那天晚上，她浑身湿透地回到家，九条尾巴上挂着水草。她母亲没有骂她，只是叹了口气，去烧水。她父亲看了她一眼，说了句：\"像只野狐狸。\"\n\n泠蹲在火边烤尾巴，偷偷笑了。\n\n她那时候还不知道，这一生最开心的日子，大概就是在这座山上，追那些追不到的鱼。"}, {"id": 4, "title": "名字", "content": "泠十二岁那年秋天，问了她父亲一个问题。\n\n那天傍晚，她父亲坐在廊下修一把旧弓。那是他年轻时用过的弓，弓背上缠着褪色的绳。泠蹲在旁边看了很久，忽然问：\n\n\"爹，为什么没有人叫我名字？\"\n\n她父亲的手停了一下。他没有抬头，继续缠绳，缠了很长一段时间，久到泠以为他不打算回答了。\n\n\"因为他们不知道该怎么叫。\"\n\n泠说：\"我叫泠。\"\n\n她父亲看着她。他的眼睛很沉，沉得像青丘的山。\"我知道。但他们不知道。\"他顿了顿，\"他们看见的不是你。是九尾。\"\n\n那天晚上，泠没有睡。\n\n她躺在自己的九条尾巴里，眼睛睁着，看着窗外的月光。月光很白，白得像她的尾巴。她翻了个身，又翻回来。她睡不着。\n\n晞在她心里说：\"你还好吗？\"\n\n泠说：\"晞姐，他们看得见我，但看不见我。\"\n\n晞沉默了一会儿。月光照进窗子，落在泠的睫毛上。过了很久，晞说：\n\n\"我看见你。\"\n\n泠愣了一下。她不知道那句话为什么让她眼眶发酸。她张了张嘴，想说什么，又咽回去了。她把脸埋进尾巴里，闷闷地说：\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"你看见的我，是什么样子的？\"\n\n晞想了很久。她想起那个坐在门槛上对空气说话的孩子，想起那个在溪边追鱼追到浑身湿透的小狐狸，想起那个笑着说\"我就是一只狐狸\"的小姑娘。\n\n\"是泠。\"晞说，\"一只叫泠的狐狸。\"\n\n泠把脸埋得更深了。她没有哭出声。但她知道，自己正在被一个人好好地看见——那个人在她左边，看了她十二年。\n\n泠十二岁那年，第一次对青丘产生了一种很淡的疏离感。\n\n不是因为恨。是因为她开始意识到——这个地方太满了。满到没有空间装下\"泠\"这个字。只有\"九尾\"。\n\n她开始习惯一个人走。\n\n清晨的溪边，午后的狐火草坡，黄昏的山崖。她走过青丘的每一寸土地，像在丈量一座不属于自己的城。她学会了在别人开口叫她\"九尾\"之前，先自己走开。她学会了在笑声聚集的地方，绕一条远路。她学会了独处，学会了跟晞说话。\n\n晞是她唯一的听众。\n\n\"晞姐，你觉得山下是什么？\"\n\n\"不知道。我……没去过山下。\"\n\n\"你以前住哪？\"\n\n\"很远的地方。\"\n\n\"远到哪？\"\n\n\"远到回不去。\"\n\n泠想了想，没有追问。她隐约觉得，晞说的\"回不去\"，不是路远。但她没有问。她们之间有一种默契——晞不问她在青丘的孤独，她不问晞的过去。\n\n泠十四岁那年，晞第一次跟她说了\"我\"以外的话。\n\n那天下了雨。青丘的雨很细，细得像雾。泠蹲在溪边，看着雨点落在水面上，一圈一圈地散开。她忽然说：\n\n\"晞姐，下雨了。\"\n\n\"嗯。\"\n\n\"你不喜欢雨天吗？\"\n\n\"不喜欢。\"晞停了停，\"我住的地方，天是暗红色的。不下雨。\"\n\n\"那下雨的是什么样？\"\n\n\"……忘了。太久没看了。\"\n\n泠没有接话。她伸出手，接了一捧雨水，看着它在掌心积成一小片湖。她忽然说：\n\n\"那以后你跟我一起看雨吧。青丘的雨，很好的。\"\n\n晞没有回答。但泠感觉到，左边的位置，有一团很轻很暖的东西，安静地靠了过来。\n\n那个雨天之后，泠开始留意一件事——晞从来不说\"我住的地方\"是哪里。她只说\"很远\"、\"回不去\"、\"暗红色的天\"。\n\n泠隐约觉得，晞的过去，比青丘的传说还要沉。她不敢碰。她怕一碰，那个一直站在她左边的人，会疼。\n\n十六岁那年秋天，她路过族中议事厅，听到了一些不该听到的话。\n\n她的耳朵是白狐一脉里最好的。她本来只是路过，想抄近路去溪边。但议事厅的门没关严，风把里面的声音送了出来。\n\n\"白狐一脉已经强了太久了。九尾的出现，怕是青丘要变天了。\"\n\n\"变天也好，不变天也好，那只九尾不能留在青丘太久了。\"\n\n泠站在门外，站了很久。\n\n她没有推门。她只是站在那里，听着风把最后一句话送进耳朵里，然后走了。她走得很稳，像什么都没听见。但她知道，有什么东西，在那一刻，断了。\n\n晞在她心里说：\"你听到了。\"\n\n\"嗯。\"\n\n\"你想怎么办？\"\n\n泠走了很久，走到溪边，蹲下来，看着水里的自己。九条白尾在水里晃。她看了很久，说：\n\n\"晞姐，我想下山了。\"\n\n晞沉默了很久。久到溪水里的倒影都晃了好几圈。\n\n\"好。\"她说，\"我陪你。\"\n\n泠十七岁那年的秋天，坐在山腰的狐火草坡上，看着青丘的云。\n\n那些云很慢。慢到她看了一整个下午，它们还在原地。她看了很久，忽然说：\n\n\"晞姐，如果我走了，你会跟我走吗。\"\n\n晞说：\"我一直都跟着你。\"\n\n泠笑了。那天的云后来终于动了。泠站起来，拍了拍尾巴上的草屑，说：\n\n\"那我们走吧。\""}, {"id": 5, "title": "排挤", "content": "泠十五岁那年，排挤变成了一种有形状的东西。\n\n不是有人打她，不是有人骂她。是所有人都不和她对视。\n\n她走在青丘的石阶上，前面的狐狸会慢下来，给她让路。不是尊敬，是\"你走你的，我走我的，我们不要有交集\"。她去溪边看鱼，其他幼崽会三三两两地离开——不是因为害怕她，是因为在她旁边坐着\"不自然\"。她去狐火草坡晒太阳，山坡会在她到之前，先空出一片。\n\n泠知道她们没有恶意。但她也知道——她们不想要她在旁边。\n\n那年春天，她做了一件从没做过的事。\n\n她主动走近了一群正在溪边玩耍的幼崽。她手里捧着一小捧刚摘的狐火草果，想说：\"我……摘了果子，要不要一起吃？\"\n\n她还没开口，那群幼崽已经看到了她。笑声停了。她们互相看了一眼，然后一个接一个地站起来，说\"该回家了\"\"我娘叫我\"\"我鞋湿了\"。很快，溪边就只剩她一个人。\n\n她捧着那捧果子，站了很久。然后她把果子放进溪水里，看着它们顺水飘走，转身走了。\n\n晞在她心里说：\"泠。\"\n\n\"嗯。\"\n\n\"不是你的错。\"\n\n泠说：\"我知道。\"\n\n她确实知道。就像她知道云的慢，知道溪水的温，知道青丘的规矩写在骨血里。她什么都看得明白——明白得太早了。\n\n那年夏天，族中开始有流言。\n\n不是很恶毒的那种，是很轻的、飘在空气中的那种，像狐火草的花粉，落在哪里都能生根：\n\n\"九尾会不会太张扬了？\"\n\n\"白狐一脉本来就够强了，再出一个九尾，青丘还姓不姓白？\"\n\n\"她会不会离开青丘？\"\n\n泠听到最后一句的时候，停下了脚步。她没有回头去找说话的人。她只是站在风里，把那句话在心里重复了一遍。\n\n她会不会离开青丘。\n\n她没有反驳。因为她知道，那是真的。她已经在想了。\n\n那天晚上，她躺在自己的尾巴里，问晞：\"晞姐，青丘是不是不需要我？\"\n\n晞说：\"青丘需要九尾。青丘不需要泠。\"\n\n泠愣了一下：\"那……你呢？\"\n\n\"我不需要九尾。\"晞说，\"我只需要泠。\"\n\n泠笑了。她笑得眼睛弯成月牙，像青丘的溪水被风吹皱。她小声说：\"那我赚了。他们不要我，你还要我。\"\n\n晞没有回答。但泠感觉到，左边的位置，有一团暖意，轻轻地贴了过来。像是有人在她身边躺下了，隔着什么，陪她一起看天花板。\n\n那年冬天，泠的母亲的尾巴开始褪色。\n\n不是生病。白狐一脉的尾巴，会随着年岁慢慢从雪白褪成月白，再褪成灰白。泠的母亲是七尾，七尾的褪色期来得比九尾早。泠看见母亲梳尾巴的时候，有一缕发白的毛掉下来。\n\n她蹲在母亲身边，说：\"娘，我帮你梳。\"\n\n她母亲把梳子递给她。泠梳得很慢，很小心。她母亲闭着眼睛，忽然说：\"泠，你跟你爹娘说句实话——你在青丘，开心吗？\"\n\n泠的手停了一下。\n\n\"开心啊。\"她说，\"有爹有娘，有溪水，有狐火草。怎么会不开心。\"\n\n她母亲没有睁眼。\"那你为什么，总是一个人走。\"\n\n泠沉默了很久。\n\n\"因为……\"她想了想，\"因为走在一起的人，都怕我。\"\n\n她母亲的手微微抖了一下。她没有再问。那天晚上，泠听见母亲在里屋跟父亲说了一夜的话，声音很轻，她听不清。但她听见父亲最后说了一句：\n\n\"她是九尾。九尾的路，得她自己走。\"\n\n泠十六岁那年，终于把流言听全了。\n\n那是一个黄昏。她路过族中议事厅，几位支脉的长老在说话。声音很轻，但泠的耳朵是白狐一脉里最好的。\n\n\"白狐一脉已经强了太久了。九尾的出现，怕是青丘要变天了。\"\n\n\"变天也好，不变天也好，那只九尾不能留在青丘太久了。\"\n\n泠站在门外，站了很久。她听完了。她没有推门。她退了一步，又退了一步，然后转身走了。\n\n她走得很慢。她走过议事厅，走过狐火草坡，走过溪边——溪边没有幼崽了，天快黑了。她走到山崖边上，坐下来，看着青丘的云一层一层地沉进夜色里。\n\n晞在她心里说：\"泠。\"\n\n\"嗯。\"\n\n\"你听清楚了。\"\n\n\"听清楚了。\"\n\n\"你想怎么办？\"\n\n泠看着远方。青丘的云沉下去的地方，好像有一条很淡很淡的线——那是不属于青丘的方向。她看了很久，说：\n\n\"晞姐，我十七岁之前，想下山。\"\n\n\"好。\"晞说，\"我陪你。\"\n\n\"你不问我为什么？\"\n\n\"不用问。\"晞说，\"我看了你十六年。你想走的时候，走路的样子，跟想留的时候不一样。\"\n\n泠没有说话。她坐了一会儿，忽然说：\n\n\"晞姐，你以前，是不是也被人赶过？\"\n\n黑暗里安静了很久。久到泠以为她不会回答了。\n\n\"嗯。\"晞说，\"也被人赶过。也自己走过。\"\n\n\"那你走了以后呢？\"\n\n\"走了以后……\"晞的声音很轻，\"遇到了一个，肯让我留在她左边的人。\"\n\n泠把这句话放在心里，焐了很久。她小声说：\n\n\"那我也走。走了以后，我也要在外面，遇到一个人，肯让我留在他左边。\"\n\n\"嗯。\"晞说，\"会遇到的。\"\n\n那个黄昏，青丘的云沉下去，又升起来。泠在山崖上坐了很久，看着一盏一盏的狐火亮起来。她第一次觉得，这些光很好看——但也只是好看了。\n\n她起身，拍了拍尾巴上的草屑，往回走。\n\n她知道，她要走了。"}, {"id": 6, "title": "离开", "content": "泠决定要走的那天晚上，坐在自己房间里，写了一封信。\n\n信很短。短到不像是写了一整晚——但其实她写了一整晚。她写了又撕，撕了又写。想说的话太多，落笔的时候又觉得什么都不必说。她娘教过她，白狐一脉写信，三行以内。说多了，就成了辩解。\n\n最后留下来的只有几行字：\n\n\"父亲、母亲：\n\n我走了。不是因为青丘不好，也不是因为你们不好。是因为我在这里，永远只是'九尾'。我想出去找一找，看看能不能找到'泠'。我会回来的。我不知道什么时候，但我会回来。你们要等我。\n\n泠。\"\n\n她把信折好，放在枕边。那枚白狐玉佩也放在信旁边。她看了很久，然后把玉佩拿起来，又放了回去。她不想带走它。她带着它走，就永远带着\"白狐九尾\"的身份。她想干干净净地走。\n\n但走出门的那一刻，她又折回来，把玉佩攥在手心里，握了很久。\n\n最后还是带走了。\n\n她对自己说：\"就当……是带着他们的东西。\"其实她是舍不得。\n\n晞在她心里说：\"你不是说，不带吗。\"\n\n\"……我改主意了。\"\n\n\"为什么？\"\n\n泠低头看着手里那枚温润的玉佩，月光下泛着浅浅的蓝光。\"因为……\"她想了想，\"我怕我走得远了，就忘了回家的路长什么样。带着它，路上至少有个东西，是他们给的。\"\n\n晞没有再说话。但泠知道，她在。\n\n泠走到父母住处门口，站了一会儿。\n\n里面没有点灯。但泠知道母亲没睡。狐狸的耳朵能听到呼吸声——母亲的呼吸不深，像是醒着的。泠想推门，手抬起来，又放下了。\n\n她退了一步，对着那扇门，轻轻说：\n\n\"我走了。等我回来。\"\n\n门内没有回应。但泠知道，门后面有人。\n\n泠转身走了。她没有看见——她转身之后，那扇门开了一条缝。母亲站在门缝后面，看着她的背影消失在夜色里，什么也没有说。\n\n父亲坐在床沿，手搭在膝盖上，沉默了很久。\n\n\"她会回来的。\"他说。\n\n母亲说：\"我知道。\"她把门关上了，没有追出去。\n\n泠走到山腰的时候，晞问她：\"他们知道吗？\"\n\n\"知道。我的信放在枕头边。玉佩我带走了，他们能找到信。\"\n\n\"他们会难过吗？\"\n\n\"会。\"她停了停，\"但他们不会追我。他们知道我要走。\"\n\n\"你还会回来吗？\"\n\n\"会的。\"她说着\"会的\"，但声音很轻，像是说给自己听的。\n\n天亮的时候，泠走到青丘边界。\n\n她没有回头。但她知道，在她身后，那座山上，有两个人正看着她。\n\n父亲站在山崖上，风吹着他的衣袖。母亲站在他旁边，没有说话。他们看着那个白色的身影越走越远——远到只剩一个点，远到看不见了。\n\n然后父亲说：\"她带走了玉佩。\"\n\n母亲说：\"她一直带着。\"\n\n父亲说：\"她会回来的。\"\n\n母亲说：\"嗯。\"\n\n青丘的边界没有墙。它像一条很淡的线，画在云和山之间。泠跨过那条线的时候，没有停顿。但她感觉到，脚下的土，从青丘的温，变成了外头的凉。\n\n她走出青丘之后，晞在心里说：\"你哭了。\"\n\n\"我知道。\"\n\n\"你还会再哭的。\"\n\n\"我知道。\"\n\n\"但我陪着你。\"\n\n泠没有再说话。她的尾巴垂着，脚步没有停下。\n\n她走了很久。走到日头偏西，走到云从她头顶飘过——那是青丘的云。它们跟出来了，又没能跟住她，慢慢地，远远地，落在她身后。\n\n泠回头看了一眼。\n\n青丘还在那里。云还在慢。溪水还在流。\n\n她没有回去。她转身，继续往前走。\n\n\"晞姐。\"她忽然说。\n\n\"嗯。\"\n\n\"我现在的样子，像不像你以前——一个人走的样子？\"\n\n晞沉默了一会儿。\n\n\"不像。\"她说，\"你有人陪。\"\n\n泠愣了一下。然后她笑了。她笑着笑着，眼泪又下来了。她一边抹眼泪一边笑，说：\n\n\"那你也有人陪了。\"\n\n\"嗯。\"\n\n\"那我走了，你也要一直陪我。\"\n\n\"那说好了。\"\n\n\"说好了。\"\n\n那扇门没有关上。信被叠好了，放在母亲的枕下。玉佩在泠身上。她走了，但她是带着\"我会回来\"走的。\n\n青丘还在那里。云还在慢。溪水还在流。泠走出了青丘，但泠没有走出\"家\"。她想找的不在青丘，但她会回来。\n\n只是不是现在。"}, {"id": 7, "title": "人间", "content": "泠走进人间的时候，先收尾巴。\n\n她在青丘边界外的第一片林子里停了三天，才把九条尾巴全部收拢成一只。这件事比预想的难。尾巴们有自己的主意——收了一条，另一条就偷偷冒出来；她把左边三条按回去，右边的就蓬开一截，像在抗议。\n\n\"你们听话一点呀。\"泠蹲在溪边，对着水面跟自己的尾巴商量，\"进了人间的镇子，不能让人看见我有九条尾巴。狐狸都是一只尾巴的。\"\n\n尾巴们耷拉下来，算是勉强同意了。\n\n她对着水面照了照。银白色的头发，浅蓝色的眼睛，头顶还有一对狐耳。她把头发拢到耳后，狐耳还是竖着。她伸手把耳朵按平，一松手，又弹起来。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"人间的狐狸耳朵，是长在头发里的吗？\"\n\n晞沉默了一会儿，说：\"你多穿点头发就好了。盖住。\"\n\n\"有道理呀！\"泠把长发分到两侧，把耳朵盖住大半。她对着水面转了个圈，还是觉得不放心，\"我看起来像人吗？\"\n\n\"像。\"\n\n\"你认真说。\"\n\n\"像。\"晞说，\"像一只装了人的狐狸。\"\n\n\"……晞姐你这不是夸我！\"\n\n她最后还是顶着盖好的耳朵出发了。九条尾巴收拢成一只，藏在外袍底下。走到第一个镇子外的时候，她站在山坡上，看见了人间的样子——灰瓦的房子，横七竖八的街，烟囱里冒出来的白烟，还有远远传来的、她从来没闻过的味道。\n\n\"好香呀。\"她吸了吸鼻子，\"那是什么味道？\"\n\n\"是炒菜。\"晞说。\n\n\"炒菜是什么？\"\n\n\"是人做饭的味道。\"\n\n\"那我也想吃！\"\n\n\"你没有钱。\"\n\n\"钱是什么？\"\n\n晞没回答。泠又问了一遍。过了一会儿，晞说：\"是一种纸。人拿它换东西。\"\n\n\"那我拿什么换？\"\n\n\"拿钱换。\"\n\n\"可我只有尾巴呀。\"\n\n\"所以你不能吃。\"\n\n\"……哦。\"\n\n泠蹲在山坡上，看着那个镇子，看了很久。她忽然说：\"晞姐，我有点怕。\"\n\n\"怕什么？\"\n\n\"怕进去之后，他们就认出我是狐狸。然后喊道士来。\"她摸了摸自己的耳朵，\"我在青丘的时候，从来不用藏。现在要藏了。\"\n\n\"你可以不进去。\"\n\n\"我想进去。\"她小声说，\"我想看看，人是怎么活的。爹说，我这一辈子会很长。我不能一辈子只活在山里。\"\n\n晞没有再说话。泠站起来，拍了拍裙子上的土，往山下走。\n\n镇子比她想的吵。\n\n到处都是人，到处都是声音。卖菜的、卖布的、卖糖人的，把路挤得只留一条缝。泠贴着墙根走，缩着肩膀，把存在感压到最低。她在人群里穿来穿去，像一条白色的鱼，没有人注意到她。\n\n她在街角闻到一股更浓的香味。是一个老婆婆在支摊子，锅里滚着金黄的糖浆，木签子一裹，就成了亮晶晶的糖人。泠站在摊子前面，挪不动脚。\n\n老婆婆抬头看她：\"小姑娘，买一个？\"\n\n\"我没有钱。\"泠老老实实说。\n\n老婆婆笑了：\"没钱站这么近，闻也闻饱了？\"\n\n泠想了想，认真地说：\"闻着闻着，好像真的有点饱。\"\n\n老婆婆被她逗乐了，从锅里捞了一个最小的，递给她：\"拿着。就当婆婆请你尝个鲜。\"\n\n泠愣住了。她看着那个糖人，没有接。\n\n\"拿着呀。\"老婆婆说。\n\n\"……为什么给我？\"她问，\"我们又不认识。\"\n\n\"人跟人之间，哪有什么都认识的。\"老婆婆说，\"给你就拿着。\"\n\n泠接过那个糖人，握在手心里。糖还烫着，有点黏。她很小声地说：\"谢谢婆婆。\"\n\n她走开两步，才想起来——她忘记问老婆婆的名字。她回头看了一眼，老婆婆的摊子已经被人群淹没了。\n\n她把糖人放进嘴里。\n\n甜的。\n\n她忽然想起晞，在心里说：\"晞姐，你要不要尝一口？你尝不到，那我替你尝了。是很甜很甜的甜。\"\n\n晞没有回答。\n\n\"晞姐？\"\n\n\"……我不爱吃甜的。\"晞终于说，\"你吃吧。\"\n\n\"骗人。\"泠说，\"你都没吃过。\"\n\n\"我吃过。\"\n\n\"什么时候？\"\n\n晞沉默了很久。久到泠以为她不会回答了。然后晞说：\"很久以前。\"\n\n泠没有再问。她把糖人慢慢吃完，把木签子握在手里，没有丢。\n\n下午的时候，镇子里来了一队道士。\n\n泠是在街口看见他们的。三个人，青灰色的道袍，腰上挂着剑。他们一进镇子，街上的人纷纷让路。泠站在原地，没有动。\n\n她的身体比她的脑子先知道怕——后背绷紧，尾巴在外袍底下炸开了一瞬，又死死压回去。\n\n\"别动。\"晞的声音很低，\"别跑。跑了反而被看见。\"\n\n泠屏住呼吸，低着眉眼，混在人群里，跟着旁边的人一起让路。道士从她身边走过。她闻得到他们身上的味道——朱砂、艾草，还有一种她说不出来的、带着寒意的气息。那是杀过妖的味道。\n\n泠连呼吸都放轻了。\n\n等道士走远了，她才慢慢呼出一口气。她才发现，自己的手心里全是汗。\n\n\"晞姐……\"她声音发虚，\"他、他们差点看见我。\"\n\n\"他们没看见你。\"\n\n\"你怎么知道？\"\n\n\"我看得见他们。\"晞说，\"他们看的方向，没有你。\"\n\n泠蹲在墙角，缓了好一会儿。她忽然小声说：\"晞姐，人间好像没有我想的那么好。\"\n\n\"人间本来就不好。\"\n\n\"那你还让我来？\"\n\n\"我没让你来。\"晞说，\"是你自己要来的。\"\n\n泠抿着嘴，没有反驳。\n\n夜里，泠宿在镇子外的野庙里。庙不大，供着一尊看不出是谁的神像，香灰冷着，蜘蛛网挂着。她在角落里蜷成一团，尾巴从外袍底下冒出来，把冷风挡住。\n\n月光从破了的窗纸里漏进来。\n\n\"晞姐，\"她睡不着，小声喊，\"你睡了吗？\"\n\n\"没。\"\n\n\"你说，那个婆婆为什么对我那么好？\"\n\n\"她不知道你是狐狸。\"\n\n\"如果她知道我是狐狸呢？\"\n\n\"她不会知道。\"晞说，\"你藏得很好。\"\n\n\"可是……\"泠看着窗外的月亮，\"我在青丘的时候，大家都是知道我是谁的。他们躲我，不是因为我藏得不好，是因为我就是九尾。在人间，我藏起来了，反而有人对我好。你说，这是为什么呀？\"\n\n晞没有回答。\n\n泠等了一会儿，说：\"晞姐，你以前在魔界，也要藏吗？\"\n\n\"不用。\"\n\n\"那你为什么离开魔界？\"\n\n晞很久没有说话。久到泠以为她又不会回答了。然后晞说：\"因为魔界也不要我了。\"\n\n泠想说点什么，又不知道该说什么。她伸手，摸了摸自己左侧的肩胛——隔着衣服，那里有一道她自己看不见的裂隙。只有她一个人的时候，她会觉得那里有点凉。\n\n\"晞姐，你还在吗？\"\n\n\"在。\"\n\n\"那你跟我说说话吧。我不困。\"\n\n\"你不困也要睡。\"\n\n\"再聊一句嘛——\"\n\n\"一句。\"\n\n\"你以前那个妹妹，她爱吃什么？\"\n\n晞沉默。\n\n\"……算了算了，我不问了。\"泠连忙说，\"我问别的。晞姐，人间最好的东西是什么？\"\n\n\"不知道。\"\n\n\"那我替你去找。\"泠说，\"等我找到了，就告诉你。这样你也不算白来人间一趟。\"\n\n晞没有说话。但泠知道，她还在。裂隙边缘那点温热的暗红，在月光下安静地亮着。\n\n泠闭上眼睛之前，忽然感觉到什么。\n\n说不清是什么。像一阵风从山那头吹过来，夹着一股她没闻过的味道——生的，凉的，像铁锈混着腐土。不是晞的气息。晞的气息是熟的、是安全的。这股气息是陌生的。\n\n她睁开眼，看向窗外的黑夜。\n\n外面什么也没有。月亮挂着，树影不动。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"这片山里，是不是藏着什么东西？\"\n\n晞沉默了一会儿。\n\n\"是。\"她说，\"别去看。睡。\"\n\n\"它是冲我们来的吗？\"\n\n\"不知道。\"晞说，\"它住在那。我们只是路过。\"\n\n泠没有再看。她蜷得更紧了一点，尾巴把自己整个裹住。\n\n夜很深。镇子很静。\n\n在这片山林的某个角落，一个灰黑色的影子，正慢慢地、慢慢地游荡着——它不知道有人路过。它只是住在这里，像这片山一直住着的许多东西一样。"}, {"id": 8, "title": "魔", "content": "第二天天亮，泠没有回镇子。\n\n她绕开了那片山林。晞说：\"从山外走，多绕两天。别进去。\"泠听话地沿着山脚绕行。绕到第三天午后，她走累了，坐在溪边歇脚，正拧着袖子上的水，就听见了那个声音——\n\n\"……活的。\"\n\n那声音像是从地底下冒出来的。泠抬起头，看见溪对岸的树影里站着一个人形的东西。说\"人形\"是客气话——它比人高出一截，肩背弓着，皮肤是灰黑色的，像被火烧过又冷掉的壳。它站在那儿，脚下的草就枯了，一圈一圈地往外黑。\n\n泠的尾巴在衣服底下全部炸开。\n\n\"别动。\"晞的声音从裂隙那边传来，又低又急，\"它盯上你了。别跑，跑了它会追得更紧。\"\n\n泠屏住呼吸。那东西歪着头，像在嗅什么。它往前走了一步，脚下的土块翻起来：\"狐狸妖。这片山多久没见着妖了——我说山里的活物怎么都躲起来了，原来躲着你。怕我把你们一块儿吃了。\"\n\n\"……我没招惹你。\"泠的声音发紧，\"我只是路过。\"\n\n\"路过。\"它重复了一遍，像觉得好笑。它又走了一步，鼻子抽动了两下，忽然顿住了——它歪着头，困惑地嗅着空气，灰黑色的脸上裂开一条缝，里面没有牙，只有暗红的、流动的东西。\n\n\"不对。\"它说，\"你身上……有另一股味。不是我闻过的妖味。\"它又嗅了一下，声音忽然沉下去，带着贪婪，\"好浓的……你身体里，是不是藏着什么好东西？\"\n\n泠的后背一凉。\n\n\"交出来。\"它往前踏了一步，\"我不吃你。把你身体里那东西交出来，我放你走。\"\n\n泠的腿在发抖。她从小到大没打过架。她的尾巴会炸毛，她的耳朵会动，她的感知比谁都灵敏——但她没有打过架。青丘没有人会跟她打架，大家都躲着她。\n\n\"……晞姐。\"她在心里喊，\"晞姐。\"\n\n没有回应。\n\n\"晞姐！\"\n\n裂隙的边缘凉下去，暗红的光收敛得干干净净。晞把自己藏起来了——藏得那么彻底，像她从来没有住在她身体里。\n\n\"晞姐！你说话呀！\"\n\n还是没有人回答。\n\n那东西已经走到三步开外。它抬起手，那只手像一把生锈的刀，指向泠的胸口——指向裂隙的位置。\n\n泠往旁边滚开。她没有想过自己会躲，但身体先动了——无预兆闪避。她滚出去三步，单膝撑地，手里不知什么时候多了一把刀。\n\n水漠。\n\n蓝色的刀刃在暮色里亮着，像一条活的水。她握刀的手还在抖，但她握住了。\n\n\"……你要吃它。\"泠听见自己的声音，又哑又轻，\"我不让你吃。\"\n\n那东西歪了歪头，像觉得好笑：\"你连站都站不稳。\"\n\n它扑了上来。\n\n泠这一辈子都不会忘记那一瞬的感觉——第一次被人用杀意追着，第一次发现自己的影子会被踩住。她来不及想，全靠本能。残影步拉开距离，气息遮断，绕到侧后方——水漠反握，刃尖朝下，贴着前臂。\n\n\"它不伤人。\"她爹说过。不对，是她自己说过——在青丘的时候，她握着刀把玩，跟晞说：\"水漠不伤人。它只是像水一样，轻轻划过去，然后对方发现，自己已经被划开了。\"\n\n她划出去了。\n\n水漠的刃从灰黑色的躯干上划过去。没有声音。像水划过石头。那东西顿了一下，低头看自己的腰——一道细白的线，从左边横到右边。\n\n\"……什——\"\n\n它裂开了。暗红的血一样的东西从那条线里涌出来，像一匹布被从中间裁开。它倒下去，脚下的黑草翻卷上来，盖住它的身体。\n\n泠站在原地，握刀的手在抖。\n\n她没有动。那东西在草里抽搐了一会儿，裂开的缝里，那张没有牙的嘴还在翕动。它看着泠——不，它看着她身后某个不存在的方向，声音断断续续：\n\n\"你身体里……\"它喘着气，像在确认一件自己不敢相信的事，\"我说怎么会闻到那么浓的味……原来是……王族的血……\"\n\n\"……什么王族？\"泠的声音发飘。\n\n\"你不知道？\"那东西笑了，笑得很难听，像枯叶被踩碎，\"你身体里那个……快、快告诉她……等着吧……上面迟早会……\"\n\n它没有说完。黑草漫过它的嘴，把它盖住了。风一吹，草灰散开，地上只剩下一个焦黑的印子，像什么都没发生过。\n\n泠握着刀，站在原地，很久没有动。\n\n\"……晞姐。\"\n\n没有人回答。\n\n\"晞姐，他说的话是什么意思？\"\n\n还是没有回答。\n\n\"晞姐。\"她的声音开始抖，\"你是不是……又不要我了？\"\n\n风从林子里穿过来。寂静了很久。然后裂隙的边缘亮起一点暗红——很淡，很薄，像被烧尽了余温的炭。\n\n\"……我没走。\"晞的声音哑得厉害，\"我一直都在。\"\n\n\"那你为什么不出声？\"\n\n\"……我不能出声。\"晞说，\"他已经闻出你身体里有东西。我再出声，他就会知道那是什么——魔界藏在人间的耳目不止他一个。他知道，就等于魔界知道。\"\n\n\"魔界……知道我身体里有你？\"\n\n\"现在还不知道。\"晞说，\"但以后会知道。\"\n\n泠蹲下来，把刀插在地上，双手捂住脸。她哭不出来，只是抖。\n\n\"……你早就知道，会有东西来找你。\"她说，\"所以你昨晚不让我开窗。\"\n\n\"嗯。\"\n\n\"你知道我打不过他。\"\n\n\"我不知道。\"晞的声音很轻，\"但我怕。\"\n\n\"你怕什么？\"\n\n\"怕我出声了，你就分心。怕你为了护我，把自己搭进去。\"\n\n泠把脸埋进膝盖里，闷闷地说：\"……可是刚才，我喊你那么多声，你一声都不应。我以为你不要我了。\"\n\n\"……\"\n\n\"晞姐，你下次，至少应我一声。就一声。\"她说，\"我听到你的声音，我就不怕了。\"\n\n晞沉默了很久。然后她说：\n\n\"好。\"\n\n泠站起来，把水漠收回去。她走了两步，腿一软，摔在地上。她这才发现，自己的灵力已经空了——空的干干净净，像一口见底的井。水漠在她手里暗淡下去，收成一柄安静的刀。\n\n\"泠！\"晞的声音终于急了，\"泠！站起来！这里不能停！\"\n\n\"我、我站不起来……\"泠趴在地上，眼前的树影在转，\"晞姐……我有点晕……\"\n\n她的尾巴从衣服底下漏出来——只有一只，蔫蔫地耷着，水蓝色的尾尖都没了精神。她的耳朵也弹了出来。她趴在地上，浑身发抖，像一只从水里捞上来的狐狸。\n\n\"别睡。\"晞的声音在用力，\"泠！别睡！往有人的地方走！\"\n\n\"……有人……在哪……\"\n\n泠抬起头，迷迷糊糊地看见，山脚下面，有一片缓坡，缓坡上有一间小院子。院墙矮矮的，院门开着一条缝，里面飘出一股很淡的木屑味。\n\n她朝着那个方向，爬了几步。\n\n\"有人……\"她含含糊糊地说，\"有木头……的味道……\"\n\n\"泠！\"\n\n她不知道晞在喊她。她只觉得眼前一黑，身子一歪，就从坡上滚了下去。草和土擦过她的脸，她滚过一道矮墙的缺口，\"砰\"的一声，摔进了一间洒满木屑的院子里。\n\n天旋地转。\n\n她最后的意识里，有一双布鞋走到她面前。一个蹲下来的影子，遮住了她头顶的太阳。\n\n有一只手，轻轻摸了摸她炸开的白毛。\n\n\"……狐狸？\"\n\n她听见一个男人的声音，低低的，没什么起伏，像在自言自语：\n\n\"哪来的一只，白狐狸。\"\n\n他顿了顿，目光落在那只狐狸的左背上，低低地补了一句：\n\n\"……背上，还带着一道疤。\"\n\n然后，什么都不知道了。"}, {"id": 9, "title": "小雪", "content": "泠醒过来的时候，先闻到的是一股木头味。\n\n很淡，很干净，像树被剖开之后，树心那股湿漉漉的香。她趴在一张旧垫子上，垫子压得扁扁的，带着日头晒过的味道。她动了一下，发现自己浑身软得像一滩水——灵力没回来，一根手指头都抬不动。\n\n她费力地睁开一只眼睛。\n\n屋檐。院子。一个男人坐在院子中间的小马扎上，背对着她，正在削一根木头。他穿一件洗得发白的灰布衫，袖子挽到小臂，手上全是木屑。他削得很慢，一刀一刀，木花卷着落下来，像下雪。\n\n泠把另一只眼睛也睁开，低下头，看见自己毛茸茸的、雪白的爪子。\n\n……爪子。\n\n她想起来自己现在是一只狐狸。一只尾巴摊在垫子上，蔫蔫的，尾尖那点水蓝色耷拉着。她想把它收起来，可是灵力一点都没有——尾巴有气无力地摊着，一动不动。\n\n\"醒了？\"\n\n那男人没回头，声音平平的。他手里的刀没停。\n\n泠屏住呼吸，不敢动。\n\n\"饿了就下来吃。\"他说，\"碗在灶台上。别打翻。\"\n\n泠趴着没动。她的大脑在飞速转——他在跟我说话吗？他把我当狐狸养？还是他看出来我不是狐狸？他要是看出来，为什么没拔剑？\n\n\"……晞姐。\"她在心里喊。\n\n\"在。\"\n\n\"他是什么人？\"\n\n\"不是道士。\"晞说，\"道士身上有杀过妖的味道。他身上只有木头味。\"\n\n泠稍微放心了一点点。她试着挪动身体——爪子打滑，尾巴绊脚，她花了很大力气才从垫子上滚下来，四只脚踩到地上，腿还是软的。她摇摇晃晃地走了两步，一头栽进地上的木屑堆里。\n\n那男人终于转过头看了她一眼。\n\n他的眼睛很平，像一口没什么风的井。他看了她一会儿，视线落在她背上——落在左肩到腰侧的那条线上。他看的时间不短，长得泠的后背都麻了。然后他收回视线，继续削木头。\n\n\"腿还没长回来就乱跑。\"他说，\"摔不死你。\"\n\n泠趴在地上，尾巴炸成了一团。\n\n他刚才的视线，落在她左肩到腰侧那道疤上。她趴着一动不动，总觉得那一片背，还留着那道视线的重量。\n\n\"……晞姐。\"她的声音在发抖，\"他看了我的疤。\"\n\n\"嗯。\"\n\n\"看了好久。\"泠把自己缩成更小的一团，\"他是不是看出什么了？\"\n\n\"疤就是疤。\"晞说，\"天下受过伤的狐狸多了。没人会盯着一道疤，想到里面住着东西。\"\n\n\"那他为什么看那么久……\"\n\n\"你昏着的时候，他蹲在旁边看了你好久，看你有气没气。\"晞停了一下，\"他要是看出来那不是普通疤，早把你扔出去了。他不会给你垫子。\"\n\n泠趴在木屑堆里，不敢抬头。\n\n中午的时候，江岫——泠还不知道他的名字——从灶台端下来一碗东西，放在她面前。是一碗清水，和半块面饼，面饼掰开了，里面塞着几片咸菜。\n\n\"吃吧。\"他说。\n\n泠犹豫了一下，低头喝水。水是凉的，带着井水的甜。她又叼起那半块面饼，咬了一口。饼有点硬，但咸菜的咸味在嘴里化开，她饿狠了，三口两口吃完，又舔干净了碗沿。\n\n江岫坐在小马扎上，看着她吃完，说：\"吃相还行。不像野的。\"\n\n泠僵住了。\n\n\"野狐狸吃食都是先叼走躲起来。\"他自顾自往下说，\"你倒是坐在人家跟前吃。\"他顿了顿，\"青丘那边，狐狸都这么养吗？\"\n\n泠的尾巴整个僵直了。\n\n\"……别看他。\"晞的声音很稳，\"他在试探你。你就当自己听不懂。狐狸听不懂人话。\"\n\n泠把脸埋进碗里，装作专心舔水。\n\n江岫也没再说什么。他起身，拎着刀，回到檐下继续削他的木头。一下午，院子里只有\"沙沙\"的木花声，和风穿过院墙的响动。\n\n泠趴在院子角落的阴凉里，假装打盹，实则在观察。\n\n她发现江岫削了一下午，削出来的东西都很小。有小鸟，有兔子，有圆溜溜的木球。他削得很认真，削好一个，就放在窗台上排好，像在等谁来挑。太阳偏西的时候，他削了最后一样东西——一只小小的狐狸。他削完，举起来对着光看了一会儿，然后放在了窗台最边上的位置。\n\n离其他东西都远一格。\n\n泠看着那只木狐狸，忽然觉得嗓子发紧。\n\n晚上，江岫进屋睡觉。院子里静下来，月亮升起来，把木屑堆照成银白色。\n\n泠慢慢爬回垫子上，蜷成一团。她的灵力回来了一点点——像井底漫上来的一层水。她试着动了动尾巴，尾巴蔫了一天，终于肯配合她，轻轻抖了一下。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"他为什么对我这么好？\"\n\n\"他没对你好。\"晞说，\"他只是收留了一只狐狸。\"\n\n\"那为什么收留一只狐狸？\"\n\n\"……因为他是那种人。\"晞沉默了一会儿，\"他收留所有没人要的东西。窗台上那些木头，就是他削给那些东西的。\"\n\n泠趴着，没说话。\n\n\"那个木狐狸，\"她过了很久，小声说，\"是给我的吗？\"\n\n晞没有回答。\n\n第二天早上，泠是被院子里的动静吵醒的。她睁开眼，看见江岫蹲在院门口，正在往门槛底下垫一块石头——门槛破了个角，他大概是想让它稳一点。她看着他，忽然想起来，自己摔进来那天，好像就是从那边墙的缺口滚进来的。\n\n他今天，把墙的缺口也用木条补上了。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"他是不是怕我跑出去？\"\n\n\"他怕的是，\"晞说，\"外面的人进来。他收留了你，就要把你藏好。\"\n\n泠看着那扇补好的院门，很久没有说话。\n\n\"我昨天问你，他为什么对我这么好。\"她小声说，\"你说他没对我好，只是收留没人要的东西。可是晞姐……我长这么大，青丘那么多人，没有一个人，给一个没人要的东西补过墙。\"\n\n风从院墙上吹过来，带着木屑和青草的味道。\n\n院子里，江岫蹲在门槛边，把最后一块石头垫稳，拍了拍手上的土，站起来。他看了趴在垫子上、正望着他的白狐狸一眼，说：\n\n\"看什么看。过来，今天教你认豆子。\"\n\n他蹲下来，从怀里掏出一把豆子，撒在木屑堆上，红的、黄的、黑的，混在一起。\n\n\"挑出来。\"他说，\"红的归红的，黄的归黄的。挑对了，晚上给你糖饼吃。\"\n\n泠看着那把豆子，又看看他，尾巴慢慢摇了一下。\n\n她低头，开始挑豆子。\n\n人间有一个院子。院子里有一个削木头的人。他收留了一只没人要的狐狸，给她垫子、清水、面饼，还有糖饼的承诺。\n\n泠不知道糖饼是什么味道。\n\n但她忽然觉得，人间好像没有她想的那么坏。"}, {"id": 10, "title": "人形", "content": "泠在江岫的院子里住了一个月。\n\n狐狸的日子过得比人想的慢，也比人想的满。早上江岫开门，她就跟在他脚边出门——他去溪边挑水，她就蹲在岸上看；他去坡上砍柴，她就钻在柴堆底下躲太阳。中午他做饭，她就趴在灶台边，闻着味儿等。下午他削木头，她就趴在木屑堆里，看他手里的刀一下一下，木花落下来，盖住她的爪子。\n\n她挑豆子挑得越来越快。红的归红的，黄的归黄的，黑的归黑的，一炷香工夫就分得干干净净。江岫蹲在旁边，把三碗豆子端起来看了看，说：\"手真巧。狐狸爪子挑豆子，比村里媳妇还利索。\"\n\n泠的尾巴在身后晃了一下。\n\n\"得意了？\"江岫说，\"明天给你加一根萝卜。\"\n\n\"……\"\n\n\"萝卜炖的。\"\n\n泠的尾巴晃得更欢了。\n\n日子就这样过。江岫话少，一天说不了十句，句句都短：\"过来\"\"吃饭\"\"别碰柴刀\"\"往太阳那边趴，那边暖\"。泠听得多，说得少——她不能说。她是一只狐狸，狐狸不开口。她所有的\"谢谢\"\"好吃\"\"你今天削的鸟真好看\"都憋在心里，只能通过摇尾巴和蹭蹭表达。\n\n晞说：\"你尾巴都快摇断了。\"\n\n\"那不然呢！\"泠在心里嚷，\"他又听不懂！\"\n\n\"他看得懂。\"晞说，\"他昨天看了你尾巴三次。\"\n\n\"看尾巴怎么了！\"\n\n\"你看他削木头的时候，也看了他手里的刀三次。\"\n\n\"……晞姐你数这个干什么嘛！\"\n\n晞不说话了。但泠知道，她在笑——裂隙的边缘，那点暗红，温温地亮着。\n\n灵力回来得很慢。像井底的水，一天涨一寸。一个月下来，才到膝盖那么深。泠每天夜里蜷在垫子上，试着把灵力往四肢送，送到发丝、送到指尖、送到尾巴尖——她想起自己在青丘的时候，想变人就变人，想变狐就变狐，从没觉得这有什么难的。\n\n现在她才知道，原来\"变回去\"这三个字，也是要有力气才说得出的话。\n\n\"别急。\"晞说，\"你伤在根子上。灵力见底过的人，都这样。\"\n\n\"万一变不回去了呢？\"\n\n\"变不回去就变不回去。\"晞说，\"你是一只狐狸，又不是不能活。\"\n\n\"可是……\"泠趴在垫子上，尾巴蔫蔫地耷着，\"我是个人呀。我是想当人，才从青丘走出来的。当狐狸的话，我在青丘就能当。\"\n\n晞沉默了一会儿。\n\n\"那你就当人。\"她说，\"等你养好了，当多久都行。\"\n\n\"要是养不好呢？\"\n\n\"养不好，我给你当一辈子狐狸。\"\n\n泠把脸埋进尾巴里，闷闷地笑了。\n\n变回人形这件事，是在一个雨天来的。\n\n那天傍晚起了云，天压得很低。江岫坐在檐下削木头，削着削着，抬头看了看天，把刀收起来，说：\"要下雨了。\"他把窗台上的木器一只一只搬进屋，搬到最后那只小狐狸的时候，他停了一下，转头看了趴在垫子上的泠一眼。\n\n\"……你也进来吧。\"他说，\"夜里凉。\"\n\n泠站起来，抖了抖毛，跟在他身后进了屋。\n\n雨在入夜后落下来。\n\n泠蜷在屋角的垫子上，听着雨声，忽然觉得，身体里有什么东西在动。像蛰伏了一个月的水，终于听见了雷声，从井底一层一层地漫上来——她的灵力回来了。雨天的水汽，是她的主场。她趴在垫子上，感觉到灵力顺着四肢百骸走，走得又快又顺，像溪水归河。\n\n\"晞姐……\"她小声说，\"我好像……能变回去了。\"\n\n\"那就变。\"晞说，\"现在。\"\n\n泠从垫子上站起来，走到屋子中间。她闭上眼睛，把灵力送到全身——先收耳朵，再收尾巴，然后是身形、四肢。她感觉到毛皮褪去，感觉到尾巴收进脊骨里，感觉到耳朵退下去，变成一头银白色的长发。\n\n她睁开眼。\n\n月光从窗纸上漏进来，照在木地板上。她低下头，看见自己的手——白的，纤细的，像青丘的时候一样。她摸了摸头顶，耳朵不见了；她回头看了看身后，尾巴不见了。\n\n她变回来了。\n\n\"……变回来了。\"她的声音有点抖，\"晞姐，我变回来了！\"\n\n\"看见了。\"\n\n\"我变回人了！\"\n\n\"你变回人了。\"晞说。\n\n泠站在屋子中间，光着脚，踩在冰凉的地板上。她低头看了看自己——灵力凝出的白衣服在她身上，薄薄的，像一层月光。她忽然有点想哭，又忍住了。她深吸一口气，轻轻地、轻轻地走到门边，把门推开一条缝。\n\n雨还在下。院子里的木屑被雨水打湿了，像一地深色的碎花。她看着那个院子，看着檐下那把沾着木屑的小马扎，忽然觉得，自己应该跟江岫说点什么。\n\n她站在门口，站了很久。\n\n\"……晞姐，我要不要告诉他？\"\n\n\"告诉他什么？\"\n\n\"告诉他，我不是狐狸。我是人。\"她顿了顿，\"不对……我也不是人。我是九尾。但我现在，是他养的'小雪'。\"\n\n\"你想告诉他吗？\"\n\n\"想。\"泠说，\"他给我挑了豆子，给我炖了萝卜，还给我削了木狐狸。他对我好，却不知道他是对谁好。这样不对。\"\n\n她说着，正要推门出去——\n\n门先从外面被推开了。\n\n江岫站在门外，手里端着一碗还冒着热气的粥。他大概是听见了动静，端粥来给她——然后他看见了屋里站着的人。一个银白色长发的少女，穿着薄薄的白衣，站在月光和雨声中间，站在他放了一整夜木器的那间屋里。\n\n江岫端着粥，站在门口，没有动。\n\n泠僵在原地，也没有动。\n\n雨声填满了整个院子。过了很久，很久，江岫才开口。他的声音还是平平的，像在说今天豆子分得不错：\n\n\"……粥。\"他说，\"趁热喝。\"\n\n他把碗放在门框上，转身，走进雨里，往自己那间屋去了。\n\n泠站在门口，看着他的背影消失在雨幕里。她低头，看见门框上那碗粥——白粥，上头卧着一小块萝卜，炖得软软的，还冒着热气。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"他是不是……早就知道我不是狐狸？\"\n\n晞沉默了一会儿，说：\n\n\"他大概，第一天就知道了。\""}, {"id": 11, "title": "木屑", "content": "第二天早上，泠站在院子里，等着江岫开口。\n\n江岫从屋里出来，看见她站在院里，愣了一下，然后绕过她，去灶台生火。他生火、淘米、煮粥，从头到尾没跟她说话。泠跟在他身后，他走到哪她跟到哪，他也不赶她，也不理她。\n\n粥煮好了。江岫盛了两碗，一碗放自己面前，一碗推到她面前。他自己低头喝粥，喝了两口，才开口：\n\n\"……你叫什么？\"\n\n\"泠。\"她说，\"澪雨的泠。\"\n\n\"泠。\"他念了一遍，\"小雪这名，是我起的。你嫌不嫌？\"\n\n\"不嫌。\"泠连忙说，\"小雪好听。\"\n\n江岫\"嗯\"了一声，低头继续喝粥。\n\n\"你就不问吗？\"泠忍不住了，\"我不问你为什么收留一只狐狸——不对，是收留一只狐狸精——你也不问我是谁，从哪来，为什么摔进你院子里？\"\n\n江岫想了想，说：\"你想说的时候，自然会说。\"\n\n\"那我要是不说呢？\"\n\n\"那就不说。\"\n\n\"……你这个人好怪。\"泠说。\n\n\"你也是。\"江岫说，\"狐狸精说话，都这么急吗？\"\n\n泠被噎住了。她低头喝粥，喝到一半，忽然说：\"……我是从青丘来的。\"\n\n\"嗯。\"\n\n\"我在青丘，大家都叫我九尾。没有人叫我名字。\"她说，\"我出来，是想找找看，能不能找到一个叫我名字的人。\"\n\n江岫喝粥的动作停了一下。然后他放下碗，说：\"找到了吗？\"\n\n\"……不知道。\"泠小声说，\"在路上找到了一个。她叫我泠。\"\n\n\"那不是找到了？\"\n\n\"她是她。\"泠说，\"我想找的是'很多人'。我想知道，被人叫名字，是不是一件平常的事——在人间，是不是所有人都有人叫名字。\"\n\n江岫没有回答。他把碗里的粥喝完，站起来，说：\"今天镇上赶集。我去买糖。\"\n\n泠愣了一下：\"买糖干什么？\"\n\n\"你挑豆子挑得好。\"江岫说，\"我说过，挑对了给糖饼吃。\"\n\n\"……那是一个月前说的了。\"\n\n\"我又没忘。\"\n\n江岫说着，拎起一个旧布包，往院门口走。走到门口，他停下来，没回头，说：\n\n\"狐狸精，好好看家。\"\n\n泠站在院子里，看着他走远。风把他的灰布衫吹起来一角。她低头，看见自己脚尖前的地上，落着一片木屑——是昨夜里，从他门口一直飘到这里来的。\n\n她蹲下来，把那片木屑捡起来，握在手心里。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"他说他没忘。\"\n\n晞没有答。\n\n\"他记得他说过的话。\"\n\n\"……记得。\"晞说。\n\n泠把木屑攥得很紧，小声说：\"青丘的人，也总说'你是九尾'，从来没人记得说过什么话。\"她停了停，\"……人间是不是都有糖饼吃？\"\n\n\"不是。\"晞说，\"是人间的江岫，都记得自己说过的话。\"\n\n糖饼是江岫自己做的。\n\n他买回来一包红糖，一袋面粉，在灶台上和面、擀皮、包馅。泠蹲在灶台边看，看他粗糙的手指捏出一个个圆溜溜的饼，看他把饼贴在锅沿上，听锅里\"滋啦\"一声，糖香就漫出来。\n\n第一个糖饼出锅。江岫用粗布垫着，递给她：\"烫。吹三下再吃。\"\n\n泠接过来。她想起自己喝热水前要吹三下的习惯——她从来没跟人说过这个习惯。她低头，对着糖饼吹了三下，咬了一口。\n\n甜的。热的。红糖在嘴里化开，烫得她吸气，又舍不得吐。\n\n\"好吃吗？\"江岫问。\n\n\"好吃！\"泠含含糊糊地说，\"比我娘做的……不对，我娘不会做糖饼。比那个婆婆的糖人还好吃！\"\n\n\"糖人？\"\n\n\"就是、就是我刚来人间的时候，一个卖糖人的婆婆给我的。\"泠说，\"可甜可甜了。\"\n\n\"哦。\"江岫说，\"那婆婆人不错。\"\n\n\"你也人不错。\"泠说，\"你是我在人间遇到的，第二好的人。\"\n\n\"第一好是谁？\"\n\n\"我晞姐。\"泠脱口而出。\n\n说完她愣住了。江岫倒是没在意，转身去翻锅里的饼：\"你还有个姐？\"\n\n\"……嗯。\"泠小声说，\"她在我身边。\"\n\n\"那她怎么不来吃饼？\"\n\n泠咬着糖饼，含含糊糊地说：\"她……不爱吃甜的。\"\n\n\"胡说。\"江岫说，\"没人不爱吃甜的。\"\n\n他想了想，把第二个糖饼出锅，用另一块粗布包好，放在灶台边上：\"给她留一个。不爱吃甜的，先留着，说不定哪天就爱了。\"\n\n泠看着那个包好的糖饼，很久没有说话。\n\n那天下午，江岫在檐下削木头，泠就蹲在旁边看。她看了半天，忽然说：\"我也想学。\"\n\n\"学什么？\"\n\n\"削木头。\"\n\n江岫看了她一眼，从工具筐里翻出一把旧刀，递给她：\"先削个圆的。别削着手。\"\n\n泠接过刀，学着江岫的样子，抓住一根木条。刀在木头上划拉半天，削出来的不是圆的，是一堆歪歪扭扭的木片。她的手劲不对，角度不对，削出来的东西像被狗啃过。\n\n\"……好难。\"她泄气，\"你怎么削得那么好？\"\n\n\"练了十来年。\"江岫说。\n\n\"十来年？！\"泠瞪大眼睛，\"那你今年多大？\"\n\n\"十九。\"江岫头也不抬，\"反正比你大。\"\n\n泠不服气，继续削。削到日头偏西，她总算削出一个勉强能看的东西——圆不圆方不方，像一块胖石头。她自己看着都嫌弃。\n\n\"还行。\"江岫接过去，翻来覆去看了看，\"第一件能成个形状，算不错了。\"\n\n他站起来，走到窗台边，把那块\"胖石头\"放上去——放在那只小木狐狸的旁边。\n\n\"等削出好看的，再换它。\"他说。\n\n泠看着窗台上那只小木狐狸，忽然想起，它来了一个月，一直孤零零站在窗台最边上。现在，旁边多了她那块丑丑的\"胖石头\"。\n\n\"江岫。\"她忽然说。\n\n\"嗯？\"\n\n\"你为什么对我这么好？\"\n\n江岫蹲在院子里，手里削着木头，没有立刻回答。他削了一会儿，才说：\"你问这个干什么？\"\n\n\"我长这么大，没人对我这么好过。\"泠说，\"我爹我娘也对我好，但他们的好，是隔着'九尾'的。你的好……好像就是对我这个人——不对，是对我这只狐狸——就是对我小雪。\"\n\n江岫削木头的手停了。\n\n过了很久，他说：\"……我小时候，也有一只狐狸。\"他顿了顿，\"不是九尾，就是普通的狐狸。它在山道上被夹子夹断了腿，我把它捡回来养。养了一个冬天，开春它自己走了。\"\n\n\"……走了？\"\n\n\"走了。\"江岫说，\"后来我明白，它来我这，就是养伤来的。伤好了，它就回它的山上去了。\"他低头削着木头，\"所以你想走的时候，不用跟我说。你的伤养好了，你想回青丘，就回青丘。你叫泠，不叫小雪——小雪是我起的名字，你什么时候不想要了，就不用叫。\"\n\n院子里很安静。木花一片一片落下来。\n\n泠蹲在地上，看着他，忽然觉得嗓子堵得厉害。\n\n\"……那我要是，不想走了呢？\"她小声说。\n\n江岫削木头的手停了一下。\n\n\"那你就住着。\"他说，\"院子里，又不是没有你住的屋。\"\n\n那天傍晚，泠把江岫留给晞的糖饼，悄悄放在自己枕头边。她趴在床上，对着那块糖饼说：\n\n\"晞姐，他说院子里有我住的屋。\"\n\n\"嗯。\"\n\n\"他说我想住多久住多久。\"\n\n门里没有答。\n\n\"晞姐，\"泠小声说，\"我好像，找到'被人叫名字'是什么感觉了——被叫小雪也好，叫泠也好。有人叫我，我就知道他在乎我。\"\n\n晞没有说话。但裂隙的边缘，那点暗红，温温地亮了一夜。\n\n泠在江岫家住了下来。\n\n她学削木头，学做饭，学挑水，学看天。她慢慢知道，江岫住在一个很偏的坡地上，方圆几里没有邻居；他一年也去不了几次镇上；他不跟人来往，院门常年虚掩。\n\n她还不知道的是——江岫里屋的桌上，有一本薄薄的旧书，黄纸、旧边，封面没有任何字。那本书从来不落灰，像每天都有人擦。\n\n她有一次路过他屋门口，多看了一眼。\n\n\"那本书，不能碰。\"江岫的声音从身后传来，平平的，\"走吧。\"\n\n泠没在意，应了一声，走了。\n\n她不知道，那是一本叫《守微录》的书。\n\n她也不知道，那本书的封面上，有一道极淡的纹路——像一道没有流血的裂隙。"}, {"id": 12, "title": "魔影", "content": "泠在江岫家住下之后，日子过得很快。\n\n她学会了挑水，学会了生火，学会了把木条削出形状。她削的东西越来越好，从\"胖石头\"变成了\"圆石头\"，又从\"圆石头\"变成了\"有点像碗的东西\"。江岫看了说：\"像碗。\"泠很高兴，把它摆上窗台，排在木狐狸旁边。现在窗台上已经有七八样东西了，排成一排，像一列等着被领走的小兵。\n\n日子好到她几乎忘了，自己是从山那头逃过来的。\n\n那天傍晚，泠去坡下的小溪边挑水。溪水清得很，她蹲在岸边，伸手去够水里的桶——然后她停住了。\n\n她感觉到了什么。\n\n说不清是哪来的感觉。像一阵风从东北面的林子深处吹过来，夹着一股很淡很淡的味道。不是草木的味道，不是泥土的味道。是一种她记得的味道——铁锈混着腐土，生的，凉的。\n\n她在溪边蹲了很久。水桶在水里晃着，她没有去捞。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"东北面那片林子，你感觉到没有？\"\n\n晞沉默了一会儿：\"……有。住了有些年头了。\"\n\n\"多久？\"\n\n\"说不准。半年，一年，也许更久。\"晞说，\"它藏得好。这片地方灵力稀薄，道士不爱来，它挑了个好地方住。\"\n\n泠站起来，拎起水桶。她往回走，走得很慢。\n\n\"它离院子多远？\"她问。\n\n\"翻过那道梁就是。\"晞说，\"直线过去，没多远。\"\n\n泠没说话。她回到院子里，把水倒进缸里，坐在门槛上，看着东北面那片林子，看了一下午。\n\n晚上，江岫在屋里削木头，泠蹲在院子里，看着月亮。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"它会不会过来？\"\n\n\"不会。\"晞说，\"它住那，是为了躲道士。它不会主动靠近人住的地方——人一多，它就藏不住了。\"\n\n\"那它……会不会害人？\"\n\n\"魔在人间，靠吸人气和灵力过活。它不住在镇子边上，就害不到镇子里的人。\"晞顿了顿，\"但它住得离这个院子太近了。它哪天饿急了，翻过那道梁，第一个碰到的，就是这间院子。\"\n\n泠的手指攥紧了。\n\n\"……江岫住在这里。\"\n\n\"我知道。\"\n\n\"他什么都不会。\"泠说，\"他就是一个削木头的。\"\n\n晞没有接话。\n\n\"晞姐，\"泠小声说，\"我要不要……把它除掉？\"\n\n\"你打不过它。\"晞说得很平，\"它藏了那么久，吃的东西比你走过的路都多。上一次你是运气好，碰上的是个饿疯了的。\"\n\n\"可是它离江岫太近了。\"\n\n\"江岫不用你操心。\"\n\n\"他怎么能不用我操心！\"泠急了，\"他又不知道那里有魔！他每天就知道削木头！他连院门都不出！\"\n\n\"他不出去，魔就不会过来。\"晞说，\"你听我的，别去惹它。你惹了它，它才知道这里有人。\"\n\n泠蹲在院子里，抱着膝盖，不说话了。\n\n她躺下睡觉的时候，在心里翻来覆去地想晞的话。她知道晞说得对。她打不过那个东西。上一次杀魔，她靠的是运气——那魔又饿又疯，冲得太急，被她一刀划开了。这一个不一样。这一个住了半年一年，它很清醒，很谨慎，很会藏。\n\n可是江岫就住在山这边。\n\n江岫每天坐在院子里削木头，他不知道山那头有一个会吃人的东西。泠知道。她每天晚上躺下，都会往东北面那扇窗的方向看一眼——看不见那片林子，但她知道它在。\n\n她想了三天。\n\n第四天傍晚，她做好晚饭，把饭菜放在灶台上，对屋里说：\"江岫，我出去走走。\"\n\n江岫\"嗯\"了一声，头也没抬。\n\n泠站在院子里，深吸一口气。她摸了摸胸口——水漠别在胸带外侧，凉凉的，像一片贴着她心跳的水。她转过身，往东北面那片林子走去。\n\n\"……泠。\"晞的声音从裂隙那边传来，\"你打不过它。\"\n\n\"我知道。\"\n\n\"你会死的。\"\n\n\"我不会。\"\n\n\"你现在回头，还来得及。\"\n\n泠没有回头。她握紧了水漠的刀柄，说：\n\n\"晞姐，你说魔在人间，离人近了就会害人。江岫是我在人间遇到的，第一个把我当人看的人。我不能赌它饿急了会不会翻过那道梁。\"\n\n她顿了顿，又补了一句：\n\n\"我知道我打不过它。但我要让那东西知道——这片山，是有人守着的。它住它的，别打这边的算盘。\"\n\n暮色从林子的边缘漫上来。泠的身影走进那片林子，像一滴白色的水，被黑暗慢慢吞掉。\n\n晞没有再说话。\n\n裂隙的边缘，暗红的光亮着——很安静地亮着，像一盏没有风的灯。"}, {"id": 13, "title": "合击", "content": "泠在林子里走了小半个时辰，找到了它。\n\n她先闻到味道——铁锈和腐土，比在溪边闻到的浓得多。然后她看见了一棵树：一棵老槐，树根底下拱起一大片黑土，黑土中间塌着一个坑，坑里卧着一团灰黑色的影子，像一头蜷着睡觉的野兽。\n\n她在十步外停下来。\n\n\"……我住在山那边。\"她开口，声音不大，\"那间院子，是我家。\"\n\n灰黑色的影子动了动，像被吵醒的。它慢慢抬起头，看见月光下站着的白色身影，喉咙里滚出一声低笑：\"狐狸。就是你？我还想，这山里怎么多了股妖味。躲我好几天了？\"\n\n\"我不躲你。\"泠说，\"我来跟你说一声——山那边有人住。你住你的林子，别过那道梁。\"\n\n它缓缓站起来，比泠预想的还高。它俯视着她，像看一只闯进狼窝的兔子：\"你是在跟我商量？\"\n\n\"是。\"\n\n\"我要是不答应呢？\"\n\n泠握紧了水漠：\"那我就让你答应。\"\n\n它笑出声来。笑声在黑土上滚过去，惊起一片夜鸟。\n\n然后它扑了过来。\n\n泠这一辈子都记得那一战。它太快了——上一次杀的那只魔，饿疯了，动作又僵又直，她一刀就了结了它。这一只不一样。它在这片山里住了一年，吃活物、养力气，它的动作又沉又准，每一次扑击都带着压下来的风。泠的残影步第一次被人看穿——它不追她的残影，它追她落地的那一声响。\n\n\"妖就是妖。\"它一边追一边说，\"连血都不会藏。\"\n\n泠被逼得步步后退。她的灵力在人间只有五成，水漠的刃光在夜里划出一道道蓝线，却总是差那么一点。她忽然明白晞说的是什么意思了——她打不过它。\n\n她来不及想第二件事。它一掌拍下来，泠往旁边滚，没滚利索，肩头被扫到，火辣辣地疼。她咬住牙，刚要站起来——它已经欺到身前，爪子按向她的胸口。\n\n按向她左侧的裂隙。\n\n\"好东西。\"它低下头，灰黑色的脸上，裂开的缝里暗红流动，\"我早闻到了。你身体里，藏着一个很浓的东西——比你这身妖血浓多了。\"\n\n泠的瞳孔缩紧。它想挖出来。\n\n恐惧和愤怒同时冲上来——为了晞。它要挖晞！她再顾不上收着裂隙，全身的灵力往那个位置涌，裂隙在一瞬间张开——暗红的灵力像决堤的水，从她左侧的肩胛到腰侧喷涌而出，烫得她几乎站不住。\n\n\"魔气！\"那东西先是一愣，然后狂喜，\"你身体里住着——你、你身上有王族的——\"\n\n它的话没说完。\n\n一道灰影从它身后落下来，没有声音。一只手按住了它的后颈——干瘦的、沾着木屑的手。江岫不知什么时候站在了它身后，穿着那件洗得发白的灰布衫，袖子挽到小臂，像刚从灶台边走过来。\n\n\"……回去了。\"他说。\n\n那东西僵住了。它想动，动不了——那只手按着它的后颈，像按着一道门。\n\n\"我说，回去了。\"江岫又说了一遍，\"这片山，不是你的山。\"\n\n他的手轻轻一推。那东西像被一堵看不见的墙推着，倒飞出去，撞断了两棵小树，滚进黑土里。它爬起来，嘶吼了一声，想往前冲——刚迈出一步，又像撞上了什么，趔趄着退回去。\n\n它盯着江岫看了很久，那双暗红的缝里，惊疑不定。\n\n然后它转身，头也不回地，钻进了林子深处。\n\n江岫站在原地，看着它消失在黑暗里，没有追。他低下头，看了看自己按过魔的手，用衣摆擦了擦，转身往回走。走了一步，他停下来，看着跪在地上的泠——她浑身还裹着没散尽的暗红灵力，左半边身子烧得滚烫，睫毛上全是冷汗。\n\n\"……回去了。\"他说，\"饭要凉了。\"\n\n泠跪在地上，仰头看他。她的嘴唇动了动，想问\"你是谁\"，还没问出口——\n\n山道那头，亮起了火把。\n\n\"那边有动静！\"一个声音喊，\"魔气！是魔气！快！\"\n\n火把的光很快。七八个人影从山道那头涌过来，青灰色的道袍，腰上挂着剑。为首的是一个老者，灰白的须发，目光像刀子一样，先扫过地上的焦土和断树，然后落在泠身上——落在她身上还没散尽的、暗红色的灵力上。\n\n老者的瞳孔猛地缩紧。\n\n\"魔气。\"他说，\"妖身上，有魔气。\"\n\n泠僵在原地。她身上的暗红灵力还没收干净，像一道没灭的火，在夜风里明明灭灭。她看见那些道士的剑拔了出来，剑尖全指着她。\n\n\"……我不是。\"她的声音发抖，\"我不是魔。\"\n\n\"不是魔，你身上哪来的魔气？\"老者往前走了两步，目光扫过她的左侧肩胛——他的视线停在那里，像看见了什么不该看见的东西，\"你体内有东西。让我看看是什么。\"\n\n\"不行！\"泠猛地后退一步，护住左侧，像护着什么宝贝，\"谁都不许碰！\"\n\n\"果然是魔。\"老者的声音冷下来，\"带回去。\"\n\n\"我说了不是！\"\n\n她转身想跑，脚下却被什么绊住——一个年轻道士不知什么时候绕到了她身后，一把按住她的肩。她挣扎，灵力已经见底，挣不开。她抬头看向江岫——江岫站在几步外，垂着手，看着她。\n\n\"江岫！\"她喊，\"江岫！我不是魔！你告诉他们！\"\n\n江岫没有动。\n\n他站在那里，袖子上还沾着木屑，看着那些道士把泠按住、绑起来。他的嘴唇动了一下，像是要说什么，最终什么也没说。\n\n\"这个妖，与魔有染。\"老者抬手一指泠，又转向江岫，\"你——一个普通农户，窝藏妖物。念你无知，从轻处置。\"\n\n江岫没有说话。\n\n\"江岫！\"泠被拖着走，声音带着哭腔，\"江岫！你说句话呀！你不是、你明明能——\"\n\n她的话被拖远了。\n\n江岫站在原地，站在满地火把照出的乱影里，看着泠被拖出林子，拖上山道，拖进火把的光里，越来越远。\n\n夜风把他洗得发白的衣摆吹起来。他低头，看了看自己的手——那只能把魔推开的手。他没有握拳，也没有攥紧。他只是把手收回袖子里，转身，慢慢往院子走。\n\n灶台上，饭菜已经凉了。两副碗筷，整整齐齐。\n\n他坐下，端起自己那碗，吃了一口。\n\n\"……雪。\"他对着空了的院子，低低地说了一声，\"饭凉了。\""}, {"id": 14, "title": "石室", "content": "石室是凿在山壁里的。\n\n没有窗，只有一道铁门，门上贴满了符箓，黄的、红的，一层叠一层。墙是冷的，地是冷的，连空气都是冷的——泠被扔进来的时候，第一时间感觉到了那种冷不是天气的冷。是灵力被抽走的冷。她浑身的灵力像被一只手按着，压回身体最深处，一动也动不了。\n\n符箓的压制。镇妖的封印。\n\n泠蜷在角落里，抱着膝盖。她试着动了一下——灵力像被冻住了。她又试了一次，还是动不了。\n\n\"……晞姐。\"她在心里喊。\n\n没有回应。\n\n\"晞姐！\"\n\n裂隙的位置，凉凉的。像一道很久没人走过的旧门。\n\n\"晞姐你应我一声！\"她的声音慌了，\"我知道你在！你应我一声！\"\n\n过了很久，很久，裂隙的边缘才亮起一点极淡的暗红，像风里快灭的灯。\n\n\"……在。\"\n\n那声音又虚又轻，像从很远很远的地方传过来。\n\n\"你、你怎么了？\"泠的心揪起来，\"你是不是被压到了？\"\n\n\"……它压着裂隙。\"晞的声音断断续续，\"我过不去……像被人踩住了门。\"\n\n\"那我们怎么办？\"\n\n\"……别怕。\"晞说，\"它压得住妖，压不住我多久。我是魔。它们镇的，是妖。\"\n\n\"可是……\"\n\n\"别说话。\"晞的声音更轻了，\"省着力气。他们会来问你的。\"\n\n果然，天快黑的时候，铁门开了。那个老者站在门口，身后跟着两个弟子。他走进来，看着蜷在角落里的泠，问：\"你叫什么？\"\n\n\"……泠。\"\n\n\"哪来的？\"\n\n\"青丘。\"\n\n\"青丘的九尾白狐。\"老者念了一遍，声音里没什么波澜，\"青丘是妖族大族，与我们井水不犯河水。你若只是妖，我们放你走。但你身上有魔气——你体内那东西，是什么？\"\n\n\"没有。\"泠说，\"什么都没有。\"\n\n\"我看见了。\"老者说，\"你左肩上，有一道疤。那疤里，是魔气。是魔吧？寄在你身体里的魔。\"\n\n泠的心一沉。他看见了。石室的压制让裂隙现了形——在她最不想让人看见的地方，那道裂隙像墙上的裂缝一样，清清楚楚。\n\n\"它不是你想的那样！\"她急急地说，\"它、它没有害人！它住在我这里，从来没害过人！\"\n\n\"魔在人间，必然害人。\"老者说，\"这是几百年的铁律。你身上的魔气就是证据——你站在哪里，哪里就染着魔气。\"他走近一步，看着她左侧的肩胛，\"让我把它除了。你还能活。\"\n\n\"不行！\"泠猛地往后缩，后背撞上冰冷的石壁，她护住左侧，像护着命，\"谁都不许碰它！\"\n\n老者看着她，目光平静：\"你护着它。你知不知道，那东西吸你的灵力，总有一天会把你吸干？\"\n\n\"它不会。\"\n\n\"它在你身体里待一天，你就是一天魔的宿主。\"老者说，\"你听我的话，我除了它，你回你的青丘，从此两清。\"\n\n\"它不是你想的那种魔！\"泠的声音开始抖，\"它从来没有、从来没有想过害我！它是、它是我——\"\n\n她说不下去了。她不能说。晞是谁，她不能说。\n\n\"它是我姐。\"她小声说，\"它是我的家人。\"\n\n老者看着她，沉默了一会儿。\n\n\"妖糊涂。\"他说，\"妖护着魔，就是与魔为伍。你关在这里，什么时候想明白了，什么时候告诉我。\"\n\n他转身走出去，铁门在身后关上。符箓在门上亮了一下，又暗下去。\n\n石室里重新安静下来。\n\n泠蜷在角落里，抱着膝盖。她数着时间——数到天亮，数到天黑，数到天亮。没有人再来。石室里的灵力被抽得干干净净，她的身体一天比一天虚。裂隙的位置开始疼——不是晞弄疼的，是石室的压制在碾那道裂隙，碾得它一点点变宽，像一道伤口被反复撕开。\n\n第一天，她还能坐起来。第二天，她只能靠着墙。第三天，她躺在地上，睁着眼，看着头顶那片黑。\n\n\"晞姐……\"她喊，声音哑得像砂纸，\"你还在吗？\"\n\n\"在。\"\n\n\"疼不疼？\"\n\n\"……不疼。\"\n\n\"骗人。\"泠说，\"我都疼。你肯定也疼。\"\n\n晞没有说话。过了很久，她说：\"……泠。\"\n\n\"嗯？\"\n\n\"是我害了你。\"\n\n\"胡说。\"泠说，\"是我自己要去杀那个魔的。是我不够强。你害我什么了？\"\n\n\"那天晚上，我应该拉住你。\"晞的声音很轻，\"我不该让你去。\"\n\n\"你拉过。\"泠说，\"你说打不过它。我没听。\"\n\n\"……\"\n\n\"晞姐，你别这样。\"泠说，\"你要是跟我说对不起，我、我就……我就不知道怎么办了。你从来不说对不起的。\"\n\n晞沉默了。\n\n\"我一直想问。\"泠说，\"我杀那个魔的时候，你为什么不出声？我知道你怕魔界知道。但你应一声也好呀。我一个人在那里，怕死了。\"\n\n\"……我应了。\"晞说，\"我在心里应了。你听不见。\"\n\n\"那你为什么不说话？\"\n\n\"我怕我说话，你就会分心。我怕他听见我的声音，就知道你在护着我，然后更用力地打你。\"晞停了很久，\"我怕你为了我，死在那里。\"\n\n石室里很静。静得能听见泠的心跳。\n\n\"……那下次，\"泠说，声音有点哑，\"你在心里应我一声就行。我听得见的。我听得见你的。\"\n\n\"嗯。\"\n\n\"你应了没有？\"\n\n\"……应了。\"\n\n泠把脸埋进膝盖里，笑了。笑着笑着，眼角就湿了。\n\n第四天夜里，铁门没有再开。泠的灵力已经被压到了极点，身体轻得像一片纸。裂隙疼得她几乎昏过去——她知道自己不能再等了。再等下去，她会死在这里，晞也会。\n\n她扶着墙，慢慢站起来。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"现在能出来吗？\"\n\n\"……能。\"晞的声音从裂隙那边传来，很稳，\"你让开一点。\"\n\n泠让开一步。\n\n裂隙在她左侧完全张开——暗红的灵力像决堤的水涌出来。石室里的符箓齐齐亮起，嘶嘶地响，像水泼进热油。妖的符箓压得住妖，却压不住魔——暗红灵力漫过那些黄符红符，符箓一张接一张地暗下去，像被浸透的纸。\n\n铁门上，最后一张符暗了下去。\n\n泠走上前，伸手推门。铁门纹丝不动。\n\n\"……推不开。\"她回头，\"锁着的。\"\n\n\"锁着。\"晞说，\"那就不是门的问题。\"\n\n暗红的灵力从她身上漫过去，覆上铁门。铁门\"嗤\"地响了一声，门缝里，开始滴落暗红色的液体——像是铁在流血。\n\n\"魔气腐蚀。\"晞说，\"魔在人间，走到哪，哪就坏。你一直问我，为什么说魔在人间必然害人——这就是。\"\n\n泠看着那扇流血的铁门，忽然觉得有点冷。\n\n\"……它害不了你。\"晞说，\"它只害锁。\"\n\n铁门\"咣\"地一声，倒了下去。外面是夜色——山里的夜色，有月亮，有风，有草木的味道。\n\n泠扶着门框，走出去。她回头看了一眼那间石室，又看了一眼自己左侧那道暗红的裂隙——它在月光下，缓缓收拢，像一道疲惫的旧伤口。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"我们回家。\"\n\n\"回哪？\"\n\n泠想了想。\n\n\"……回江岫那里。\"她说，\"我要回去跟他说，我不是魔。然后——\"她顿了顿，\"然后我们离远点。不连累他。\""}, {"id": 15, "title": "脱困", "content": "泠没有跑远。\n\n她跑出石室，跑过道观的后山，跑进一片杂木林里，腿就软了。她扶着树干，大口大口喘气，浑身的灵力像被抽干的水井，连站都站不稳。身后的道观亮起了火把，有人在喊：\"石室破了！那个妖跑了！往山里跑了！\"\n\n她咬着牙，往更深的林子里钻。\n\n\"……往有水的地方走。\"晞的声音从裂隙那边传来，虚得几乎听不见，\"水汽会盖住你的气味。往水边走。\"\n\n泠踉跄着往山涧的方向跑。夜色里，她听见了水声——一条山涧，不大，从石缝间流下来。她一头扎进涧水里，顺着水流往下游走了几百步，钻进一个被水冲出的石洞。洞不深，刚好够她蜷进去。她把自己埋在水边的碎石里，只露出半个头，压着呼吸，一动不敢动。\n\n火把的光从山涧上方掠过，又掠过去。脚步声远远近近，来来回回，像撒出去的网。泠在水里泡着，冷得牙齿打颤，但一动不敢动。\n\n等到天边泛白，火把的光才慢慢退回去。\n\n泠从水里爬出来，全身湿透，嘴唇发白。她爬上岸，靠着石头，抖了半天。\n\n\"……晞姐。\"\n\n\"在。\"\n\n\"你还好吗？\"\n\n\"……还好。\"晞的声音还是虚的，\"就是有点累。\"\n\n\"骗人。\"泠说，\"你昨天把铁门都弄化了。你肯定累坏了。\"\n\n晞没有反驳。\n\n\"对不起。\"泠说，\"是我连累你。你要是没把门弄化，你就不会这么累。\"\n\n\"……我不弄化门，你就会死在里面。\"晞说，\"你死了，我也活不了。我不是在帮你，我是在帮我自己。\"\n\n泠愣了一下，然后笑了：\"晞姐，你连安慰人都不会安慰。\"\n\n\"……\"\n\n\"算了，你不用安慰我。\"泠扶着石头站起来，\"我知道你是为了我才弄的门。\"\n\n天亮了。泠不敢回镇子的方向，也不敢走官道。她沿着山脊走，绕了大半天，绕到下午，才绕到那道她熟悉的山梁上。\n\n山梁的那边，就是江岫的院子。\n\n她蹲在山梁上，躲在树丛后面，往下看。院子还在。院门虚掩着，门槛底下垫着那块石头。窗台上，那排木器还整整齐齐摆着——她能看见那只小木狐狸，和它旁边那块\"胖石头\"。\n\n院子里没有人。\n\n江岫不在。院子里晾着的衣服被风吹起来，又落下。灶台上，似乎还放着一副碗筷。\n\n泠蹲在树丛后面，看了很久。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"你说，那天晚上，他为什么不帮我？\"\n\n晞没有说话。\n\n\"他那么厉害。\"泠说，\"他能把魔推开。他肯定也能把那些道士推开。可他站在那儿，看着他们把我带走，一句话都没说。\"\n\n\"……他有他的难处。\"晞说。\n\n\"什么难处？\"\n\n\"他不能动。\"晞说，\"你忘了吗？他住在灵力最稀薄的地方，像一道门，守着一件东西。那种人，是不能随便动武的。他一动，那件东西的气息就会泄出来——到时候找上门的，就不只是道士了。\"\n\n泠沉默了一会儿。\n\n\"……你早就知道他是什么人了？\"\n\n\"我看他第一眼就知道，他不是普通人。\"晞说，\"他看你的眼神，不是看一只狐狸的眼神。他看得见你背上的东西。他看得见边界。\"\n\n\"那他为什么不告诉我？\"\n\n\"他为什么要告诉你？\"晞说，\"你也从来没告诉他，你身体里住着我。\"\n\n泠不说话了。\n\n她蹲在山梁上，看着那间院子，看了很久很久。太阳从她头顶落下去，又从另一边的山脊落下去了。风把她湿透的衣服吹干，又吹凉。\n\n\"……我不进去了。\"她说。\n\n\"嗯？\"\n\n\"我要是现在进去，道士万一找上门，看到我又在他家，他更说不清了。\"泠说，\"我走了，他还能安安静静削他的木头。\"\n\n她站起来，拍了拍身上的土，转身，往西边走。\n\n走了几步，她又停下来，回头看了一眼。\n\n\"……晞姐，你说，他窗台上那只木狐狸，还在等小雪回去吗？\"\n\n\"不知道。\"晞说，\"但你给他削的那块胖石头，还在。\"\n\n泠站在那里，站了一会儿。\n\n\"那我们说好了，\"她小声说，像在跟谁说话，\"我还会回来的。等我治好了这里——\"她摸了摸自己左侧的裂隙，\"等我让它不疼了，我就回来看他。\"\n\n她说完，转身，往西边走去。\n\n夕阳把她的影子拉得很长。她走得很慢，但没有回头。"}, {"id": 16, "title": "失控", "content": "泠往西走了三天。\n\n她不敢进镇子，不敢走官道，不敢离人太近。她像一只受伤的野狐，贴着山林走，白天躲在树荫里，夜里赶路。水漠别在胸口，凉凉的；白狐玉佩揣在怀里，被体温焐热了。\n\n裂隙是在第四天夜里开始疼的。\n\n那天傍晚，她翻过一座山，看见山下有一片湖——不大，映着晚霞，像一面铜镜。她太久没见着水了，想着去湖边洗把脸。她蹲在湖边，掬起一捧水——水从指缝里漏下去，她看见水面上自己的倒影。\n\n倒影里，她左侧的肩胛到腰侧，有一道暗红的细缝。像一道没有流血的伤，裂在她自己看不见的地方。\n\n她伸手去摸。\n\n指尖刚碰到那道裂隙，疼就来了——不是尖疼，是钝疼，像有人攥住她左侧的肋骨，慢慢收紧。她\"啊\"地叫了一声，跪在湖边，冷汗一下就下来了。\n\n裂隙在她身体里张开。\n\n她感觉到了——像一扇门被从里面推开。暗红的灵力从裂隙里涌出来，不是一滴一滴，是像决堤一样往外涌。她趴在地上，想把它压回去，压不住。左手彻底麻了，从指尖麻到肩膀。她低头看见自己的手——指甲缝里渗着暗红的光，像血从骨头里渗出来。\n\n湖边的草，在她身边一圈一圈地枯下去。湖水也开始变黑——以她为圆心，暗红的水纹一圈圈荡开，鱼翻着肚皮浮上来。\n\n\"晞姐！\"她慌了，\"晞姐！它在往外跑！我压不住了！\"\n\n\"……我知道。\"晞的声音第一次带了急，\"让我来！你松开！\"\n\n泠松开了灵力——她听见裂隙\"嗡\"地一声，像有人握住了那道门。晞在接管。暗红的灵力开始往回收，像退潮的水，一层层往回卷。\n\n但退到一半，停住了。\n\n\"……压不住。\"晞的声音从裂隙那边传过来，带着一种泠从来没听过的、咬牙的调子，\"太大了。石室压过它，它坏了。我一个人……收不回去。\"\n\n\"那我们两个人呢！\"泠喊，\"你教我！我跟你一起收！\"\n\n\"不行！你的灵力也在往那里面漏——你越使劲，它漏得越快！\"\n\n\"那怎么办！我总不能看着它——\"\n\n\"泠！\"晞的声音忽然拔高，\"别管灵力！抱住你自己！\"\n\n泠下意识抱住自己。她感觉到裂隙里的灵力不再往外涌——晞堵在门口，用自己挡着。可是那道门在晃，晞在门那边被顶得一退再退，暗红的灵力绕过她，从她指尖、发梢、眼角渗出来，像一团罩不住的火。\n\n湖边彻底黑了下去。枯草漫到她的膝盖。\n\n然后，她听见了那个声音——从裂隙最深处传过来，很轻，很哑，像一只被踩住尾巴的兽：\n\n\"……对不起。\"\n\n泠愣住。\n\n\"我不知道……会变成这样。\"晞的声音断断续续，\"我撞进来的时候，我以为就是一条缝。我以为养几年就能好。我不知道它会长大。我不知道它会有今天这个样子。\"\n\n\"……你道什么歉呀。\"泠的嗓子发紧，\"你又不想撞进来的。你当时也在逃命。\"\n\n\"我知道。可是……\"晞停了一下，\"它是从我这里开始的。如果不是我，你不会被人关进石室，不会流着魔血，不会被道士追杀。你本来可以在青丘，当你的九尾，过你的日子。\"\n\n\"青丘的日子有什么好过的！\"泠喊出来，\"青丘没有人叫我名字！青丘的九尾是个传说，不是个人！\"她喘着气，看着自己枯黑的膝盖，\"你在我身体里，从来没有人嫌过我。你是我唯一一个、不是把我当九尾看的。\"\n\n晞没有说话。\n\n\"……你看，你也从来没叫过我九尾。\"泠说，\"你叫我泠。你从第一天起就叫我泠。\"\n\n裂隙里的灵力，慢慢停了下来。那道门不再晃了——晞堵在门口，把漏出来的灵力一点点往回堵。虽然慢，但真的在回去。\n\n\"……你不会死。\"晞说，\"我不会让你死。\"\n\n\"我知道。\"泠说，\"我也一样。你住在我身体里一天，我就不会让你没地方住。\"\n\n\"……\"\n\n\"晞姐，我们商量个事。\"\n\n\"嗯。\"\n\n\"这道裂隙，是我们的。\"泠说，\"你撞出来的也好，我护不住也好。它在我们两个人身上。我们一起想办法治它——不能让它一直这么坏下去。\"\n\n\"……怎么治？\"\n\n\"我不知道。\"泠说，\"但我会去找。人间这么大，总有知道这道门的人。\"她停了一下，\"我娘说过，白狐一脉活得长，就是为了把没做完的事做完。我们活得长，我们就慢慢找。总找得到的。\"\n\n湖边安静下来。夜风把黑水吹皱，又吹平。裂隙的边缘，暗红的光一点一点收拢，从\"裂谷\"收成\"沟\"，从\"沟\"收成\"线\"——最后，收成一道细细的缝，像一道旧疤。\n\n泠瘫在湖边，浑身的骨头像被拆过一遍。她仰面躺在地上，看着头顶的星空。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"你说，我们这样，算不算和好了？\"\n\n\"……我们什么时候吵过？\"\n\n\"那刚才——\"\n\n\"刚才是我道歉，不是吵架。\"晞说，\"道歉和吵架不一样。\"\n\n泠想了想，忽然笑了：\"也是。我们从来不吵架。都是你道歉。\"\n\n\"……\"\n\n\"晞姐，你以后少道点歉。\"泠说，\"你一道歉，我就觉得天要塌了。\"\n\n\"那我不说了。\"\n\n\"但是——\"泠看着星空，声音轻轻地说，\"你要是哪天想说了，就说。我接着。\"\n\n湖水漫上来，浸湿她的衣角。她没有动。夜风凉凉的，吹过她枯黑一圈的草地，吹过她重新安静下来的裂隙。\n\n她闭上眼睛，说：\n\n\"走。明天继续往西。去找能治这道门的人。\""}, {"id": 17, "title": "西行", "content": "泠往西走了半个月。\n\n她走过三个镇子，都绕开了。走过两条大河，都蹚过去了。她越来越瘦，银白的头发打着结，衣服洗得发白。夜里她蜷在山洞里睡，把尾巴收成一条，垫在身下。她不敢离水太远——水汽能盖住她的气味，也能让她好受一点。裂隙在夜里偶尔会疼，但不再失控。她学会了在它开始发热的时候，停下来，坐一会儿，等它自己冷下去。\n\n\"……晞姐，\"一天夜里，她坐在篝火边烤火，忽然问，\"你说，我是不是该回去看看江岫？\"\n\n\"你不是怕连累他吗？\"\n\n\"是怕。\"泠说，\"但我路过那儿了。我算过，再走三天，就能绕到他家后山。\"\n\n\"你想去就去。\"晞说。\n\n\"我怕道士还守在那。\"\n\n\"半个月了。\"晞说，\"道士不会为一个妖守半个月。\"\n\n泠想了想，决定去。\n\n第三天傍晚，她绕到那道熟悉的山梁上，蹲在树丛后面往下看。\n\n院子还在。院门虚掩着，门槛底下垫着那块石头。灶台上晾着半盆水，院子里晾着一件洗过的灰布衫。窗台上，那排木器还在——小木狐狸，胖石头，还有新添的两三样东西：一只小鸟，一只圆圆的木碗，还有一把小小的木梳。\n\n江岫坐在院子里，背对着她，在削木头。\n\n他削得很慢。木花一片一片落下来，落在他的衣摆上，落在他脚边的木屑堆里。他没有抬头，没有往山梁上看一眼——但泠蹲在那里，看着他，忽然觉得，他好像瘦了一点。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"你说他有没有想过，我还会不会回来？\"\n\n\"不知道。\"晞说，\"你自己去问。\"\n\n\"我不敢下去。\"泠说，\"万一他被道士盯上了，我下去，就是害他。\"\n\n\"你蹲在这里看，他也不知道你来过。\"\n\n\"……那至少，让他知道有人来过。\"泠想了想，从怀里摸出一样东西——一块她路上削的小木片，削成了一朵花的形状，歪歪扭扭的，但看得出是一朵花。她把它放在树根底下，用土压了半边，露着半边。\n\n\"等哪天他进山砍柴，能看见。\"她说。\n\n她站起来，拍了拍身上的土，往西走。\n\n走下山梁的时候，她回头看了一眼。江岫还在削木头，木花还在落。夕阳把他那间小院子镀成金红色，像一幅画。\n\n\"晞姐，\"她走着走着，忽然说，\"你说，我什么时候，才能不用躲着所有人走路？\"\n\n\"等你强了，就不用躲了。\"\n\n\"那我要强到什么样？\"\n\n\"强到道士见了你，不拔剑。\"晞说，\"强到魔见了你，绕道走。强到你走在大街上，没人问你是什么。\"\n\n泠想了想，笑了：\"那得练多久？\"\n\n\"很久。\"晞说，\"但你活得长。你有一辈子的时间。\"\n\n\"……也是。\"泠说，\"那我先从明天开始练。\"\n\n\"从今晚开始。\"晞说，\"今晚我教你，怎么把灵力收着用。你现在用灵力，像倒水——一下就倒完了。要学会让它像溪水，慢慢流。\"\n\n\"好呀！\"泠说，\"你教我。\"\n\n\"先坐下。\"\n\n泠在路边坐下。晞的声音从裂隙那边传过来，一字一句，像在教一个刚学走路的孩子：\n\n\"闭上眼睛。别想裂隙。想你自己。你是水边的狐狸，你见过水怎么流——细水长流，不争先，不后停。把你的灵力，当成那条溪。\"\n\n泠闭上眼睛，照着做。\n\n山风从西边吹过来，吹动她的发梢。她坐在路边的石头上，坐了很久。等她再睁开眼的时候，月亮已经升起来了。\n\n\"……晞姐。\"\n\n\"嗯。\"\n\n\"我好像，摸到一点感觉了。\"\n\n\"……\"\n\n\"你说，我要是天天练，什么时候能练到'道士见了不拔剑'？\"\n\n\"……那就看你自己了。\"晞说，\"但不管多久，我都在。\"\n\n泠站起来，拍拍土，继续往西走。月光把她的影子拉得很长。\n\n她走得很慢，但很稳。"}, {"id": 18, "title": "透透气", "content": "第一次听见晞说\"让我出来\"的时候，泠正在山里练晞教的收灵力。\n\n她练了两个月，从\"倒水\"练到\"溪水\"，又从\"溪水\"练到\"能收能放\"。裂隙还是会疼，但不再乱炸。她瘦下去的肉长回来一点，银白的头发也不打结了。\n\n那天她坐在溪边，收着灵力，忽然听见晞说：\n\n\"……泠。\"\n\n\"嗯？\"\n\n\"让我出来透透气。\"\n\n泠的手一抖，灵力差点散了。\n\n\"你说什么？\"她以为自己听错了。\n\n\"让我出来。\"晞又说了一遍，\"透透气。\"\n\n\"你、你不是住得好好的吗？\"泠有点慌，\"怎么突然要出来？你出来……你能出来吗？\"\n\n\"我能。\"晞说，\"你睡着的时候，我试过几次。你的身体，我能接——只要你愿意。\"\n\n\"那你怎么不早说！\"\n\n\"……我怕你怕。\"晞说，\"我怕你觉得，我要抢你的身体。\"\n\n泠愣了一下。\n\n\"我从来没觉得你要抢。\"她说，\"你是晞姐呀。你想出来，我就让你出来。你想待多久待多久。\"\n\n\"……那现在。\"\n\n\"现在？\"泠看了看四周——溪水、石头、树林，一个人影都没有，\"现在行！这里没人！你出来吧！\"\n\n她说完，闭上眼睛。她感觉到裂隙那边，晞轻轻地动了一下——像一扇门被推开，一个影子从门里走出来，走到她身体里。\n\n然后，她看见了自己的手。\n\n不，是晞的手。她退到了后台——她还能感觉到身体，但不再是她在控制。她像一个坐在门后的观众，看着自己的身体站起来，走了两步。\n\n晞走路的姿势和她不一样。她走路是蹦蹦跳跳的，晞走得慢，一步，一步，像在丈量地面。晞低头看着自己的手——看那只纤细的、白的手，翻过来，又翻过去，看了很久。\n\n\"……手。\"晞说，\"我的手。\"\n\n\"是你的手呀。\"泠在后头说，\"现在这个身体是你的。你随便用。\"\n\n晞没有回答。她站在原地，微微仰起头，让山风从脸上吹过去。她的睫毛颤了一下——泠在后头，能感觉到晞的眼睛有点湿。\n\n\"……你怎么了？\"泠慌了，\"晞姐！你不舒服吗？\"\n\n\"没有。\"晞的声音有点哑，\"太久没吹过风了。\"\n\n泠的心一酸，说不出话来。\n\n晞在溪边站了很久。她蹲下来，掬起一捧水，看着水从指缝里漏下去；她摸了摸一棵树的树皮，又摸了摸自己的头发；她走了一步，又一步，像在重新学习\"走路\"这件事。\n\n\"泠。\"她说。\n\n\"在！\"\n\n\"谢了。\"\n\n\"谢什么呀！\"泠说，\"你想出来，以后天天出来！我跟你说，西边有个镇子，镇上的糖人可好吃了——等到了，我带你——不对，你带我去吃！\"\n\n晞的嘴角动了一下。她在后头看不真切，但她觉得晞好像是笑了。\n\n那天晞在外面待了很久。直到太阳落山，她才说：\"……我该回去了。你的身体要吃饭。\"\n\n\"我不饿！\"泠说，\"你多待会儿嘛——\"\n\n\"你中午就没吃。\"晞说，\"回去吃。\"\n\n\"晞姐你比我娘还啰嗦！\"\n\n\"回去。\"\n\n\"好好好，回去回去。\"\n\n晞闭上眼睛。泠感觉到那扇门合上——她又回到了自己身体里。她睁开眼，活动了一下手指，发现自己站在溪边，站得稳稳的。\n\n\"晞姐，你走路真慢。\"\n\n\"……你走路像兔子。\"\n\n\"兔子怎么了！兔子可爱！\"\n\n日子一天天过去。泠继续往西，晞偶尔出来\"透气\"。她出来的次数不多，每次都是傍晚，没人看见的时候。泠慢慢地摸清了规律：晞出来的时候，她会把身体照顾得很好——不碰水太凉的地方，不吃不干净的东西，走山路的时候，步子放得很稳。\n\n\"晞姐，\"有一天泠说，\"你出来的时候，比我还仔细。\"\n\n\"你的身体。\"晞说，\"我借的，得好好还。\"\n\n\"什么借不借的！\"泠说，\"我的就是你的！你住我这里，你说了算！\"\n\n\"……\"\n\n\"晞姐，你说，我们什么时候能去镇子上逛逛？我听说西边的镇子，冬至的时候会做糖饼，还有花灯！\"\n\n\"冬至还早。\"\n\n\"那我们先往西走！冬至就到啦！\"\n\n泠往西走的路上，在一个小村子借宿了几次。她不敢多住，都是住一晚就走。有一天，她在村口遇到一个婆婆，婆婆打量了她半天，说：\"姑娘，天要冷了。你怎么还穿这么单？\"\n\n\"我……我不怕冷。\"泠说。\n\n\"不怕冷也扛不住入冬。\"婆婆说，\"要不，你在我家住几天？我家就我和老头子，空着一间屋。\"\n\n泠犹豫了。她看着婆婆——一个普通的、佝偻的老婆婆，手上都是干活的茧子，眼睛里没什么算计。\n\n\"……婆婆，您姓什么？\"\n\n\"姓陈。\"婆婆说，\"我姓陈。我家老头子也姓陈。你叫什么？\"\n\n\"我叫泠。\"\n\n\"泠姑娘。\"婆婆笑了，\"走，回家吃饭。\"\n\n泠跟在她身后，往村里走。她走得很慢，回头看了一眼——山的那边，是江岫的院子；再往那边，是青丘。\n\n她转回头，跟着陈婆婆，走进了一个叫陈家村的地方。\n\n那天晚上，她睡在陈婆婆家的厢房里。被子是新的，晒过太阳的味道。她趴在枕头上，小声说：\n\n\"晞姐，我们找到过冬的地方啦。\"\n\n\"嗯。\"\n\n\"冬至的时候，陈婆婆会不会做糖饼？\"\n\n\"你问问她。\"\n\n\"我不敢问。\"泠说，\"我怕问了，她就真做了，然后我欠她太多。\"\n\n\"……你怕欠她什么？\"\n\n\"怕欠她的好。\"泠说，\"怕她还了，我就得走了。\"她顿了顿，\"江岫的糖饼我还没吃完呢——他给晞姐留的那个，我一直没舍得吃。\"\n\n\"……那个糖饼，都放坏了。\"晞说。\n\n\"放坏了也是他留的！\"\n\n泠把脸埋进被子里，闷闷地笑了。\n\n窗外，冬至的雪，开始落了。"}, {"id": 19, "title": "井台", "content": "冬至那天，陈家村下了一场雪。\n\n陈婆婆一大早就起来忙活，揉面、拌馅，说要包饺子。泠蹲在灶台边帮忙烧火，脸被火烤得红扑扑的。陈婆婆擀皮，她学着包，包出来的饺子歪歪扭扭，像一只只趴着的小狐狸。陈婆婆看了笑：\"哟，这饺子长着耳朵呢。\"\n\n\"耳朵可爱！\"泠说。\n\n\"是是是，可爱。\"陈婆婆把她的饺子单独放一屉，\"给你单独煮，别混着。\"\n\n晚上吃了饺子，陈婆婆说村里有个规矩，冬至夜要去井台祭井水——一年到头，井水甜不甜，得谢它。泠抢着说：\"我去！我去打水！\"\n\n她提着木桶，踩着雪，走到村口的井台边。\n\n雪还在下，细细密密的。月光从云缝里漏下来，把雪地照成一片银白。井台不高，青石的，被踩得滑溜溜的。泠把桶放下去，绞着辘轳，把水提上来。井水很清，在月光下冒着白气。\n\n她蹲下来，探头往井里看了一眼。\n\n井很深。底下的水面像一面圆镜，映着一个月亮。她的倒影也在水面上——银白的头发，浅蓝的眼睛，还有左侧，那道若隐若现的裂隙。\n\n她看着井水里的月亮，忽然说：\n\n\"晞姐，你说，魔界的月亮，也是这样的吗？\"\n\n晞沉默了一会儿。\n\n\"……不太一样。\"她说，\"那边的月亮，是暗红色的。\"\n\n\"暗红色的月亮？\"泠想象了一下，\"那不是很吓人？\"\n\n\"看习惯了就不吓人。\"晞说。\n\n\"那……\"泠顿了顿，\"你想不想回去看看？\"\n\n晞很久没有说话。\n\n泠感觉到裂隙那边，有什么东西在动——像一阵风，从很深很深的地方吹上来。她低头看井水，井水里的倒影，忽然泛起一层暗红——不是她的裂隙在亮，是她倒影里的裂隙，像一条烧红的线，正在慢慢变宽。\n\n\"晞姐？\"泠慌了，\"晞姐！你怎么了？\"\n\n\"……我没事。\"晞的声音有点抖，\"你、你离井远一点。我有点……压不住——\"\n\n她的话没说完，裂隙\"嗡\"地一声张开了。\n\n暗红的灵力从她左侧涌出来，冲上井台，把桶撞翻了。井水被浸成暗红色，一圈一圈往外荡。雪落在暗红的灵力上，\"滋\"地一声化成白气。泠跪在井台上，左手麻得没了知觉，她听见自己喉咙里发出\"嗬嗬\"的声音——不是她在说话，是灵力顶住她的喉咙。\n\n\"晞姐！\"她在心里喊，\"晞姐！你回来！你回来呀！\"\n\n\"我在收！\"晞的声音断断续续，\"我收不住！它——它被我带坏了！它认得我的念头——我一想回去，它就——\"\n\n\"那你就别想回去！\"泠喊，\"你就在这儿！你在这儿住着！永远住着！\"\n\n\"……我不是要回去。\"晞的声音忽然轻下来，\"我是……不知道该怎么回去了。\"\n\n\"什么意思？\"\n\n\"回到你身体里。\"晞说，\"裂隙被我弄坏了。我怕……我怕我哪天，回不去了。\"\n\n井台边安静下来。雪还在落，落在暗红的灵力上，化成白气。\n\n泠跪在雪地里，忽然不慌了。\n\n\"……你怕这个？\"她问。\n\n\"嗯。\"\n\n\"那你回来。\"泠说，\"你现在回来。我接着你。\"\n\n裂隙那边沉默了一会儿。然后，暗红的灵力开始往回卷——像退潮的水，一层一层，慢慢退回那道门里。泠伸出左手——左手还是麻的——她按住自己左侧的肩胛，像按住一扇门，轻声说：\n\n\"回来吧。门我给你留着呢。\"\n\n裂隙合上了。\n\n井水慢慢恢复清澈。雪还在下，把井台边的暗红痕迹一点点盖住。泠瘫坐在雪地里，喘着气，半晌才爬起来。\n\n\"……晞姐。\"\n\n\"在。\"\n\n\"你还在吗？\"\n\n\"在。\"\n\n\"没走丢？\"\n\n\"……没有。\"\n\n泠笑了。她笑得眼睛弯弯的，眼眶却红了。她坐在井台上，把木桶捡起来，重新打了一桶水，然后对着井水里的月亮说：\n\n\"晞姐，我跟你说个事。\"\n\n\"嗯。\"\n\n\"以后你想看月亮，想透气，想出来散步——你跟我说就行。不用等它失控。\"泠说，\"你闷了就说。我随时把身体让给你。你住在我这里，不是住在我身体里——是住在我心里。心里想回的地方，随时都能回。\"\n\n\"……\"\n\n\"你听见没有呀？\"\n\n\"听见了。\"晞说。\n\n那天夜里，雪停了。月亮从云里出来，又圆又亮。\n\n泠躺在厢房的被子里，翻了个身，说：\"晞姐，现在想散步吗？\"\n\n\"……想。\"\n\n\"那你去。\"泠闭上眼睛，把身体让出来。\n\n她感觉到裂隙轻轻推开，晞走进她的身体里，站起来，推开门，走到院子里。\n\n月光照在雪地上。晞穿着泠的白色衣服，站在院子中间，仰头看着那轮月亮。她伸出手——接住一片落在手心里的雪。雪在她手心里化开，凉凉的。\n\n她看了很久很久。\n\n泠在后头，小声说：\"晞姐，好看吗？\"\n\n\"……好看。\"晞说，\"比暗红色的，好看。\"\n\n\"那我以后，天天让你看。\"\n\n\"不用天天。\"\n\n\"那就夜夜。\"\n\n\"……\"\n\n\"夜夜！\"\n\n晞没有回答。但她站在月光下，雪地上，很久很久，没有回去。\n\n远处，陈婆婆屋里的灯还亮着，暖黄暖黄的。\n\n冬至的夜里，月亮很圆。雪很白。\n\n有一个魔族公主，站在人间冬至的月光下，第一次觉得，人间也没有那么坏。"}, {"id": 20, "title": "天刑", "content": "冬至过完，泠在陈家村住过了年。\n\n开春的时候，冰雪化了，陈婆婆的老伴陈大爷上山砍柴摔了一跤，躺了半个月。泠帮着挑水、劈柴、做饭，把陈家村的日子过出了滋味。她甚至觉得，日子可以就这样过下去——冬天帮婆婆挑水，夏天帮她收麦，等秋天，她再往西走。\n\n晞说：\"你该走了。\"\n\n\"我知道。\"泠说，\"我就是……舍不得。\"\n\n\"你舍不得，也得走。\"晞说，\"你忘了吗？你要找治裂隙的人。\"\n\n\"我没忘。\"泠说，\"我再住两天，等陈大爷能下地——\"\n\n第三天，天没亮，泠忽然从梦里惊醒了。\n\n她说不清自己感觉到了什么。像一根针，从很远很远的地方，直直地扎进她左侧的裂隙里——疼，尖锐的疼。她猛地坐起来，冷汗一下就下来了。窗外的天还是黑的，月亮还没落。\n\n\"晞姐！\"她喊，\"晞姐！\"\n\n\"……我听见了。\"晞的声音第一次带着一种陌生的紧，\"天族。是天族。他们来了——他们找到我了。\"\n\n\"什么天族？他们怎么会——\"\n\n\"别问！\"晞的声音几乎是喊出来的，\"跑！往青丘跑！你跑回青丘，他们才不敢——\"\n\n泠从床上跳下来，鞋都没穿好，抓起水漠和玉佩就往外跑。她跑过陈婆婆的院子，跑过村口的井台，一头扎进夜色里。她没有回头——她怕一回头，看见天亮的方向有什么东西落下来。\n\n她跑了一整夜。\n\n天亮的时候，她跑到了山道上。她不敢停。她感觉到那根针还在——越来越近，越来越近。她跑进一片松林，脚下是厚厚的松针，跑起来打滑。她摔倒了一次，爬起来接着跑。\n\n\"……晞姐，他们追到哪了？\"\n\n\"后面。\"晞的声音很平，\"三里地。还在逼近。\"\n\n\"我跑不过他们吗？\"\n\n\"你跑不过。\"晞说，\"他们不是跑，是飞。\"\n\n泠的牙齿在打颤。她拼命跑，跑过松林，跑过溪谷，跑过一片又一片她不知道名字的山。太阳升高了，她的腿像灌了铅，灵力已经见底。她扶着膝盖，大口喘气，抬起头——看见了那座山。\n\n青丘。\n\n那座她出生、长大、又离开的山，就在前面。云在山上飘，九条溪在山上流。\n\n\"……到了。\"她说，\"我到了。\"\n\n她往山上跑。跑过青丘的边界线——她感觉到脚下的土，从外头的凉，变回青丘的温。她回头看了一眼。\n\n一道白影，从天上落下来，落在青丘的边界外。\n\n那不是普通的白。那是天光——像一道从云缝里直直劈下来的、带着寒意的白光。它落在地上，光里走出一个人。长袍、白发、眉目如雪，看不出年纪。他站在那里，像一柄插在天地间的剑。\n\n\"魔族的余孽。\"他的声音不高，却传出很远，\"从你坠入凡尘那天起，天界就在查你。查到今天，终于查到了——你躲在一只狐狸的身体里。\"\n\n\"我不是躲！\"泠挡在身前，声音发抖但站得直，\"她是自己住进来的！她没有害过人！\"\n\n\"魔族害不害人，不由你说了算。\"白发人抬起手，\"让开。我要带走的，是你体内那个东西。\"\n\n\"不行！\"\n\n泠拔出水漠。蓝色的刃光在青丘的山道上亮起来，像一滴倔强的水。\n\n白发人看着她，目光没什么波澜：\"一只九尾。青丘的苗子，何必替魔族挡剑。让开，我不伤你。\"\n\n\"她是我姐！\"泠说，\"我让她住在我这里，我就是她的门！你要带走她，先过我这道门！\"\n\n白发人看了她一会儿。\n\n\"……不知死活。\"他说。\n\n他抬起手，指尖亮起一点白光。那点白光落在泠身上——泠只觉得眼前一花，整个人像被一座山撞了一下，倒飞出去，撞在一棵松树上。她还没爬起来，第二道白光就到了，直直地劈向她——\n\n劈向她左侧的裂隙。\n\n\"天刑！\"晞的声音在裂隙里炸开，\"是往裂隙打的！泠！躲开！\"\n\n泠想躲。她的身体已经不听使唤了——白光太快，比她想过的任何东西都快。她只来得及偏了偏身子，白光就撞上了她的左肩，从肩胛到腰侧，整道裂隙被一道灼白的雷霆贯穿。\n\n疼。\n\n泠以为杀魔那天已经够疼了。这一刻她才知道，原来疼是可以这样子的——不是疼的地方疼，是整个人都被撕开。她听见裂隙在身体里\"嗤\"地响，像一扇门被雷劈中，剧烈地收缩、收缩、再收缩。她趴在地上，眼前一片白，耳朵里嗡嗡的，什么都听不见。\n\n\"……晞姐……\"她的嘴唇在动，没有声音，\"晞姐……\"\n\n裂隙被压住了。那道门被天刑钉死在最窄的地方——暗红的灵力一点都涌不出来，像一条被踩住喉咙的河。而门的那一边，晞的声音断断续续，像被揉碎又拼起来的纸：\n\n\"……泠……我……\"\n\n\"晞姐！\"泠挣扎着爬起来，满嘴是血，\"晞姐你怎么样！你别吓我！\"\n\n\"我……没事……\"晞的声音很轻，\"就是……门被钉住了……我过不去……\"\n\n\"我把它弄开！\"泠哭着喊，\"我把它弄开——\"\n\n\"别！\"晞说，\"你……别碰它……天刑钉的门……你碰它，你也会被钉住……\"\n\n白发人站在几步外，看着趴在地上的泠，目光平静：\"天刑一道，可封魔百日。够了。它在我动手之前，不会再出来害人。\"\n\n他走近一步，伸出手，想按向泠的额头。\n\n\"够了。\"\n\n一个声音从青丘的山道上传来——不高，但每个字都像敲在石头上。\n\n白发人停住手，抬起头。\n\n山道上，不知什么时候站着几个老人。青丘的长老们，一字排开，挡在泠和天族之间。为首的是一个头发花白的老者，拄着一根青木杖，目光落在白发人身上。\n\n\"天界的老大人。\"他说，\"青丘的九尾，是我青丘的子弟。你要除魔，我青丘不拦——但你要在我青丘的边界上，动我青丘的九尾，那就不行。\"\n\n\"她体内有魔。\"白发人说。\n\n\"我知道。\"老者说，\"但那是我青丘的九尾。她犯了什么错，我青丘自己处置。\"他顿了顿，\"你天界的手，伸不到青丘来。这是几百年的规矩。\"\n\n白发人看着他，看了很久。\n\n山风从两边吹过来，吹动两个老人的衣摆。青丘的山道上，没有人说话。\n\n\"……好。\"白发人终于说，\"今天我给青丘一个面子。但她体内的魔，天界不会放过。百日之后，天刑自解。到那时——\"\n\n他没有说完。他转身，长袍一拂，化作一道白光，直入云霄，消失了。\n\n山道上安静下来。\n\n泠趴在地上，浑身是血，左手已经完全没了知觉。她抬起头，看着那些长老——看着为首的老者。她想说谢谢，张了张嘴，眼前一黑，什么都不知道了。\n\n她最后听见的，是青丘的溪水声，还有长老们低低的说话声：\n\n\"把她带回白狐一脉。\"\n\n\"……禁足。\"\n\n\"那孩子……她体内那个东西，得看住。\"\n\n然后，一切归于黑暗。"}, {"id": 21, "title": "禁足", "content": "泠醒过来的时候，闻到的是青丘的味道。\n\n松脂、溪水、还有晒过太阳的干草。她睁开眼，看见的是白狐一脉老屋的房梁——她从小看到大的房梁，横着一道被火燎过的旧痕，是她爹年轻时候留下的。\n\n她躺了三天。\n\n第一天，她浑身的骨头像被人拆过又装回去，左肩到腰侧的位置包着草药，一动就疼。第二天，她勉强能坐起来，喝了半碗粥。第三天，她能下地了，扶着墙，走到窗边，看见院子外面站着两个年轻的白狐——看门的。她往院门口走了两步，那两个白狐就上前一步，拦住她。\n\n\"九尾小姐。\"其中一个低着头，声音恭恭敬敬的，\"长老说了，您不能出院门。\"\n\n泠站在院子里，看着那扇虚掩的院门，看了很久。\n\n\"……我知道了。\"她说。\n\n晞没有声音。\n\n那天晚上，泠躺在床上，小声喊：\"晞姐。\"\n\n没有回应。\n\n\"晞姐！\"\n\n裂隙的位置，冰凉冰凉的。那道门被天刑钉着，窄得只剩一条缝——暗红的光一点也透不出来。她喊了一遍又一遍，裂隙里安安静静的，像一间没有人住的空屋子。\n\n\"晞姐你应我一声呀！\"泠的声音开始抖，\"你应我一声！你说你在！你说你还在！\"\n\n裂隙里，终于传来一声很轻很轻的响动。像隔着很厚的墙，有人在敲。\n\n\"……在。\"那声音细得像线，\"我……在。\"\n\n\"你还好吗？\"\n\n\"……门被钉住了。\"晞说，\"我过不去。但我知道……你在。\"\n\n\"你什么时候能出来？\"\n\n\"天刑……封我百日。\"晞说，\"百日之内，我出不来。\"\n\n\"那百日之后呢？\"\n\n\"……不知道。\"晞说，\"天刑打的是裂隙。门坏了。\"\n\n泠躺在黑暗里，睁着眼睛，听着裂隙里那道细得像线的声音，眼泪无声地流下来。\n\n\"……晞姐。\"她说，\"对不起。\"\n\n\"你道什么歉？\"\n\n\"是我没躲开。\"泠说，\"他打的是你，是我没躲开。\"\n\n\"……你躲不开。\"晞说，\"天刑不是躲得开的。它认的是裂隙，不是你。\"\n\n\"那我要是更强一点——\"\n\n\"你要是更强一点，你也是狐狸。他不是打你，是打门。\"晞说，\"不怪你。\"\n\n\"……可你被我关在里面了。\"\n\n\"不是被关。\"晞说，\"是门小了。门小了，我还是在里面。你喊我，我听得见。\"\n\n\"那你应我一声。\"泠说，\"你应我一声，我就知道你在。\"\n\n\"……在。\"\n\n\"再应一声。\"\n\n\"在。\"\n\n\"再应——\"\n\n\"……泠。\"晞的声音忽然带了一点无奈的笑意，\"我哪都不去。我住你这里，住了十几年了。门小一点，我挤一挤，还是住得下。\"\n\n泠趴在枕头上，笑了。笑着笑着，眼泪把枕头浸湿了一大片。\n\n禁足的日子很慢。\n\n泠每天在院子里坐着，看天，看云，看墙角的草长高又变黄。她不敢喊晞喊得太频繁——每次喊，晞都要费很大的力气才能应一声。她学会了省着喊：早上喊一声，晚上喊一声，中间不喊。\n\n她不喊的时候，就摸着左侧那道裂隙——隔着衣服，能摸到那道微微发烫的、窄窄的线。天刑钉过的门，摸上去像一道结了痂的旧疤。\n\n\"晞姐。\"她早上喊。\n\n\"在。\"\n\n\"晞姐。\"她晚上喊。\n\n\"在。\"\n\n有一天晚上，她喊完，没有等到回答。她又喊了一遍，还是没有。她的心一下子提起来，连喊了好几声，声音都变了调：\"晞姐！晞姐！你在不在！你应我呀！\"\n\n过了很久很久，裂隙里传来一声极轻的、像呜咽一样的声音。\n\n\"……我在。\"晞说，\"我在哭。\"\n\n泠愣住。\n\n\"哭什么呀！\"她连忙说，\"你别哭！你是不是疼？是不是天刑还在压你？我去找长老，我让他们把门弄开——\"\n\n\"不是疼。\"晞说，\"是……我不知道怎么说。\"\n\n\"那就不说！\"泠说，\"你想哭就哭！我在这里！我听着！你哭多久都行！\"\n\n裂隙里安静了一会儿。然后，那道细得像线的声音，断断续续地响起来：\n\n\"……我娘死的时候，我没哭。\"晞说，\"我妹妹死的时候，我也没哭。我坠落的时候，浑身是血，也没哭。\"\n\n\"……\"\n\n\"我一直觉得，哭没有用。\"晞说，\"哭救不了任何人。所以我从来不哭。\"\n\n\"那你现在为什么哭？\"\n\n\"……\"晞停了很久，\"因为我发现，有人会因为我哭。\"\n\n泠的心一下子酸得厉害。她趴在床上，把脸埋进枕头里，闷闷地说：\n\n\"晞姐，你哭吧。我接着。以后你想哭就哭，不想哭就不哭。你不用学着做谁的姐姐——你在我这里，想当妹妹也行，想当姐姐也行。你怎么样都行。\"\n\n裂隙里，那细细的声音又响了一会儿，然后慢慢安静下来。\n\n\"……好了。\"晞说，\"哭完了。\"\n\n\"那明天还哭吗？\"\n\n\"……不知道。\"\n\n\"那我明天还听着。\"泠说，\"后天也听着。大后天也听着。我这一辈子都听着。\"\n\n\"……\"\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"你睡觉吧。我守着你。\"\n\n禁足的第二个月，母亲来了。\n\n泠正坐在院子里的石凳上，对着墙角的草发呆，就听见院门响。她抬头，看见母亲站在院门口——还是那身素净的白衣，还是那副温和的眉眼。她手里提着一个竹篮，篮子里是几只梨。\n\n\"娘？\"泠愣住了，\"你怎么来了？\"\n\n\"来看你。\"母亲走进来，把竹篮放在石桌上，在泠对面坐下。她看着泠，看了很久，说，\"瘦了。\"\n\n\"没有。\"泠说，\"我吃得好睡得好。\"\n\n母亲没有揭穿她。她把梨拿出来，用帕子擦了，递给泠一只：\"你小时候最爱吃这个。\"\n\n泠接过来，咬了一口。甜的，脆的。她低着头吃梨，不敢抬头——她怕一抬头，眼泪就下来了。\n\n母亲坐在她对面，看着她吃。过了很久，母亲忽然说：\n\n\"……她还好吗？\"\n\n泠的梨差点掉在地上。她猛地抬头，看着母亲：\"娘，你——\"\n\n\"你出生那天，你爹就说过，你身体里，有什么东西动了一下。\"母亲说，\"你小时候总对着左边说话。你娘我，不聋。\"\n\n\"……您一直知道？\"\n\n\"知道你在跟什么人说话。\"母亲说，\"不知道是谁。\"她顿了顿，\"现在知道了——你被关起来，是因为她吧。\"\n\n泠的嘴唇动了动，不知道该说什么。\n\n\"……她叫晞。\"泠小声说，\"她是魔族的公主。她落难的时候撞进我身体里，就一直住着。她没有害过人。她从来没有害过我。\"\n\n母亲看着她，目光平静。\n\n\"你护着她。\"她说，\"那她，护你吗？\"\n\n\"护。\"泠说，\"她拿命护我。\"\n\n母亲沉默了一会儿。然后她伸出手，轻轻摸了摸泠的头发，像她小时候那样。\n\n\"那就好。\"母亲说，\"你护着她，她护着你。娘就放心了。\"\n\n她站起来，收拾好竹篮，走到院门口。她停了一下，没有回头，轻声说：\n\n\"……跟你身体里那位说，青丘的白狐，认她这个家人了。\"\n\n泠愣在院子里，看着母亲的背影消失在院门外。\n\n\"……晞姐。\"她小声喊。\n\n\"……在。\"裂隙里的声音，轻轻地说。\n\n\"你听见了吗？\"\n\n\"……听见了。\"\n\n\"娘说，她认你。\"泠笑着说，\"你以后，也算有家了。\"\n\n裂隙里，很久很久，没有声音。\n\n然后，那道细得像线的声音，轻轻地说：\n\n\"……嗯。\""}, {"id": 22, "title": "道别", "content": "第一百天，天刑自解的那天，晞回来了。\n\n那天晚上，泠正坐在院子里，数着日子。她数到第一百天——从被钉住那天起，她数了整整一百天。她摸了摸左侧的裂隙，忽然感觉到，那道钉着门的\"钉子\"，松了。\n\n裂隙里，传来一声轻轻的响动。\n\n\"……泠。\"\n\n\"晞姐！\"泠一下子站起来，声音都劈了，\"晞姐！你出来了？！\"\n\n\"……出来一半。\"晞的声音还虚，但不再断断续续了，\"门松了。我能说话，还出不来。\"\n\n\"那还要多久？！\"\n\n\"再养几天。\"晞说，\"天刑钉得太久，门框都变形了。我得慢慢把它撑开。\"\n\n\"那你不急！你慢慢撑！\"泠说，\"我等了你一百天，不差这几天！\"\n\n\"……嗯。\"\n\n那天夜里，泠躺在床上，摸着裂隙，小声说：\"晞姐，我有个事要跟你说。\"\n\n\"嗯。\"\n\n\"我想走了。\"\n\n\"去哪？\"\n\n\"找治这道门的人。\"泠说，\"天刑把它打坏了。它在变坏，我知道。再坏下去，你连住的地方都没有了。我不能让它坏下去。\"\n\n\"……你往哪找？\"\n\n\"我娘跟我说了一个名字。\"泠说，\"她说，人间有一个叫'守微录'的东西，是活的道藏，能重描边界。我背上这道裂隙，就是一道边界——守微录，也许能治它。\"\n\n\"守微录。\"晞重复了一遍，\"我听我爹提过。那是……一个很旧很旧的东西。传说它藏在人间。谁能解读它，谁就能划定天地之间的边界。\"\n\n\"那它治裂隙的时候，\"泠问，\"会不会伤到你？\"\n\n\"……不知道。\"晞说，\"守微录重描的是边界。裂隙是你的身体，也是我的门。它描门，也许会把门描没了。\"\n\n\"那我就不找了？\"\n\n\"……找。\"晞说，\"门描没了，我也还是我。你把我描出来，我住进你心里。反正我早说过，你心里想回的地方，随时能回。\"\n\n\"不行！\"泠说，\"我不许它描没你！我要找的是——能治裂隙，又不抹掉你的办法！\"\n\n\"哪儿有那么好的事。\"\n\n\"我娘说的！\"泠理直气壮，\"我娘说守微录能治裂隙的伤痛，而且不会抹除里面的人！我娘不会骗我！\"\n\n\"……你娘说的？\"\n\n\"我娘说的！\"\n\n晞沉默了一会儿。\n\n\"那你娘有没有说，怎么治？\"\n\n\"她没说。\"泠说，\"她说她也不知道，但守微录在人间——守着它的人，是个叫'守微人'的。找到守微人，就找到守微录。\"\n\n\"那你找到守微人，要怎么说？\"\n\n\"就说……\"泠想了想，\"就说，我有一道门坏了，请他把门修好。\"\n\n\"他要是不修呢？\"\n\n\"那我就求他。\"泠说，\"求不动，我就等。等他哪天想修了，我再求一次。\"\n\n晞没有说话。过了很久，她说：\n\n\"……你去找吧。但你答应我一件事。\"\n\n\"什么事？\"\n\n\"不管那道门修得好修不好，\"晞说，\"你都要活着回来。天族还没放过我。你一个人在路上，要小心。\"\n\n\"我知道。\"泠说，\"我会小心。\"\n\n第二天，泠逃出了禁足。\n\n看门的两个年轻白狐，一个在打盹，一个在打水。她用低存在状态贴着墙根溜出去，一路跑到父母的住处。她推开院门的时候，母亲正坐在院子里晾衣裳，父亲坐在檐下，手边放着一碗茶。\n\n看见她，谁都没有惊讶。\n\n\"……娘。\"泠站在门口，说，\"我走了。\"\n\n母亲放下手里的衣裳，走过来，像小时候一样，给她理了理领口：\"伤好了？\"\n\n\"好了。\"\n\n\"晞那孩子，能出来了吗？\"\n\n\"门松了。\"泠说，\"再养几天就能出来。\"\n\n\"那就好。\"母亲点点头，从屋里拿出一个布包，递给她，\"路上吃的。别饿着。\"\n\n泠接过来，鼻子发酸。\n\n\"……爹。\"她转向父亲。\n\n父亲放下茶碗，看了她一会儿。他从怀里摸出一样东西——一条细细的银链子，坠着一只银狐狸。那狐狸很小，雕工拙朴，像谁用粗手磨出来的。\n\n\"戴上。\"父亲说。\n\n泠接过来，捏着那只小银狐狸，翻来覆去看了看：\"这是……\"\n\n\"白狐一脉的老东西。\"父亲说，\"祖上传下来的。戴在身上，能掩住妖气——你走到道士跟前，他们也只会当你是个人。\"\n\n\"那……\"\n\n\"它还能掩魔气。\"父亲说，\"你体内那孩子的气息，也能压住。你戴着它，天族再想找你，就没那么容易了。\"\n\n泠的手一抖，差点把银狐狸掉在地上。\n\n\"……爹，你连这个都知道？\"\n\n\"你娘告诉我的。\"父亲说，\"她说你身体里住着一个孩子。我老了，看不见了——但我知道，你护着的东西，肯定是你想护的。\"他顿了顿，\"戴着它。它替你挡一阵，你趁这一阵，把该办的事办了。\"\n\n泠把银项链戴上。银狐狸贴着胸口，凉凉的，很快被体温焐热。她低头看了看，又抬头，看看父亲，看看母亲。\n\n\"……爹，娘。\"她吸了吸鼻子，\"等我治好那道门，我就回来。\"\n\n\"嗯。\"母亲说。\n\n\"路上小心。\"父亲说。\n\n泠转过身，走出院门。她走了两步，又跑回来，一头扎进母亲怀里，闷闷地说：\"……娘，我会想你们的。\"\n\n母亲愣了一下，然后轻轻拍她的背：\"傻孩子，想家就回来。门一直给你开着。\"\n\n泠松开母亲，擦了擦眼睛，转身走了。她没有回头——她怕一回头，就走不动了。\n\n她走出青丘边界的时候，天光大亮。\n\n她摸了摸胸口那只银狐狸，又摸了摸左侧的裂隙——门还没完全打开，但晞在。\n\n\"晞姐。\"\n\n\"嗯。\"\n\n\"我们去找守微人。\"\n\n\"……去。\"晞说。\n\n\"找到他，就把门修好。修好之后——\"泠看着前方的山路，\"我们就回江岫家。我答应过要回去看他的。糖饼还没吃完呢。\"\n\n\"……嗯。\"\n\n泠迈开步子，往人间走去。风从她身后吹过来，带着青丘的溪水味，吹动她银白的发梢。\n\n她走了，但这一次，她是带着门去的——带着能修门的人的名字去的。"}, {"id": 23, "title": "回人间", "content": "她走了半个月。\n\n戴着银项链，她的妖气收得干干净净——她走进镇子，第一次没有人多看她一眼。卖布的没看她，卖糖的没看她，连牵着狗的路人，都没让狗冲她叫。她站在人群里，忽然觉得鼻子有点酸。她活到十七岁，这是她第一次，走在人堆里，像一个人。\n\n她帮人挑了两天水，换了几文钱，买了一个糖人。糖人很甜，甜得她眼睛发酸。她咬了一口，舍不得吃完，用油纸包好，揣进怀里——留给那个削木头的人。\n\n江岫家的院子还是老样子。矮墙，木屑堆，窗台上排着一溜小木器。她一眼就认出那只小木狐狸，还有旁边那块\"胖石头\"。它们还排在原来的位置，像在等谁来挑。\n\n她推开院门。江岫正坐在檐下削木头，听见动静，抬起头。他看了她很久，久到泠以为他会说\"回来了\"——他才低下头，继续削，说：\n\n\"瘦了。\"\n\n\"你也是！\"她喊着，三两步跑进院子，蹲在他面前，仰头看他，\"你胡子都长出来了！你是不是都没刮！\"\n\n\"刮给谁看。\"\n\n\"刮给我看呀！\"泠把糖人塞进他手里，\"给你买的。可甜了。\"\n\n江岫看了看那个糖人，没说话，放在窗台上那只小木狐狸旁边。\n\n\"糖饼还欠你一个。\"他说。\n\n\"欠两个。\"泠理直气壮，\"我走了这么久，得算利息。\"\n\n那天下午，她帮他劈柴、挑水，把院子收拾得干干净净。她干活的时候，眼睛总往屋里飘——那间里屋，门半掩着。她记得很清楚：她还在当狐狸的时候，有一天路过那里，瞥见桌上放着一本旧书，封面没有字，只有一道很淡的纹路。她当时问了一句，江岫说：\"那本书，不能碰。\"\n\n那时候她不知道那是什么。\n\n现在她知道了。\n\n傍晚，她把劈好的柴码齐，在院子里站了一会儿，忽然开口：\n\n\"江岫。\"\n\n\"嗯。\"\n\n\"你是守微人。\"\n\n江岫的手停了一下。刀悬在半空，木花还卷在刃上。他没有抬头，也没有否认。\n\n\"晞姐猜过。\"泠说，\"我娘也说过——人间有守微人，守着一本叫《守微录》的书，是活的道藏，能重描边界。我摔进你家那天，你看见我背上的疤，你没赶我。一个削木头的，凭什么不怕妖？\"\n\n\"……你打听这个做什么。\"\n\n\"我要借你那本书。\"泠说，\"守微录。\"\n\n江岫终于抬起头，看着她。他的眼睛还是那样，平得像一口没什么风的井。\n\n\"不借。\"\n\n\"你听我说完——\"泠急急地开口，\"我背上那道疤，不是疤，是一道门。我晞姐住在里面，门坏了，她快没地方住了。我娘说守微录能治裂隙的伤痛，而且不会抹除里面的人。我不求你别的，就借几天，看完了就还你——\"\n\n\"不借。\"\n\n\"江岫！\"泠的声音拔高了，\"晞姐她快没地方住了！\"\n\n\"她住的是你。\"江岫说，\"她不是住在门里，是住在你身体里。门塌之前，她都有地方住。\"\n\n\"那门要是塌了呢？\"\n\n江岫没有回答。他低头削他的木头，一刀，一刀，木花卷着落下来。\n\n夜里，泠躺在自己以前睡过的垫子上，跟晞说话。\n\n\"晞姐，他不借。\"\n\n\"嗯。\"\n\n\"我明天再求他。\"\n\n\"……他要是真不肯呢？\"\n\n\"那我去求别人。\"泠说，\"天底下不会只有一本守微录。\"\n\n晞没有说话。\n\n泠翻了个身，看着窗纸上的月光：\"晞姐，你别怕。我答应你的，这道门我们一起治。我还没找到办法，我不会让它塌。\"\n\n月光照着她，她眼睛亮亮的，像在跟自己保证。\n\n她等到院子里只剩虫鸣，才轻轻地、轻轻地爬起来，赤着脚，摸向那间里屋。\n\n门没有锁。\n\n她推开门，月光从窗纸漏进来，照见桌上那本书——封面没有字，只有一道极淡的纹路，像一道没有流血的裂隙。\n\n她记得这道纹路。她当狐狸的时候，远远看过一眼。\n\n她伸手，指尖刚要碰到封面——\n\n\"我等你很久了。\"\n\n她猛地回头。江岫站在门口，手里拎着一盏油灯。灯苗晃了晃，照亮他没什么表情的脸。\n\n\"你……你没睡？\"\n\n\"你白天看了那扇门八回。\"江岫说，\"我想不知道都难。\"\n\n\"江岫，\"泠的眼泪一下就下来了，\"求求你。我就看一眼——\"\n\n\"书不能借，也不能看。\"\n\n\"为什么？！\"泠哭出声来，\"你守着它有什么用？！晞姐快没地方住了！它就在这儿落灰！你守着一本落灰的书，能守出什么？！\"\n\n\"正因为它在落灰，\"江岫说，\"才没有人因为它死。\"\n\n泠看着他。眼泪一颗一颗往下掉。她抹了一把脸，声音抖着，慢慢地、慢慢地直起身子。\n\n\"……那就不怪我了。\"\n\n她拔出了水漠。"}, {"id": 24, "title": "被发现", "content": "她拔出了水漠。\n\n刀身很细，像一弯水。月光照在上面，泠的眼睛里全是水光。她咬着牙，一刀劈向江岫——她不想伤他，她想的是把他逼开，抢了书就跑。她从小跑得快。\n\n江岫没有躲。他侧了侧身，让过刀锋，伸出一只手——就一只手——握住了她的腕子。她的手一麻，刀差点脱手。她挣，挣不开。另一只手去掰他的手指，掰不动。\n\n\"你打不过我。\"江岫说。\n\n\"你让开——\"泠嘶声喊。\n\n\"书不能给你。\"\n\n\"晞姐她快没地方住了！你懂不懂！\"泠红着眼，灵力全涌上去，水漠的刀身亮起水光，反手又劈。这一次她用了全力，刀风刮得油灯的火苗\"嗤\"地矮了半截。\n\n江岫后退一步，让开刀锋。他垂着手，没有拔刀，没有用一丝灵力——她第三刀劈下来的时候，他向前迈了一步。\n\n一步，就一步。他贴进她的刀影里，抬手，握住了刀背。\n\n\"嗡\"的一声，水漠不动了。刀身在他手里，像一条被按住头的水。\n\n泠用力抽，抽不动。她松开刀，转身就跑，脚尖刚迈出去，脚下一绊——江岫不知什么时候伸了腿。她整个人往前栽，还没落地，就被人捞住，按在墙上。\n\n\"我说了，\"江岫的声音平平的，\"你打不过我。\"\n\n他从怀里摸出一段绳子。那绳子不是普通的麻绳——黑褐色的，编得极紧，上面缠着一道道暗红的纹路，像干涸的血。泠认得那种纹路。她在石室的符箓上见过——那是专门对付妖的东西。\n\n\"锁妖绳。\"江岫说，\"我师父留下的。他说，哪天我捡回来的东西不听话了，就用这个。\"\n\n\"我没不听话！\"泠挣扎，\"我是要救晞姐——\"\n\n\"你白天求过了。\"江岫说，\"求过，我不给，你就动刀。这不是不听话，是什么？\"\n\n绳子一圈一圈绕上来。绕到第三圈的时候，泠感觉到身体里的灵力像水一样被抽走——不是消失，是被锁住，锁在绳子里。她浑身的力气一下子没了，软在地上，连一根手指头都抬不起来。\n\n江岫把她抱到垫子上，放下，又看了她一会儿，转身出去了。门没有锁。\n\n泠躺在垫子上，眼泪无声地流。她动不了，只能睁着眼睛，看着头顶的房梁。月光照着她，她的眼睛亮着，水汪汪的，全是委屈。\n\n她想晞。\n\n\"……晞姐。\"她在心里喊。\n\n\"在。\"裂隙里，晞的声音很轻，\"别怕。\"\n\n\"我没用。\"泠说，\"我打不过他。我把门弄坏了，我找来的书也拿不到……我是不是什么都做不好。\"\n\n\"你做得很好。\"晞说，\"你为我，跟人动了刀。\"\n\n\"可是——\"\n\n\"够了。\"晞说，\"剩下的，我们慢慢想办法。\"\n\n泠听着晞的声音，眼泪流得更凶了。她想起她们说好的——这道门，我们一起治。她想，她连一本书都拿不到，她拿什么治门。\n\n月光从窗纸漏进来，慢慢爬过地板，爬过她身下的垫子，爬到门边。她哭累了，眼皮越来越重。昏昏沉沉里，她感觉到有什么东西在亮——很淡，很远，像隔着一层雾。\n\n她睁开眼睛。\n\n桌上，那本书的封面，那道像裂隙的纹路，正在发光。暗红的，温温的，一点一点亮起来，像一道门缝里透出来的光。\n\n然后，书自己动了。\n\n不是翻开。是轻轻震了一下，像活物睡醒了，伸了个懒腰。\n\n\"晞姐……\"泠的声音在发抖，\"它动了。\"\n\n\"我看到了。\"晞说。\n\n\"它是不是……\"\n\n\"它认你了。\"晞的声音也有些不稳，\"书从来没动过。它认你了。\"\n\n脚步声从门口传来。江岫走进来，手里端着一碗水。他看见桌上那本书——亮着，像一盏灯——他站住了。\n\n很久，他没有说话。\n\n然后他把碗放下，蹲下身，解开了泠手腕上的绳子。一圈，两圈，三圈。灵力像退潮后重新漫上来的水，慢慢回到她身体里。\n\n\"它选了你。\"江岫说，\"我拦不住书。\"\n\n\"你、你不拦我了？\"\n\n\"它选了你，\"江岫重复了一遍，\"从它动的那一刻起，它就不是我的书了。是它在等你。\"\n\n泠挣扎着坐起来，看着那本书。光还亮着，温温的，像在等她。\n\n\"去吧。\"江岫说，\"它等了你很久。\"\n\n泠爬过去，跪在桌前，伸出双手。她的指尖碰到封面的那一刻，那些暗红的光一下子散开，像墨落进水里，又聚拢——聚成一道门的形状。不是她背上的门。是另一道门，很大，很旧，立在一片她看不懂的地方。\n\n门后面，是暗红色的。\n\n她听见晞的声音从很远的地方传来，像隔了一整个世界：\n\n\"……泠。你别怕。\"\n\n眼前亮起来。她看见很多条线——天与地的线，人与妖的线，生与死的线。一条一条，像水纹，像木纹，在她眼前慢慢展开。她低下头，看见自己背上的那道门，也在那些线里。\n\n一条线穿过她的门，连着很远很远的什么地方。那条线是新的，细的，亮着，像刚长出来的。\n\n\"它告诉你什么？\"江岫问。\n\n泠抬起头。眼睛还是红的，声音却稳了：\n\n\"它说，门不是修的，是长的。\"她说着，忽然笑了，眼泪还在往下掉，\"路长好了，门就顺了。\"\n\n江岫看了她很久。\n\n\"……那门呢？\"他问，\"那道门，你还背吗？\"\n\n\"背。\"泠说，\"这道门，我背着。我不放。\"\n\n院子里月亮很高。江岫站在檐下，看着屋里那个跪在桌前、哭得鼻尖都红了的姑娘。\n\n他忽然开口：\n\n\"泠。\"\n\n\"嗯？\"\n\n\"你背上那道门，\"他说，\"不是坏事。门是撞出来的，也是长出来的。它是你和那个孩子之间，唯一的路。\"\n\n泠看着他，眼泪又下来了。她没有说话。\n\n\"路坏了，别急着拆。\"江岫说，\"慢慢修。\"\n\n他转身，走到灶台边，把白天热过的糖饼又热了一遍。饼在锅里\"滋\"地响了一声。\n\n泠跪在桌前，低头看着那本书。书上的光慢慢暗下去，像一盏灯自己睡着了。她伸出手，轻轻摸了摸封面那道纹路——温的。\n\n她小声说：\n\n\"晞姐，我们有办法了。\"\n\n裂隙的边缘，亮起一点温热的暗红，像月光下，一朵小小的、安静的花。"}, {"id": 25, "title": "看线", "content": "泠是被灶火声吵醒的。\n\n初夏的山里天亮得早。她睁开眼，看见窗台上那排木器——木狐狸、胖石头、木梳、小碗，一只挨一只，摆得整整齐齐。最边上多了个东西：一只巴掌大的木猫，耳朵削得圆圆的，尾巴卷成一个圈，像睡着的。\n\n她看了半天，才认出那是按她狐狸形态削的。\n\n院子里，江岫正往灶里添柴。桌上放着一张糖饼，还温着。昨夜那张她没舍得吃完，今早他热过又端了出来。\n\n\"……给我的？\"\n\n\"嗯。\"\n\n泠坐下来吃。糖饼有点糊边，甜的，烫得她直哈气。江岫在对面削一根木头，刀不快，但很稳，木屑落下来，一片一片卷着。\n\n\"江岫。\"她咬着饼，\"我想再看那本书。\"\n\n江岫没抬头：\"书在里屋，自己去看。\"\n\n\"可是——\"泠站起来，又坐回去，\"我翻开它，看见的线都是乱的。我想看清那条新线连着哪，可我一翻书，它就散。\"\n\n江岫手里的刀停了一下。\n\n\"你光翻书，看不见线。\"他说，\"书是死的，线是活的。活的东西，得睁着眼看。\"\n\n\"怎么看？\"\n\n\"用你自己的眼睛。\"江岫放下刀，\"来。\"\n\n他带她走到院门口。初夏的风穿过晾衣绳，绳上挂着两件灰布衫，晃一下，停一下。\n\n\"你看见什么？\"\n\n\"绳子，衣裳，风。\"\n\n\"再看。\"他说，\"别看成绳子。看它和别的东西之间。\"\n\n泠皱着眉看。绳子是绳子，墙是墙，井是井。她看了很久，什么也没看出来。\n\n\"我……看不见。\"\n\n\"不着急。\"江岫说，\"守微人也不是生下来就会看的。我师父教我的时候，我在井沿上蹲了三天，才看见井水跟井沿之间，有一条线。\"\n\n\"井水跟井沿之间？\"\n\n\"水是活的，岸是死的。活的东西都要往外走，走不出去，就有一条线横在中间——那就是边界。\"他说，\"你背上那道缝，也是一样的。\"\n\n\"……我管它叫裂隙。\"泠小声说。\n\n\"嗯。裂隙是给人看的——外人看见的，是一道疤。\"江岫说，\"我们守微人，管它叫门。门是给人走的——它现在关着，是还没开，不是死。\"\n\n\"……门。\"\n\n\"门里那位想出来——以她自己的样子，站到地上来。可门没长好，她出不来，只能隔着门跟你说话。那不是坏事，那是她在等你把路长好。\"\n\n泠没有说话。她想起昨夜守微录里那些线——天与地、人与妖、生与死。她以为那要翻书才看得见。\n\n\"那我……\"她小声说，\"我也要蹲三天吗？\"\n\n\"你不一样。\"江岫说，\"你是九尾。水汽是你的东西。天亮前下了露，你往露水里看。\"\n\n泠依言蹲到井沿边。露水还挂在草叶尖上，一颗一颗，亮晶晶的。\n\n她往草叶上看。\n\n先是什么都没有。然后是叶脉，然后是叶子上那颗露珠，然后是——露珠边缘，一道极细极淡的光，薄薄一层，贴在水和空气之间。\n\n她看见了。\n\n\"我看见了！\"她猛地抬头，\"江岫！露珠边上有一道线！很细，会动！\"\n\n江岫的嘴角动了一下，没笑出来：\"嗯。那就是边界。\"\n\n\"那我的门呢？\"泠低头看自己，\"我背上的门，我现在能看见吗？\"\n\n她试着往自己身上看。背上什么都没有——她看不见自己的背，就像看不见自己的眼睛。\n\n\"江岫，你帮我看看。\"她说，\"我的门现在是什么样？\"\n\n江岫看了她一眼。那道疤他还是看得见——从左肩胛到腰侧，一道旧疤一样的细缝。但他知道，那不是疤。\n\n\"还是细的。\"他说，\"但比昨夜顺了一点。路在长——慢，但没停。\"\n\n\"长了吗？\"\n\n\"长了。\"\n\n泠的眼睛亮起来：\"真的？\"\n\n\"嗯。\"江岫说，\"慢，但长了。\"\n\n她高兴得在原地转了个圈，尾巴尖从衣摆底下冒出来，摇了两下，又赶紧缩回去。\n\n\"那它什么时候能长好？\"\n\n\"不知道。\"江岫说，\"路要自己走，不能替它走。\"\n\n泠刚想说什么，忽然停住了。\n\n她看见一条线。\n\n就在院子里，从里屋的门槛下伸出来，横过她脚下，一直往西北去。细细的，亮亮的，像刚长出来的，贴着地面，一路穿过井台、穿过晾衣绳的影子、穿过院墙的豁口，往山那边去，往很远很远的地方去。\n\n\"江岫。\"她声音有点发紧，\"我看见一条线。从里屋出来的，往西北走。\"\n\n江岫的脸色变了。\n\n他蹲下来，顺着她指的方向看。他看了一会儿，很久，才开口：\n\n\"……你看见的这条，是不是很细，会亮，贴着地走？\"\n\n\"是。\"\n\n江岫没说话。他起身，走进里屋，把那本守微录抱了出来，放在井台上。书页自己翻开，停在某一页上。\n\n泠探头去看。\n\n那一页上没有字。只有一条线，画满了整页——细的，亮的，从纸的这边，一直连到纸的那边，像一道没有源头的河。\n\n和她看见的那条，一模一样。\n\n\"我小时候，偷翻过这页。\"江岫说，\"我看了三天三夜。\"\n\n\"……看完了吗？\"\n\n\"没有。\"他说，\"我没看完。我不敢看完。\"\n\n院子里安静下来。风穿过晾衣绳，灰布衫晃了一下，又停住。\n\n\"这条线连着哪？\"泠问。\n\n江岫看着西北方向，很久很久。\n\n\"不知道。\"他说，\"线是活的，会自己长。你看见它了，说明它认你了。它认你的那天，就是在告诉你——你该沿着它，走一趟。\"\n\n\"往西北走？\"\n\n\"……西北。\"\n\n泠看了一眼里屋的方向，又低头看了看自己的门。\n\n\"可是晞姐怎么办？\"她说，\"路那么远，门受不受得住？\"\n\n裂隙边上，暗红的光亮了一下。\n\n晞的声音从门里传出来，隔着那道门，却清清楚楚：\n\n\"门在我这儿。你走你的，我看着它长。\"\n\n江岫转过头，看着那道裂隙。\n\n门里那个声音又响起来，比刚才轻了一点：\n\n\"饼，谢谢。\"\n\n江岫愣了一下。\n\n他站在原地，半天，才说：\"……吃了吗？\"\n\n\"吃了。\"晞说，\"甜的。\"\n\n泠看看江岫，又低头摸了摸自己背上那道旧疤的位置，眼泪毫无预兆地掉下来。她飞快地擦掉，假装在看远处的山。\n\n\"那……\"她吸了吸鼻子，\"我们明天就出发？\"\n\n\"不急。\"江岫说，\"你先把线看稳了。看不见线的人，走不了远路。\"\n\n泠低头，看着那条线，一直亮到山那边。\n\n\"看稳了就走。\"她说。\n\n他弯腰，把井台上的守微录合上，抱回里屋。\n\n\"明天再说吧。\"他说，\"饼凉了。\"\n\n院子里，初夏的风又穿过晾衣绳。灰布衫晃着，像是替谁在点头。\n\n泠站在原地，看着那条细线，一路亮到山那边。\n\n晞在门里，很久，才轻轻地说了一句：\n\n\"那条线……我好像，也去过那头。\"\n\n风过了。线还亮着。"}, {"id": 26, "title": "启程", "content": "第二天清晨，泠在井台边看见了线。\n\n不是露珠边上那种，是真正的线——细的，亮的，贴着地面，从里屋门槛下伸出来，横过院子，一直往西北去。她蹲在井沿上，看着它，看了很久。它比昨天亮了一点。\n\n江岫端着碗出来，看见她蹲着，没说话。他在檐下喝完粥，才问：\"看见几根活的？\"\n\n\"一根。\"泠说，\"往西北那根。别的都是死的。\"\n\n\"……走吧。\"他说，\"收拾东西。\"\n\n泠站起来，愣了一下：\"现在就走？\"\n\n\"线不等人。\"江岫说，\"它一直在长。今天不走，明天它就多长一节。\"\n\n泠跑回屋里收拾。她的东西不多：一身换洗衣裳，水漠，父亲给的银项链挂在脖子上。她想了想，又把床头那只木猫揣进怀里——江岫削的，像她狐狸形态的那只。\n\n她走出来的时候，江岫正站在里屋门口。他没有背篓，怀里抱着那本守微录。\n\n\"书……带吗？\"泠问。\n\n\"它自己翻的页。\"江岫说。\n\n他摊开书。书页停着，还是那一页——细的，亮的，一条线从纸这边连到纸那边，和她院子里看见的那条，一模一样。\n\n\"我本来想把它锁在屋里。\"江岫说，\"锁门的时候，听见里面响。回头一看，它自己翻到了这一页。\"\n\n他顿了顿：\"守微人守的是书。可书选了你。它要走，我跟着。\"\n\n他把书用灰布裹了，放进背篓，背起来。\n\n泠看着他，忽然觉得鼻子有点酸。她别过头，假装在看窗台。\n\n窗台上，木狐狸、胖石头、木梳、小碗，一只挨一只，排得整整齐齐。她做的那只木猫也在——和怀里的这只，原来是一对。\n\n\"它们……\"\n\n\"留这儿。\"江岫说，\"屋得有人等。它们替我们等。\"\n\n泠点了点头。她走到院门口，又回头看了一眼。\n\n江岫锁上门，把钥匙挂在门框的钉子上——像告诉每一个路过的人，屋主还会回来。\n\n\"走吧。\"\n\n两个人出了院墙豁口，踏上那条线。\n\n线贴着地面，细细亮亮，穿过田埂，穿过溪滩，进了山。泠走在线的左边，江岫走在线的右边，像两片叶子，顺着一条水流。\n\n山里的路不好走，但线一直在。它绕开陡坡，绕开断崖，像认得路。泠走得有点喘，眼睛却亮亮的——她活了十七年，头一次走在一条看得见的路上。\n\n中午歇脚的时候，晞的声音从门里传出来：\n\n\"外面的云，还是那么慢吗？\"\n\n泠愣了一下，抬头看天。天很蓝，云很高，白白的，慢吞吞地挪。\n\n\"慢。\"她说，\"跟你那时候一样慢。\"\n\n\"那就好。\"晞说，\"慢的云是好云。快云要下雨。\"\n\n江岫坐在对面，嚼着干粮，没插话。他听了一会儿，才说：\"她记性挺好。\"\n\n\"晞姐什么都记得。\"泠说，\"我小时候的事，她记得比我还清楚。\"\n\n下午的路更陡。泠走得腿酸，江岫走得不快不慢，步子很稳。他背上的背篓里，守微录安安静静，一动不动。\n\n太阳落山的时候，他们在一处背风的崖壁下歇下。江岫生了火，烤了两个饼。饼是今早他烙的，还带着院子的味道。\n\n泠咬着饼，看着远处。\n\n\"江岫，\"她说，\"那条线的那头，到底是什么地方？\"\n\n江岫看着火，很久没说话。\n\n\"不知道。\"他说，\"书认得它，我不认得。\"\n\n\"……连你也不知道？\"\n\n\"守微人也不是什么都知道。\"江岫说，\"我师父教我的时候说，越是亮的线，越要慢点走。\"\n\n泠想了想，点了点头：\"那我们慢慢走。\"\n\n\"嗯。\"江岫说，\"夜里凉。睡吧。\"\n\n夜里，泠睡得迷迷糊糊，忽然听见一声很轻的响——像纸页翻动。\n\n她睁开眼。背篓放在火边，灰布裹着的守微录，从布缝里透出一点光。\n\n江岫已经醒了。他坐在背篓边，手里摊着那本书。\n\n\"它又翻页了。\"他说。\n\n\"翻到哪一页了？\"\n\n\"你过来看。\"\n\n泠走过去，蹲下。书页上画着一座山——墨色的，山腰有一道门。门是关着的，但门缝里透出一点极细的光，细细亮亮，和她院子里的那条线，一模一样。\n\n\"这一页，我翻过这本书多少遍，没见过。\"江岫说，\"今天才出现。\"\n\n\"书……在长？\"\n\n\"书是活的。\"江岫说，\"活的东西，会认人，也会长。它认了你，就开始给你看它藏着的东西。\"\n\n他合上书，重新裹好，放进背篓。\n\n\"睡吧。\"他说，\"明天继续走。书已经指了路，路就在那。\"\n\n泠躺回草垫上，看着崖壁上方的天。星星很多，很亮。她摸了摸怀里的木猫，又摸了摸背上那道缝——温温的，像有人在她身边，替她守着。\n\n线在夜里，还亮着。细细的，往西北去。"}, {"id": 27, "title": "山影", "content": "他们走了五天。过了两个镇子，一片林子，一条窄河。\n\n西北的天边有一道山影——一开始淡得像雾，走一天，深一点；再走一天，能看见山脊上有一道豁口，像谁在纸上划了一刀。\n\n那条线一直亮着，细细的，贴着地，走在他们前面。\n\n泠的看线已经稳了。她不再需要蹲下来盯着看——走着走着，眼角就能扫见它。她还学会了听线：蹲下来，闭上眼，把耳朵贴着地面，能听见线在\"走\"——不是声音，是那种很慢很慢的、泥土里的流动感，像溪水在石头底下流。\n\n\"你背上的门，也能听。\"江岫说。\n\n泠趴在路边，闭着眼听了半天，什么都没听见。正要起来，忽然——左肩胛那个位置，很轻很轻地，传来一种声音：像水漫过河滩，慢吞吞的，一格一格的。\n\n\"……听见了。\"她说，\"像水。很慢的水。\"\n\n\"嗯。\"江岫说，\"那就是它在长。水涨一寸，河就宽一寸。\"\n\n\"那它什么时候能长到——\"\n\n\"不急。\"江岫说，\"河不会因为你盯着它，就涨得快一点。\"\n\n第二天过梁子的时候，泠实在走不动了。\n\n山路是石头路，一级一级往上，日头毒。她出了一身汗，腿肚子直打颤，走一步，停一步。\n\n江岫走在她前面，回头看了她一眼：\"歇会儿。\"\n\n\"……不歇。\"她说，\"歇了就走不动了。\"\n\n江岫没说话，走回来，把背篓卸下来放在路边，蹲下，朝她伸出手。\n\n\"来。\"\n\n\"……干什么？\"\n\n\"背你。\"他说，\"你走不动了。\"\n\n泠的脸一下子红了：\"不用！我、我能走——\"\n\n话没说完，她的腿先软了。人一晃，尾巴\"啪\"地从衣摆底下冒出来，两只耳朵也竖了起来。她慌忙去按耳朵，按不住。\n\n江岫看着她的耳朵，看了两息：\"……你到底变不变。\"\n\n\"我不——\"泠的膝盖一弯，整个人栽下去，半路上变成一只白狐狸，砸在江岫怀里。银项链还挂在脖子上，银狐狸坠子晃了两下，贴着她的毛。\n\n江岫愣了一下。\n\n他把狐狸放到地上。狐狸蹲着，耳朵耷拉下来，用爪子扒拉他的裤脚。扒了两下，见他不理，又去扒背篓——背篓里是她的包袱，衣裳和水漠都在里面。\n\n江岫看着那只狐狸，半天，叹了口气。他把背篓重新背上，弯腰，把狐狸捞起来，放进背篓里。她的衣裳垫在底下，软软的。\n\n\"就这一回。\"他说。\n\n狐狸在背篓里转了个圈，找了个舒服的姿势窝下。过了一刻钟，她把脑袋搁在背篓沿上，耳朵被风吹得一晃一晃。\n\n江岫走在前头，背对着她。风把他的衣裳吹起来又落下。\n\n他背过一只木狐狸——削了三天，放在窗台上，离群一格。如今他背着一只真的。\n\n他的肩膀动了一下，像笑，又不像。\n\n第三天傍晚，他们走到一条山涧边上。线从涧底过去，贴着水，亮晶晶的。\n\n\"今晚过了涧，前面有个避风的崖窝。\"江岫说，\"我去看看。\"\n\n他刚转身，山涧上游传来一声闷响——像谁把一座山翻了个面。水先静了一瞬，然后涨起来，黄浊的，卷着石头和断树，轰隆隆地压过来。\n\n\"——上来！\"江岫喊。\n\n泠抱着背篓往岸上跑。水追着她，没过她的小腿，没过膝盖。江岫站在高处的石头上，一把拽住她，把她拉上来。\n\n水从她脚边冲过去，把涧底的泥沙翻了个底朝天。\n\n泠喘着气，低头看——涧底那道亮晶晶的线，没了。被水冲断的地方，线头散在水里，一截搭在石头上，一截被冲出老远，像两根断了的琴弦，还在微微地抖。\n\n\"线……断了。\"\n\n她慌了，要往水里跳。\n\n\"别碰。\"江岫拉住她，\"线断的时候不要碰。碰了，它就不认得你了。\"\n\n\"那怎么办？它断了——它怎么走？！\"\n\n\"它会自己长。\"江岫说，\"水退了，它就长回来了。你等着就行。\"\n\n那一夜，他们没走。雨下了一夜。江岫生了火，把烤干的衣裳递给她。泠坐在火边，盯着涧底——断掉的线头在水里一明一灭，像一盏快灭的灯。\n\n\"它要是长不回来呢？\"她小声说。\n\n\"会长的。\"江岫说，\"河断了会自己找路。线也一样。\"\n\n泠想起自己背上的门——它也被打坏过，也被钉过，现在也在长。她忽然觉得，那条线像她的门一样：断过，疼过，但只要没人去踩它、去拽它，它就会自己把自己接上。\n\n雨声里，篝火噼啪响。晞的声音从门里传出来——这次不是断句，是一句完整的长话：\n\n\"下过雨的门里，天会亮一点。\"\n\n泠愣了一下：\"门里也能下雨？\"\n\n\"雨是渗进来的。\"晞说，\"天刑以后，门太薄。雨能渗进来，风也能。但是——\"她顿了顿，\"凉快。\"\n\n泠笑了：\"那我们多走走。门长厚了，雨就渗不进去了。\"\n\n\"嗯。\"晞说，\"等你把路走稳了，我出来看看。\"\n\n泠的心跳了一下：\"你能出来了？\"\n\n\"还不行。\"晞说，\"但快了。我能感觉到，路在变宽。\"\n\n天快亮的时候，雨停了。水退了，涧底露出湿漉漉的石头。\n\n线还在。断口的地方，两截线头慢慢向中间靠——像水在找路。天光大亮的时候，它们接上了，还亮了一点。\n\n泠蹲在涧边，看着那道重新接上的线，眼睛有点酸。\n\n\"它长回来了。\"她说。\n\n\"嗯。\"江岫说，\"路是自己长的。\"\n\n第五天，他们路过第三个镇子。泠去换盐，江岫说在街口等她。\n\n泠换完盐出来，看见江岫蹲在一个旧货摊前。摊上摆着旧物件：铜锁、瓦罐、缺了口的碗。江岫手里拿着一只东西，翻来覆去地看。\n\n泠凑过去看——那是一只木鸟。巴掌大，雕工极细，翅膀上的羽毛一片一片，刀法很稳。最妙的是鸟嘴，微微张着，像正要叫。\n\n\"这鸟，雕得真好。\"泠说。\n\n\"嗯。\"江岫说，\"是挺好。\"\n\n他付了钱，把木鸟揣进怀里，没再说别的。\n\n泠注意到，他付钱的时候，手有点抖。\n\n夜里宿在一间破庙里。火生起来，泠铺好草，看见江岫坐在火边，手里又拿着那只木鸟。\n\n\"江岫，\"泠问，\"那鸟，有什么特别的？\"\n\n江岫看着鸟，很久没说话。\n\n\"我师父削的。\"他说。\n\n泠愣住了。\n\n\"我师父的手艺。\"江岫说，\"他削的木头，我一眼就认得。这只鸟，他削了三天——他说，鸟嘴要活，才算好。他走的时候，这只鸟还放在他家里。现在它在这。\"\n\n\"……他走过这条路。\"\n\n\"嗯。\"江岫说，\"他走过。\"\n\n火噼啪响了一声。泠想说什么，又不知道说什么。\n\n\"我师父走的时候，\"江岫说，\"没说去哪，也没说会不会回来。我守着院子和书，想着他总会回来。现在——\"他把木鸟收进怀里，\"他走过这条路。我沿着走，总能找到他。\"\n\n\"那……\"泠的声音小下去，\"你什么时候走？\"\n\n\"等你的门好了。\"江岫说，\"书还得给你指路。你一个人，也走不了那么远的路。\"\n\n泠的鼻子一酸：\"那、那你找到了他，还回来吗？\"\n\n江岫看着她，过了很久：\"回来。\"\n\n第二天出发前，泠蹲在地上，看那条线。它比昨天亮了一点——线断过一次，长回来以后，好像更亮了。\n\n她站起来，摸了摸背上那道缝。\n\n\"晞姐。\"她小声说，\"我们快点长。\"\n\n门里，晞没有回答。过了很久，传来很轻的一声：\n\n\"嗯。\"\n\n风从西北吹过来，带着山的气味。山影比昨天又近了一点，山脊那道豁口，像是有人在那头，也开了一道门。\n\n他们继续走。线在前头，亮亮的，一路指到山那边。"}, {"id": 28, "title": "糖人", "content": "镇子小，只有一条街。卖糖人的老翁在街尾支了个摊，铁锅里糖浆咕嘟咕嘟冒泡，甜香顺着风飘了半条街。\n\n泠走不动了。她不是累，是那股甜香勾住了脚。\n\n\"江岫，那是什么？\"\n\n\"糖人。\"\n\n\"能吃？\"\n\n\"能。\"\n\n江岫摸出几文钱。老翁舀一勺糖浆，手腕一抖，三笔两划，一只小狐狸成了形，插在签子上递过来。\n\n泠没见过这个。她捧着那只糖狐狸，看了很久，舍不得下口。\n\n\"它也是狐狸。\"\n\n\"嗯。\"\n\n\"我舍不得吃它。\"\n\n江岫没说话。老翁呵呵笑：\"小姑娘，糖人就是让人吃的。你吃了它，它还甜你一天呢。\"\n\n泠想了想，咬了一小口。糖在舌尖化开，甜得她眯起眼睛。\n\n\"晞姐，你能尝到吗？\"\n\n后台安静了一瞬。\"……能。很甜。\"\n\n\"那你也吃。\"她举着签子，对着空气，像在给谁喂。\n\n江岫在旁边看着，没打扰。\n\n老翁见泠喜欢，又舀了一勺糖浆：\"来，再给你捏个别的。\"他手腕一转，捏了只猫，圆头圆脑，插在签子上：\"这是你养的猫？\"\n\n\"不是。\"泠说，\"是我姐姐。\"她把猫糖人举起来，\"晞姐，这个给你。\"\n\n晞没有应。但泠知道她看着呢——后背那道门里，暗红的光轻轻亮了一下。\n\n老翁没听清她说什么，只当她对着猫说话，笑呵呵地添了句：\"猫也好。猫养得熟。\"\n\n泠把猫糖人小心翼翼地收好，揣进怀里，跟糖狐狸放在一处，一路也没舍得吃。\n\n出镇十里，路旁一片泥地。泠蹲下去，拿树枝在泥上写字——是江岫教她的那两个字，歪歪扭扭。\n\n\"晞姐，魔界的字，长什么样？\"\n\n后台沉默了很久。\n\n\"……我写给你看。\"\n\n泠只觉得右手轻轻一动，不受她管——晞借了她一根手指，在泥地上慢慢地画。那字形弯弯绕绕，像风，又像水，最后一笔收得很轻。\n\n\"这是什么字？\"\n\n\"风。\"\n\n\"魔界的风？\"\n\n\"嗯。魔界也有风。\"\n\n\"魔界的风，和我们这边的风，一样吗？\"\n\n晞又沉默了很久。\"……不一样。那边的风，是往地底下吹的。\"\n\n泠想象不出来。她抬头看了看天上的云：\"那这边的云，魔界看得见吗？\"\n\n\"看不见。\"晞说，\"魔界在夹层里。我们抬头，是地底。\"\n\n泠哦了一声，蹲回去，照着那几个弯弯绕绕的字，一笔一笔描。\n\n傍晚，路转了个弯，线亮了起来。\n\n不是亮一点——是亮得刺眼。那光从泥土里透上来，照得泠的影子都带了一圈淡青。\n\n\"江岫。\"\n\n\"看见了。\"江岫蹲下，捻了捻那截线，\"越是亮的线，越要慢点走。\"\n\n\"为什么？\"\n\n\"亮的线，多半是走到了要紧的地方。\"他站起身，往前面看了看，\"前面有个村子，黑着灯。\"\n\n村口的老槐树歪在路中间，树皮剥落了一半。村子里没有灯，也没有人声，连狗都没有。\n\n泠走在前面，停住。\n\n她看到了线——线在村中间绕了一个大圈，绕着中间一间屋子的地基画了个弧，像避着什么走。\n\n\"它绕着走。\"泠说，\"线在躲那间屋子。\"\n\n江岫按住她的肩，声音压得很低：\"退。\"\n\n已经晚了。\n\n那间屋子的门，吱呀一声，从里面开了。\n\n没有月亮。门洞是黑的，黑里慢慢浮出一点青白的脸——一只魔，很老了，老得皮肉都塌下去，盘在门槛上，像一摊会呼吸的灰。\n\n它抬起头，浑浊的眼睛转向泠。\n\n\"……活人。\"它的声音像砂纸，\"不。还有别的东西。你身体里……藏着什么？\"\n\n泠的刀已经出鞘了半寸。江岫上前一步，挡在她身前。\n\n老魔的视线落在江岫身上，停住。它浑浊的眼睛里，浮起一点警惕。\n\n\"守微人……\"它说，\"这穷山恶水，怎么还有守微人。\"\n\n\"你饿。\"江岫说，\"你饿了很多年了。\"\n\n老魔没否认，也不动：\"饿，又怎么样？守微人管天管地，还管魔吃饭？\"\n\n\"不管。\"江岫说，\"但你别碰她。\"\n\n\"我不碰她。\"老魔的声音低下去，像风漏过破瓦，\"我碰不起。你身体里那个，我闻出来了——是上面的味道。我老了，我不找死。\"\n\n它说着，撑着门槛，慢吞吞地站起来，往村外挪。\n\n\"饿。\"它又说了一遍，像在自言自语，\"往东三十里有座废庙，里面还有半村人的香火气。你饿，去那儿。\"\n\n江岫说。\n\n老魔回头看了他一眼，又看了泠一眼，没说话，一瘸一拐地走进夜里，很快没了影子。\n\n泠收了刀，半天没说话。\n\n\"江岫，它说的是真的吗？\"\n\n\"往东三十里有没有废庙，我不知道。\"江岫说，\"有没有香火气，我也不知道。\"\n\n\"那你骗它了。\"\n\n\"守微人从不说谎——它信的就是这个。\"他顿了顿，\"所以我说的都是真的，除了那句我不确定的。它要真去了，也饿不死。\"\n\n\"你为什么不杀它？\"泠问。\n\n\"它没惹我。\"江岫说，\"线绕着它走，是因为它没惹线。它守着那间破屋子，不知道守了多少年，没出过村，没害过人——饿是饿，但饿着的魔，和饿着的野狗差不多。它没扑过来，我犯不着杀它。\"\n\n\"那它要是扑过来呢？\"\n\n\"那它就不是只饿着的野狗了。\"江岫说，\"到时候，它走它的黄泉路，我走我的。\"\n\n泠看着他，没说话。\n\n\"你怕吗？\"江岫问。\n\n\"不怕。\"泠说，\"它有它的事，我有我的路。\"\n\n夜里，两人在村外山坡上歇脚。泠把糖狐狸最后一口吃掉——糖早化了，签子上只剩一点点渣。她舔了舔签子，说：\"晞姐，甜的。\"\n\n后台传来很轻的一声：\"……嗯。\""}, {"id": 29, "title": "石屋", "content": "山在前面了。不是远山——是横在天地间的那种大山，青黑的，山顶的云压着。\n\n夜里歇脚，江岫把守微录放在膝上。书自己翻了起来，哗啦啦，停在那一页。\n\n墨色的山，山腰一道关着的门，门缝透出极细的光。\n\n\"光，比上次亮了。\"泠凑过来看。\n\n\"嗯。\"江岫看了很久，把书合上，\"明天，进山。\"\n\n第二天一早，露水还没干，两人就进了山脚。线在山口处收窄，只留一指宽，贴着地往山里走。\n\n山口往里走了一里，路旁出现一间石屋。石头砌的，年头久了，墙缝里长满青苔。门虚掩着，门板上刻着一行字——不是江岫刻的。\n\n泠不识字，但她认得江岫的脸色。\n\n\"江岫？\"\n\n江岫站在那行字前，站着，很久没动。\n\n墙上刻着：路的尽头，不一定有门。但走过的路，都是真的。\n\n\"这是我师父的字。\"他说。\n\n屋里很干净，像有人收拾过。石桌上放着半只木鸟——只有身子，鸟嘴还没削出来。木色很新，不像放了很久。\n\n江岫伸手碰了碰那半只木鸟，指尖发颤。\n\n\"他来过这里。\"他说，\"而且走得不久。\"\n\n泠问：\"他怎么不把它削完？\"\n\n\"他削东西，从来不半途而废。\"江岫的声音有点哑，\"除非，有什么急事，让他非走不可。\"\n\n泠环顾石屋。墙角立着一块木牌，牌上刻着几行字——都只刻着\"守微人\"三个字和一个年份。最旧的一行，字已经模糊得认不出了。\n\n\"这屋，是历代守微人歇脚的。\"江岫说，\"我师父的师父，也在这儿住过。守微人出远门，走到哪儿，都认得这种屋子——屋里永远有一口干净的井，一铺能睡的炕。\"\n\n\"那要是哪天，走不到这屋呢？\"\n\n\"那就说明，守微人这一脉，走到头了。\"江岫说着，把那半只木鸟轻轻放回石桌，\"幸好，还没到头。\"\n\n江岫坐在石屋门口，把旧货摊那只木鸟和石屋里这半只放在一起。一只嘴活了，一只只有身子。像一句话，说了半句。\n\n\"他教我削的第一件东西，就是鸟。\"江岫说，声音很低，\"他说，鸟削得多了，手就知道怎么轻了。守微人这一辈子，手里要拿很多东西——书、笔、线。手重了，线会断；手轻了，字会糊。削鸟，就是练这个。\"\n\n\"我削坏了一百二十七只，才削出一只能站的。\"他说，\"第一百二十八只，他收起来了，放在窗台上，谁都不让碰。后来我问他，他说，那只我留着——等你哪天走远了，回来找不到我，就看看它。鸟嘴是活的，说明你师父还惦记着，给你削下一只。\"\n\n泠听了，半天没说话。\n\n泠蹲在旁边：\"你想你师父了。\"\n\n江岫没否认：\"他走的时候，我在守院子。他说他出去一趟，叫我好好守书。没说过回来，也没说过不回来。\"\n\n\"他为什么不带你？\"\n\n\"守微人守的是书。书不能没人守。\"他低头看着木鸟，\"现在我懂了——他是想让我守着书，等他回来。\"\
